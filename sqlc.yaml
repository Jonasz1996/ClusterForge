version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: inet
            go_type: net/netip.Addr
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.bool
            nullable: true
            go_type:
              type: bool
              pointer: true
