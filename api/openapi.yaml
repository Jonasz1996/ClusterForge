        "404": { $ref: "#/components/responses/Error" }
  /commands/{commandId}/run:
    parameters:
      - { name: commandId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: runCommand
      summary: Een eigen commando draaien op nodes of een cluster (admin); taak command.run
      description: |
        Eén node tegelijk, bij een cluster de VIP-houder als laatste. De uitvoer staat live in de stappen van de taak;
        de taak annuleren stopt het commando op de node. Standaard stopt de taak bij de eerste node waar het commando
        niet met exitcode 0 eindigt. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandRunInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent-upgrades:
    get:
      operationId: listAgentUpgrades
      summary: Welke agents verouderd zijn en of ze vanzelf bijgewerkt worden
      description: |
        Per node met een agent: versie, protocol en binary tegenover de agent die deze server aanbiedt. Een agent vanaf
        protocol 23 werkt zichzelf bij; een oudere werk je één keer met het installatiescript en --upgrade bij. Ook voor
        viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradeOverview" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: startAgentUpgrades
      summary: Agents bijwerken (admin); één taak agents.upgrade per cluster, één node tegelijk
      description: |
        node_ids werkt die nodes bij, cluster_id elke verouderde agent van dat cluster, all elke verouderde agent buiten
        prod; all met include_prod ook die op prod. Per cluster één node tegelijk: de volgende pas als de vorige met de
        nieuwe agent terug is. Komt een node niet terug of zet hij de oude agent terug, dan stopt de taak van dat cluster.
        Op prod vraagt het geen code of bevestiging meer (totp_code en confirm worden genegeerd). Met include_prod starten de clusters buiten prod meteen; de prodclusters komen in een rij
        (queued_prod) en gaan één voor één: het volgende pas als het vorige gelukt is, bij een fout stopt de rij. Een
        cluster waar al een taak loopt, staat in skipped; is er niets gestart of in de rij gezet, dan 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUpgradeInput" }
      responses:
        "202":
          description: Taken aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradeStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent-upgrades/auto:
    put:
      operationId: setAgentUpgradeAuto
      summary: Agents vanzelf bijwerken aan- of uitzetten (admin)
      description: |
        Aan (standaard) werkt ClusterForge elke minuut verouderde agents bij die verbonden zijn, met een taak per cluster.
        Nooit op prod, niet op clusters waar het uitstaat, en niet naar een agent waarnaar bijwerken op die node al eens mislukte.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradeOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent-upgrades/prod-auto:
    put:
      operationId: setAgentUpgradeProdAuto
      summary: Agents op prod ook vanzelf bijwerken aan- of uitzetten (admin)
      description: |
        Aan werkt ClusterForge verouderde agents op prod ook vanzelf bij, één prodcluster tegelijk en één node tegelijk.
        Mislukt een update op prod, dan staat het op prod stil tot die node met de knop bijgewerkt is. Aan- en uitzetten
        vraagt geen code (totp_code wordt genegeerd). Geldt alleen als vanzelf bijwerken (auto) aan staat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                totp_code: { type: string, description: Wordt genegeerd }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradeOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /agent-upgrades/prod-queue:
    delete:
      operationId: clearAgentUpgradeProdQueue
      summary: De rij prodclusters van "ook productie" stoppen (admin)
      description: Haalt de prodclusters die nog niet begonnen zijn uit de rij. Een taak die al loopt, annuleer je bij Taken.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradeOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent-endpoints:
    get:
      operationId: getAgentEndpoints
      summary: Op welk adres agents de server bereiken, en welke agents nog naar een ander adres wijzen
      description: |
        server_url is het adres in het installcommando en voor het downloaden van nieuwe agents; nats_url het adres
        waarmee agents verbinden. Zonder instelling is dat het interne adres uit CF_NATS_ADVERTISE (met de poort van de
        webserver), niet de naam achter een reverse proxy. Is ook dat er niet, dan is server_url leeg en gebruikt de
        webinterface zijn eigen adres. Per agent (vanaf protocol 47) de adressen uit zijn agent.json. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEndpointsOverview" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: setAgentEndpoints
      summary: Het adres voor agents instellen (admin); leeg is de standaard
      description: |
        Verandert het installcommando en nieuwe aanmeldingen meteen. Bestaande agents blijven op hun adres tot je ze
        omzet (POST /agent-endpoints/apply).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_url, nats_url]
              properties:
                server_url: { type: string, description: "Bijvoorbeeld http://192.168.113.153:8080; leeg is de standaard" }
                nats_url: { type: string, description: "host:poort, bijvoorbeeld 192.168.113.153:4222; leeg is de standaard" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEndpointsOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent-endpoints/apply:
    post:
      operationId: applyAgentEndpoints
      summary: Agents omzetten naar het adres voor agents (admin); één taak agents.reconfigure per cluster, één node tegelijk
      description: |
        node_ids zet die nodes om, all elke afwijkende agent buiten prod, met include_prod ook die op prod. De agent test
        het nieuwe adres eerst (NATS met zijn eigen sleutel, /api/v1/health over http) en zet zijn oude agent.json terug als
        hij na de herstart de server niet bereikt. Per cluster één node tegelijk; mislukt er een, dan stopt de taak van dat
        cluster en blijven de andere op hun oude adres. Op prod vraagt het tweestapsverificatie en een code in totp_code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                node_ids: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean }
                include_prod: { type: boolean }
                totp_code: { type: string }
      responses:
        "202":
          description: Taken aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradeStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/agent-upgrade-auto:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setClusterAgentUpgradeAuto
      summary: Agents vanzelf bijwerken op één cluster aan- of uitzetten (admin)
      description: Uit werkt ClusterForge de agents van dit cluster alleen met de knop bij. Prod gaat alleen vanzelf met prod_auto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradeOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /cronjobs:
    get:
      operationId: listCronjobs
      summary: De cronjobs en systemd-timers die de agents melden
      description: |
        ClusterForge vraagt elke vijf minuten elke node naar zijn cronjobs en timers, via agentprotocol 16: /etc/crontab,
        /etc/cron.d, de crontabs van gebruikers, de periodieke mappen en de systemd-timers, met de laatste run uit de journal.
        Per cluster dezelfde job op meer nodes samen. Wachtwoorden in commando's zijn op de node al gemaskeerd. Ook voor
        viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CronGroup" } }
        "401": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/cron-logging:
    post:
      operationId: setCronLogging
      summary: cron op een node het einde en de exitcode van elke job laten loggen (admin)
      description: |
        Schrijft een drop-in voor cron.service die cron met -L 15 start, en herstart cron; lopende jobs draaien door.
        Met enabled=false gaat de drop-in weg. Vraagt agentprotocol 17.
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Gedaan
          content:
            application/json:
              schema:
                type: object
                required: [output]
                properties:
                  output: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/crons/{key}/toggle:
    post:
      operationId: toggleNodeCron
      summary: Een gevonden cronregel op een node uit- of weer aanzetten (admin)
      description: |
        Zet de regel in commentaar, met "# uitgezet door ClusterForge: " ervoor, of haalt dat weer weg. Alleen voor een regel
        in /etc/crontab, /etc/cron.d of de crontab van een gebruiker; de rest van het bestand blijft zoals het is. Daarna leest
        ClusterForge de node opnieuw. Vraagt agentprotocol 20, en op prod de slug en TOTP.
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                confirm: { type: string, description: De slug van het cluster, op prod }
      responses:
        "200":
          description: Gedaan
          content:
            application/json:
              schema:
                type: object
                required: [output]
                properties:
                  output: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /cron-jobs:
    get:
      operationId: listCronJobs
      summary: De beheerde cronjobs, met de laatste run per node
      description: Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ManagedCronJob" } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCronJob
      summary: Een beheerde cronjob maken (admin)
      description: |
        De job komt meteen op de nodes als systemd-timer (agentprotocol 18). Op prod vraagt het tweestapsverificatie en de
        slug in confirm. 400 met field bij een fout in het formulier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedCronJobCreate" }
      responses:
        "201":
          description: Gemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedCronJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /cron-jobs/schedule:
    get:
      operationId: checkCronSchedule
      summary: Een schema in gewone taal, met de volgende vijf runs
      parameters:
        - { name: schedule, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronScheduleInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /cron-jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCronJob
      summary: Eén beheerde cronjob met zijn runs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedCronJobDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCronJob
      summary: Een beheerde cronjob wijzigen of aan- en uitzetten (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedCronJobInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedCronJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCronJob
      summary: Een beheerde cronjob weghalen, ook van de nodes (admin)
      parameters:
        - { name: confirm, in: query, required: false, schema: { type: string } }
      responses:
        "204": { description: Weg }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /cron-jobs/{jobId}/run:
    post:
      operationId: runCronJob
      summary: Een beheerde cronjob nu uitvoeren (admin)
      description: Op de node met het VIP, op zijn node of op alle nodes. Op prod met tweestapsverificatie en de slug in confirm.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: string }
      responses:
        "202":
          description: Gestart
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /cron-jobs/{jobId}/plan:
    get:
      operationId: getCronSyncPlan
      summary: Wat een bestandssync nodig heeft, per node gecontroleerd (admin)
      description: |
        Vraagt elke bron en elk doel naar rsync, ssh, sshd, PermitRootLogin, de hostsleutels en de vrije ruimte in de doelmap.
        Vraagt agentprotocol 21.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronSyncPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /cron-jobs/{jobId}/dry-run:
    post:
      operationId: dryRunCronSync
      summary: Een bestandssync als proef draaien naar één doel (admin)
      description: |
        rsync --dry-run --itemize-changes vanaf de bron die de sync nu zou draaien; er verandert niets. Elke regel is een bestand
        dat zou veranderen, zoals ">f+++++++++ map/bestand" (nieuw) of "*deleting oud" (weg, alleen met verwijderen aan).
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, format: uuid, description: De node-id van het doel }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [source, lines]
                properties:
                  source: { type: string, description: De bron die de proef draaide }
                  lines: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /cron-runs/{runId}:
    get:
      operationId: getCronRun
      summary: Eén run met zijn uitvoer
      description: Een viewer ziet de uitvoer niet van een job die als root draait.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronRun" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /cron-runs/{runId}/stop:
    post:
      operationId: stopCronRun
      summary: Een lopende run stoppen (admin)
      description: cf-agent stopt het commando met zijn hele procesgroep; de run krijgt de uitkomst stopped. Vraagt agentprotocol 19.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: string }
      responses:
        "202": { description: Gestopt }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /cronjobs/refresh:
    post:
      operationId: refreshCronjobs
      summary: De cronjobs van alle nodes meteen opnieuw lezen
      responses:
        "202": { description: Gestart }
        "401": { $ref: "#/components/responses/Error" }
  /databases/migration:
    get:
      operationId: getDatabaseMigration
      summary: Het plan om een database naar de database van een cluster te verhuizen
      description: |
        Bekijkt de database op de oude server (alleen de catalogus: grootte, tabellen met engine en primaire sleutel, views,
        routines, triggers en events) en laat de importerende node van het nieuwe cluster de begroeting van de oude MariaDB
        lezen, zonder in te loggen. Zonder component kiest het plan het cluster waarvan de app de database nu al gebruikt, als
        dat er één is. Met de bevindingen en de vorige proeven. Er verandert niets. Ook voor viewers.
      parameters:
        - { name: source, in: query, required: true, schema: { type: string }, description: "De sleutel van de server onder Databases, zoals mariadb/<cluster>" }
        - { name: database, in: query, required: true, schema: { type: string } }
        - { name: component, in: query, required: false, schema: { type: string, format: uuid }, description: De database van het nieuwe cluster }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseMigrationPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /databases/migration/trial:
    post:
      operationId: startDatabaseMigrationTrial
      summary: Een proefverhuizing beginnen (admin); wordt een taak
      description: |
        Maakt op de oude server een tijdelijke gebruiker die alleen deze database mag lezen, laat de nieuwe node de dump
        ophalen en importeren in <database>_proef terwijl de app doorwerkt, telt de rijen aan beide kanten, haalt de kopie en
        de gebruiker weer weg en bewaart hoe lang het duurde. Het wachtwoord van de tijdelijke gebruiker bewaart ClusterForge
        nergens. 409 als het plan iets tegenhoudt of er al een proef van deze database loopt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabaseMigrationInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migration/move:
    post:
      operationId: startDatabaseMove
      summary: Een database echt verhuizen (admin); wordt een taak
      description: |
        Zet de app eerst in onderhoud. De taak kijkt of er nog iemand met de oude database verbonden is (zonder force wacht ze
        even en stopt ze dan), maakt de gebruikers van de app op het nieuwe cluster met dezelfde hash van hun wachtwoord, laat
        de nieuwe node de dump ophalen en importeren in dezelfde naam, en telt de rijen aan beide kanten. Alles moet gelijk
        zijn; anders gaan de nieuwe database en de nieuwe gebruikers weer weg en blijft de app op de oude. Gelukt, dan wacht de
        verhuizing op overschakelen. De hash bewaart ClusterForge nergens. 409 als het plan iets tegenhoudt, als er zonder force
        nog verbindingen zijn, of als er al een proef of verhuizing van deze database loopt. Raakt de verhuizing een
        prodcluster, dan met de slug (die van het nieuwe cluster, anders die van het oude) en tweestapsverificatie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabaseMoveInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migrations/{id}/switch:
    post:
      operationId: switchDatabaseMove
      summary: De app draait op de nieuwe database (admin)
      description: |
        Voor een verhuizing die gekopieerd is. Zonder force mag niemand meer met de oude database verbonden zijn en moet
        iemand met de nieuwe verbonden zijn; anders 409 met wie. Daarna mogen de gebruikers van de app de oude database alleen
        nog lezen (SELECT en SHOW VIEW).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, description: "Toch overschakelen, ook met verbindingen naar de oude database" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseMigrationRun" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migrations/{id}/cancel:
    post:
      operationId: cancelDatabaseMove
      summary: Een gekopieerde verhuizing annuleren (admin)
      description: |
        Haalt de nieuwe database en de gebruikers die ClusterForge maakte weg van het nieuwe cluster; de app blijft op de oude
        database. Confirm is de naam van de database. 409 als iemand de nieuwe database al gebruikt: schakel dan over.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseMigrationRun" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migrations/{id}/lock:
    post:
      operationId: lockDatabaseMove
      summary: De oude database van een verhuisde app op slot zetten of het slot eraf halen (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked]
              properties:
                locked: { type: boolean, description: "true: alleen nog lezen; false: de rechten van voor de verhuizing terug" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseMigrationRun" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migrations/{id}/retire:
    post:
      operationId: retireDatabaseMove
      summary: De oude database van een verhuisde app afbouwen (admin); wordt een taak
      description: |
        Kan als er zeven dagen niemand van buiten de databasenode met de oude database verbonden was, en nu niemand
        verbonden is (ook niet op de databasenode zelf). Een laatste dump op een node van de oude server, die blijft staan;
        is hij niet compleet, dan stopt het. Daarna gaan de database en de gebruikers van de app weg. Een gebruiker die ook
        rechten op een andere database heeft of er de laatste 30 dagen een andere gebruikte, blijft. Name is de naam van de
        database; raakt het een prodcluster (dat van de app, anders het oude), dan ook de slug en tweestapsverificatie. 409
        als het nog niet kan, met tot wanneer en waarom.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentDropInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/retire:
    get:
      operationId: listDatabaseRetire
      summary: De oude databaseservers waarvan een database verhuisd is
      description: |
        Per oude server (alle databaseservers op dezelfde nodes, zoals MariaDB en PostgreSQL op db1 tot db3): de verhuisde
        databases met wanneer afbouwen kan, wat er nog van een app op staat, en per app of zijn firewallregel naar de oude
        server nog gebruikt wordt, uit de verbindingen die ClusterForge elke minuut leest. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DatabaseRetireSource" } }
        "401": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters:
    get:
      operationId: listKubeClusters
      summary: De Kubernetes-clusters met hun laatste samenvatting
      description: |
        ClusterForge vat elk cluster van type kubernetes elke 30 seconden
