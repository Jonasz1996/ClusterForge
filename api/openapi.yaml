        node_id: { type: string, format: uuid }
        hostname: { type: string }
        source_vmid: { type: integer }
        volid: { type: string }
        backup_time: { type: string, format: date-time }
        backup_storage: { type: string }
        size_bytes: { type: integer, format: int64 }
        memory_bytes: { type: integer, format: int64, description: Wat de VM volgens de config uit de back-up vraagt }
        disk_bytes: { type: integer, format: int64 }
        address: { type: string, description: Het adres van de node; de andere nodes bereiken hem daarop }
    DRPlan:
