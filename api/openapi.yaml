        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /proxmox/probe:
    post:
      operationId: probeProxmox
      summary: Certificaat van een Proxmox-adres ophalen om de vingerafdruk te controleren (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_url]
              properties:
                api_url: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxProbe" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProxmox
      summary: Eén Proxmox-omgeving
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConnection" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProxmox
      summary: Proxmox-koppeling wijzigen (admin); zonder token_secret blijft het oude
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxPatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
