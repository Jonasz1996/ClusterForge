      properties:
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        verified: { type: boolean, description: Of GitHub de handtekening van de commit geldig vindt }
        url: { type: string, description: De commit op de website }
    GitRepo:
      type: object
      required: [id, api_url, repository, branch, path, server_url, web_url, head, last_sync_at, last_error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        api_url: { type: string }
        repository: { type: string, description: "eigenaar/naam" }
        branch: { type: string }
        path: { type: string, description: De map met een map per cluster }
        server_url:
          type: string
          description: Het adres waarmee nieuwe nodes uit Git ClusterForge bereiken; leeg als het nog niet ingevuld is
        web_url: { type: string, description: De repository op de website }
        head:
          description: De laatste commit die de server zag
          allOf: [{ $ref: "#/components/schemas/GitCommit" }]
          nullable: true
        last_sync_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: Waarom de laatste synchronisatie mislukte; leeg als ze lukte }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GitRepoStatus:
      type: object
      required: [enabled, repo, interval_seconds, pending_changes]
      properties:
        enabled: { type: boolean, description: Zonder CF_MASTER_KEY staat GitOps uit }
        repo:
          allOf: [{ $ref: "#/components/schemas/GitRepo" }]
          nullable: true
        interval_seconds: { type: integer, description: Tijd tussen twee keer lezen }
        pending_changes: { type: integer, description: Wijzigingen die wachten op goedkeuring }
    GitRepoInput:
      type: object
      required: [repository]
      properties:
        api_url: { type: string, description: "Standaard https://api.github.com" }
        repository: { type: string, description: "eigenaar/naam, of de link naar de repository" }
        branch: { type: string, description: Standaard main }
        path: { type: string, description: Standaard clusters }
        token: { type: string, format: password, description: "Fine-grained token met alleen Contents: read; leeg laat het opgeslagen token staan" }
        server_url:
          type: string
          description: "Het adres waarmee nieuwe nodes ClusterForge bereiken, zoals https://clusterforge.lan; nodig voor omhoog schalen en nieuwe clusters"
    GitProbe:
      type: object
      required: [head, files]
      properties:
        head: { $ref: "#/components/schemas/GitCommit" }
        files: { type: array, items: { type: string }, description: De gevonden clusterbestanden }
    GitFieldError:
      type: object
      required: [field, line, message]
      properties:
        field: { type: string, description: "Zoals params.vip of cluster.name" }
        line: { type: integer, description: De regel in het bestand; 0 als die niet bekend is }
        message: { type: string }
    GitFileState:
      type: string
      description: |
        in_sync: gelijk aan het cluster; pending: een wijziging wacht; applying:
        een goedgekeurde wijziging wordt toegepast; not_applied: gelijk aan de
        spec, maar die staat niet op alle nodes; rejected: deze inhoud is
        afgewezen; invalid: fouten; new: een nieuw cluster; unlinked: het
        cluster bestaat maar is niet gekoppeld; missing: het bestand van een
        gekoppeld cluster ontbreekt
      enum: [in_sync, pending, applying, not_applied, rejected, invalid, new, unlinked, missing]
    GitFile:
      type: object
      required: [path, slug, state, cluster_id, cluster_name, errors, change_id, commit, secret, url]
      properties:
        path: { type: string }
        slug: { type: string }
        state: { $ref: "#/components/schemas/GitFileState" }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        errors: { type: array, items: { $ref: "#/components/schemas/GitFieldError" } }
        change_id: { type: string, format: uuid, nullable: true, description: "De wachtende, afgewezen, lopende of mislukte wijziging" }
        commit: { type: string, description: De commit waarin de server deze inhoud voor het eerst zag }
        secret: { type: boolean, description: Er stond een geheim in; de inhoud wordt niet bewaard }
        url: { type: string, description: Het bestand op de website }
    GitChangeStatus:
      type: string
      enum: [pending, applying, applied, failed, rejected, superseded]
    GitChange:
      type: object
      required: [id, cluster_id, cluster_name, cluster_environment, slug, path, kind, status, commit, base_revision, revision, summary, job_id, decided_by, decided_at, reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string, description: De naam nu, of die uit het bestand bij een nieuw cluster }
        cluster_environment: { $ref: "#/components/schemas/Environment" }
        slug: { type: string }
        path: { type: string }
        kind: { type: string, enum: [create, update] }
        status: { $ref: "#/components/schemas/GitChangeStatus" }
        commit: { $ref: "#/components/schemas/GitCommit" }
        base_revision: { type: integer }
        revision: { type: integer, nullable: true, description: De spec-revisie die de goedkeuring maakte }
        summary: { type: string, description: "Zoals: node_count van 2 naar 3; keepalived.conf op 2 nodes, 1 nieuwe node" }
        job_id: { type: string, format: uuid, nullable: true }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        reason: { type: string, description: "De reden van afwijzen of vervallen, of de fout van de taak" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GitChangeDetail:
      allOf:
        - $ref: "#/components/schemas/GitChange"
        - type: object
          required: [plan, local, file_url, needs_confirmation, full_apply, blocked, blocked_code]
          properties:
            needs_confirmation: { type: boolean, description: "Het cluster is of wordt prod: goedkeuren vraagt de slug" }
            full_apply:
              type: boolean
              description: Een eerdere revisie is niet op alle nodes toegepast, dus goedkeuren past alle stappen opnieuw toe
            blocked: { type: string, description: "Waarom goedkeuren nu niet kan; leeg als het kan" }
            blocked_code:
              type: string
              description: "no_server_url: het adres van ClusterForge ontbreekt bij de koppeling; dhcp_growth: omhoog schalen met DHCP; leeg als goedkeuren kan"
            plan: { $ref: "#/components/schemas/GitPlan" }
            local:
              type: array
              items: { type: string }
              description: Uit de laatste driftcontrole, wat op de nodes al afwijkt en overschreven wordt
            file_url: { type: string }
    GitApproveInput:
      type: object
      properties:
        confirm: { type: string, description: Op prod de slug van het cluster }
    GitRejectInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    GitReapplyInput:
      type: object
      properties:
        confirm: { type: string, description: Op prod de slug van het cluster }
    GitDecision:
      type: object
      required: [change, job]
      properties:
        change: { $ref: "#/components/schemas/GitChange" }
        job:
          allOf: [{ $ref: "#/components/schemas/Job" }]
          nullable: true
          description: null als er op geen node iets verandert
    GitFieldChange:
      type: object
      required: [field, label, from, to]
      properties:
        field: { type: string }
        label: { type: string }
        from: { type: string }
        to: { type: string }
    GitPlanNewNode:
      type: object
      required: [hostname, role, address, prefix, host, vm]
      properties:
        hostname: { type: string }
        role: { type: string }
        address: { type: string }
        prefix: { type: integer }
        host: { type: string }
        vm:
          type: object
          required: [cpu, memory_mib, disk_gib]
          properties:
            cpu: { type: integer }
            memory_mib: { type: integer }
            disk_gib: { type: integer }
    GitStepChange:
      type: object
      required: [step, ids, title, change, summary]
      properties:
        step: { type: string, description: "Zoals file:/var/www/html/index.html" }
        ids: { type: array, items: { type: string } }
        title: { type: string }
        change: { type: string, enum: [added, changed, removed] }
        summary: { type: string }
        diff: { type: string, description: "Unified diff; geheimen staan er als [geheim] in" }
    GitPlanNode:
      type: object
      required: [node_id, hostname, new, vips, steps]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        new: { type: boolean }
        vips: { type: array, items: { type: string }, description: De VIP's die deze node nu heeft }
        steps: { type: array, items: { $ref: "#/components/schemas/GitStepChange" } }
    GitPlan:
      type: object
      required: [kind, summary, base_revision, template, metadata, params, new_nodes, nodes, unchanged, warnings, no_steps]
      properties:
        kind: { type: string, enum: [create, update] }
        summary: { type: string }
        base_revision: { type: integer }
        template:
          type: object
          required: [name, from, to]
          properties:
            name: { type: string }
            from: { type: string, description: Leeg bij een nieuw cluster }
            to: { type: string }
        metadata: { type: array, items: { $ref: "#/components/schemas/GitFieldChange" } }
        params: { type: array, items: { $ref: "#/components/schemas/GitFieldChange" } }
        new_nodes: { type: array, items: { $ref: "#/components/schemas/GitPlanNewNode" } }
        nodes:
          type: array
          description: In de volgorde van toepassen; de bestaande nodes met de VIP-eigenaar als laatste, daarna de nieuwe
          items: { $ref: "#/components/schemas/GitPlanNode" }
        unchanged: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        no_steps: { type: boolean, description: Geen gerenderde stap verandert }
        vip: { type: string }
        vrid: { type: integer }
        proxmox: { type: string }
