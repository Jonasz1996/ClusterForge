      type: object
      required: [kind, namespace, name]
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
    Incident:
      type: object
      required: [id, number, title, severity, status, started_at, detected_at, resolved_at, caused_by_test, test_run_id, note, updated_at, subjects, cause]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        severity: { type: string, enum: [low, high, critical] }
        status: { type: string, enum: [open, resolved] }
        started_at: { type: string, format: date-time }
        detected_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        caused_by_test:
          type: boolean
          description: Tijdens een failovertest van ClusterForge in hetzelfde cluster
        test_run_id: { type: string, format: uuid, nullable: true }
        note: { type: string }
        updated_at: { type: string, format: date-time }
        subjects:
          type: array
          items: { $ref: "#/components/schemas/IncidentSubject" }
        cause:
          allOf: [{ $ref: "#/components/schemas/IncidentTopCause" }]
          nullable: true
          description: De eerste oorzaak uit de analyse, als die waarschijnlijk of mogelijk is
    IncidentTopCause:
      type: object
      required: [summary, level]
      properties:
        summary: { type: string }
        level: { type: string, enum: [likely, possible] }
    IncidentList:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        has_more: { type: boolean }
    IncidentDetail:
      type: object
      required: [incident, history, history_more, analysis, timeline, timeline_more, ai]
      properties:
        incident: { $ref: "#/components/schemas/Incident" }
