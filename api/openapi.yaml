        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /logs/query:
    post:
      operationId: queryLogs
      summary: De regels van een of meer logbronnen op één tijdlijn, gefilterd (admin)
      description: |
        De agents lezen de bronnen tegelijk (een bestand onder /var/log, het
        journaal of de log van een container), ontleden tijd, niveau en
