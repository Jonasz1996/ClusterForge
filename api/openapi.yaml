      properties:
        field: { type: string }
        label: { type: string }
        from: { type: string }
        to: { type: string }
    AuditEntry:
      type: object
      required: [id, ts, action, category, summary, actor, on_behalf_of, subject, cluster, node, job, ip, session, changes, payload]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        action: { type: string }
        category: { type: string }
        summary:
          type: string
          description: Wat er gebeurde, als Nederlandse zin
        actor:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [user, agent, system] }
            id: { type: string }
            name: { type: string }
        on_behalf_of:
          description: De gebruiker die de taak aanvroeg, als het systeem dit namens hem deed
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        subject:
          type: object
          required: [type, id, name, deleted]
          properties:
            type: { type: string }
            id: { type: string }
            name: { type: string }
            deleted: { type: boolean }
        cluster:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        node:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        job:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        ip: { type: string, nullable: true }
        session:
          type: string
          nullable: true
          description: Het begin van de sessiehash; regels met dezelfde waarde komen uit dezelfde login
        changes:
          type: array
          items: { $ref: "#/components/schemas/AuditChange" }
        payload: { type: object, additionalProperties: true }
    IncidentSubject:
      type: object
      required: [type, id, name, cluster_id, first_status, worst_status, last_status, reason, since, until, present, app]
      properties:
        type: { type: string, enum: [cluster, node, service, test_run, app, cron, cron_job] }
        id: { type: string, format: uuid }
        name: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        first_status: { type: string }
        worst_status: { type: string }
        last_status:
          type: string
          description: De status nu, of toen het weer goed was
        reason: { type: string }
        since: { type: string, format: date-time }
        until:
          type: string
          format: date-time
          nullable: true
          description: Wanneer het weer goed was; null zolang het nog misgaat
        present:
          type: boolean
          description: Of het onderwerp nog bestaat
        app:
          allOf: [{ $ref: "#/components/schemas/IncidentApp" }]
          nullable: true
          description: Bij een app in Kubernetes waar hij staat; null bij een ander onderwerp of een app die weg is
