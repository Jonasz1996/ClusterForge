        rpo_seconds: { type: number, format: double, nullable: true, description: De leeftijd van de oudste back-up bij de start van het terugzetten }
        rto_met: { type: boolean, nullable: true, description: Leeg zonder doel of zonder meting }
        rpo_met: { type: boolean, nullable: true }
        restore_seconds: { type: number, format: double, nullable: true }
        boot_seconds: { type: number, format: double, nullable: true }
        check_seconds: { type: number, format: double, nullable: true }
        cleanup_seconds: { type: number, format: double, nullable: true }
        total_seconds: { type: number, format: double, nullable: true }
        nodes: { type: array, items: { $ref: "#/components/schemas/DRReportNode" } }
        vips: { type: array, items: { $ref: "#/components/schemas/DRReportVIP" } }
        destroyed_at: { type: string, format: date-time, nullable: true }
        aborted: { type: string, description: Waarom de bewaking de repetitie afbrak, of leeg }
