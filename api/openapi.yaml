        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFailoverTest
      summary: Een failovertest verwijderen (admin); de runs blijven als geschiedenis
      responses:
