    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: removeKubeNode
      summary: Een worker weghalen (admin); wordt een taak
      description: |
        Leegmaken, de VM uitzetten, de node uit Kubernetes halen, de VM verwijderen en de node uit ClusterForge, met een
        nieuwe revisie van de spec met één worker minder. Alleen een worker in een cluster uit een template dat geen Git volgt;
        een server weghalen geeft 409. Met preview=true komt alleen het plan terug. Houden pods het leegmaken tegen, dan
        antwoordt de server 409 met code needs_force. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubeRemoveNodeInput" }
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeRemoveNodePlan" }
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters/{clusterId}/access:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listKubeAccess
      summary: De uitgegeven kubeconfigs; een admin ziet ze allemaal, een viewer de zijne
      description: |
        Actieve kubeconfigs, en verlopen of ingetrokken kubeconfigs van de laatste 30 dagen, de nieuwste eerst. Het token
        staat er nooit bij: ClusterForge bewaart het niet.
      responses:
        "200":
          description: De kubeconfigs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KubeAccess" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: issueKubeAccess
      summary: Een kubeconfig voor kubectl op je eigen pc
      description: |
        ClusterForge maakt een ServiceAccount in de namespace clusterforge, met de ClusterRole cluster-admin (admin) of view,
        en vraagt via de agent een token dat na days dagen verloopt. De kubeconfig wijst naar het VIP op poort 6443 en komt
        alleen in dit antwoord. Een viewer krijgt alleen view. Het vraagt je wachtwoord, of je code als je
        tweestapsverificatie hebt; een admin-kubeconfig voor prod vraagt bovendien tweestapsverificatie en de slug in
        confirm. Een agent van voor deze versie geeft 503 met code agent_too_old.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubeAccessInput" }
      responses:
        "201":
          description: Uitgegeven
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeAccessIssued" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters/{clusterId}/access/{accessId}/revoke:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: accessId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeKubeAccess
      summary: Een kubeconfig intrekken; een admin elke, een viewer de zijne
      description: |
        Het ServiceAccount gaat weg, en dan weigert de API het token meteen. Antwoordt de API nu niet, dan is de kubeconfig
        toch ingetrokken, met de fout in remove_error, en haalt ClusterForge het ServiceAccount weg zodra het cluster weer
        antwoordt.
      responses:
        "200":
          description: Ingetrokken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeAccess" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /kubernetes/snapshots:
    get:
      operationId: listKubeSnapshotClusters
      summary: Per Kubernetes-cluster hoe het met de etcd-snapshots staat, voor Back-ups
      description: |
        Zoals de sync ze laatst las (om de vijf minuten). freshness is ok als de nieuwste snapshot jonger is dan een dag,
        stale als hij ouder is, none zonder snapshot, en unknown als de lijst niet te lezen is.
      responses:
        "200":
          description: De clusters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KubeSnapshotCluster" } }
        "401": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters/{clusterId}/snapshots:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listKubeSnapshots
      summary: De etcd-snapshots van een cluster, per server
      description: |
        ClusterForge leest ze op dat moment uit de API (ETCDSnapshotFile van k3s). Lukt dat niet, dan komt de laatst
        gelezen lijst terug met de fout in error.
      responses:
        "200":
          description: De snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeSnapshots" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: saveKubeSnapshot
      summary: Snapshot nu (admin)
      description: |
        De agent op de server die het cluster begon doet k3s etcd-snapshot save --name clusterforge; is die er niet, dan
        een andere server. snapshot is leeg als k3s hem nog niet in de API meldt. Een agent van voor deze versie geeft 503
        met code agent_too_old, een fout van k3s 502 met code node_failed.
      responses:
        "201":
          description: Gemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeSnapshotSaved" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters/{clusterId}/snapshots/restore:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreKubeSnapshot
      summary: Een snapshot terugzetten in lab of test (admin); wordt een taak
      description: |
        Alles wat na de snapshot veranderde in Kubernetes is daarna weg. De taak maakt eerst een snapshot van nu, stopt
        k3s op elke server, zet de snapshot terug op de server die het cluster begon (k3s server --cluster-reset), start k3s
        daar, zet op de andere servers de database van etcd opzij en start ze, en wacht tot elke node Ready is. Alleen met
        een snapshot op de server die het cluster begon. Met preview=true komt alleen het plan terug; anders is de slug in
        confirm nodig. Op prod geeft het 409: daar staat het runbook in de webinterface en de README.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubeRestoreInput" }
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeRestorePlan" }
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters/{clusterId}/upgrade:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getKubeUpgrade
      summary: Welke k3s het cluster draait en naar welke het kan
      description: |
        Bijwerken is overstappen naar een nieuwere versie van de template kubernetes, met de wijziging van de spec
        (POST /clusters/{id}/spec met version). next is de nieuwste templateversie met een nieuwere k3s die nu kan:
        Kubernetes gaat één minorversie per keer omhoog en nooit terug. De nodes komen live uit de API; lukt dat niet,
        dan is nodes leeg en staat de fout in nodes_error. Een cluster dat niet uit een template komt, geeft 409.
      responses:
        "200":
          description: De versies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeUpgrade" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cf_session
  parameters:
    KubeNamespace:
      name: namespace
      in: query
      description: Alleen deze namespace; zonder zijn het alle
      schema: { type: string }
    KubeSystem:
      name: system
      in: query
      description: Ook de systeemnamespaces kube-system, kube-public en kube-node-lease; standaard niet
      schema: { type: boolean }
    KubeGroup:
      name: group
      in: query
      description: De API-groep, zoals apps; leeg is de kerngroep
      schema: { type: string }
    KubeVersion:
      name: version
      in: query
      required: true
      description: De versie, zoals v1
      schema: { type: string }
    KubeResource:
      name: resource
      in: query
      required: true
      description: De soort in het meervoud, zoals deployments
      schema: { type: string }
    DocScopeParam:
      name: scope
      in: path
      required: true
      description: overview of cluster
      schema: { type: string }
    DocKindParam:
      name: kind
      in: path
      required: true
      description: overzicht bij scope overview; architectuur, netwerk, configuratie, cronjobs, herstel of runbooks bij een cluster, kubernetes bij een Kubernetes-cluster, en database bij een cluster met een databaseserver op zijn nodes
      schema: { type: string }
    DocClusterParam:
      name: cluster
      in: query
      description: Het cluster; verplicht bij scope cluster
      schema: { type: string, format: uuid }
    TimelineFrom:
      name: from
      in: query
      description: Vanaf dit tijdstip; standaard 24 uur geleden
      schema: { type: string, format: date-time }
    TimelineTo:
      name: to
      in: query
      description: Tot (niet tot en met) dit tijdstip; standaard nu
      schema: { type: string, format: date-time }
    TimelineClass:
      name: class
      in: query
      description: Alleen deze klassen, met komma's, zoals change,symptom
      schema: { type: string }
    TimelineLimit:
      name: limit
      in: query
      description: Het aantal laatste regels
      schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
    MetricsFrom:
      name: from
      in: query
      description: Een vast venster in plaats van range, samen met to; hoogstens 7 dagen
      schema: { type: string, format: date-time }
    MetricsTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    ChangesFrom:
      name: from
      in: query
      description: Vanaf dit tijdstip; standaard 7 dagen geleden
      schema: { type: string, format: date-time }
    ChangesTo:
      name: to
      in: query
      description: Tot (niet tot en met) dit tijdstip; standaard nu
      schema: { type: string, format: date-time }
    ChangesKind:
      name: kind
      in: query
      description: Alleen deze soorten, met komma's, zoals package,service
      schema: { type: string }
    ChangesLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
    AuditBefore:
      name: before
      in: query
      description: Alleen regels met een kleiner id (de volgende pagina)
      schema: { type: integer, format: int64 }
    AuditFrom:
      name: from
      in: query
      description: Vanaf dit tijdstip
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      description: Tot (niet tot en met) dit tijdstip
      schema: { type: string, format: date-time }
    AuditUser:
      name: user
      in: query
      description: Wat deze gebruiker deed, wat namens hem gebeurde en wat over zijn account ging
      schema: { type: string, format: uuid }
    AuditActorType:
      name: actor_type
      in: query
      schema: { type: string, enum: [user, agent, system] }
    AuditCluster:
      name: cluster
      in: query
      description: Ook een verwijderd cluster
      schema: { type: string, format: uuid }
    AuditNode:
      name: node
      in: query
      description: Ook taken en agents van deze node
      schema: { type: string, format: uuid }
    AuditJob:
      name: job
      in: query
      schema: { type: string, format: uuid }
    AuditCategory:
      name: category
      in: query
      description: Een soort uit /audit/info
      schema: { type: string }
    AuditQuery:
      name: q
      in: query
      description: Zoekt in action, payload en de namen van gebruiker, cluster, node en taak
      schema: { type: string, maxLength: 200 }
  responses:
    Error:
      description: Fout
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Preferences:
      type: object
      required: [kube_learning]
      properties:
        kube_learning: { type: boolean, description: "De leermodus in het dashboard Kubernetes: uitleg en kubectl-commando's" }
    ClusterComponent:
      type: object
      required: [id, cluster_id, engine, template, version, title, revision, applied_revision, params, nodes, vip, state, job_id, job_error, created_at, updated_at,
        auto_recover, down_since, down_reason, nodes_out, recovery, health, health_reason, health_at]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        engine: { type: string, description: mariadb of postgresql }
        template: { type: string, description: "Het onderdeel, zoals mariadb-galera" }
        version: { type: string }
        title: { type: string }
        revision: { type: integer }
        applied_revision: { type: integer, nullable: true, description: De laatste revisie die helemaal lukte; null tot de eerste uitrol klaar is }
        params: { type: object, additionalProperties: true, description: De instellingen zonder geheimen }
        nodes: { type: array, items: { $ref: "#/components/schemas/ComponentNode" } }
        vip:
          allOf: [{ $ref: "#/components/schemas/ComponentVIP" }]
          nullable: true
          description: Het VIP van de app dat de database volgt; null zonder
        state: { type: string, description: "installing, applying, ready of failed" }
        job_id: { type: string, format: uuid, nullable: true, description: De laatste taak die het onderdeel toepaste }
        job_error: { type: string, description: Waarom die taak mislukte }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        auto_recover: { type: boolean, description: Na een volledige uitval vanzelf opnieuw beginnen }
        down_since:
          type: string
          format: date-time
          nullable: true
          description: Sinds wanneer geen enkele node in een Primary component zit; null zolang de database draait
        down_reason: { type: string, description: "Waarom de database weg is, per node" }
        nodes_out: { type: array, items: { $ref: "#/components/schemas/ComponentNodeOut" }, description: De nodes die niet meedoen terwijl het cluster draait }
        recovery:
          allOf: [{ $ref: "#/components/schemas/ComponentRecovery" }]
          nullable: true
          description: De laatste taak die de database opnieuw startte; null als er nog geen was
        health:
          type: string
          enum: ["", healthy, degraded, down]
          description: Wat de bewaking laatst zag; leeg als ze nog niet keek of al twee minuten niet, zoals tijdens een taak. Telt mee in de status van het cluster
        health_reason: { type: string, description: "Waarom verminderd of down, met de naam van de database ervoor" }
        health_at: { type: string, format: date-time, nullable: true, description: Wanneer de bewaking laatst keek }
    ComponentNodeOut:
      type: object
      required: [hostname, since, reason]
      properties:
        hostname: { type: string }
        since: { type: string, format: date-time }
        reason: { type: string }
    ComponentRecovery:
      type: object
      required: [job_id, status, error]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, description: "queued, running, succeeded, failed of canceled" }
        error: { type: string }
    ComponentUpdateInput:
      type: object
      required: [auto_recover]
      properties:
        auto_recover: { type: boolean }
    HealRunInput:
      type: object
      required: [key, hash]
      properties:
        key: { type: string, description: De sleutel van de database uit GET /heal }
        hash: { type: string, description: De hash van het plan dat je zag }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentRecoverInput:
      type: object
      required: [hash]
      properties:
        hash: { type: string, description: De hash van het plan dat je zag }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentDatabases:
      type: object
      required: [engine, node, address, port, hosts, databases, users]
      properties:
        engine: { type: string, enum: [mariadb, postgresql] }
        node: { type: string, description: "De datanode waarvan ClusterForge las; bij PostgreSQL de primary" }
        address: { type: string, description: "Waar een app verbindt; het VIP van de database, of de eerste datanode" }
        port: { type: integer }
        hosts:
          type: array
          items: { type: string }
          description: "De adressen waarvandaan een nieuwe gebruiker mag inloggen; alle nodes en VIP's van het cluster. Leeg bij PostgreSQL, waar pg_hba dat bepaalt"
        databases:
          type: array
          items: { $ref: "#/components/schemas/ComponentDatabase" }
        users:
          type: array
          items: { $ref: "#/components/schemas/ComponentDatabaseUser" }
    ComponentDatabase:
      type: object
      required: [name, size_bytes, tables, connections, users]
      properties:
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        tables: { type: integer, description: -1 als het aantal niet te lezen was }
        connections: { type: integer, description: Verbindingen op de node waarvan ClusterForge las }
        users:
          type: array
          items: { type: string }
          description: De gebruikers met rechten op deze database
    ComponentDatabaseUser:
      type: object
      required: [name, hosts, system, global, databases]
      properties:
        name: { type: string }
        hosts:
          type: array
          items: { type: string }
        system:
          type: boolean
          description: "Een gebruiker van de database zelf, zoals root of postgres, of een tijdelijke beheerder van ClusterForge om een dump terug te zetten"
        global:
          type: array
          items: { type: string }
          description: Rechten op alle databases
        databases:
          type: array
          items: { $ref: "#/components/schemas/ComponentDatabaseGrant" }
    ComponentDatabaseGrant:
      type: object
      required: [database, all, privileges]
      properties:
        database: { type: string }
        all: { type: boolean, description: "Alle rechten op deze database; bij PostgreSQL de eigenaar" }
        privileges:
          type: array
          items: { type: string }
    ComponentDatabaseInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "1 tot 63 kleine letters, cijfers of _" }
        user: { type: string, description: De gebruiker; standaard de naam van de database }
    ComponentDatabaseCreated:
      type: object
      required: [database, user, password, hosts, address, port, node]
      properties:
        database: { type: string }
        user: { type: string }
        password: { type: string, description: Staat alleen hier; ClusterForge bewaart het niet }
        hosts:
          type: array
          items: { type: string }
        address: { type: string }
        port: { type: integer }
        node: { type: string }
    ComponentUserPassword:
      type: object
      required: [user, password, hosts]
      properties:
        user: { type: string }
        password: { type: string, description: Staat alleen hier; ClusterForge bewaart het niet }
        hosts:
          type: array
          items: { type: string }
    ComponentDropInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "De naam van wat weg moet, ter bevestiging" }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentConfirmInput:
      type: object
      properties:
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentBackupSettings:
      type: object
      required: [on, at, keep_days]
      properties:
        on: { type: boolean, description: Elke dag een dump van elke database }
        at: { type: string, description: "Wanneer, als uu:mm in de tijdzone van de server", example: "02:00" }
        keep_days: { type: integer, minimum: 1, maximum: 90, description: Zoveel dagen blijft een dump staan }
        next_at: { type: string, format: date-time, nullable: true, readOnly: true, description: De volgende nachtelijke dump }
    ComponentDump:
      type: object
      required: [id, database, node, file, trigger, status, started_at, finished_at, size_bytes, raw_bytes, tables, tables_expected, message, job_id, restore_name]
      properties:
        id: { type: string, format: uuid }
        database: { type: string }
        node: { type: string, description: De node waarop de dump staat }
        file: { type: string, description: "De naam in /var/backups/clusterforge-db/<database>/" }
        trigger: { type: string, enum: [schedule, manual] }
        status:
          type: string
          enum: [running, ok, suspect, failed]
          description: "suspect: compleet, maar meer dan de helft kleiner dan de vorige goede, of er mist een tabel"
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        size_bytes: { type: integer, format: int64, description: Op schijf, met zstd }
        raw_bytes: { type: integer, format: int64, description: De SQL }
        tables: { type: integer }
        tables_expected: { type: integer }
        message: { type: string, description: Waarom de dump mislukte of verdacht is }
        job_id: { type: string, format: uuid, nullable: true }
        restore_name: { type: string, description: "De standaardnaam als je deze dump terugzet: <database>_herstel_<datum van de dump>" }
    ComponentDatabaseDumps:
      type: object
      required: [database, latest, failed, freshness]
      properties:
        database: { type: string }
        latest: { allOf: [{ $ref: "#/components/schemas/ComponentDump" }], nullable: true, description: De nieuwste goede dump }
        failed: { allOf: [{ $ref: "#/components/schemas/ComponentDump" }], nullable: true, description: "De laatste poging, als die na de nieuwste goede mislukte of verdacht was" }
        freshness:
          type: string
          enum: [ok, stale, missing, "off"]
          description: "stale: de nieuwste goede dump is ouder dan 26 uur; off: de nachtelijke dump staat uit"
    ComponentDumps:
      type: object
      required: [settings, databases, dumps, active]
      properties:
        settings: { $ref: "#/components/schemas/ComponentBackupSettings" }
        databases: { type: array, items: { $ref: "#/components/schemas/ComponentDatabaseDumps" } }
        dumps: { type: array, items: { $ref: "#/components/schemas/ComponentDump" } }
        active: { allOf: [{ $ref: "#/components/schemas/ComponentDumpJob" }], nullable: true, description: Een dump of terugzetten dat wacht of loopt }
    ComponentDumpJob:
      type: object
      required: [job_id, kind, title]
      properties:
        job_id: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
    ComponentDumpInput:
      type: object
      required: [database]
      properties:
        database: { type: string }
    ComponentRestoreInput:
      type: object
      properties:
        target: { type: string, description: "De nieuwe database; standaard <database>_herstel_<datum van de dump>" }
    ComponentRestoreStarted:
      type: object
      required: [job, target]
      properties:
        job: { $ref: "#/components/schemas/Job" }
        target: { type: string }
    DatabaseBackups:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DatabaseBackup" } }
    DatabaseBackup:
      type: object
      required: [cluster_id, cluster_name, component_id, engine, database, latest, failed, freshness, settings]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        component_id: { type: string, format: uuid }
        engine: { type: string }
        database: { type: string }
        latest: { allOf: [{ $ref: "#/components/schemas/ComponentDump" }], nullable: true }
        failed: { allOf: [{ $ref: "#/components/schemas/ComponentDump" }], nullable: true }
        freshness: { type: string, enum: [ok, stale, missing, "off"] }
        settings: { $ref: "#/components/schemas/ComponentBackupSettings" }
    ComponentManage:
      type: object
      required: [cluster_id, cluster_name, slug, prod, engine, title, vip, nodes, hash]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        slug: { type: string }
        prod: { type: boolean }
        engine: { type: string, enum: [mariadb, postgresql] }
        title: { type: string }
        vip: { type: string, description: Het VIP van de database; leeg zonder }
        nodes: { type: array, items: { $ref: "#/components/schemas/ComponentManageNode" } }
        hash: { type: string }
    ComponentManageNode:
      type: object
      required: [node_id, hostname, index, answered, state, healthy, role, sync, lag_bytes, pending_restart, vip, actions]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        index: { type: integer }
        answered: { type: boolean, description: De agent antwoordde }
        state: { type: string, description: Hoe het met de database op de node staat, in woorden }
        healthy: { type: boolean, description: "De node doet mee: Synced bij Galera, de primary of een replica die bijhoudt bij Patroni" }
        role: { type: string, description: "Bij PostgreSQL primary of replica; leeg bij Galera" }
        sync: { type: boolean, description: De synchrone replica van Patroni }
        lag_bytes: { type: integer, format: int64, nullable: true, description: Hoeveel WAL een replica nog niet heeft; null als Patroni het niet zegt }
        pending_restart: { type: boolean, description: Een gewijzigde instelling werkt pas na een herstart van PostgreSQL }
        vip: { type: boolean, description: De node heeft nu het VIP van de database }
        actions: { type: array, items: { $ref: "#/components/schemas/ComponentManageAction" } }
    ComponentManageAction:
      type: object
      required: [action, title, allowed, reason, effects]
      properties:
        action: { type: string, enum: [resync, switchover, reinit] }
        title: { type: string }
        allowed: { type: boolean }
        reason: { type: string, description: Waarom het nu niet kan; leeg als het kan }
        effects: { type: array, items: { type: string }, description: Wat er gebeurt }
    ComponentManageInput:
      type: object
      required: [action, node_id, hash]
      properties:
        action: { type: string, enum: [resync, switchover, reinit] }
        node_id: { type: string, format: uuid }
        hash: { type: string, description: De hash van Beheer zoals je het zag }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentSettingsPlanInput:
      type: object
      properties:
        settings:
          type: object
          additionalProperties: true
          description: De nieuwe waarden, zoals buffer_pool of shared_buffers en max_connections; wat ontbreekt, blijft
    ComponentSettingsInput:
      type: object
      required: [hash]
      properties:
        settings:
          type: object
          additionalProperties: true
          description: Dezelfde waarden als in het plan
        hash: { type: string, description: De hash van het plan zoals je het zag }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentSettingsPlan:
      type: object
      required: [cluster_id, cluster_name, slug, prod, engine, title, revision, params, changes, nodes, effects, findings, blocked, hash]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        slug: { type: string }
        prod: { type: boolean }
        engine: { type: string, enum: [mariadb, postgresql] }
        title: { type: string }
        revision: { type: integer, description: De revisie nu; de nieuwe instellingen worden de volgende }
        params: { type: array, items: { $ref: "#/components/schemas/ComponentSettingParam" } }
        changes: { type: array, items: { $ref: "#/components/schemas/ComponentSettingChange" } }
        nodes: { type: array, items: { $ref: "#/components/schemas/ComponentSettingsNode" }, description: De datanodes op de volgorde van toepassen }
        effects: { type: array, items: { type: string }, description: Wat er gebeurt }
        findings: { type: array, items: { $ref: "#/components/schemas/ComponentFinding" } }
        blocked: { type: boolean }
        hash: { type: string }
    ComponentSettingParam:
      type: object
      required: [name, label, help, type, value, min, max]
      properties:
        name: { type: string }
        label: { type: string }
        help: { type: string }
        type: { type: string, description: "size, int, string of bool" }
        value: { type: string, description: De waarde nu, als tekst zoals 1G of 200 }
        min: { type: string }
        max: { type: string }
    ComponentSettingChange:
      type: object
      required: [name, label, from, to]
      properties:
        name: { type: string }
        label: { type: string }
        from: { type: string }
        to: { type: string }
    ComponentSettingsNode:
      type: object
      required: [node_id, hostname, state, healthy, writer, memory_bytes, memory_used_pct, free_after_pct]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        state: { type: string }
        healthy: { type: boolean }
        writer: { type: boolean, description: "De schrijver: de node met het VIP bij Galera, de primary bij PostgreSQL" }
        memory_bytes: { type: integer, format: int64 }
        memory_used_pct: { type: number, format: double, nullable: true, description: Wat de node de laatste zeven dagen tot gebruikte, de database meegerekend }
        free_after_pct: { type: number, format: double, nullable: true, description: Wat er met de nieuwe instellingen vrij blijft }
    ComponentUpgradePlan:
      type: object
      required: [cluster_id, cluster_name, slug, prod, engine, title, nodes, effects, findings, blocked, hash]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        slug: { type: string }
        prod: { type: boolean }
        engine: { type: string, enum: [mariadb, postgresql] }
        title: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/ComponentUpgradeNode" }, description: De nodes op de volgorde van bijwerken }
        effects: { type: array, items: { type: string }, description: Wat er gebeurt }
        findings: { type: array, items: { $ref: "#/components/schemas/ComponentFinding" } }
        blocked: { type: boolean }
        hash: { type: string }
    ComponentUpgradeNode:
      type: object
      required: [node_id, hostname, role, state, healthy, writer, version, packages, skip]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        role: { type: string, enum: [data, arbiter] }
        state: { type: string }
        healthy: { type: boolean }
        writer: { type: boolean }
        version: { type: string, description: De versie die nu draait; leeg bij een scheidsrechter }
        packages:
          type: array
          items: { type: string }
          nullable: true
          description: Pakketten van de database met een nieuwere versie volgens de laatste apt update; null als de agent het niet zei
        skip: { type: boolean, description: "Er is niets bij te werken, zoals op de scheidsrechter van PostgreSQL" }
    ComponentUpgradeInput:
      type: object
      required: [hash]
      properties:
        hash: { type: string, description: De hash van het plan zoals je het zag }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentJoinPlanInput:
      type: object
      properties:
        node_id: { type: string, format: uuid, description: De node die bij de database komt; zonder alleen de kandidaten }
    ComponentJoinInput:
      type: object
      required: [node_id, hash]
      properties:
        node_id: { type: string, format: uuid }
        hash: { type: string, description: De hash van het plan zoals je het zag }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentJoinPlan:
      type: object
      required: [cluster_id, cluster_name, slug, prod, engine, title, revision, candidates, node, members, vip, vip_joins, votes, effects, findings,
                 blocked, hash]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        slug: { type: string }
        prod: { type: boolean }
        engine: { type: string, enum: [mariadb, postgresql] }
        title: { type: string }
        revision: { type: integer, description: De revisie nu; met de node erbij wordt het de volgende }
        candidates: { type: array, items: { $ref: "#/components/schemas/ComponentJoinCandidate" }, description: De nodes van het cluster zonder de database }
        node:
          description: De nieuwe node met de controles en stappen; null zonder keuze
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ComponentPlanNode" }]
        members: { type: array, items: { $ref: "#/components/schemas/ComponentJoinMember" }, description: De nodes die er al zijn }
        vip: { type: string, description: Het VIP van de database; leeg zonder }
        vip_joins: { type: boolean, description: De nieuwe node krijgt het VIP in keepalived }
        votes: { type: integer, description: Het aantal stemmen met de nieuwe node erbij }
        effects: { type: array, items: { type: string }, description: Wat er gebeurt }
        findings: { type: array, items: { $ref: "#/components/schemas/ComponentFinding" } }
        blocked: { type: boolean }
        hash: { type: string }
    ComponentJoinCandidate:
      type: object
      required: [node_id, hostname]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
    ComponentJoinMember:
      type: object
      required: [node_id, hostname, role, state, healthy, writer, changes]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        role: { type: string }
        state: { type: string }
        healthy: { type: boolean }
        writer: { type: boolean, description: De node met het VIP bij Galera, de primary bij PostgreSQL }
        changes: { type: array, items: { type: string }, description: Wat er op deze node verandert; niets herstart de database }
    ComponentRecoverPlan:
      type: object
      required: [cluster_id, cluster_name, slug, prod, title, nodes, primary, begin, findings, blocked, hash]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        slug: { type: string }
        prod: { type: boolean }
        title: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/ComponentRecoverNode" } }
        primary: { type: string, description: De node die al in een Primary component zit; leeg als de database helemaal weg is }
        begin: { type: string, description: De node die het cluster begint; leeg als het cluster draait of als dat pas na het lezen van de posities vastligt }
        findings: { type: array, items: { $ref: "#/components/schemas/ComponentFinding" } }
        blocked: { type: boolean }
        hash: { type: string }
    ComponentRecoverNode:
      type: object
      required: [node_id, hostname, index, answered, state, active, running, uuid, seqno, safe_to_bootstrap, from, action]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        index: { type: integer }
        answered: { type: boolean, description: De agent antwoordde }
        state: { type: string, description: Hoe het met MariaDB staat, in woorden }
        active: { type: string, description: "Wat systemd over mariadb zegt: active, activating, failed of inactive" }
        running: { type: boolean }
        uuid: { type: string, description: De geschiedenis van het cluster }
        seqno: { type: integer, format: int64, description: De laatste transactie; -1 als die onbekend is }
        safe_to_bootstrap: { type: boolean, description: De node stopte als laatste }
        from: { type: string, description: "Waar de positie vandaan komt: running, grastate of recovery" }
        action: { type: string, description: "begin, join, none (doet al mee), skip (antwoordt niet) of later (na het lezen van de posities)" }
    ComponentVIP:
      type: object
      required: [id, address, nodes, owner, own, vrid]
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        nodes: { type: array, items: { type: string }, description: De nodes van de database die het VIP in keepalived hebben }
        owner: { type: string, description: De node die het VIP nu heeft; leeg als niemand }
        own: { type: boolean, description: Een eigen VIP van de database, met een vrrp_instance van ClusterForge }
        vrid: { type: integer, description: Het VRRP-id van een eigen VIP; 0 bij het VIP van de app }
    ComponentPlanVIP:
      type: object
      required: [id, address, owner, own, vrid]
      properties:
        id: { type: string, format: uuid, description: Leeg (nullen) bij een eigen VIP dat er nog niet is }
        address: { type: string }
        owner: { type: string, description: De node die het VIP nu heeft; leeg als niemand }
        own: { type: boolean, description: Een eigen VIP dat ClusterForge maakt }
        vrid: { type: integer, description: Het VRRP-id van een eigen VIP; 0 bij het VIP van de app }
    ComponentNode:
      type: object
      required: [node_id, hostname, role, index]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        role: { type: string, description: "data of arbiter" }
        index: { type: integer }
    ComponentInput:
      type: object
      required: [engine, nodes]
      properties:
        engine: { type: string, description: mariadb of postgresql }
        nodes: { type: array, items: { type: string, format: uuid }, description: "De datanodes op volgorde; de eerste begint het cluster" }
        arbiter: { type: string, format: uuid, nullable: true, description: "Een node die alleen meestemt (garbd of etcd); nodig bij twee datanodes" }
        settings:
          type: object
          additionalProperties: true
          description: "buffer_pool of shared_buffers en max_connections; wat ontbreekt, krijgt de standaard"
        vip_id:
          type: string
          format: uuid
          nullable: true
          description: "Het VIP van de app: keepalived zet het dan alleen op een node waarvan MariaDB mag schrijven. Niet bij PostgreSQL"
        vip_address:
          type: string
          description: >-
            Een eigen VIP voor de database, met een eigen vrrp_instance van ClusterForge; het staat altijd op de node waar de database
            schrijft. Nodig bij PostgreSQL, bij MariaDB in plaats van vip_id
    ComponentApplyInput:
      allOf:
        - { $ref: "#/components/schemas/ComponentInput" }
        - type: object
          required: [hash]
          properties:
            hash: { type: string, description: De hash van het plan dat je zag }
            confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentReapplyInput:
      type: object
      properties:
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    ComponentPlan:
      type: object
      required: [cluster_id, cluster_name, slug, prod, engine, template, version, title, params, nodes, vip, findings, blocked, hash]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        slug: { type: string }
        prod: { type: boolean }
        engine: { type: string }
        template: { type: string }
        version: { type: string }
        title: { type: string }
        params: { type: object, additionalProperties: true, description: "De instellingen met de standaarden; een geheim als [geheim]" }
        nodes: { type: array, items: { $ref: "#/components/schemas/ComponentPlanNode" } }
        vip:
          allOf: [{ $ref: "#/components/schemas/ComponentPlanVIP" }]
          nullable: true
        findings: { type: array, items: { $ref: "#/components/schemas/ComponentFinding" } }
        blocked: { type: boolean, description: "Iets houdt het tegen; uitrollen kan niet" }
        hash: { type: string }
    ComponentPlanNode:
      type: object
      required: [node_id, hostname, role, index, address, os, pve_type, pve_node, vmid, memory_bytes, memory_used_pct, need_bytes, free_after_pct,
                 disk_free_bytes, disk_mount, existing, steps, vip_instance, vip_diff]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        role: { type: string }
        index: { type: integer }
        address: { type: string }
        os: { type: string }
        pve_type: { type: string, description: "lxc, qemu, of leeg als ClusterForge de node niet in Proxmox kent" }
        pve_node: { type: string, description: De Proxmox-host }
        vmid: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        memory_used_pct: { type: number, nullable: true, description: "Hoogstens gebruikt in zeven dagen (p95); null zonder metingen" }
        need_bytes: { type: integer, format: int64, description: De buffer pool plus ongeveer 300 MB }
        free_after_pct: { type: number, nullable: true, description: Wat er daarna overblijft; null zonder metingen }
        disk_free_bytes: { type: integer, format: int64, nullable: true }
        disk_mount: { type: string }
        existing: { type: string, description: Wat er al aan MariaDB draait }
        steps: { type: array, items: { type: string } }
        vip_instance: { type: string, description: De vrrp_instance met het VIP; leeg als het VIP niet op deze node staat }
        vip_diff: { type: string, description: "Wat ClusterForge in keepalived.conf verandert, als unified diff zonder auth_pass; leeg als er niets verandert" }
    ComponentTemplate:
      type: object
      required: [engine, name, version, title, description, params]
      properties:
        engine: { type: string, enum: [mariadb, postgresql] }
        name: { type: string }
        version: { type: string }
        title: { type: string }
        description: { type: string }
        params: { type: array, items: { $ref: "#/components/schemas/TemplateParam" } }
    ComponentFinding:
      type: object
      required: [level, code, node_id, hostname, message, command]
      properties:
        level: { type: string, description: "blocked, warning of info" }
        code: { type: string }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string }
        message: { type: string }
        command: { type: string, description: Een commando dat het oplost; leeg als er geen is }
    DatabaseMigrationInput:
      type: object
      required: [source, database, component_id]
      properties:
        source: { type: string }
        database: { type: string }
        component_id: { type: string, format: uuid }
    DatabaseMoveInput:
      type: object
      required: [source, database, component_id]
      properties:
        source: { type: string }
        database: { type: string }
        component_id: { type: string, format: uuid }
        force: { type: boolean, description: "Toch verhuizen, ook als er nog verbindingen met de oude database zijn" }
        confirm: { type: string, description: "De slug, als de verhuizing een prodcluster raakt" }
    DatabaseMigrationPlan:
      type: object
      required: [source, database, info, clients, targets, target, reach, findings, blocked, accounts, new_hosts, connections, move_findings,
        move_blocked, runs, active]
      properties:
        source: { $ref: "#/components/schemas/DatabaseMigrationSource" }
        database: { type: string }
        info:
          allOf: [{ $ref: "#/components/schemas/DatabaseMigrationInfo" }]
          nullable: true
          description: Wat de oude server over de database weet; null als hij niet te lezen was
        clients: { type: array, items: { $ref: "#/components/schemas/DatabaseUser" }, description: Wie de database de laatste 30 dagen gebruikte }
        targets: { type: array, items: { $ref: "#/components/schemas/DatabaseMigrationOption" } }
        target:
          allOf: [{ $ref: "#/components/schemas/DatabaseMigrationTarget" }]
          nullable: true
        reach:
          allOf: [{ $ref: "#/components/schemas/DatabaseMigrationReach" }]
          nullable: true
        findings: { type: array, items: { $ref: "#/components/schemas/ComponentFinding" } }
        blocked: { type: boolean, description: De proef kan niet }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/DatabaseMigrationAccount" }
          description: De gebruikers met rechten op de database op de oude server, zonder wachtwoord of hash
        new_hosts: { type: array, items: { type: string }, description: Waarvandaan die gebruikers op het nieuwe cluster mogen inloggen }
        connections:
          type: array
          items: { $ref: "#/components/schemas/DatabaseMigrationConnection" }
          description: Wie er nu met de oude database verbonden is
        move_findings:
          type: array
          items: { $ref: "#/components/schemas/ComponentFinding" }
          description: Wat alleen de echte verhuizing aangaat; de bevindingen in findings gelden ook, behalve die over de kopie van de proef
        move_blocked: { type: boolean, description: De echte verhuizing kan niet }
        runs: { type: array, items: { $ref: "#/components/schemas/DatabaseMigrationRun" } }
        active:
          allOf: [{ $ref: "#/components/schemas/ComponentDumpJob" }]
          nullable: true
          description: Een proef of verhuizing van deze database die nu kopieert
    DatabaseMigrationAccount:
      type: object
      required: [user, host, plugin, privileges, global, member_of, moves]
      properties:
        user: { type: string }
        host: { type: string, description: Leeg bij PostgreSQL }
        plugin:
          type: string
          description: "Hoe hij inlogt. MariaDB: alleen mysql_native_password gaat mee. PostgreSQL: nologin, scram-sha-256, md5, none (zonder wachtwoord) of other"
        privileges:
          type: array
          items: { type: string }
          description: "Bij PostgreSQL OWNER, CONNECT, CREATE, TEMPORARY, en OBJECTS als hij iets in de database bezit of er rechten op heeft"
        global: { type: boolean, description: Hij heeft ook rechten op alle databases, of mag bij PostgreSQL databases of rollen maken }
        member_of: { type: array, items: { type: string }, description: Bij PostgreSQL de rollen waarvan hij lid is }
        moves: { type: boolean, description: De echte verhuizing neemt hem mee }
    DatabaseMigrationConnection:
      type: object
      required: [server, user, address, hostname, count]
      properties:
        server: { type: string }
        user: { type: string }
        address: { type: string, description: Leeg voor een verbinding van de server zelf }
        hostname: { type: string, description: "De node met dat adres, als ClusterForge hem kent" }
        count: { type: integer }
    DatabaseMigrationSource:
      type: object
      required: [key, name, cluster_id, slug, environment, engine, kind, version, summary, servers, node, address, port, via]
      properties:
        key: { type: string }
        name: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        slug: { type: string, description: Leeg bij een losse node }
        environment: { type: string }
        engine: { type: string }
        kind: { type: string }
        version: { type: string }
        summary: { type: string }
        servers: { type: array, items: { type: string } }
        node: { type: string, description: De server waarop ClusterForge de database bekijkt en de tijdelijke gebruiker maakt; leeg als er geen is }
        address: { type: string, description: Het adres waarmee de nieuwe node de oude server bereikt; leeg zolang dat niet bekeken is }
        port: { type: integer }
        via: { type: string, description: "node (rechtstreeks) of vip; leeg zolang dat niet bekeken is" }
    DatabaseMigrationInfo:
      type: object
      required: [version, charset, collation, size_bytes, tables, rows, views, routines, triggers, events, owner, extensions]
      properties:
        version: { type: string }
        owner: { type: string, description: Bij PostgreSQL de eigenaar van de database }
        extensions: { type: array, items: { type: string }, description: Bij PostgreSQL de extensies in de database }
        charset: { type: string, description: Bij PostgreSQL de encoding }
        collation: { type: string }
        size_bytes: { type: integer, format: int64, description: De data en indexen van alle tabellen }
        tables: { type: integer }
        rows: { type: integer, format: int64, description: De schatting van InnoDB, geen telling }
        views: { type: integer }
        routines: { type: integer }
        triggers: { type: integer }
        events: { type: integer }
    DatabaseMigrationOption:
      type: object
      required: [cluster_id, cluster_name, component_id, suggested]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        component_id: { type: string, format: uuid }
        suggested: { type: boolean, description: De app van dit cluster gebruikt de database nu al }
    DatabaseMigrationTarget:
      type: object
      required: [cluster_id, cluster_name, slug, environment, component_id, node, version, address, port, hosts, buffer_pool_bytes, data_bytes,
        disks, exists]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        slug: { type: string }
        environment: { type: string }
        component_id: { type: string, format: uuid }
        node: { type: string, description: De node die importeert }
        version: { type: string }
        address: { type: string, description: Waar de app de database straks vindt }
        port: { type: integer }
        hosts: { type: array, items: { type: string }, description: Waarvandaan de tijdelijke gebruiker mag inloggen }
        buffer_pool_bytes: { type: integer, format: int64 }
        data_bytes: { type: integer, format: int64, description: Wat er al aan databases staat }
        disks: { type: array, items: { $ref: "#/components/schemas/DatabaseMigrationDisk" } }
        exists: { type: boolean, description: De database staat er al }
    DatabaseMigrationDisk:
      type: object
      required: [hostname, mount, free_bytes]
      properties:
        hostname: { type: string }
        mount: { type: string }
        free_bytes: { type: integer, format: int64 }
    DatabaseMigrationReach:
      type: object
      required: [reached, version, tls, code, error, seen]
      properties:
        reached: { type: boolean }
        version: { type: string }
        tls: { type: boolean }
        code: { type: integer, description: "De fout die MariaDB meteen stuurde, zoals 1130, of bij PostgreSQL 28000 als pg_hba.conf weigert; 0 zonder" }
        error: { type: string }
        seen: { type: string, description: "Bij PostgreSQL: het adres waarvan de oude server de nieuwe node ziet, als pg_hba.conf hem weigert" }
    DatabaseMigrationRun:
      type: object
      required: [id, kind, status, cluster_id, cluster_name, component_id, source_name, source_node, source_address, database, target_database,
        target_node, started_at, finished_at, size_bytes, dump_bytes, import_ms, count_ms, tables, rows_source, rows_target, differences,
        objects, message, job_id, stage, accounts, force, target_address, copied_at, switched_at, locked,
        retire_job_id, retired_at, retire_node, retire_file, retire_bytes, retire_message]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [trial, migrate] }
        retire_job_id: { type: string, format: uuid, nullable: true, description: Het laatste afbouwen van de oude database }
        retired_at: { type: string, format: date-time, nullable: true, description: Wanneer de oude database en haar gebruikers weggingen }
        retire_node: { type: string, description: De node met de laatste dump; leeg zonder dump }
        retire_file: { type: string, description: "De laatste dump, in /var/backups/clusterforge-db/<database>/" }
        retire_bytes: { type: integer, format: int64, description: De laatste dump op schijf }
        retire_message: { type: string, description: Wat het afbouwen deed, of waarom het mislukte }
        status: { type: string, enum: [running, ok, failed] }
        stage:
          type: string
          description: "Bij een verhuizing: copy (kopieert), copied (wacht op overschakelen), done of cancelled; leeg bij een proef"
        accounts: { type: array, items: { $ref: "#/components/schemas/DatabaseMigrationMovedUser" } }
        force: { type: boolean, description: Verhuisd terwijl er nog verbindingen met de oude database waren }
        target_address: { type: string, description: Waar de app de nieuwe database vindt }
        copied_at: { type: string, format: date-time, nullable: true }
        switched_at: { type: string, format: date-time, nullable: true }
        locked: { type: boolean, description: De gebruikers van de app mogen de oude database alleen nog lezen }
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        component_id: { type: string, format: uuid }
        source_name: { type: string }
        source_node: { type: string }
        source_address: { type: string }
        database: { type: string }
        target_database: { type: string }
        target_node: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        size_bytes: { type: integer, format: int64 }
        dump_bytes: { type: integer, format: int64, description: De SQL die over het netwerk kwam }
        import_ms: { type: integer, format: int64, nullable: true, description: Ophalen en importeren }
        count_ms: { type: integer, format: int64, nullable: true, description: Daarna de rijen tellen aan beide kanten }
        tables: { type: integer }
        rows_source: { type: integer, format: int64 }
        rows_target: { type: integer, format: int64 }
        differences:
          type: array
          items: { $ref: "#/components/schemas/DatabaseMigrationCount" }
          description: De tabellen met een ander aantal rijen
        objects: { type: array, items: { $ref: "#/components/schemas/DatabaseMigrationObjects" } }
        message: { type: string }
        job_id: { type: string, format: uuid, nullable: true }
    DatabaseRetireSource:
      type: object
      required: [name, cluster_id, keys, servers, readable, empty, remaining, moves, rules]
      properties:
        name: { type: string, description: "Het cluster, of de nodes als ze in geen of meer clusters zitten" }
        cluster_id: { type: string, format: uuid, nullable: true }
        keys: { type: array, items: { type: string }, description: De groepen onder Databases }
        servers: { type: array, items: { type: string } }
        readable: { type: boolean, description: Elke groep gaf een volledige lijst met databases }
        empty: { type: boolean, description: Er staat geen database van een app meer op }
        remaining: { type: array, items: { $ref: "#/components/schemas/DatabaseRetireRemaining" } }
        moves: { type: array, items: { $ref: "#/components/schemas/DatabaseRetireMove" } }
        rules: { type: array, items: { $ref: "#/components/schemas/DatabaseRetireRule" } }
    DatabaseRetireRemaining:
      type: object
      required: [source_key, engine, database, moved]
      properties:
        source_key: { type: string }
        engine: { type: string }
        database: { type: string }
        moved: { type: boolean, description: Verhuisd; wacht op afbouwen }
    DatabaseRetireMove:
      type: object
      required: [run, engine, source_key, exists, last_used, last_by, last_local, local_by, ready_at, ready, active, prod_slug]
      properties:
        run: { $ref: "#/components/schemas/DatabaseMigrationRun" }
        prod_slug: { type: string, description: "De slug om in te tikken als het afbouwen een prodcluster raakt; leeg als niet" }
        engine: { type: string }
        source_key: { type: string }
        exists: { type: boolean, description: De oude database staat er volgens de laatste lezing nog }
        last_used:
          type: string
          format: date-time
          nullable: true
          description: De laatste verbinding met de oude database van buiten de databasenode, in de laatste 30 dagen
        last_by: { type: string, description: Wie dat was }
        last_local:
          type: string
          format: date-time
          nullable: true
          description: De laatste verbinding op de databasenode zelf, zoals een back-up; die houdt afbouwen niet tegen
        local_by: { type: string }
        ready_at: { type: string, format: date-time, nullable: true, description: Vanaf wanneer afbouwen kan; null als het gebeurd is }
        ready: { type: boolean }
        active:
          allOf: [{ $ref: "#/components/schemas/ComponentDumpJob" }]
          nullable: true
          description: Het afbouwen dat wacht of loopt
    DatabaseRetireRule:
      type: object
      required: [cluster_id, cluster_name, engine, address, port, last_seen, state]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        engine: { type: string }
        address: { type: string, description: Waarlangs de app de oude database gebruikte; leeg als het onbekend is }
        port: { type: integer }
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: De laatste verbinding van een node van de app met de oude servers, in de laatste 30 dagen
        state:
          type: string
          enum: [in_use, until_retired, unused]
          description: "in_use: de app verbond na het overschakelen nog; until_retired: nodig om terug te kunnen tot het afbouwen; unused: de regel kan weg"
    DatabaseMigrationMovedUser:
      type: object
      required: [user, old_hosts, hosts, privileges, new]
      properties:
        user: { type: string }
        old_hosts: { type: array, items: { type: string }, description: Zijn hosts op de oude server; leeg bij PostgreSQL }
        hosts: { type: array, items: { type: string }, description: Zijn hosts op het nieuwe cluster; leeg bij PostgreSQL }
        privileges: { type: array, items: { type: string } }
        new: { type: boolean, description: "ClusterForge maakte hem nieuw op het nieuwe cluster: annuleren haalt hem weer weg" }
    DatabaseMigrationCount:
      type: object
      required: [name, source, target]
      properties:
        name: { type: string }
        source: { type: integer, format: int64 }
        target: { type: integer, format: int64 }
    DatabaseMigrationObjects:
      type: object
      required: [kind, source, target]
      properties:
        kind: { type: string, description: "views, routines, triggers of events" }
        source: { type: integer }
        target: { type: integer }
    ManagedCronJobInput:
      type: object
      required: [name, schedule, run_on, user, command, timeout_seconds, enabled]
      properties:
        name: { type: string }
        schedule: { type: string, description: "Een cronregel met vijf velden of een @-woord, zoals 0 */6 * * *" }
        run_on: { type: string, enum: [vip, node, all] }
        node_id: { type: string, format: uuid, nullable: true, description: Alleen bij run_on node }
        user: { type: string }
        command: { type: string }
        timeout_seconds: { type: integer }
        enabled: { type: boolean }
        retries: { type: integer, minimum: 0, maximum: 3, description: "Hoe vaak een mislukte run herhaalt, met een minuut ertussen" }
        alert: { type: boolean, description: Een mislukte run opent een incident }
        kind:
          type: string
          enum: [command, sync]
          description: "Een commando of een bestandssync; alleen bij het maken, daarna verandert het niet"
        sync: { $ref: "#/components/schemas/ManagedCronSyncInput" }
        confirm: { type: string, description: De slug van het cluster, op prod }
    ManagedCronSyncInput:
      type: object
      description: "Een bestandssync met rsync over SSH, van de node met het VIP (of één node) naar de doelen. Command blijft leeg."
      required: [source]
      properties:
        source: { type: string, description: "De map op de bron, zoals /var/www/nextcloud/data/" }
        target: { type: string, description: "De map op elk doel; leeg is dezelfde map" }
        to_cluster_id: { type: string, format: uuid, nullable: true, description: "Leeg: de andere nodes van het eigen cluster" }
        delete: { type: boolean, description: "Bestanden op het doel weghalen die op de bron weg zijn" }
        exclude: { type: array, items: { type: string }, description: "Patronen zoals *.part" }
        bwlimit_mb: { type: integer, description: "Bandbreedte in MB/s; 0 is onbeperkt" }
    ManagedCronSync:
      type: object
      required: [source, target, to_cluster_id, to_cluster_name, delete, exclude, bwlimit_mb]
      properties:
        source: { type: string }
        target: { type: string }
        to_cluster_id: { type: string, format: uuid, nullable: true }
        to_cluster_name: { type: string, description: "Leeg bij een sync binnen het eigen cluster" }
        delete: { type: boolean }
        exclude: { type: array, items: { type: string } }
        bwlimit_mb: { type: integer }
    CronSyncResult:
      type: object
      required: [node_id, hostname, result, exit, files, bytes, deleted, error]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        result: { type: string, enum: [ok, failed, refused], description: "refused: het doel heeft het VIP van zijn cluster of de sync mag dat niet" }
        exit: { type: integer }
        files: { type: integer }
        bytes: { type: integer, format: int64 }
        deleted: { type: integer }
        error: { type: string }
    CronSyncPlan:
      type: object
      required: [nodes, notes]
      properties:
        notes: { type: array, items: { type: string } }
        nodes:
          type: array
          items:
            type: object
            required: [node_id, hostname, role, address, ok, checks]
            properties:
              node_id: { type: string, format: uuid }
              hostname: { type: string }
              role: { type: string, description: "bron, doel, of bron en doel" }
              address: { type: string }
              ok: { type: boolean }
              checks:
                type: array
                items:
                  type: object
                  required: [name, ok, text]
                  properties:
                    name: { type: string }
                    ok: { type: boolean }
                    text: { type: string }
    ManagedCronJobCreate:
      allOf:
        - $ref: "#/components/schemas/ManagedCronJobInput"
        - type: object
          required: [cluster_id]
          properties:
            cluster_id: { type: string, format: uuid }
    ManagedCronJob:
      type: object
      required: [id, cluster_id, cluster_name, cluster_slug, cluster_environment, name, schedule, describe, on_calendar, run_on, node_id, node_hostname,
        user, command, timeout_seconds, enabled, retries, alert, kind, sync, revision, next_run, missed_at, running, nodes, failures_24h, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        cluster_slug: { type: string }
        cluster_environment: { $ref: "#/components/schemas/Environment" }
        name: { type: string }
        schedule: { type: string }
        describe: { type: string }
        on_calendar: { type: string }
        run_on: { type: string, enum: [vip, node, all] }
        node_id: { type: string, format: uuid, nullable: true }
        node_hostname: { type: string }
        user: { type: string }
        command: { type: string }
        timeout_seconds: { type: integer }
        enabled: { type: boolean }
        revision: { type: integer }
        next_run: { type: string, format: date-time, nullable: true }
        missed_at: { type: string, format: date-time, nullable: true, description: "Het laatste geplande moment, als de job toen niet draaide" }
        running: { type: integer, description: Op hoeveel nodes er nu een run loopt }
        retries: { type: integer }
        alert: { type: boolean }
        kind: { type: string, enum: [command, sync] }
        sync: { allOf: [{ $ref: "#/components/schemas/ManagedCronSync" }], nullable: true }
        failures_24h: { type: integer }
        nodes: { type: array, items: { $ref: "#/components/schemas/ManagedCronJobNode" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ManagedCronJobNode:
      type: object
      required: [node_id, hostname, applied, has_vip, error, last_run]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        applied: { type: boolean, description: De agent heeft de laatste versie van de job }
        has_vip: { type: boolean }
        error: { type: string }
        last_run: { allOf: [{ $ref: "#/components/schemas/CronRunSummary" }], nullable: true }
    CronRunSummary:
      type: object
      required: [id, node_id, hostname, reason, result, started_at, ended_at, exit_code, sync]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        sync: { type: array, items: { $ref: "#/components/schemas/CronSyncResult" }, description: "Bij een sync de uitkomst per doel" }
        reason: { type: string, enum: [schedule, manual, retry] }
        result: { type: string, enum: [running, ok, failed, skipped, timeout, stopped] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        exit_code: { type: integer, nullable: true }
    CronRun:
      allOf:
        - $ref: "#/components/schemas/CronRunSummary"
        - type: object
          required: [job_id, job_name, revision, output, output_truncated, output_hidden, live]
          properties:
            job_id: { type: string, format: uuid }
            job_name: { type: string }
            revision: { type: integer }
            output: { type: string }
            output_truncated: { type: boolean, description: Alleen de laatste 64 KiB }
            output_hidden: { type: boolean, description: "Een viewer ziet de uitvoer van een job als root niet" }
            live: { type: boolean, description: "De uitvoer komt zo net van de node, want de run loopt nog" }
    ManagedCronJobDetail:
      type: object
      required: [job, runs]
      properties:
        job: { $ref: "#/components/schemas/ManagedCronJob" }
        runs: { type: array, items: { $ref: "#/components/schemas/CronRunSummary" } }
    CronScheduleInfo:
      type: object
      required: [describe, on_calendar, next]
      properties:
        describe: { type: string }
        on_calendar: { type: string }
        next: { type: array, items: { type: string, format: date-time } }
    CronGroup:
      type: object
      description: De cronjobs van één cluster, of van de nodes zonder cluster.
      required: [key, cluster_id, cluster_name, cluster_slug, cluster_environment, nodes, jobs]
      properties:
        key: { type: string, description: "Uniek per groep, voor de webinterface" }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        cluster_slug: { type: string }
        cluster_environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        nodes: { type: array, items: { $ref: "#/components/schemas/CronNodeRead" } }
        jobs: { type: array, items: { $ref: "#/components/schemas/CronJob" } }
    CronNodeRead:
      type: object
      required: [node_id, hostname, daemon, logging, journal, truncated, error, error_kind, synced_at, ok_at]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        daemon: { type: string, description: "cron, cronie of leeg als er geen cron draait" }
        logging: { type: boolean, description: "cron logt einde en exitcode (-L 15)" }
        journal: { type: boolean, description: De agent kon de journal lezen }
        truncated: { type: boolean, description: "De node had meer dan 1000 jobs; de rest ontbreekt" }
        error: { type: string }
        error_kind:
          type: string
          description: "Waarom ClusterForge het de agent niet kon vragen: old_agent, offline, no_answer of agent; leeg als hij antwoordde"
        synced_at: { type: string, format: date-time }
        ok_at: { type: string, format: date-time, nullable: true, description: Wanneer de agent het laatst antwoordde }
    CronJob:
      type: object
      description: Eén cronjob of timer, met de nodes waarop hij staat.
      required: [key, source, file, line, user, schedule, describe, command, unit, description, package, clusterforge, nodes, next_run,
        differs, warnings]
      properties:
        key: { type: string, description: Dezelfde voor dezelfde job op elke node }
        source:
          type: string
          enum: [crontab, cron.d, user, periodic, timer]
          description: "/etc/crontab, /etc/cron.d, de crontab van een gebruiker, cron.hourly/daily/weekly/monthly, of een systemd-timer"
        file: { type: string, description: Het bestand, of de unit van een timer }
        line: { type: integer }
        user: { type: string }
        schedule: { type: string, description: "Vijf velden, een @-woord, hourly/daily/weekly/monthly, of de OnCalendar van een timer" }
        describe: { type: string, description: "Het schema in gewone taal; leeg als ClusterForge het niet kan lezen" }
        command: { type: string, description: Gemaskeerd }
        unit: { type: string, description: De service van een timer }
        description: { type: string }
        package: { type: string, description: "Het Debian-pakket van het bestand; leeg voor wat Jonas zelf maakte" }
        clusterforge: { type: boolean, description: Een job die ClusterForge zelf beheert }
        next_run: { type: string, format: date-time, nullable: true }
        nodes: { type: array, items: { $ref: "#/components/schemas/CronJobNode" } }
        differs:
          type: array
          description: Nodes waar dezelfde job (zelfde bestand en gebruiker) met een ander schema of commando staat
          items: { $ref: "#/components/schemas/CronVariant" }
        warnings: { type: array, items: { $ref: "#/components/schemas/CronWarning" } }
    CronVariant:
      type: object
      required: [hostname, schedule, command]
      properties:
        hostname: { type: string }
        schedule: { type: string }
        command: { type: string }
    CronWarning:
      type: object
      required: [kind, level, text]
      properties:
        kind: { type: string, enum: [galera_bootstrap, db_restart, pg_failover, rsync] }
        level:
          type: string
          enum: [danger, warning, info]
          x-enum-varnames: [CronWarningDanger, CronWarningWarning, CronWarningInfo]
        text: { type: string }
    CronJobNode:
      type: object
      required: [node_id, hostname, enabled, last_run, last_end, last_exit, last_result, runs, failures, next_run]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        enabled: { type: boolean }
        last_run: { type: string, format: date-time, nullable: true }
        last_end: { type: string, format: date-time, nullable: true }
        last_exit: { type: integer, nullable: true }
        last_result:
          type: string
          enum: ["", ok, failed, running, started]
          description: "started: cron logde de start maar niet de uitkomst (cron zonder -L 15)"
        runs: { type: integer, description: Runs in de laatste 24 uur }
        failures: { type: integer, description: Mislukte runs in de laatste 24 uur }
        next_run: { type: string, format: date-time, nullable: true }
    HealReport:
      type: object
      description: Zelfherstel voor één database; key is die van DatabaseGroup.
      required: [key, cluster_id, cluster_name, cluster_slug, cluster_environment, engine, kind, health, problems, plan, last_run, auto]
      properties:
        key: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        cluster_slug: { type: string }
        cluster_environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        engine: { type: string, enum: [mariadb, postgresql] }
        kind: { type: string }
        health: { type: string }
        problems: { type: array, items: { $ref: "#/components/schemas/HealProblem" } }
        plan:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/HealPlan" }]
        last_run:
          nullable: true
          description: De laatste taak heal.run van deze database in het afgelopen etmaal.
          allOf: [{ $ref: "#/components/schemas/HealRun" }]
        auto:
          nullable: true
          description: Zelfherstel vanzelf van het cluster; null bij een losse node.
          allOf: [{ $ref: "#/components/schemas/HealAuto" }]
    HealAutoSetting:
      type: object
      required: [enabled, paused_at, paused_reason]
      properties:
        enabled: { type: boolean }
        paused_at:
          type: string
          format: date-time
          nullable: true
          description: Gepauzeerd na drie mislukte pogingen op rij; aanzetten heft het op.
        paused_reason: { type: string }
    HealAuto:
      allOf:
        - $ref: "#/components/schemas/HealAutoSetting"
        - type: object
          required: [allowed, due, note]
          properties:
            allowed: { type: boolean, description: false op prod }
            due: { type: boolean, description: Zelfherstel voert het plan nu vanzelf uit }
            note: { type: string, description: Waarom het plan wel of niet vanzelf gebeurt; leeg als er niets te doen is }
    HealRun:
      type: object
      required: [job_id, status, error, created_at, finished_at]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        error: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    HealProblem:
      type: object
      required: [code, level, title, why, nodes]
      properties:
        code:
          type: string
          description: |
            no_inspect, unit_stopped, process_hung, process_outside_unit, unit_disabled, galera_wrong_address,
            galera_no_primary, disk_full of no_quorum.
        level: { type: string, enum: [down, warning] }
        title: { type: string }
        why: { type: string }
        nodes: { type: array, items: { type: string } }
    HealPlan:
      type: object
      required: [action, steps, nodes, auto, auto_why, blocked, managed_component_id, hash]
      properties:
        action:
          type: string
          description: restart (gestopte servers starten), galera (adressen bijwerken en/of het cluster opnieuw beginnen), of leeg als het herstel bij het onderdeel hoort.
        steps: { type: array, items: { type: string } }
        nodes: { type: array, items: { $ref: "#/components/schemas/HealPlanNode" } }
        auto: { type: boolean, description: "Het plan mag vanzelf, als Zelfherstel op het cluster vanzelf mag." }
        auto_why: { type: string }
        blocked: { type: string, description: "Waarom het plan nu niet kan; leeg als het kan." }
        managed_component_id: { type: string, format: uuid, nullable: true }
        hash: { type: string }
    HealPlanNode:
      type: object
      required: [node_id, hostname, unit, start, kill, kill_pids, primary, set_address, old_cluster_address, cluster_address,
        old_node_address, node_address, file]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        unit: { type: string }
        start: { type: boolean }
        kill: { type: boolean }
        kill_pids: { type: array, items: { type: integer } }
        primary: { type: boolean }
        set_address: { type: boolean }
        old_cluster_address: { type: string }
        cluster_address: { type: string }
        old_node_address: { type: string }
        node_address: { type: string }
        file: { type: string }
    DatabaseGroup:
      type: object
      description: Eén databasecluster, de servers van één engine in één cluster, of één losse node.
      required: [key, cluster_id, cluster_name, cluster_slug, cluster_environment, engine, kind, health, summary, version, servers,
        databases, databases_from, databases_total]
      properties:
        key: { type: string, description: "Uniek per groep, voor de webinterface" }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        cluster_slug: { type: string }
        cluster_environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        engine: { type: string, enum: [mariadb, postgresql] }
        kind:
          type: string
          enum: [galera, patroni, replication, single]
          description: Galera, PostgreSQL met Patroni, een primary met replica's, of losse servers
        health: { type: string, enum: [ok, warning, down, unknown] }
        summary: { type: string, description: In één zin hoe het ervoor staat }
        version: { type: string, description: "De versie, of meer versies met komma's" }
        servers: { type: array, items: { $ref: "#/components/schemas/DatabaseServer" } }
        databases: { type: array, items: { $ref: "#/components/schemas/DatabaseInfo" } }
        databases_from: { type: string, description: De node waarvan de lijst met databases komt }
        databases_total: { type: integer, description: Het aantal databases; de lijst toont er hoogstens 500 }
    DatabaseServer:
      type: object
      required: [node_id, hostname, unit, active, running, version, role, read_only, connections, max_connections, state, ok, error,
        error_kind, synced_at, ok_at, galera, patroni, source, replicas]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        unit: { type: string, description: "De systemd-unit, zoals mariadb, postgresql@17-main of patroni" }
        active: { type: string, description: Wat systemd over die unit zegt }
        running: { type: boolean, description: De server antwoordde via de socket }
        version: { type: string }
        role: { type: string, description: "member (Galera), primary, replica of standalone; leeg als onbekend" }
        read_only: { type: boolean }
        connections: { type: integer }
        max_connections: { type: integer }
        state: { type: string, description: "In een paar woorden, zoals Synced of replica van 10.0.20.186" }
        ok: { type: boolean }
        error: { type: string }
        error_kind:
          type: string
          description: "Waarom ClusterForge het de agent niet kon vragen: old_agent, offline, no_answer of agent; leeg als hij antwoordde"
        synced_at: { type: string, format: date-time }
        ok_at: { type: string, format: date-time, nullable: true, description: Wanneer de agent het laatst antwoordde }
        galera:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DatabaseGalera" }]
        patroni:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DatabasePatroni" }]
        source:
          nullable: true
          description: De replicatie van een replica
          allOf: [{ $ref: "#/components/schemas/DatabaseSource" }]
        replicas: { type: array, items: { $ref: "#/components/schemas/DatabaseReplica" } }
    DatabaseGalera:
      type: object
      required: [cluster_name, cluster_status, cluster_size, state, ready, members]
      properties:
        cluster_name: { type: string }
        cluster_status: { type: string, description: "Primary, Non-Primary of Disconnected" }
        cluster_size: { type: integer }
        state: { type: string, description: "Synced, Donor/Desynced, Joining en zo" }
        ready: { type: boolean }
        members: { type: array, items: { type: string } }
    DatabasePatroni:
      type: object
      required: [scope, role, state, timeline, error]
      properties:
        scope: { type: string }
        role: { type: string }
        state: { type: string }
        timeline: { type: integer }
        error: { type: string }
    DatabaseSource:
      type: object
      required: [host, running, lag_seconds, error]
      properties:
        host: { type: string }
        running: { type: boolean }
        lag_seconds: { type: integer, format: int64, nullable: true }
        error: { type: string }
    DatabaseReplica:
      type: object
      required: [address, state, sync, lag_bytes]
      properties:
        address: { type: string }
        state: { type: string }
        sync: { type: string }
        lag_bytes: { type: integer, format: int64 }
    DatabaseInfo:
      type: object
      required: [name, size_bytes, tables, users, shared, last_used_at]
      properties:
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        tables: { type: integer, description: "-1 als het aantal niet te lezen was" }
        users:
          type: array
          description: Wie de database de laatste dertig dagen gebruikte
          items: { $ref: "#/components/schemas/DatabaseUser" }
        shared: { type: boolean, description: "Meer dan één cluster, losse node of onbekend adres gebruikt de database" }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: De laatste keer dat er een client verbonden was; null als dat in dertig dagen niet zo was
    DatabaseUser:
      type: object
      required: [key, kind, cluster_id, node_id, name, nodes, db_users, connections, last_seen, dependency]
      properties:
        key: { type: string }
        kind: { type: string, description: "cluster, node (een node zonder cluster), unknown (een onbekend adres) of local (de databasenode zelf)" }
        cluster_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        name: { type: string, description: "De naam van het cluster, de hostname of het adres" }
        nodes: { type: array, items: { type: string }, description: "De hostnames, of de adressen die ClusterForge niet kent" }
        db_users: { type: array, items: { type: string }, description: "De gebruikers in de database" }
        connections: { type: integer, description: "Verbindingen bij de laatste keer lezen" }
        last_seen: { type: string, format: date-time }
        dependency:
          type: string
          description: "De afhankelijkheid van dit cluster naar het databasecluster: confirmed, suggested, ignored, of leeg als er geen is of als het hetzelfde cluster is"
    KubeClusterSummary:
      type: object
      required: [id, name, slug, environment, status, status_reason, vip, synced, api_ok, error, version, nodes_total, nodes_ready,
        pods_total, pods_running, pods_pending, pods_problem, workloads_total, workloads_ready, synced_at, ok_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
        status: { $ref: "#/components/schemas/Status" }
        status_reason: { type: string }
        vip: { type: string, nullable: true, description: Het VIP van de API en de apps }
        synced: { type: boolean, description: false als ClusterForge het cluster nog nooit samenvatte }
        api_ok: { type: boolean, description: De API antwoordde bij de laatste samenvatting }
        error: { type: string, description: Waarom de laatste samenvatting mislukte }
        version: { type: string }
        nodes_total: { type: integer }
        nodes_ready: { type: integer }
        pods_total: { type: integer }
        pods_running: { type: integer }
        pods_pending: { type: integer }
        pods_problem: { type: integer, description: "Pods die aandacht vragen, zoals CrashLoopBackOff" }
        workloads_total: { type: integer }
        workloads_ready: { type: integer }
        synced_at: { type: string, format: date-time, nullable: true }
        ok_at: { type: string, format: date-time, nullable: true, description: Wanneer de API het laatst antwoordde }
    KubeUsage:
      type: object
      required: [cpu_millis, memory_bytes]
      properties:
        cpu_millis: { type: integer, format: int64 }
        memory_bytes: { type: integer, format: int64 }
    KubePodCounts:
      type: object
      required: [total, running, pending, succeeded, failed, problem]
      properties:
        total: { type: integer }
        running: { type: integer }
        pending: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        problem: { type: integer, description: Pods die aandacht vragen }
    KubeEvent:
      type: object
      required: [namespace, kind, name, type, reason, message, count, first_seen, last_seen, source, object]
      properties:
        namespace: { type: string }
        kind: { type: string, description: De soort van het object waar het event over gaat }
        name: { type: string }
        type: { type: string, description: Normal of Warning }
        reason: { type: string }
        message: { type: string }
        count: { type: integer }
        first_seen: { type: string, format: date-time, nullable: true }
        last_seen: { type: string, format: date-time }
        source: { type: string, description: "Wie het event meldde, zoals kubelet" }
        object:
          description: Het object, om te openen; null als ClusterForge de soort niet kent
          nullable: true
          allOf: [{ $ref: "#/components/schemas/KubeRef" }]
    KubeRef:
      type: object
      description: Wijst een object in Kubernetes aan
      required: [group, version, resource, namespace, name]
      properties:
        group: { type: string, description: Leeg is de kerngroep }
        version: { type: string }
        resource: { type: string }
        namespace: { type: string, description: Leeg bij een object zonder namespace }
        name: { type: string }
    KubeCondition:
      type: object
      required: [type, status, reason, message, last_transition]
      properties:
        type: { type: string }
        status: { type: string, description: "True, False of Unknown" }
        reason: { type: string }
        message: { type: string }
        last_transition: { type: string, format: date-time, nullable: true }
    KubeChainLink:
      type: object
      description: Een schakel in de keten van een object
      required: [role, kind, name, ref, node_id, text, url]
      properties:
        role:
          type: string
          enum: [owner, node, clusterforge, vm, service, ingress, pods, volume, claim, backend]
        kind: { type: string }
        name: { type: string }
        ref:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/KubeRef" }]
        node_id: { type: string, format: uuid, nullable: true, description: De ClusterForge-node }
        text: { type: string }
        url: { type: string, description: Een webadres om te openen; leeg als er geen is }
    KubeContainer:
      type: object
      required: [name, image, init, ready, restarts, state, reason, message, since, last_reason, last_exit_code, last_finished]
      properties:
        name: { type: string }
        image: { type: string }
        init: { type: boolean, description: "Een init-container, die voor de andere draait" }
        ready: { type: boolean }
        restarts: { type: integer }
        state: { type: string, enum: [running, waiting, terminated, unknown] }
        reason: { type: string }
        message: { type: string }
        since: { type: string, format: date-time, nullable: true }
        last_reason: { type: string, description: "Waarom de vorige container stopte, zoals OOMKilled of Error" }
        last_exit_code: { type: integer, nullable: true }
        last_finished: { type: string, format: date-time, nullable: true }
    KubePodDetail:
      type: object
      required: [node, ip, host_ip, qos, containers]
      properties:
        node: { type: string }
        ip: { type: string }
        host_ip: { type: string }
        qos: { type: string }
        containers: { type: array, items: { $ref: "#/components/schemas/KubeContainer" } }
    KubeObject:
      type: object
      required: [ref, api_version, kind, uid, created_at, labels, annotations, summary, problem, conditions, chain, events, yaml, pod, actions,
        replicas]
      properties:
        ref: { $ref: "#/components/schemas/KubeRef" }
        api_version: { type: string }
        kind: { type: string }
        uid: { type: string }
        created_at: { type: string, format: date-time }
        labels: { type: object, additionalProperties: { type: string } }
        annotations: { type: object, additionalProperties: { type: string } }
        summary: { type: string, description: De toestand in gewone woorden }
        problem: { type: boolean }
        conditions: { type: array, items: { $ref: "#/components/schemas/KubeCondition" } }
        chain: { type: array, items: { $ref: "#/components/schemas/KubeChainLink" } }
        events: { type: array, items: { $ref: "#/components/schemas/KubeEvent" } }
        yaml: { type: string, description: "Het object als YAML, zonder managedFields en zonder secretwaarden" }
        pod:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/KubePodDetail" }]
        actions:
          type: array
          description: De acties die bij dit object kunnen; alleen een beheerder voert ze uit
          items: { $ref: "#/components/schemas/KubeActionName" }
        replicas:
          type: integer
          nullable: true
          description: Hoeveel pods het object vraagt, als je het kunt schalen
    KubeActionName:
      type: string
      enum: [scale, restart, rollback, delete, cordon, uncordon, drain]
    KubeActionInput:
      type: object
      required: [action, ref]
      properties:
        action:
          type: string
          enum: [scale, restart, rollback, delete, cordon, uncordon]
        ref: { $ref: "#/components/schemas/KubeRef" }
        replicas: { type: integer, minimum: 0, maximum: 100, description: Het nieuwe aantal pods bij scale }
        revision: { type: integer, format: int64, description: "De versie bij rollback; zonder is het de vorige" }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    KubeActionResult:
      type: object
      required: [message, changed]
      properties:
        message: { type: string, description: Wat er gebeurde en wat Kubernetes nu doet }
        changed: { type: boolean, description: "Onwaar als het object al zo stond" }
    KubeRevision:
      type: object
      required: [revision, replicaset, images, created_at, replicas, current, change_cause]
      properties:
        revision: { type: integer, format: int64 }
        replicaset: { type: string }
        images: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        replicas: { type: integer, description: Hoeveel pods deze versie nu vraagt }
        current: { type: boolean }
        change_cause: { type: string, description: "De annotatie kubernetes.io/change-cause; leeg als niemand ze zette" }
    KubeDrainInput:
      type: object
      required: [node]
      properties:
        node: { type: string, description: De naam van de node in Kubernetes }
        preview: { type: boolean, description: Alleen het plan tonen }
        force: { type: boolean, description: "Ook pods zonder eigenaar en met emptyDir uitzetten; die zijn dan weg" }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    KubeDrainPod:
      type: object
      required: [namespace, name, owner_kind, owner_name, reason]
      properties:
        namespace: { type: string }
        name: { type: string }
        owner_kind: { type: string }
        owner_name: { type: string }
        reason: { type: string, description: "Waarom de pod blijft of tegenhoudt, of waarop je moet letten" }
    KubeDrainPlan:
      type: object
      required: [node, cordoned, evict, skip, blocked]
      properties:
        node: { type: string }
        cordoned: { type: boolean, description: De node stond al op cordon }
        evict: { type: array, items: { $ref: "#/components/schemas/KubeDrainPod" } }
        skip: { type: array, items: { $ref: "#/components/schemas/KubeDrainPod" } }
        blocked: { type: array, items: { $ref: "#/components/schemas/KubeDrainPod" } }
    KubeRemoveNodeInput:
      type: object
      required: [node]
      properties:
        node: { type: string, description: De naam van de node in Kubernetes }
        preview: { type: boolean, description: Alleen het plan tonen }
        force: { type: boolean, description: "Ook pods zonder eigenaar en met emptyDir uitzetten; die zijn dan weg" }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    KubeRemoveNodePlan:
      type: object
      required: [node, node_id, hostname, ready, vmid, host, workers, drain]
      properties:
        node: { type: string }
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        ready: { type: boolean, description: "Niet Ready: de node gaat op cordon in plaats van leeg, want zijn pods stoppen daar nooit netjes" }
        vmid: { type: integer }
        host: { type: string, description: De Proxmox-host van de VM }
        workers: { type: integer, description: Het aantal workers daarna }
        drain: { $ref: "#/components/schemas/KubeDrainPlan" }
    KubeAccessInput:
      type: object
      required: [name, role, days]
      properties:
        name: { type: string, maxLength: 40, description: "Waarvoor de kubeconfig is, zoals laptop" }
        role: { type: string, enum: [admin, view], description: "admin is cluster-admin, view alleen lezen en geen Secrets" }
        days: { type: integer, minimum: 1, maximum: 30, description: Na hoeveel dagen het token verloopt }
        password: { type: string, maxLength: 1024, description: Je wachtwoord, als je geen tweestapsverificatie hebt }
        totp_code: { type: string, maxLength: 10, description: Je code, als je tweestapsverificatie hebt }
        confirm: { type: string, description: De slug van het cluster; nodig voor admin op prod }
    KubeAccess:
      type: object
      required: [id, cluster_id, user_id, user, name, role, account, state, created_at, expires_at, revoked_at, revoked_by,
        revoke_reason, removed_at, remove_error]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user: { type: string, description: Gebruikersnaam }
        name: { type: string }
        role: { type: string, enum: [admin, view] }
        account: { type: string, description: "Het ServiceAccount in de namespace clusterforge" }
        state:
          type: string
          enum: [active, expired, revoked, revoking]
          description: "revoking: ingetrokken, maar het ServiceAccount staat er nog omdat de API niet antwoordde"
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoked_by: { type: string, description: "Gebruikersnaam; leeg als ClusterForge zelf introk" }
        revoke_reason: { type: string }
        removed_at: { type: string, format: date-time, nullable: true }
        remove_error: { type: string }
    KubeSnapshot:
      type: object
      required: [name, file, node, hostname, kind, location, s3, size_bytes, taken_at, ready, error, restorable, restore_note]
      properties:
        name: { type: string, description: De naam van het ETCDSnapshotFile-object }
        file: { type: string, description: "De bestandsnaam, zoals etcd-snapshot-leren-server-01-1760000000" }
        node: { type: string, description: De server in Kubernetes waarop het bestand staat }
        hostname: { type: string, nullable: true, description: Die server in ClusterForge }
        kind:
          type: string
          enum: [scheduled, clusterforge, on_demand]
          description: "scheduled: k3s zelf, elke twaalf uur; clusterforge: Snapshot nu of vlak voor terugzetten; on_demand: met de hand"
        location: { type: string, description: "Zoals file:///var/lib/rancher/k3s/server/db/snapshots/..." }
        s3: { type: boolean }
        size_bytes: { type: integer, format: int64, nullable: true }
        taken_at: { type: string, format: date-time, nullable: true }
        ready: { type: boolean }
        error: { type: string }
        restorable: { type: boolean, description: ClusterForge kan deze snapshot terugzetten }
        restore_note: { type: string, description: Waarom terugzetten niet kan; leeg als het kan }
    KubeSnapshotServer:
      type: object
      required: [node, hostname, init]
      properties:
        node: { type: string }
        hostname: { type: string }
        init: { type: boolean, description: Deze server begon het cluster }
    KubeSnapshots:
      type: object
      required: [items, read_at, error, freshness, servers]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KubeSnapshot" } }
        read_at: { type: string, format: date-time, nullable: true, description: Wanneer de lijst laatst gelezen werd }
        error: { type: string, description: Waarom de lijst nu niet te lezen was }
        freshness: { type: string, enum: [ok, stale, none, unknown] }
        servers:
          type: array
          description: De servers met een agent, de eerste eerst
          items: { $ref: "#/components/schemas/KubeSnapshotServer" }
    KubeUpgrade:
      type: object
      required: [template, version, k3s, next, blocked, behind, git_managed, nodes, nodes_error]
      properties:
        template: { type: string }
        version: { type: string, description: De templateversie van de gewenste staat }
        k3s: { type: string, description: "De k3s van die templateversie, zoals v1.35.9+k3s1; leeg als deze server de versie niet kent" }
        next:
          allOf: [{ $ref: "#/components/schemas/KubeUpgradeNext" }]
          nullable: true
          description: De nieuwste templateversie met een nieuwere k3s die nu kan; null als er geen is
        blocked: { type: string, description: Waarom bijwerken in de webinterface nu niet kan; leeg als het kan }
        behind: { type: boolean, description: "Een eerdere toepassing mislukte: eerst Opnieuw toepassen" }
        git_managed: { type: boolean, description: "Het cluster volgt Git: bijwerken is de templateversie in cluster.yaml wijzigen" }
        nodes: { type: array, items: { $ref: "#/components/schemas/KubeUpgradeNode" }, description: "De servers eerst, dan op naam" }
        nodes_error: { type: string, description: Waarom de nodes nu niet te lezen waren }
    KubeUpgradeNext:
      type: object
      required: [version, k3s]
      properties:
        version: { type: string }
        k3s: { type: string }
    KubeUpgradeNode:
      type: object
      required: [name, server, kubelet, ready, unschedulable]
      properties:
        name: { type: string }
        server: { type: boolean, description: control-plane }
        kubelet: { type: string, description: De versie die de kubelet meldt }
        ready: { type: boolean }
        unschedulable: { type: boolean }
    KubeSnapshotSaved:
      type: object
      required: [snapshot, hostname, output]
      properties:
        snapshot:
          allOf: [{ $ref: "#/components/schemas/KubeSnapshot" }]
          nullable: true
        hostname: { type: string, description: De server waarop hij gemaakt is }
        output: { type: array, items: { type: string }, description: Wat k3s schreef }
    KubeRestoreInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: De naam van de snapshot (name uit de lijst) }
        preview: { type: boolean, description: Alleen het plan }
        confirm: { type: string, description: De slug van het cluster; altijd nodig }
    KubeRestorePlan:
      type: object
      required: [snapshot, init, others, workers]
      properties:
        snapshot: { $ref: "#/components/schemas/KubeSnapshot" }
        init: { type: string, description: De server die het cluster begon; daar gaat de snapshot terug }
        others: { type: array, items: { type: string }, description: De andere servers; die melden zich daarna opnieuw aan }
        workers: { type: integer, description: Het aantal andere nodes; die melden zich vanzelf weer }
    KubeSnapshotCluster:
      type: object
      required: [cluster_id, name, slug, environment, freshness, newest_at, read_at, error, servers]
      properties:
        cluster_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
        freshness: { type: string, enum: [ok, stale, none, unknown] }
        newest_at: { type: string, format: date-time, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        error: { type: string }
        servers: { type: array, items: { $ref: "#/components/schemas/KubeSnapshotClusterServer" } }
    KubeSnapshotClusterServer:
      type: object
      required: [node, hostname, newest_at, count]
      properties:
        node: { type: string }
        hostname: { type: string, nullable: true }
        newest_at: { type: string, format: date-time, nullable: true }
        count: { type: integer }
    KubeAccessIssued:
      type: object
      required: [access, kubeconfig, filename, server]
      properties:
        access: { $ref: "#/components/schemas/KubeAccess" }
        kubeconfig: { type: string, description: De kubeconfig met het token; ClusterForge bewaart hem niet }
        filename: { type: string, description: "Zoals leren.kubeconfig" }
        server: { type: string, description: "Het adres van de API, zoals https://10.0.40.10:6443" }
    KubeApplyInput:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string, description: "Eén of meer objecten, gescheiden door ---; hoogstens 50 objecten en 512 kB" }
        namespace: { type: string, description: "De namespace van objecten zonder namespace; standaard default" }
        preview: { type: boolean, description: Alleen controleren met een dry-run }
        force: { type: boolean, description: Velden overnemen die een ander programma beheert }
        confirm: { type: string, description: De slug van het cluster; nodig op prod }
    KubeFieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: "Het veld, zoals spec.template.spec.containers[0].image; leeg als de fout niet bij een veld hoort" }
        message: { type: string }
    KubeFieldConflict:
      type: object
      required: [field, manager]
      properties:
        field: { type: string }
        manager: { type: string, description: "Het programma dat het veld beheert, zoals kubectl-client-side-apply" }
    KubeApplyObject:
      type: object
      required: [doc, api_version, kind, namespace, name, ref, action, diff, errors, conflicts, note]
      properties:
        doc: { type: integer, description: Het nummer van het YAML-document, vanaf 1 }
        api_version: { type: string }
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        ref:
          allOf: [{ $ref: "#/components/schemas/KubeRef" }]
          nullable: true
          description: Null als het cluster de soort niet kent
        action:
          type: string
          enum: [create, update, unchanged, failed, skipped]
          description: "Nieuw, anders, hetzelfde, mislukt, of niet toegepast omdat een object ervoor faalde"
        diff: { type: string, description: "Unified diff van de YAML, zonder status en wat Kubernetes zelf invult" }
        errors: { type: array, items: { $ref: "#/components/schemas/KubeFieldError" } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/KubeFieldConflict" } }
        note: { type: string }
    KubeApplyResult:
      type: object
      required: [ok, changed, applied, objects]
      properties:
        ok: { type: boolean, description: Geen object faalde }
        changed: { type: integer, description: Hoeveel objecten nieuw of anders zijn }
        applied: { type: boolean, description: "Onwaar bij preview" }
        objects: { type: array, items: { $ref: "#/components/schemas/KubeApplyObject" } }
    KubeLessonSummary:
      type: object
      required: [id, number, title, summary, steps, done, unavailable, started_at, finished_at]
      properties:
        id: { type: string }
        number: { type: integer }
        title: { type: string }
        summary: { type: string }
        steps: { type: integer, description: Het aantal opdrachten }
        done: { type: integer, description: Hoeveel opdrachten af zijn }
        unavailable: { type: string, description: "Waarom de les nu niet kan; leeg als ze kan" }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    KubeLessonLink:
      type: object
      description: Waar je de opdracht doet, een tabblad, een object of een webadres
      required: [label, tab, namespace, system, ref, url]
      properties:
        label: { type: string }
        tab: { type: string, description: "Een tabblad van het cluster, zoals apps; leeg bij een object of webadres" }
        namespace: { type: string }
        system: { type: boolean }
        ref:
          allOf: [{ $ref: "#/components/schemas/KubeRef" }]
          nullable: true
        url: { type: string }
    KubeLessonStep:
      type: object
      required: [id, title, kind, state, text, web, kubectl, yaml, question, detail, answer, wrong, done_label, done_at, link]
      properties:
        id: { type: string }
        title: { type: string }
        kind:
          type: string
          enum: [do, quiz, read]
          description: "Iets doen dat ClusterForge controleert, een vraag, of lezen en zelf bevestigen"
        state: { type: string, enum: [done, current, locked] }
        text: { type: array, items: { type: string }, description: "Alinea's; code staat tussen backticks" }
        web: { type: string, description: Hoe het in ClusterForge kan }
        kubectl: { type: array, items: { type: string } }
        yaml: { type: string, description: "YAML om toe te passen; leeg als er geen is" }
        question: { type: string }
        detail: { type: string, description: "Wat de controle zag: wat er nog ontbreekt, of bij een afgeronde opdracht wat er staat" }
        answer: { type: string, description: Het goede antwoord op een vraag }
        wrong: { type: boolean, description: Het antwoord van daarnet klopt niet }
        done_label: { type: string, description: De knop bij een leesopdracht }
        done_at: { type: string, format: date-time, nullable: true }
        link:
          allOf: [{ $ref: "#/components/schemas/KubeLessonLink" }]
          nullable: true
    KubeLesson:
      type: object
      required: [id, number, title, summary, intro, outro, steps, done, unavailable, started_at, finished_at, problem]
      properties:
        id: { type: string }
        number: { type: integer }
        title: { type: string }
        summary: { type: string }
        intro: { type: array, items: { type: string } }
        outro: { type: array, items: { type: string }, description: Staat er als de les af is }
        steps: { type: array, items: { $ref: "#/components/schemas/KubeLessonStep" } }
        done: { type: integer }
        unavailable: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        problem: { type: string, description: "Waarom het cluster niet te lezen was; leeg als het lukte" }
    KubeLessonCheckInput:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: { type: string }
          description: Per opdracht een antwoord op een vraag, of iets niet-leegs om een leesopdracht af te ronden
    KubeResourceType:
      type: object
      required: [group, version, resource, kind, namespaced]
      properties:
        group: { type: string }
        version: { type: string }
        resource: { type: string }
        kind: { type: string }
        namespaced: { type: boolean }
    KubeObjectSummary:
      type: object
      required: [namespace, name, created_at, status]
      properties:
        namespace: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        status: { type: string, description: De fase of de conditie Ready; leeg als het object die niet heeft }
    KubeServicePort:
      type: object
      required: [name, protocol, port, target_port, node_port]
      properties:
        name: { type: string }
        protocol: { type: string }
        port: { type: integer }
        target_port: { type: string, description: Een nummer of de naam van een poort in de container }
        node_port: { type: integer, description: Nul als er geen is }
    KubeService:
      type: object
      required: [namespace, name, type, cluster_ip, ports, external, selector, pods, url, system]
      properties:
        namespace: { type: string }
        name: { type: string }
        type: { type: string }
        cluster_ip: { type: string }
        ports: { type: array, items: { $ref: "#/components/schemas/KubeServicePort" } }
        external: { type: array, items: { type: string }, description: "Adressen buiten het cluster, zoals van ServiceLB" }
        selector: { type: object, additionalProperties: { type: string } }
        pods: { type: integer, description: Het aantal pods dat de Service kiest }
        url: { type: string }
        system: { type: boolean }
    KubeIngressRule:
      type: object
      required: [host, path, service, port, tls, url]
      properties:
        host: { type: string }
        path: { type: string }
        service: { type: string }
        port: { type: string }
        tls: { type: boolean }
        url: { type: string }
    KubeIngress:
      type: object
      required: [namespace, name, class, rules, address, system]
      properties:
        namespace: { type: string }
        name: { type: string }
        class: { type: string }
        rules: { type: array, items: { $ref: "#/components/schemas/KubeIngressRule" } }
        address: { type: array, items: { type: string } }
        system: { type: boolean }
    KubeNetwork:
      type: object
      required: [services, ingresses]
      properties:
        services: { type: array, items: { $ref: "#/components/schemas/KubeService" } }
        ingresses: { type: array, items: { $ref: "#/components/schemas/KubeIngress" } }
    KubeClaim:
      type: object
      required: [namespace, name, phase, bytes, class, volume, access_modes, used_by, system]
      properties:
        namespace: { type: string }
        name: { type: string }
        phase: { type: string }
        bytes: { type: integer, format: int64, description: "De grootte, of de gevraagde grootte als hij nog niet gebonden is" }
        class: { type: string }
        volume: { type: string }
        access_modes: { type: array, items: { type: string } }
        used_by: { type: array, items: { type: string }, description: De pods die de claim gebruiken }
        system: { type: boolean }
    KubeVolume:
      type: object
      required: [name, phase, bytes, class, claim, reclaim, node, path]
      properties:
        name: { type: string }
        phase: { type: string }
        bytes: { type: integer, format: int64 }
        class: { type: string }
        claim: { type: string, description: namespace/naam van de claim; leeg als er geen is }
        reclaim: { type: string, description: "Wat er met de data gebeurt als de claim weg is, zoals Delete" }
        node: { type: string, description: "De node waar het volume op staat, bij local-path" }
        path: { type: string }
    KubeStorageClass:
      type: object
      required: [name, provisioner, default, reclaim, binding, expansion]
      properties:
        name: { type: string }
        provisioner: { type: string }
        default: { type: boolean }
        reclaim: { type: string }
        binding: { type: string }
        expansion: { type: boolean }
    KubeStorage:
      type: object
      required: [claims, volumes, classes]
      properties:
        claims: { type: array, items: { $ref: "#/components/schemas/KubeClaim" } }
        volumes: { type: array, items: { $ref: "#/components/schemas/KubeVolume" } }
        classes: { type: array, items: { $ref: "#/components/schemas/KubeStorageClass" } }
    KubeConfigMap:
      type: object
      required: [namespace, name, keys, bytes, created_at, system]
      properties:
        namespace: { type: string }
        name: { type: string }
        keys: { type: array, items: { type: string } }
        bytes: { type: integer }
        created_at: { type: string, format: date-time }
        system: { type: boolean }
    KubeSecretKey:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string }
        bytes: { type: integer, description: De lengte van de waarde; de waarde zelf ziet niemand }
    KubeSecret:
      type: object
      required: [namespace, name, type, keys, created_at, system]
      properties:
        namespace: { type: string }
        name: { type: string }
        type: { type: string }
        keys: { type: array, items: { $ref: "#/components/schemas/KubeSecretKey" } }
        created_at: { type: string, format: date-time }
        system: { type: boolean }
    KubeConfig:
      type: object
      required: [config_maps, secrets]
      properties:
        config_maps: { type: array, items: { $ref: "#/components/schemas/KubeConfigMap" } }
        secrets: { type: array, items: { $ref: "#/components/schemas/KubeSecret" } }
    KubeLogs:
      type: object
      required: [text, truncated]
      properties:
        text: { type: string }
        truncated: { type: boolean, description: "De log was groter dan 2 MB: de oudste regels ontbreken, vraag er minder" }
    KubeOverview:
      type: object
      required: [cluster_id, version, via, vip, nodes_total, nodes_ready, pods, workloads_total, workloads_ready, namespaces, allocatable,
        used, warnings, problems]
      properties:
        cluster_id: { type: string, format: uuid }
        version: { type: string }
        via: { type: string, description: De node waarvan de agent de API bevroeg }
        vip: { type: string, nullable: true }
        nodes_total: { type: integer }
        nodes_ready: { type: integer }
        pods: { $ref: "#/components/schemas/KubePodCounts" }
        workloads_total: { type: integer }
        workloads_ready: { type: integer, description: Workloads die doen wat ze moeten }
        namespaces: { type: array, items: { type: string } }
        allocatable: { $ref: "#/components/schemas/KubeUsage" }
        used:
          allOf: [{ $ref: "#/components/schemas/KubeUsage" }]
          nullable: true
          description: Het gebruik volgens metrics-server; null als die niet antwoordt
        warnings: { type: array, items: { $ref: "#/components/schemas/KubeEvent" } }
        problems: { type: array, items: { $ref: "#/components/schemas/KubePod" } }
    KubeNodeLink:
      type: object
      required: [id, hostname, agent, agent_protocol]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        agent: { type: boolean }
        agent_protocol: { type: integer }
    KubeNode:
      type: object
      required: [name, roles, ready, ready_reason, unschedulable, pressure, internal_ip, kubelet_version, os_image, kernel, container_runtime,
        arch, allocatable, used, pods, created_at, node]
      properties:
        name: { type: string }
        roles: { type: array, items: { type: string } }
        ready: { type: boolean }
        ready_reason: { type: string, description: De reden bij de conditie Ready als de node niet Ready is }
        unschedulable: { type: boolean, description: Cordon; er komen geen nieuwe pods op }
        pressure: { type: array, items: { type: string }, description: "Condities met een probleem, zoals DiskPressure" }
        internal_ip: { type: string }
        kubelet_version: { type: string }
        os_image: { type: string }
        kernel: { type: string }
        container_runtime: { type: string }
        arch: { type: string }
        allocatable: { $ref: "#/components/schemas/KubeUsage" }
        used:
          allOf: [{ $ref: "#/components/schemas/KubeUsage" }]
          nullable: true
        pods: { type: integer, description: "Pods op deze node, zonder de voltooide" }
        created_at: { type: string, format: date-time }
        node:
          allOf: [{ $ref: "#/components/schemas/KubeNodeLink" }]
          nullable: true
          description: De ClusterForge-node; null als die niet te vinden is
    KubeWorkload:
      type: object
      required: [kind, namespace, name, desired, ready, up_to_date, images, state, state_text, schedule, created_at, system]
      properties:
        kind: { type: string, enum: [Deployment, StatefulSet, DaemonSet, CronJob, Job] }
        namespace: { type: string }
        name: { type: string }
        desired: { type: integer }
        ready: { type: integer }
        up_to_date: { type: integer }
        images: { type: array, items: { type: string } }
        state: { type: string, enum: [ready, rolling, degraded, stopped, failed, running, suspended, scheduled] }
        state_text: { type: string }
        schedule: { type: string, description: Het schema van een CronJob }
        created_at: { type: string, format: date-time }
        system: { type: boolean }
    KubePod:
      type: object
      required: [namespace, name, node, status, problem, ready, containers, restarts, ip, images, owner_kind, owner_name, created_at, system]
      properties:
        namespace: { type: string }
        name: { type: string }
        node: { type: string }
        status: { type: string, description: De status zoals kubectl get pods hem toont }
        problem: { type: boolean }
        ready: { type: integer }
        containers: { type: integer }
        restarts: { type: integer }
        ip: { type: string }
        images: { type: array, items: { type: string } }
        owner_kind: { type: string }
        owner_name: { type: string }
        created_at: { type: string, format: date-time }
        system: { type: boolean }
    DocMeta:
      type: object
      required: [scope, kind, title, path]
      properties:
        scope: { type: string, enum: [overview, cluster] }
        kind: { type: string }
        title: { type: string }
        path: { type: string, description: "Waar het in de zip staat, zoals clusters/web/netwerk.md" }
        cluster_id: { type: string, format: uuid }
        version: { type: integer, format: int64, description: De nieuwste bewaarde versie; leeg als er nog geen is }
        generated_at: { type: string, format: date-time }
    DocClusterIndex:
      type: object
      required: [id, name, slug, environment, docs, summary]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        environment: { type: string }
        docs: { type: array, items: { $ref: "#/components/schemas/DocMeta" } }
        changed_at: { type: string, format: date-time, description: De nieuwste versie van een van zijn documenten }
        queued_until: { type: string, format: date-time, description: Wanneer een wijziging in de documentatie komt }
        summary:
          allOf: [{ $ref: "#/components/schemas/DocSummaryMeta" }]
          nullable: true
          description: De samenvatting 'In het kort' van de assistent; null zonder
    DocSummaryMeta:
      type: object
      required: [at, model, by]
      properties:
        at: { type: string, format: date-time }
        model: { type: string }
        by: { type: string, description: Wie haar vroeg; leeg als die gebruiker weg is }
    DocIndex:
      type: object
      required: [overview, clusters]
      properties:
        overview: { $ref: "#/components/schemas/DocMeta" }
        clusters: { type: array, items: { $ref: "#/components/schemas/DocClusterIndex" } }
        queued_until: { type: string, format: date-time, description: Wanneer een wijziging in het overzicht komt }
    Doc:
      type: object
      required: [scope, kind, title, path, content, sha256, cause, cause_text]
      properties:
        scope: { type: string, enum: [overview, cluster] }
        kind: { type: string }
        title: { type: string }
        path: { type: string }
        cluster_id: { type: string, format: uuid }
        cluster_name: { type: string }
        version: { type: integer, format: int64, description: Leeg als het document nog niet bewaard is }
        generated_at: { type: string, format: date-time }
        content: { type: string, description: De Markdown, zonder de kopregel met het moment van schrijven }
        sha256: { type: string }
        cause: { type: string }
        cause_text: { type: string, description: "Waarom deze versie geschreven werd, zoals Na: Cluster uitgerold" }
    DocVersion:
      type: object
      required: [id, generated_at, sha256, cause, cause_text]
      properties:
        id: { type: integer, format: int64 }
        generated_at: { type: string, format: date-time }
        sha256: { type: string }
        cause: { type: string }
        cause_text: { type: string }
    DocHistory:
      type: object
      required: [versions, keep]
      properties:
        versions: { type: array, items: { $ref: "#/components/schemas/DocVersion" } }
        keep: { type: integer, description: Hoeveel versies per document bewaard blijven }
    DocDiff:
      type: object
      required: [from, to, diff, changed]
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        diff: { type: string }
        changed: { type: integer, description: "Het aantal gewijzigde regels; -1 als de versies te groot zijn om te vergelijken" }
    DocGenerateResult:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, description: Hoeveel documenten een nieuwe versie kregen }
    DocsCommit:
      type: object
      required: [sha, url, at, files]
      properties:
        sha: { type: string }
        url: { type: string, description: De commit op de website }
        at: { type: string, format: date-time }
        files: { type: integer, description: Hoeveel bestanden de commit veranderde }
    DocsTarget:
      type: object
      required: [api_url, repository, branch, path, web_url, folder_url, enabled, last_commit, last_checked_at, last_attempt_at, last_error, created_at, updated_at]
      properties:
        api_url: { type: string }
        repository: { type: string, description: "eigenaar/naam" }
        branch: { type: string }
        path: { type: string, description: De map in de repository; leeg is de hoofdmap }
        web_url: { type: string, description: De repository op de website }
        folder_url: { type: string, description: De map op de branch op de website }
        enabled: { type: boolean, description: Automatisch publiceren na een wijziging en elke nacht }
        last_commit:
          description: De laatste commit van ClusterForge
          allOf: [{ $ref: "#/components/schemas/DocsCommit" }]
          nullable: true
        last_checked_at:
          type: string
          format: date-time
          nullable: true
          description: De laatste keer dat de repository gelijk was aan de documentatie
        last_attempt_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: Waarom de laatste poging mislukte; leeg als ze lukte }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocsTargetStatus:
      type: object
      required: [enabled, target, pending]
      properties:
        enabled: { type: boolean, description: Zonder CF_MASTER_KEY staat de export uit }
        target:
          allOf: [{ $ref: "#/components/schemas/DocsTarget" }]
          nullable: true
        pending: { type: boolean, description: Er wacht een publicatie, bijvoorbeeld na een fout }
    DocsTargetInput:
      type: object
      required: [repository]
      properties:
        api_url: { type: string, description: "Standaard https://api.github.com" }
        repository: { type: string, description: "eigenaar/naam, of de link naar de repository" }
        branch: { type: string, description: Standaard main }
        path: { type: string, description: "Standaard docs; leeg is de hoofdmap van de repository" }
        token:
          type: string
          format: password
          description: "Fine-grained token met alleen Contents: Read and write op deze repository; leeg laat het opgeslagen token staan"
        enabled: { type: boolean, description: Automatisch publiceren; standaard aan }
    DocsTargetProbe:
      type: object
      required: [branch_exists, head, files]
      properties:
        branch_exists: { type: boolean, description: Zo niet, dan maakt ClusterForge de branch bij de eerste publicatie }
        head: { type: string, description: De kop van de branch; leeg als die nog niet bestaat }
        files: { type: integer, description: Hoeveel documenten van ClusterForge er al in de map staan }
    DocsFileChange:
      type: object
      required: [path, change]
      properties:
        path: { type: string }
        change: { type: string, enum: [added, modified, deleted] }
    DocsPublishResult:
      type: object
      required: [commit, files]
      properties:
        commit:
          allOf: [{ $ref: "#/components/schemas/DocsCommit" }]
          nullable: true
        files: { type: array, items: { $ref: "#/components/schemas/DocsFileChange" } }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stabiele foutcode, bijvoorbeeld invalid_credentials of totp_required
        message:
          type: string
        field:
          type: string
          description: Het veld met de fout, zoals params.vip, als de fout bij één veld hoort
        checks:
          type: array
          description: Bij precheck_failed de controles van de voorcontrole
          items: { $ref: "#/components/schemas/TestRunCheck" }
        diff:
          type: string
          description: Bij git_mismatch het verschil tussen het bestand in Git en de export
    Health:
      type: object
      required: [status, version, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        database: { type: string, enum: [ok, unreachable] }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        totp_code: { type: string, description: "Zescijferige code, alleen als TOTP aan staat" }
    Role:
      type: string
      enum: [admin, viewer]
    User:
      type: object
      required: [id, username, role, totp_enabled, created_at, kube_learning]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        totp_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        kube_learning: { type: boolean, description: De leermodus in het dashboard Kubernetes staat aan }
    Me:
      type: object
      required: [user, csrf_token, session_expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        session_expires_at: { type: string, format: date-time }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12 }
    TotpSetup:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: { type: string }
        otpauth_url: { type: string }
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    TotpDisableRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string, format: password }
        code: { type: string }
    Event:
      type: object
      required: [id, ts, actor_type, actor_id, subject_type, subject_id, action, payload]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, agent, system] }
        actor_id: { type: string }
        subject_type: { type: string }
        subject_id: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        payload: { type: object, additionalProperties: true }
    BackupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    BackupFreshness:
      type: string
      enum: [ok, stale, missing, unknown]
      description: |
        ok: de nieuwste back-up is jonger dan de maximale leeftijd. stale: ze
        is ouder. missing: Proxmox heeft geen back-up. unknown: de back-ups
        van de koppeling zijn niet te lezen.
    BackupVolume:
      type: object
      required: [volid, storage, host, time, size, format, notes, protected, verify]
      properties:
        volid: { type: string }
        storage: { type: string }
        host:
          type: string
          description: De Proxmox-host waarlangs de back-up gelezen is
        time: { type: string, format: date-time }
        size: { type: integer, format: int64 }
        format: { type: string }
        notes: { type: string }
        protected: { type: boolean }
        verify:
          type: string
          description: Verificatie door Proxmox Backup Server; leeg als die er niet is
          enum: ["", ok, failed]
    BackupItem:
      type: object
      required: [connection_id, connection_name, vmid, name, label, guest_type, node, cluster, watched, freshness, reason, since, max_age_hours, latest, count,
        last_verification]
      properties:
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        vmid: { type: integer }
        name:
          type: string
          description: Naam van de VM in Proxmox; leeg als hij er niet meer is
        label:
          type: string
          description: Het label uit de lijst "ook bewaken"
        guest_type: { type: string }
        node:
          allOf: [{ $ref: "#/components/schemas/BackupRef" }]
          nullable: true
        cluster:
          allOf: [{ $ref: "#/components/schemas/BackupRef" }]
          nullable: true
        watched:
          type: boolean
          description: Bewaakt via de lijst "ook bewaken" in plaats van via een node
        freshness: { $ref: "#/components/schemas/BackupFreshness" }
        reason:
          type: string
          description: Waarom de stand niet ok is
        since:
          type: string
          format: date-time
          nullable: true
        max_age_hours: { type: integer }
        latest:
          allOf: [{ $ref: "#/components/schemas/BackupVolume" }]
          nullable: true
        count: { type: integer }
        last_verification:
          allOf: [{ $ref: "#/components/schemas/BackupVerification" }]
          nullable: true
          description: De laatste afgeronde back-upcontrole van de node
    BackupVerification:
      type: object
      required: [run_id, result, summary, finished_at, recovery_seconds]
      properties:
        run_id: { type: string, format: uuid }
        result: { $ref: "#/components/schemas/TestRunResult" }
        summary: { type: string }
        finished_at: { type: string, format: date-time, nullable: true }
        recovery_seconds:
          type: number
          format: double
          nullable: true
          description: Hersteltijd, terugzetten plus opstarten
    BackupSandbox:
      type: object
      required: [id, connection_id, connection_name, vmid, source_vmid, source, run_id, running, volid, state, host, storage, error,
        created_at, destroyed_at]
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        vmid: { type: integer, description: Het VMID van de sandbox }
        source_vmid: { type: integer, description: Het VMID van de VM waarvan de back-up is }
        source:
          allOf: [{ $ref: "#/components/schemas/BackupRef" }]
          nullable: true
          description: De node van de bron-VM
        run_id: { type: string, format: uuid, nullable: true }
        running: { type: boolean, description: De controle van deze sandbox loopt nog }
        volid: { type: string }
        state:
          type: string
          enum: [reserved, present, destroyed, destroy_failed, none]
          description: none als de VM er nooit kwam of niet (meer) in pool cf-sandbox zit
        host: { type: string }
        storage: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        destroyed_at: { type: string, format: date-time, nullable: true }
    BackupVerifyInput:
      type: object
      properties:
        volid: { type: string, description: Een andere back-up van dezelfde VM; leeg is de nieuwste }
    BackupVerifyDefinition:
      type: object
      required: [volid, backup_time, size, format, backup_storage, connection_id, connection_name, source_vmid, guest_name, chosen]
      properties:
        volid: { type: string }
        backup_time: { type: string, format: date-time }
        size: { type: integer, format: int64 }
        format: { type: string }
        backup_storage: { type: string }
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        source_vmid: { type: integer }
        guest_name: { type: string }
        chosen: { type: boolean, description: Iemand koos deze back-up; anders de nieuwste }
    BackupVerifyMeasurements:
      type: object
      required: [restore_seconds, boot_seconds, check_seconds, cleanup_seconds, total_seconds, host, storage, sandbox_vmid, hostname, os,
        filesystems, destroyed_at, agent_version, services_expected, services_active, databases]
      properties:
        restore_seconds: { type: number, format: double, nullable: true }
        boot_seconds: { type: number, format: double, nullable: true, description: Van starten tot de guest agent antwoordt }
        check_seconds: { type: number, format: double, nullable: true }
        cleanup_seconds: { type: number, format: double, nullable: true }
        total_seconds: { type: number, format: double, nullable: true }
        host: { type: string }
        storage: { type: string, description: De sandbox-storage }
        sandbox_vmid: { type: integer }
        hostname: { type: string, description: Wat de guest agent als hostname gaf }
        os: { type: string }
        filesystems: { type: integer }
        destroyed_at: { type: string, format: date-time, nullable: true }
        agent_version: { type: string, description: "De versie van cf-agent in de back-up, uit cf-agent verify; leeg als die niet liep" }
        services_expected: { type: integer, description: De services die cf-agent verify controleerde }
        services_active: { type: integer }
        databases:
          type: array
          description: Zoals "PostgreSQL met 3 databases"
          items: { type: string }
    BackupVerifyReport:
      type: object
      required: [definition, measurements, sandbox]
      properties:
        definition: { $ref: "#/components/schemas/BackupVerifyDefinition" }
        measurements: { $ref: "#/components/schemas/BackupVerifyMeasurements" }
        sandbox:
          allOf: [{ $ref: "#/components/schemas/BackupSandbox" }]
          nullable: true
    BackupUncovered:
      type: object
      required: [vmid, name, type, node]
      properties:
        vmid: { type: integer }
        name: { type: string }
        type: { type: string }
        node:
          allOf: [{ $ref: "#/components/schemas/BackupRef" }]
          nullable: true
    BackupConnection:
      type: object
      required: [id, name, checked_at, error, watch, not_backed_up, backup_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: Laatste poging om de back-ups te lezen
        error: { type: string }
        watch:
          type: array
          description: De lijst "ook bewaken"
          items: { $ref: "#/components/schemas/BackupWatchEntry" }
        not_backed_up:
          type: array
          nullable: true
          description: VM's die in geen back-upjob zitten; null als Proxmox dat niet liet lezen
          items: { $ref: "#/components/schemas/BackupUncovered" }
        backup_count: { type: integer }
    BackupClusterState:
      type: object
      required: [id, freshness]
      properties:
        id: { type: string, format: uuid }
        freshness: { $ref: "#/components/schemas/BackupFreshness" }
    BackupOverview:
      type: object
      required: [items, connections, clusters, sandboxes]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BackupItem" }
        connections:
          type: array
          items: { $ref: "#/components/schemas/BackupConnection" }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/BackupClusterState" }
        sandboxes:
          type: array
          description: Sandboxes die nog kunnen bestaan, ook na een mislukte verwijdering
          items: { $ref: "#/components/schemas/BackupSandbox" }
    NodeBackups:
      type: object
      required: [item, backups]
      properties:
        item:
          allOf: [{ $ref: "#/components/schemas/BackupItem" }]
          nullable: true
        backups:
          type: array
          items: { $ref: "#/components/schemas/BackupVolume" }
    DriftReport:
      type: object
      required: [source, notes, nodes]
      properties:
        source:
          allOf: [{ $ref: "#/components/schemas/DriftSource" }]
          nullable: true
        notes:
          type: array
          description: Wat de vergelijking beïnvloedt, zoals een nieuwere templateversie of een afwijkend lidmaatschap
          items: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/DriftNode" } }
    DriftSource:
      type: object
      required: [kind, template, template_version, spec_revision, baseline_at, items]
      properties:
        kind: { type: string, enum: [template, baseline, component] }
        template: { type: string, description: Leeg bij een baseline of alleen een onderdeel }
        template_version: { type: string }
        spec_revision: { type: integer }
        baseline_at: { type: string, format: date-time, nullable: true, description: Wanneer de baseline het laatst is vastgelegd }
        items:
          allOf: [{ $ref: "#/components/schemas/BaselineItems" }]
          nullable: true
          description: Wat de baseline vastlegt; null bij een template
    BaselineItems:
      type: object
      required: [packages, services, files]
      properties:
        packages: { type: array, items: { type: string } }
        services: { type: array, items: { type: string } }
        files: { type: array, items: { type: string } }
    BaselineInput:
      type: object
      required: [node_ids, packages, services, files]
      properties:
        node_ids: { type: array, items: { type: string, format: uuid } }
        packages: { type: array, items: { type: string } }
        services: { type: array, items: { type: string } }
        files: { type: array, items: { type: string }, description: Volledige paden van bestanden of mappen }
        preview: { type: boolean, description: Alleen tonen wat er vastgelegd zou worden }
    BaselineResult:
      type: object
      required: [revision, nodes]
      properties:
        revision: { type: integer, description: De nieuwe spec-revisie; 0 bij preview }
        nodes: { type: array, items: { $ref: "#/components/schemas/BaselineNode" } }
    BaselineNode:
      type: object
      required: [node_id, hostname, items, notes]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/BaselineItem" } }
        notes: { type: array, items: { type: string }, description: Wat niet vastgelegd werd en waarom }
    BaselineItem:
      type: object
      required: [kind, name, version, enabled, active, mode, owner, group, size, content]
      properties:
        kind: { type: string, enum: [package, service, file, directory] }
        name: { type: string }
        version: { type: string }
        enabled: { type: boolean, nullable: true }
        active: { type: boolean, nullable: true }
        mode: { type: string }
        owner: { type: string }
        group: { type: string }
        size: { type: integer, format: int64 }
        content: { type: boolean, description: Of de inhoud vergeleken wordt }
    DriftIgnoreInput:
      type: object
      required: [key, reason]
      properties:
        node_id: { type: string, format: uuid, nullable: true, description: Leeg voor het hele cluster }
        key: { type: string }
        reason: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
    DriftIgnore:
      type: object
      required: [id, node_id, hostname, key, reason, expires_at, expired, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string, nullable: true }
        key: { type: string }
        reason: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }
        created_by:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        created_at: { type: string, format: date-time }
    DriftIgnoreList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DriftIgnore" } }
    FailoverScenario:
      type: string
      enum: [keepalived_stop, service_stop, database_stop, restart_all, vm_hard_stop]
    FailoverProbeHTTP:
      type: object
      required: [path, expect]
      properties:
        path: { type: string, description: "Begint met /, zoals /health" }
        expect: { type: integer, description: De verwachte HTTP-status }
    FailoverProbeTCP:
      type: object
      required: [port]
      properties:
        port: { type: integer }
    FailoverProbe:
      type: object
      description: Een HTTP-pad met de verwachte status, of een TCP-poort. De host is altijd het VIP.
      properties:
        http: { $ref: "#/components/schemas/FailoverProbeHTTP" }
        tcp: { $ref: "#/components/schemas/FailoverProbeTCP" }
    FailoverTestInput:
      type: object
      required: [name, vip_id, scenario, max_takeover_seconds, expect_failback, probe]
      properties:
        name: { type: string }
        vip_id: { type: string, format: uuid }
        scenario: { $ref: "#/components/schemas/FailoverScenario" }
        service:
          type: string
          description: nginx of haproxy bij service_stop; bij database_stop en restart_all kiest ClusterForge zelf (mariadb of patroni)
        max_takeover_seconds:
          type: integer
          description: "1 tot 120; bij restart_all hoe lang de database na de herstart hoogstens nodig heeft om weer gezond te zijn, 1 tot 1800"
        expect_failback: { type: boolean, description: Het VIP moet daarna terug naar de oorspronkelijke node }
        probe: { $ref: "#/components/schemas/FailoverProbe" }
        scheduled: { type: boolean, description: "Gepland in het testvenster; niet op prod. Standaard uit" }
    FailoverStartInput:
      type: object
      properties:
        confirm: { type: string, description: Op prod de slug van het cluster }
    FailoverTest:
      type: object
      required: [id, cluster_id, vip_id, vip_address, vip_owner, vip_owner_id, name, scenario, service, description, max_takeover_seconds,
        expect_failback, probe, scheduled, next_run_at, last_run, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        vip_id: { type: string, format: uuid }
        vip_address: { type: string }
        vip_owner: { type: string, nullable: true, description: De node die het VIP nu heeft }
        vip_owner_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        scenario: { $ref: "#/components/schemas/FailoverScenario" }
        service: { type: string }
        description: { type: string, description: "Het scenario in gewone taal, zoals keepalived stoppen op de eigenaar" }
        max_takeover_seconds: { type: integer }
        expect_failback: { type: boolean }
        probe: { $ref: "#/components/schemas/FailoverProbe" }
        scheduled: { type: boolean, description: Gepland in het testvenster }
        next_run_at: { type: string, format: date-time, nullable: true, description: De volgende geplande run }
        last_run:
          allOf: [{ $ref: "#/components/schemas/TestRun" }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FailoverScenarioOption:
      type: object
      required: [key, label, available, reason, default_seconds, units]
      properties:
        key: { $ref: "#/components/schemas/FailoverScenario" }
        label: { type: string }
        available: { type: boolean }
        reason: { type: string, description: Waarom het scenario hier nu niet kan }
        default_seconds: { type: integer }
        units: { type: array, items: { type: string }, description: "De diensten die service_stop, database_stop of restart_all hier raken" }
    FailoverVIPOption:
      type: object
      required: [id, address, owner_hostname, probe, database, own_vip]
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        owner_hostname: { type: string, nullable: true }
        probe: { $ref: "#/components/schemas/FailoverProbe" }
        database: { type: string, description: "De database achter het VIP, zoals MariaDB met Galera; leeg als er geen is" }
        own_vip: { type: boolean, description: "Een eigen VIP van de database: het blijft waar de database schrijft en komt niet terug" }
    FailoverOptions:
      type: object
      required: [scenarios, vips, default_failback, prod, slug, window, next_window, last_tested_at]
      properties:
        scenarios: { type: array, items: { $ref: "#/components/schemas/FailoverScenarioOption" } }
        vips: { type: array, items: { $ref: "#/components/schemas/FailoverVIPOption" } }
        default_failback: { type: boolean, description: "Aan voor clusters uit een template met failback (keepalived met preempt), zoals keepalived-nginx" }
        prod:
          type: boolean
          description: >-
            Prodcluster: een test start alleen met de hand, met de slug als
            bevestiging en tweestapsverificatie, en is niet te plannen
        slug: { type: string }
        window: { type: string, description: "Het testvenster in gewone taal, zoals zondag van 03:00 tot 05:00" }
        next_window: { type: string, format: date-time, description: Het begin van het volgende testvenster }
        last_tested_at: { type: string, format: date-time, nullable: true, description: "De laatste test met PASS, WARNING of FAIL" }
    FailoverTestList:
      type: object
      required: [items, options, unrestored]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FailoverTest" } }
        options: { $ref: "#/components/schemas/FailoverOptions" }
        unrestored:
          type: array
          description: Runs waarvan het herstel niet lukte
          items: { $ref: "#/components/schemas/TestRun" }
    TestRunResult:
      type: string
      enum: [pass, warning, fail, error, skipped, canceled]
    TestRunCheck:
      type: object
      required: [name, ok, detail, warning, code]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }
        warning: { type: boolean, description: "Niet in orde, maar geen reden om af te keuren" }
        code:
          type: string
          description: >-
            Wat de beheerder kan doen, of leeg. agent_too_old: de back-up heeft geen cf-agent die verify kent; exec_forbidden: het
            API-token mag in de sandbox niets starten via de guest agent.
    TestRunEvent:
      type: object
      required: [t_ms, kind, text]
      properties:
        t_ms: { type: integer, format: int64, description: "Milliseconden na de storing, of bij een back-upcontrole na de start" }
        kind: { type: string, enum: [fault, down, up, takeover, clear, ready, return, step, write_down, write_up, db_ready, node_back, db_recover] }
        text: { type: string }
    TestRunSegment:
      type: object
      required: [from_ms, to_ms, ok]
      properties:
        from_ms: { type: integer, format: int64 }
        to_ms: { type: integer, format: int64 }
        ok: { type: boolean }
    FailoverWrites:
      type: object
      description: >-
        De schrijftest: een andere datanode schreef tijdens de test elke halve seconde een rij via het VIP van de database, en telde
        na de test of elke bevestigde rij er nog was. Bij restart_all schreef hij tot hij herstartte, en keek hij daarna na of de
        rijen die de server als bevestigd kende er nog waren.
      required: [node, title, vip, port, downtime_ms, recovered, failback_ms, attempts, failed, confirmed, lost, lost_seqs, extra,
        check_error, segments]
      properties:
        node: { type: string, description: De datanode die schreef }
        title: { type: string, description: "De database, zoals MariaDB met Galera" }
        vip: { type: string }
        port: { type: integer }
        downtime_ms:
          type: integer
          format: int64
          nullable: true
          description: Van de eerste mislukte schrijfactie tot de eerste van drie goede op rij, tijdens de meting
        recovered: { type: boolean, description: Schrijven lukte aan het eind van de meting weer }
        failback_ms: { type: integer, format: int64, nullable: true, description: De onderbreking bij de terugkeer }
        attempts: { type: integer, description: Schrijfacties sinds de storing }
        failed: { type: integer, description: Hoeveel daarvan mislukten }
        confirmed: { type: integer, description: Rijen die de database tijdens de hele test bevestigde }
        lost: { type: integer, nullable: true, description: "Bevestigde rijen die na de test weg waren; null als tellen niet lukte" }
        lost_seqs: { type: array, items: { type: integer, format: int64 }, description: De volgnummers van de eerste verloren rijen }
        extra: { type: integer, description: "Rijen waarvan de bevestiging niet aankwam, maar die er wel zijn" }
        check_error: { type: string, description: Waarom tellen niet lukte, of leeg }
        segments: { type: array, items: { $ref: "#/components/schemas/TestRunSegment" } }
    FailoverRestartNode:
      type: object
      required: [hostname, arbiter, back_ms, error]
      properties:
        hostname: { type: string }
        arbiter: { type: boolean, description: Een scheidsrechter in plaats van een datanode }
        back_ms: { type: integer, format: int64, nullable: true, description: "Wanneer de node terug was na de herstart; null als niet binnen de meting" }
        error: { type: string, description: "Waarom de node niet herstartte, of leeg" }
    FailoverRestart:
      type: object
      description: Wat de test die alle nodes van de database herstart zag, in ms na het versturen van de herstart.
      required: [title, engine, nodes, back_ms, healthy_ms, began, started, recover_error, reason]
      properties:
        title: { type: string, description: "De database, zoals MariaDB Galera" }
        engine: { type: string, enum: [mariadb, postgresql] }
        nodes: { type: array, items: { $ref: "#/components/schemas/FailoverRestartNode" } }
        back_ms: { type: integer, format: int64, nullable: true, description: Wanneer alle nodes terug waren }
        healthy_ms: { type: integer, format: int64, nullable: true, description: "Wanneer de database weer gezond was: alle datanodes doen mee" }
        began: { type: string, description: "De node waarop ClusterForge Galera opnieuw begon; leeg als de database vanzelf terugkwam" }
        started: { type: array, items: { type: string }, description: De nodes waarop ClusterForge MariaDB opnieuw startte }
        recover_error: { type: string, description: "Waarom opnieuw beginnen niet lukte, of leeg" }
