      description: Voor het voorbeeld in Instellingen; ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardOverview" }
        "401": { $ref: "#/components/responses/Error" }
  /agents/enroll:
    post:
      operationId: enrollAgent
