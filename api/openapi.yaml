        nodes: { type: array, items: { type: string }, description: De VM's van dit cluster op de host }
        others: { type: array, items: { type: string }, description: Gekoppelde VM's van andere clusters op de host }
    DisasterNodeOption:
      type: object
      required: [id, hostname, owner, faults, nft, tc, interfaces, primary, units]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        owner: { type: boolean, description: De node heeft nu het VIP }
        faults: { type: boolean, description: De agent kent storingen (protocol 6) }
        nft: { type: boolean }
        tc: { type: boolean }
        interfaces: { type: array, items: { type: string } }
        primary: { type: string, description: De interface naar ClusterForge; leeg als dat niet bekend is }
        units: { type: array, items: { type: string }, description: Diensten die een stap hier kan stoppen }
    DisasterActionOption:
      type: object
      required: [key, label, available, reason]
      properties:
        key: { $ref: "#/components/schemas/DisasterStepAction" }
        label: { type: string }
        available: { type: boolean }
        reason: { type: string, description: Waarom niet, als available false is }
    DisasterOptions:
      type: object
      required: [allowed, reason, slug, kinds, hosts, units, vips, nodes, actions, targets, window]
