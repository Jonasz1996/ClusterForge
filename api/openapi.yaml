        risks:
          type: array
          items: { $ref: "#/components/schemas/RecoveryReportRisk" }
    RecoveryReportBackup:
      type: object
      required: [node, connection, vmid, time, storage, size, count, freshness, last_verification]
      properties:
        node: { type: string }
        connection: { type: string }
        vmid: { type: integer }
        time: { type: string, format: date-time, nullable: true }
        storage: { type: string }
        size: { type: integer, format: int64 }
        count: { type: integer }
        freshness: { $ref: "#/components/schemas/BackupFreshness" }
        last_verification:
          type: object
          nullable: true
          required: [run_id, result, finished_at, recovery_seconds]
          properties:
            run_id: { type: string, format: uuid }
            result: { type: string }
            finished_at: { type: string, format: date-time, nullable: true }
            recovery_seconds: { type: number, nullable: true }
    RecoveryReportRun:
      type: object
      required: [id, kind, name, trigger, result, summary, finished_at, recovery_seconds, takeover_ms, downtime_ms, rto_seconds, rpo_seconds]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/TestRunKind" }
        name: { type: string }
        trigger: { type: string }
        result: { $ref: "#/components/schemas/TestRunResult" }
        summary: { type: string }
        finished_at: { type: string, format: date-time }
        recovery_seconds: { type: number, nullable: true, description: Back-upcontrole, terugzetten plus opstarten }
        takeover_ms: { type: integer, format: int64, nullable: true }
        downtime_ms: { type: integer, format: int64, nullable: true }
        rto_seconds: { type: number, nullable: true }
        rpo_seconds: { type: number, nullable: true }
    RecoveryReportMeasured:
      type: object
      required: [run_id, name, result, finished_at, rto_seconds, rpo_seconds, rto_met, rpo_met]
      properties:
        run_id: { type: string, format: uuid }
        name: { type: string }
        result: { $ref: "#/components/schemas/TestRunResult" }
        finished_at: { type: string, format: date-time }
        rto_seconds: { type: number, nullable: true }
        rpo_seconds: { type: number, nullable: true }
        rto_met: { type: boolean, nullable: true, description: Leeg zonder doel }
        rpo_met: { type: boolean, nullable: true }
    RecoveryReportRisk:
      type: object
      required: [check, card, severity, text, points]
      properties:
        check: { type: string }
        card: { $ref: "#/components/schemas/RiskCardId" }
        severity: { $ref: "#/components/schemas/RiskSeverity" }
        text: { type: string }
        points: { type: integer }
    TestRunKind: { type: string, enum: [failover.test, backup.verify, disaster.run, dr.rehearsal] }
    TestRun:
      type: object
      required: [id, kind, trigger, cluster_id, cluster_name, test_id, node_id, hostname, job_id, job_status, result, restored,
        summary, checks, timeline, measurements, definition, backup, disaster, rehearsal, requested_by, created_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/TestRunKind" }
        trigger: { type: string, enum: [manual, schedule] }
