    DisasterRunInput:
      type: object
      required: [confirm]
      properties:
        confirm: { type: array, items: { type: string }, description: De slug van elk geraakt cluster }
    DisasterTarget:
      type: object
      required: [node_id, hostname, cluster_id, cluster, unit, vmid]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid }
        cluster: { type: string }
        unit: { type: string, description: Leeg bij een VM die hard uitgaat }
        vmid: { type: integer, nullable: true }
    DisasterPrediction:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [healthy, degraded, down, split_brain, unknown] }
