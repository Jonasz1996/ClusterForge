      type: object
      required: [summary, level]
      properties:
        summary: { type: string }
        level: { type: string, enum: [likely, possible] }
    IncidentList:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        has_more: { type: boolean }
    IncidentDetail:
      type: object
      required: [incident, history, history_more, analysis, timeline, timeline_more, ai]
      properties:
        incident: { $ref: "#/components/schemas/Incident" }
        analysis:
          allOf: [{ $ref: "#/components/schemas/IncidentAnalysis" }]
          nullable: true
          description: Null zolang de analyse nog niet gerekend is
        timeline:
          type: array
          description: |
            Het logboek, het journaal en de afwijkingen in de metrics over wat
            geraakt was en wat eromheen ligt, van twee uur voor het eerste
            symptoom tot het einde, oudste eerst
          items: { $ref: "#/components/schemas/TimelineEntry" }
        timeline_more:
          type: boolean
          description: Er waren meer regels; de oudste ontbreken
        history:
          type: array
          description: Statusovergangen, incidenten, tests en herstelacties van Zelfherstel over wat geraakt was, oudste eerst
          items: { $ref: "#/components/schemas/AuditEntry" }
        history_more:
          type: boolean
          description: Er waren meer regels dan getoond
        ai:
          allOf: [{ $ref: "#/components/schemas/IncidentAI" }]
          nullable: true
          description: De analyse van de assistent; null zolang er geen is
    IncidentAI:
      type: object
      required: [text, hidden, model, at, by, automatic, cost_usd, conversation_id]
      properties:
        text: { type: string, nullable: true, description: "Markdown met vier kopjes; null als hidden" }
        hidden:
          type: boolean
          description: De analyse las met de rechten van een beheerder; een viewer ziet de tekst niet
        model: { type: string, description: "Het model dat antwoordde; met een fallback meer, gescheiden door een komma" }
        at: { type: string, format: date-time }
        by: { type: string, nullable: true, description: Wie haar vroeg; null als ze automatisch was }
        automatic: { type: boolean }
        cost_usd: { type: number }
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: Het gesprek met de tools; alleen voor wie het mag openen
    TimelineEntry:
      type: object
      required: [id, ts, from, to, delay, class, source, kind, action, summary, node_id, hostname, cluster_id, cluster, subject, job_id, job, link, detail]
      properties:
        id:
          type: string
          description: e en een event-id, c en een journaal-id, of m voor een afwijking in de metrics
        ts: { type: string, format: date-time }
        from:
          type: string
          format: date-time
          description: Het begin van het venster waarin het waarschijnlijk gebeurde
        to: { type: string, format: date-time }
        delay:
          type: string
          description: Waarom het venster er is, zoals 'een node gaat pas na 90 s zonder heartbeat op down'
        class: { type: string, enum: [change, symptom, info] }
        source: { type: string, enum: [log, agent, server, proxmox, clusterforge, metrics, kube] }
        kind: { type: string }
        action: { type: string }
        summary: { type: string }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster: { type: string }
        subject: { type: string }
        job_id: { type: string, format: uuid, nullable: true }
        job: { type: string }
        link: { type: string }
        detail:
          type: object
          additionalProperties: { type: string }
    Timeline:
      type: object
      required: [entries, has_more]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        has_more:
          type: boolean
          description: Er waren meer regels; de oudste ontbreken
    IncidentMoment:
      type: object
      required: [entry_id, ts, from, to, summary, why]
      properties:
        entry_id: { type: string, description: Leeg als het moment uit het begin van het incident komt }
        ts: { type: string, format: date-time }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        summary: { type: string }
        why: { type: string }
    IncidentCause:
      type: object
      required: [entry_id, ts, level, score, kind, summary, hostname, cluster, link, reasons, also, commit]
      properties:
        entry_id: { type: string }
        ts: { type: string, format: date-time }
        level: { type: string, enum: [likely, possible, weak] }
        score: { type: number }
        kind: { type: string }
        summary: { type: string }
        hostname: { type: string }
        cluster: { type: string }
        link: { type: string }
        reasons:
          type: array
          items: { type: string }
        also:
          type: integer
          description: Het aantal regels die erbij horen, zoals de andere stappen van dezelfde taak
        commit: { type: string, description: De volledige commit bij een Git-wijziging }
    IncidentFinding:
      type: object
      required: [node_id, hostname, metric, label, before, after, at, summary]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        metric: { type: string, enum: [cpu, memory, disk, network_errors] }
        label: { type: string }
        before: { type: number }
        after: { type: number }
        at: { type: string, format: date-time }
        summary: { type: string }
    IncidentAnalysis:
      type: object
      required: [version, first_symptom, window_from, window_to, conclusion, causes, changes, anomalies, metrics_unknown, consumers, analyzed_at]
      properties:
        version: { type: integer }
        first_symptom: { $ref: "#/components/schemas/IncidentMoment" }
        window_from: { type: string, format: date-time }
        window_to: { type: string, format: date-time }
        conclusion: { type: string }
        causes:
          type: array
          items: { $ref: "#/components/schemas/IncidentCause" }
        changes:
          type: integer
          description: Het aantal veranderingen in het venster, ook die te ver weg lagen
        anomalies:
          type: array
          items: { $ref: "#/components/schemas/IncidentFinding" }
        metrics_unknown: { type: boolean }
        consumers:
          type: array
          description: Clusters die van een geraakt cluster afhangen en zelf niet in het incident zitten
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        analyzed_at:
          type: string
          format: date-time
          description: Wanneer de analyse voor het laatst veranderde
    AssistantModel:
      type: object
      required: [id, label, input_usd, output_usd]
      properties:
        id: { type: string }
        label: { type: string }
        input_usd: { type: number, description: Dollar per miljoen tokens invoer }
        output_usd: { type: number, description: Dollar per miljoen tokens uitvoer }
    AssistantSettings:
      type: object
      required: [available, can_use, reason, enabled, has_key, model, models, monthly_budget_usd, viewer_access, auto_analyze, updated_at, updated_by]
      properties:
        available: { type: boolean, description: False zonder CF_MASTER_KEY }
        can_use: { type: boolean, description: Of jij de assistent nu kunt gebruiken }
        reason: { type: string, description: Waarom niet; leeg als het kan }
        enabled: { type: boolean }
        has_key: { type: boolean }
        model: { type: string }
        models:
          type: array
          items: { $ref: "#/components/schemas/AssistantModel" }
        monthly_budget_usd: { type: integer }
        viewer_access: { type: boolean }
        auto_analyze:
          type: boolean
          description: Nieuwe prod-incidenten met ernst hoog of kritiek automatisch analyseren, hoogstens tien per dag
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string, nullable: true, description: Gebruikersnaam }
    AssistantSettingsInput:
      type: object
      required: [enabled, model, monthly_budget_usd, viewer_access]
      properties:
        enabled: { type: boolean }
        api_key: { type: string, maxLength: 300, description: Leeg laat de opgeslagen sleutel staan }
        model: { type: string }
        monthly_budget_usd: { type: integer }
        viewer_access: { type: boolean }
        auto_analyze: { type: boolean, default: false }
        password: { type: string, maxLength: 1024, description: Je wachtwoord, als je geen tweestapsverificatie hebt }
        totp_code: { type: string, maxLength: 10, description: Je code, als je tweestapsverificatie hebt }
    AssistantKeyTest:
      type: object
      required: [model]
      properties:
        api_key: { type: string, maxLength: 300, description: Leeg test de opgeslagen sleutel }
        model: { type: string }
    AssistantKeyTestResult:
      type: object
      required: [ok, model, message]
      properties:
        ok: { type: boolean }
        model: { type: string, description: Het model dat antwoordde }
        message: { type: string, description: Wat er misging; leeg als het werkte }
    AssistantUsage:
      type: object
      required: [since, spent_usd, budget_usd, users]
      properties:
        since: { type: string, format: date-time }
        spent_usd: { type: number }
        budget_usd: { type: integer }
        users:
          type: array
          description: Per gebruiker; leeg voor een viewer
          items:
            type: object
            required: [username, questions, cost_usd]
            properties:
              username: { type: string }
              questions: { type: integer }
              cost_usd: { type: number }
    AssistantConversationInput:
      type: object
      properties:
        subject_type: { type: string, enum: [cluster, node, incident] }
        subject_id: { type: string, format: uuid }
    AssistantConversation:
      type: object
      required: [id, username, title, kind, subject_type, subject_id, created_at, updated_at, cost_usd, can_ask]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, description: Leeg voor een gesprek van ClusterForge zelf, zoals een automatische analyse }
        title: { type: string, description: Het begin van de eerste vraag; leeg zolang er geen is }
        kind:
          type: string
          enum: [chat, analysis, explain, summary]
          description: Een gewone vraag, of een analyse, uitleg of samenvatting
        can_ask: { type: boolean, description: Of jij in dit gesprek verder kunt vragen; alleen in je eigen gesprekken }
        subject_type: { type: string, description: cluster, node, incident of leeg }
        subject_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cost_usd: { type: number }
    AssistantConversationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssistantConversation" }
    AssistantConversationDetail:
      type: object
      required: [conversation, turns]
      properties:
        conversation: { $ref: "#/components/schemas/AssistantConversation" }
        turns:
          type: array
          items: { $ref: "#/components/schemas/AssistantTurn" }
    AssistantTurn:
      type: object
      required: [question, asked_at, answer, tools, models, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_usd, note]
      properties:
        question: { type: string }
        asked_at: { type: string, format: date-time }
        answer: { type: string, description: Markdown }
        tools:
          type: array
          items:
            type: object
            required: [name, label, error]
            properties:
              name: { type: string }
              label: { type: string }
              error: { type: boolean }
        models:
          type: array
          items: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        cache_write_tokens: { type: integer }
        cost_usd: { type: number }
        note: { type: string, description: Waarom het antwoord onvolledig is; meestal leeg }
    AssistantExplainInput:
      type: object
      description: Een bevinding (check, subject_type en subject_id, zoals in de health score) of een SPOF (de sleutel van het onderdeel)
      properties:
        check: { type: string, maxLength: 100 }
        subject_type: { type: string, maxLength: 40 }
        subject_id: { type: string, format: uuid }
        spof: { type: string, maxLength: 300, description: De sleutel van het onderdeel uit de SPOF-lijst }
    AssistantQuestion:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 4000 }
    IncidentNote:
      type: object
      required: [note]
      properties:
        note: { type: string, maxLength: 10000 }
    AuditPage:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_before:
          type: integer
          format: int64
          nullable: true
          description: Geef dit mee als before voor de volgende pagina; null op de laatste
    AuditInfo:
      type: object
      required: [categories, users, deleted_clusters, deleted_nodes, total, oldest]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        users:
          type: array
          items:
            type: object
            required: [id, username, disabled]
            properties:
              id: { type: string, format: uuid }
              username: { type: string }
              disabled: { type: boolean }
        deleted_clusters:
          type: array
          items: { $ref: "#/components/schemas/AuditRef" }
        deleted_nodes:
          type: array
          items: { $ref: "#/components/schemas/AuditRef" }
        total: { type: integer, format: int64 }
        oldest: { type: string, format: date-time, nullable: true }
    UserRef:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
    ClusterType:
      type: string
      enum: [keepalived, nginx, docker, cron, postgresql_ha, mariadb_ha, generic, kubernetes]
    Environment:
      type: string
      enum: [lab, test, prod]
    NodeLifecycle:
      type: string
      enum: [provisioning, active, maintenance, draining, decommissioned]
    Status:
      type: string
      description: |
        Berekend uit heartbeats, metrics en VIP's (zie internal/status).
        unknown betekent: geen agent of nog geen gegevens.
      enum: [unknown, healthy, degraded, down, split_brain]
    Cluster:
      type: object
      required: [id, slug, name, description, type, environment, status, status_reason, status_since, tags, git_repo_url, git_managed, template_name, template_version, spec_revision, applied_revision, created_at, updated_at]
      properties:
        template_name: { type: string, nullable: true, description: De template waaruit het cluster is uitgerold }
        template_version: { type: string, nullable: true }
        spec_revision: { type: integer, description: Revisie van de gewenste staat; 0 zonder spec }
        applied_revision: { type: integer, description: "De revisie die op alle nodes staat; lager dan spec_revision na een mislukte toepassing" }
        id: { type: string, format: uuid }
        slug: { type: string, description: "Korte unieke naam, bijvoorbeeld webcluster-prod" }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/ClusterType" }
        environment: { $ref: "#/components/schemas/Environment" }
        status: { $ref: "#/components/schemas/Status" }
        status_reason: { type: string, description: Waarom de status niet healthy is }
        status_since: { type: string, format: date-time, nullable: true }
        tags: { type: array, items: { type: string } }
        git_repo_url: { type: string }
        git_managed: { type: boolean, description: "Komt uit Git; naam, omgeving, tags, nodes en VIP's wijzigen dan in cluster.yaml" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RiskSeverity:
      type: string
      enum: [low, medium, high, critical]
    RiskCardId:
      type: string
      enum: [availability, backups, recovery, redundancy, configuration, maintenance, capacity, kubernetes, database, platform]
    RiskSubject:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, description: "cluster, node, vip, failover_test, test_run, dependency, drift_ignore, git_change, user, proxmox, component (een SPOF), self, kube_app (een app in Kubernetes) of kube_node (een node in Kubernetes zonder ClusterForge-node)" }
        id: { type: string, format: uuid }
        name: { type: string }
    RiskAcceptance:
      type: object
      required: [id, reason, expires_at, by, at]
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        by: { type: string }
        at: { type: string, format: date-time }
    RiskFinding:
      type: object
      required: [check, card, severity, subject, text, link, points, gain, fleet_gain]
      properties:
        check: { type: string, description: Het id uit de catalogus, zoals redundancy.same_host }
        card: { $ref: "#/components/schemas/RiskCardId" }
        severity: { $ref: "#/components/schemas/RiskSeverity" }
        subject: { $ref: "#/components/schemas/RiskSubject" }
        text: { type: string }
        link: { type: string, description: Het scherm waar je het oplost }
        points: { type: integer, description: Wat de bevinding van haar kaart aftrekt; 0 als ze geaccepteerd is }
        gain: { type: number, description: Hoeveel de score van het cluster (of de kaart Platform) stijgt als ze opgelost is }
        fleet_gain: { type: number, description: Hoeveel de score van het geheel stijgt als ze opgelost is }
        accepted: { $ref: "#/components/schemas/RiskAcceptance" }
    RiskCard:
      type: object
      required: [id, weight, score, findings]
      properties:
        id: { $ref: "#/components/schemas/RiskCardId" }
        weight: { type: integer }
        score: { type: integer, nullable: true, description: Leeg als de kaart onbekend is; dan telt ze niet mee }
        note: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/RiskFinding" }
    RiskCap:
      type: object
      required: [max, reason]
      properties:
        max: { type: integer }
        reason: { type: string }
    ClusterApps:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items: { $ref: "#/components/schemas/ClusterApp" }
        storage: { $ref: "#/components/schemas/AppStorage" }
    AppIssue:
      type: object
      required: [tone, title]
      properties:
        tone: { type: string, enum: [red, amber] }
        title: { type: string }
        detail: { type: string }
    ClusterApp:
      type: object
      required: [app, title, nodes, issues]
      properties:
        app: { type: string }
        title: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/NodeAppStatus" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/AppIssue" }
    NodeAppStatus:
      type: object
      required: [node_id, hostname, online, stale, app, updated_at, checks, values]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        online: { type: boolean }
        stale: { type: boolean, description: Ouder dan 10 minuten of de agent antwoordt niet }
        app: { type: string }
        title: { type: string }
        version: { type: string, description: De gebouwde commit }
        ref: { type: string, description: De gekozen versie (branch, tag of commit) }
        role: { type: string, description: "actief, stand-by of voor-overstap" }
        updated_at: { type: string, format: date-time }
        checks:
          type: array
          items:
            type: object
            required: [id, label, ok]
            properties:
              id: { type: string }
              label: { type: string }
              ok: { type: boolean }
              severity: { type: string }
              detail: { type: string }
        values:
          type: array
          items:
            type: object
            required: [id, label, value]
            properties:
              id: { type: string }
              label: { type: string }
              value: { type: string }
              bytes: { type: integer, format: int64 }
    AppStorage:
      type: object
      required: [volume_count, under_replicated, logical_bytes, nodes, issues]
      properties:
        leader: { type: string }
        volume_count: { type: integer }
        under_replicated: { type: integer }
        under_replicated_ids:
          type: array
          items: { type: integer }
        logical_bytes: { type: integer, format: int64, description: Elk volume één keer geteld }
        replications:
          type: object
          additionalProperties: { type: integer }
        nodes:
          type: array
          items:
            type: object
            required: [hostname, bytes, disk_total, disk_free, volumes]
            properties:
              hostname: { type: string }
              bytes: { type: integer, format: int64 }
              disk_total: { type: integer, format: int64 }
              disk_free: { type: integer, format: int64 }
              volumes: { type: integer }
        issues:
          type: array
          items: { $ref: "#/components/schemas/AppIssue" }
    ClusterRisk:
      type: object
      required: [score, grade, cards, computed_at]
      properties:
        score: { type: integer, nullable: true }
        grade: { type: string, description: A tot F; leeg zonder score }
        cap: { $ref: "#/components/schemas/RiskCap" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/RiskCard" }
        computed_at: { type: string, format: date-time, nullable: true, description: Leeg als de score nog niet berekend is }
    RiskClusterRef:
      type: object
      required: [id, name, environment]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
    RiskPlacedFinding:
      allOf:
        - $ref: "#/components/schemas/RiskFinding"
        - type: object
          required: [cluster]
          properties:
            cluster:
              description: Leeg voor de kaart Platform
              nullable: true
              allOf: [{ $ref: "#/components/schemas/RiskClusterRef" }]
    RiskClusterScore:
      type: object
      required: [id, name, environment, score, grade]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
        score: { type: integer, nullable: true }
        grade: { type: string }
    RiskOverview:
      type: object
      required: [score, grade, computed_at, platform, clusters, findings]
      properties:
        score: { type: integer, nullable: true }
        grade: { type: string }
        computed_at: { type: string, format: date-time, nullable: true }
        platform:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RiskCard" }]
        clusters:
          type: array
          items: { $ref: "#/components/schemas/RiskClusterScore" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/RiskPlacedFinding" }
    RiskPoint:
      type: object
      required: [day, score, grade]
      properties:
        day: { type: string, format: date }
        score: { type: integer, nullable: true }
        grade: { type: string }
    RiskHistory:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items: { $ref: "#/components/schemas/RiskPoint" }
    RiskComponentKind:
      type: string
      enum: [host, storage, bridge, cluster, node, service]
    RiskComponent:
      type: object
      required: [key, kind, name, group]
      properties:
        key: { type: string, description: "Herkent het onderdeel, zoals host:<koppeling>:pve1" }
        kind: { $ref: "#/components/schemas/RiskComponentKind" }
        name: { type: string, description: "Zoals pve1, local-lvm op pve1 of ceph (gedeeld)" }
        group: { type: string, description: De Proxmox-koppeling, het cluster van een node, de groep van een dienst of de omgeving van een cluster }
    RiskComponentList:
      type: object
      required: [components]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/RiskComponent" }
    RiskWhatIfInput:
      type: object
      required: [components]
      properties:
        components:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }
    RiskGuestOutcome:
      type: object
      required: [key, connection, vmid, name, host, node_id, hostname, outcome, reason, restart_host, unknown]
      properties:
        key: { type: string, description: "De sleutel van de gast op de kaart, zoals guest:<koppeling>:101" }
        connection: { type: string }
        vmid: { type: integer }
        name: { type: string }
        host: { type: string }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string }
        outcome:
          type: string
          enum: [down, restarted, partial]
          description: down, restarted (HA start hem op restart_host) of partial (een netwerkkaart valt weg, de VM draait door)
        reason: { type: string }
        restart_host: { type: string }
        unknown: { type: boolean, description: Geen node in ClusterForge }
    RiskNodeOutcome:
      type: object
      required: [id, hostname, outcome]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        outcome:
          type: string
          enum: [down, restarted]
          description: restarted als HA zijn VM herstart
    RiskPrediction:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: "#/components/schemas/Status" }
        reason: { type: string }
    RiskClusterOutcome:
      type: object
      required: [id, name, environment, before, during, after_ha, nodes_down]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
        before: { $ref: "#/components/schemas/RiskPrediction" }
        during: { $ref: "#/components/schemas/RiskPrediction" }
        after_ha:
          description: Na de herstart door HA; leeg als HA in dit cluster niets herstart
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RiskPrediction" }]
        nodes_down: { type: array, items: { type: string } }
    RiskServiceOutcome:
      type: object
      required: [id, name, group, environment, impact, direct, reason, recovers]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        group: { type: string }
        environment: { type: string, description: lab, test, prod of leeg }
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        direct: { type: boolean }
        reason: { type: string }
        recovers: { type: boolean, description: Werkt weer zodra HA de VM's herstart heeft }
    RiskSelfOutcome:
      type: object
      required: [name, outcome, reason, restart_host]
      properties:
        name: { type: string }
        outcome: { type: string, enum: [down, restarted] }
        reason: { type: string }
        restart_host: { type: string }
    RiskWhatIf:
      type: object
      required: [components, guests, nodes, clusters, services, self, notes]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/RiskComponent" }
        guests:
          type: array
          items: { $ref: "#/components/schemas/RiskGuestOutcome" }
        nodes:
          type: array
          description: De nodes die uitvallen
          items: { $ref: "#/components/schemas/RiskNodeOutcome" }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/RiskClusterOutcome" }
        services:
          type: array
          items: { $ref: "#/components/schemas/RiskServiceOutcome" }
        self:
          description: Leeg als ClusterForge zelf blijft draaien of niet bekend is waar hij draait
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RiskSelfOutcome" }]
        notes: { type: array, items: { type: string } }
    RiskSPOFCluster:
      type: object
      required: [id, name, reason]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        reason: { type: string }
    RiskSPOFService:
      type: object
      required: [id, name, group, reason]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        group: { type: string }
        reason: { type: string }
    RiskSPOF:
      type: object
      required: [component, clusters, services, down, self]
      properties:
        component: { $ref: "#/components/schemas/RiskComponent" }
        clusters:
          type: array
          description: De prod-clusters die down gaan
          items: { $ref: "#/components/schemas/RiskSPOFCluster" }
        services:
          type: array
          description: De bevestigde prod-diensten die down gaan
          items: { $ref: "#/components/schemas/RiskSPOFService" }
        down: { type: integer, description: Hoeveel clusters en diensten in alle omgevingen down gaan }
        self: { type: boolean, description: ClusterForge zelf valt ook uit }
    RiskSPOFList:
      type: object
      required: [spofs]
      properties:
        spofs:
          type: array
          items: { $ref: "#/components/schemas/RiskSPOF" }
    SelfGuest:
      type: object
      required: [connection_id, connection, vmid, name, host, type]
      properties:
        connection_id: { type: string, format: uuid }
        connection: { type: string }
        vmid: { type: integer }
        name: { type: string }
        host: { type: string }
        type: { type: string, enum: [qemu, lxc] }
    SelfLocation:
      type: object
      required: [source, guest, matched_on, note, guests]
      properties:
        source: { type: string, enum: [auto, manual, none], description: "auto: gevonden aan een adres; manual: ingevuld; none: niet gevonden" }
        guest:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SelfGuest" }]
        vmid: { type: integer, nullable: true, description: Ook gevuld als de ingevulde VM niet meer in Proxmox staat }
        matched_on: { type: string }
        note: { type: string, description: Waarom hij niet gevonden is }
        guests:
          type: array
          description: De VM's en containers om uit te kiezen
          items: { $ref: "#/components/schemas/SelfGuest" }
    MapLayer:
      type: object
      required: [layer, items, edges, notes]
      properties:
        layer: { type: string, enum: [physical, network] }
        items:
          type: array
          items: { $ref: "#/components/schemas/MapItem" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/MapEdge" }
        notes:
          type: array
          items: { type: string }
    MapItem:
      type: object
      required: [id, kind, name, parent, status, detail, node_id, cluster_id, cluster, environment, self, link, facts]
      properties:
        id:
          type: string
          description: |
            Zoals host:<koppeling>:pve1, storage:<koppeling>:ceph,
            storage:<koppeling>:local-lvm@pve1, bridge:<koppeling>:pve1:vmbr0,
            guest:<koppeling>:101, node:<id>, subnet:10.0.20.0/24,
            gateway:10.0.20.1 of vip:<id>; dezelfde sleutels als de wat-als
        kind: { type: string, enum: [host, storage, guest, subnet, gateway, node, vip, bridge] }
        name: { type: string }
        parent: { type: string, description: De host waarin hij getekend wordt; leeg staat hij los }
        status: { $ref: "#/components/schemas/Status" }
        detail: { type: string, description: Eén regel onder de naam }
        node_id: { type: string, format: uuid, nullable: true }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster: { type: string }
        environment: { type: string }
        self: { type: boolean, description: De VM waarop ClusterForge zelf draait }
        link: { type: string, description: Het scherm van dit onderdeel }
        facts:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
    MapEdge:
      type: object
      required: [id, from, to, kind, label]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        kind:
          type: string
          enum: [disk, member, uplink, gateway, owner, vrrp]
          description: |
            disk: een gast naar de storage van zijn schijven; member: een
            subnet naar een node; uplink: een bridge naar een subnet; gateway;
            owner: een VIP naar zijn eigenaar; vrrp: keepalived-peers
        label: { type: string }
    HostNetworkList:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/HostNetwork" }
    HostNetwork:
      type: object
      required: [host, read_at, error, interfaces]
      properties:
        host: { type: string }
        read_at: { type: string, format: date-time }
        error: { type: string, description: De fout van de laatste keer lezen; de interfaces zijn dan van daarvoor }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/HostInterface" }
    HostInterface:
      type: object
      required: [iface, type, active, ports, vlan_id, vlan_raw_device, cidr, cidr6, gateway, gateway6, vlan_aware, mtu, comments]
      properties:
        iface: { type: string }
        type: { type: string, description: "bridge, bond, eth, vlan, alias, OVSBridge, OVSBond, OVSPort, OVSIntPort of unknown" }
        active: { type: boolean }
        ports: { type: array, items: { type: string } }
        vlan_id: { type: integer, nullable: true }
        vlan_raw_device: { type: string }
        cidr: { type: string }
        cidr6: { type: string }
        gateway: { type: string }
        gateway6: { type: string }
        vlan_aware: { type: boolean }
        mtu: { type: integer, nullable: true }
        comments: { type: string }
    NodeLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NodeLink" }
    NodeLink:
      type: object
      required: [id, connection_id, connection, vmid, guest, guest_type, host, node_id, hostname, cluster_id, cluster, mac, created_at]
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        connection: { type: string }
        vmid: { type: integer }
        guest: { type: string }
        guest_type: { type: string, enum: [qemu, lxc] }
        host: { type: string }
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster: { type: string }
        mac: { type: string }
        created_at: { type: string, format: date-time }
    SelfLocationInput:
      type: object
      required: [connection_id, vmid]
      properties:
        connection_id: { type: string, format: uuid }
        vmid: { type: integer, minimum: 100, maximum: 999999999 }
    RiskAcceptanceInput:
      type: object
      required: [check, subject_type, subject_id, reason]
      properties:
        check: { type: string }
        subject_type: { type: string }
        subject_id: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
        expires_at: { type: string, format: date-time, nullable: true, description: Leeg is zonder einddatum; hoogstens twee jaar }
    ClusterListItem:
      allOf:
        - $ref: "#/components/schemas/Cluster"
        - type: object
          required: [node_count, vip_count, vips, drift, impact, impacted_by, score, grade]
          properties:
            score: { type: integer, nullable: true, description: De health score; leeg zolang ze niet berekend is }
            grade: { type: string, description: Het cijfer van A tot F; leeg zonder score }
            node_count: { type: integer }
            vip_count: { type: integer }
            drift: { $ref: "#/components/schemas/ClusterDriftSummary" }
            impact:
              description: >-
                De ergste doorgegeven uitval op de bevestigde diensten van dit
                cluster, langs bekende afhankelijkheden van buiten; uitval
                binnen het cluster zegt de status al
              allOf: [{ $ref: "#/components/schemas/ServiceImpact" }]
            impacted_by: { type: array, items: { type: string }, description: "De clusters, nodes of extern waar die uitval begint, zoals db-prod" }
            vips:
              type: array
              description: De VIP's met hun huidige eigenaar
              items: { $ref: "#/components/schemas/VipOwner" }
    ClusterDetail:
      allOf:
        - $ref: "#/components/schemas/Cluster"
        - type: object
          required: [owners, nodes, vips]
          properties:
            owners: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
            nodes: { type: array, items: { $ref: "#/components/schemas/Node" } }
            vips: { type: array, items: { $ref: "#/components/schemas/Vip" } }
    ClusterInput:
      type: object
      required: [slug, name, type, environment]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/ClusterType" }
        environment: { $ref: "#/components/schemas/Environment" }
        git_repo_url: { type: string }
        tags: { type: array, items: { type: string } }
        owner_ids: { type: array, items: { type: string, format: uuid } }
    ClusterPatch:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/ClusterType" }
        environment: { $ref: "#/components/schemas/Environment" }
        git_repo_url: { type: string }
        tags: { type: array, items: { type: string } }
        owner_ids: { type: array, items: { type: string, format: uuid } }
    Node:
      type: object
      required: [id, cluster_id, cluster_slug, cluster_name, hostname, role, description, lifecycle, primary_ip, tags, created_at, updated_at, agent, status, status_reason, status_since, proxmox, drift_status]
      properties:
        id: { type: string, format: uuid }
        drift_status:
          type: string
          nullable: true
          description: De laatste driftcontrole, of null als de node nooit gecontroleerd is
          enum: [in_sync, drift, error, none]
        proxmox:
          description: De gekoppelde VM of container in Proxmox, of null
          nullable: true
          allOf: [{ $ref: "#/components/schemas/NodeProxmox" }]
        status: { $ref: "#/components/schemas/Status" }
        status_reason: { type: string, description: Waarom de status niet healthy is }
        status_since: { type: string, format: date-time, nullable: true }
        agent:
          description: De actieve agent, of null als er (nog) geen agent is
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AgentSummary" }]
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_slug: { type: string, nullable: true }
        cluster_name: { type: string, nullable: true }
        hostname: { type: string }
        role: { type: string }
        description: { type: string }
        lifecycle: { $ref: "#/components/schemas/NodeLifecycle" }
        primary_ip: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NodeInput:
      type: object
      required: [hostname]
      properties:
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        role: { type: string }
        description: { type: string }
        lifecycle: { $ref: "#/components/schemas/NodeLifecycle" }
        primary_ip: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        proxmox:
          description: Koppeling met een VM of container in Proxmox; null koppelt los
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ProxmoxLink" }]
    NodePatch:
      type: object
      properties:
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        role: { type: string }
        description: { type: string }
        lifecycle: { $ref: "#/components/schemas/NodeLifecycle" }
        primary_ip: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        proxmox:
          description: Koppeling met een VM of container in Proxmox; null koppelt los
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ProxmoxLink" }]
    Vip:
      type: object
      required: [id, cluster_id, address, interface, vrid, description, owner_node_id, owner_hostname, owner_since]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        address: { type: string }
        interface: { type: string }
        vrid: { type: integer, nullable: true }
        description: { type: string }
        owner_node_id: { type: string, format: uuid, nullable: true }
        owner_hostname: { type: string, nullable: true }
        owner_since: { type: string, format: date-time, nullable: true }
    VipOwner:
      type: object
      required: [address, owner_hostname]
      properties:
        address: { type: string }
        owner_hostname: { type: string, nullable: true }
    VipInput:
      type: object
      required: [address]
      properties:
        address: { type: string }
        interface: { type: string }
        vrid: { type: integer, nullable: true }
        description: { type: string }
    VipPatch:
      type: object
      properties:
        address: { type: string }
        interface: { type: string }
        vrid: { type: integer, nullable: true }
        description: { type: string }
    AgentConnection:
      type: string
      description: online bij een heartbeat in de laatste 30 s, late tot 90 s, daarna offline
      enum: [online, late, offline]
    AgentSummary:
      type: object
      required: [id, version, enrolled_at, last_seen_at, connection, commands]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        commands: { type: boolean, description: "De agent kan commando's uitvoeren (herstarten, onderhoud); oudere agents niet" }
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
        connection: { $ref: "#/components/schemas/AgentConnection" }
    NodeChanges:
      type: object
      required: [changes, has_more, agents_too_old]
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/NodeChange" } }
        has_more: { type: boolean, description: Er zijn meer regels in de periode dan limit }
        agents_too_old:
          type: array
          description: Nodes waarvan de agent nog geen journaal stuurt; van hen komen alleen regels van de server en Proxmox
          items: { $ref: "#/components/schemas/ChangesNode" }
    ChangesNode:
      type: object
      required: [node_id, hostname]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
    NodeChange:
      type: object
      required: [id, node_id, hostname, ts, observed_at, source, kind, subject, action, summary, detail, job_id]
      properties:
        id: { type: integer, format: int64 }
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        ts: { type: string, format: date-time, description: Tijd op de node, gecorrigeerd voor de klokafwijking }
        observed_at: { type: string, format: date-time }
        source: { type: string, enum: [agent, server, proxmox, clusterforge] }
        kind:
          type: string
          description: package, service, file, boot, login, oom, network, facts, vm, agent, user of command
        subject: { type: string }
        action: { type: string }
        summary: { type: string }
        detail: { type: object, additionalProperties: { type: string } }
        job_id: { type: string, format: uuid, nullable: true }
    NodeRuntime:
      type: object
      required: [facts, collected_at, changed_at, heartbeat]
      properties:
        facts:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Facts" }]
        collected_at: { type: string, format: date-time, nullable: true }
        changed_at: { type: string, format: date-time, nullable: true }
        heartbeat:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/HeartbeatStatus" }]
    HeartbeatStatus:
      type: object
      required: [received_at, uptime_seconds, load, addresses, services]
      properties:
        received_at: { type: string, format: date-time }
        uptime_seconds: { type: integer, format: int64 }
        load: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        addresses: { type: array, items: { type: string } }
        services: { type: object, additionalProperties: { type: string } }
    Facts:
      type: object
      description: Zoals de agent ze verzamelt; zie pkg/protocol
      required: [hostname, machine_id, os, kernel, arch, virtualization, cpus, memory_bytes, swap_bytes, boot_time, primary_address, interfaces, filesystems, services, docker, keepalived, upgrades]
      properties:
        hostname: { type: string }
        machine_id: { type: string }
        os:
          type: object
          required: [id, version_id, codename, pretty_name]
          properties:
            id: { type: string }
            version_id: { type: string }
            codename: { type: string }
            pretty_name: { type: string }
        kernel: { type: string }
        arch: { type: string }
        virtualization: { type: string }
        cpus: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        swap_bytes: { type: integer, format: int64 }
        boot_time: { type: string, format: date-time }
        primary_address: { type: string }
        interfaces:
          type: array
          nullable: true
          items:
            type: object
            required: [name, mac, up, addresses]
            properties:
              name: { type: string }
              mac: { type: string }
              up: { type: boolean }
              addresses: { type: array, nullable: true, items: { type: string } }
              kind: { type: string, description: "Vanaf protocol 5: physical, vlan, bridge, bond, veth, wireguard, tun, dummy of other" }
              parent: { type: string }
              master: { type: string }
              vlan_id: { type: integer }
              mtu: { type: integer }
        filesystems:
          type: array
          nullable: true
          items:
            type: object
            required: [mount, device, type, size_bytes, used_bytes]
            properties:
              mount: { type: string }
              device: { type: string }
              type: { type: string }
              size_bytes: { type: integer, format: int64 }
              used_bytes: { type: integer, format: int64 }
        services:
          type: array
          nullable: true
          items:
            type: object
            required: [name, active, enabled]
            properties:
              name: { type: string }
              active: { type: string }
              enabled: { type: string }
        docker:
          type: object
          nullable: true
          required: [version, containers]
          properties:
            version: { type: string }
            containers: { type: integer }
        keepalived:
          type: object
          nullable: true
          required: [active, vips]
          properties:
            active: { type: string }
            vips: { type: array, nullable: true, items: { type: string } }
            instances:
              type: array
              description: Vanaf protocol 5
              items:
                type: object
                required: [name, interface, vrid, vips]
                properties:
                  name: { type: string }
                  interface: { type: string }
                  vrid: { type: integer }
                  state: { type: string }
                  priority: { type: integer }
                  peers: { type: array, items: { type: string } }
                  vips: { type: array, nullable: true, items: { type: string } }
        upgrades:
          type: object
          nullable: true
          required: [total, security, packages]
          properties:
            total: { type: integer }
            security: { type: integer }
            packages: { type: array, nullable: true, items: { type: string } }
        routes:
          type: array
          description: Vanaf protocol 5
          items:
            type: object
            required: [dest, interface]
            properties:
              dest: { type: string }
              gateway: { type: string }
              interface: { type: string }
              metric: { type: integer }
        default_gateway: { type: string }
        dns: { type: array, items: { type: string } }
        listeners:
          type: array
          items:
            type: object
            required: [proto, addr, port]
            properties:
              proto: { type: string }
              addr: { type: string }
              port: { type: integer }
              unit: { type: string }
        reboot_required: { type: boolean }
        kernel_installed: { type: string }
        apt_updated_at: { type: string, format: date-time }
        certificates:
          type: array
          items:
            type: object
            required: [path, subject, issuer, not_after]
            properties:
              path: { type: string }
              subject: { type: string }
              dns_names: { type: array, items: { type: string } }
              issuer: { type: string }
              not_after: { type: string, format: date-time }
        seaweed:
          $ref: '#/components/schemas/SeaweedFacts'
    SeaweedFacts:
      type: object
      description: SeaweedFS op de node (vanaf protocol 26); zie pkg/protocol/seaweed.go. Geheimen staan er nooit in.
      required: [processes]
      properties:
        version: { type: string }
        processes:
          type: array
          items:
            type: object
            required: [role, pid, args]
            properties:
              role: { type: string, description: "master, volume, filer, s3, server, mount, …" }
              pid: { type: integer }
              unit: { type: string }
              container: { type: string }
              args: { type: array, items: { type: string } }
              ip: { type: string }
              ports: { type: object, additionalProperties: { type: integer } }
              dirs: { type: array, items: { type: string } }
              meta_dir: { type: string }
              peers: { type: array, items: { type: string } }
              masters: { type: array, items: { type: string } }
              default_replication: { type: string }
              data_center: { type: string }
              rack: { type: string }
              disks:
                type: array
                items:
                  type: object
                  required: [dir, total, free]
                  properties:
                    dir: { type: string }
                    total: { type: integer, format: int64 }
                    free: { type: integer, format: int64 }
        configs:
          type: array
          items:
            type: object
            required: [path, kind]
            properties:
              path: { type: string }
              container: { type: string }
              kind: { type: string }
              enabled: { type: array, items: { type: string } }
              jwt: { type: boolean }
        master:
          type: object
          required: [is_leader, max_volumes, free_volumes]
          properties:
            leader: { type: string }
            is_leader: { type: boolean }
            peers: { type: array, items: { type: string } }
            max_volumes: { type: integer }
            free_volumes: { type: integer }
            data_nodes:
              type: array
              items:
                type: object
                required: [url, volumes, max]
                properties:
                  url: { type: string }
                  data_center: { type: string }
                  rack: { type: string }
                  volumes: { type: integer }
                  max: { type: integer }
            layouts:
              type: array
              items:
                type: object
                required: [replication, writable]
                properties:
                  collection: { type: string }
                  replication: { type: string }
                  writable: { type: integer }
        volume:
          type: object
          required: [volumes, bytes, files]
          properties:
            volumes: { type: integer }
            read_only: { type: integer }
            bytes: { type: integer, format: int64 }
            files: { type: integer, format: int64 }
            replications: { type: object, additionalProperties: { type: integer } }
            collections: { type: array, items: { type: string } }
    EnrollmentToken:
      type: object
      required: [id, description, node_id, node_hostname, cluster_id, cluster_name, max_uses, uses, expires_at, created_at, created_by]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        node_id: { type: string, format: uuid, nullable: true }
        node_hostname: { type: string, nullable: true }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string, nullable: true }
        max_uses: { type: integer }
        uses: { type: integer }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { type: string, nullable: true, description: Gebruikersnaam }
    EnrollmentTokenInput:
      type: object
      properties:
        description: { type: string }
        node_id: { type: string, format: uuid, nullable: true, description: Alleen deze bestaande node mag zich ermee aanmelden }
        cluster_id: { type: string, format: uuid, nullable: true, description: Nieuwe nodes komen in dit cluster }
        max_uses: { type: integer, minimum: 1, maximum: 100, description: Standaard 1 }
        ttl_hours: { type: integer, minimum: 1, maximum: 720, description: Standaard 24 }
    NewEnrollmentToken:
      allOf:
        - { $ref: "#/components/schemas/EnrollmentToken" }
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Alleen nu zichtbaar }
    EnrollRequest:
      type: object
      required: [token, nkey_public, hostname, machine_id, agent_version, protocol_version]
      properties:
        token: { type: string }
        nkey_public: { type: string }
        hostname: { type: string }
        machine_id: { type: string }
        agent_version: { type: string }
        protocol_version: { type: integer }
    ClaimRequest:
      type: object
      required: [nkey_public, hostname, machine_id, agent_version, protocol_version]
      properties:
        nkey_public: { type: string }
        hostname: { type: string }
        machine_id: { type: string }
        agent_version: { type: string }
        protocol_version: { type: integer }
    EnrollResponse:
      type: object
      required: [agent_id, node_id, nats_url, nats_cert_sha256]
      properties:
        agent_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        nats_url: { type: string, description: Bijvoorbeeld tls://clusterforge.lan:4222 }
        nats_cert_sha256: { type: string, description: Hex-sha256 van het NATS-certificaat; de agent pint het }
    MetricsRange:
      type: string
      enum: ["1h", "6h", "24h", "7d"]
      default: "1h"
    Metrics:
      type: object
      required: [range, start, end, step_seconds, timestamps, panels]
      properties:
        range: { $ref: "#/components/schemas/MetricsRange" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        step_seconds: { type: integer }
        timestamps:
          type: array
          description: Unix-tijden in seconden; de waarden van elke lijn horen hierbij
          items: { type: integer, format: int64 }
        panels:
          type: array
          items: { $ref: "#/components/schemas/MetricPanel" }
    MetricPanel:
      type: object
      required: [id, title, unit, series]
      properties:
        id: { type: string }
        title: { type: string }
        unit: { type: string, enum: [percent, load, bytes_per_second, celsius, millicores, bytes, count, per_second, seconds] }
        series:
          type: array
          items: { $ref: "#/components/schemas/MetricSeries" }
    MetricSeries:
      type: object
      required: [label, values]
      properties:
        label: { type: string }
        values:
          type: array
          description: Eén waarde per tijdstip in timestamps; null als er geen meting is
          items: { type: number, format: double, nullable: true }
    ServerInfo:
      type: object
      required: [version, metrics_enabled, grafana_node_url, grafana_cluster_url]
      properties:
        version: { type: string }
        metrics_enabled: { type: boolean, description: Of er een VictoriaMetrics is ingesteld }
        grafana_node_url:
          type: string
          description: Link naar Grafana voor een node, met {hostname}, {node_id}, {cluster}, {cluster_id} en {env}; leeg als niet ingesteld
        grafana_cluster_url:
          type: string
          description: Link naar Grafana voor een cluster, met {cluster}, {cluster_id} en {env}; leeg als niet ingesteld
    ProxmoxConnection:
      type: object
      required: [id, name, api_url, token_id, tls_fingerprint, pve_version, last_sync_at, last_error, counts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        api_url: { type: string, description: "Bijvoorbeeld https://pve1.lan:8006" }
        token_id: { type: string, description: "Bijvoorbeeld clusterforge@pve!cf" }
        tls_fingerprint: { type: string, description: SHA-256 van het certificaat zoals Proxmox hem toont; leeg betekent gewone CA-controle }
        pve_version: { type: string }
        last_sync_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: Fout van de laatste sync; leeg als die lukte }
        counts: { $ref: "#/components/schemas/ProxmoxCounts" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProxmoxCounts:
      type: object
      required: [hosts, vms, containers]
      properties:
        hosts: { type: integer }
        vms: { type: integer }
        containers: { type: integer }
    ProxmoxInput:
      type: object
      required: [name, api_url, token_id, token_secret]
      properties:
        name: { type: string }
        api_url: { type: string }
        token_id: { type: string }
        token_secret: { type: string, writeOnly: true }
        tls_fingerprint: { type: string }
    ProxmoxPatch:
      type: object
      properties:
        name: { type: string }
        api_url: { type: string }
        token_id: { type: string }
        token_secret: { type: string, writeOnly: true }
        tls_fingerprint: { type: string }
    ProxmoxProbe:
      type: object
      required: [api_url, fingerprint, subject, issuer, not_after, trusted]
      properties:
        api_url: { type: string, description: Het adres zoals de server het gebruikt }
        fingerprint: { type: string }
        subject: { type: string }
        issuer: { type: string }
        not_after: { type: string, format: date-time }
        trusted: { type: boolean, description: Of het certificaat ook zonder vingerafdruk geldig is }
    ProxmoxResources:
      type: object
      required: [hosts, guests, storages]
      properties:
        hosts: { type: array, items: { $ref: "#/components/schemas/ProxmoxHost" } }
        guests: { type: array, items: { $ref: "#/components/schemas/ProxmoxGuest" } }
        storages: { type: array, items: { $ref: "#/components/schemas/ProxmoxStorage" } }
    ProxmoxHost:
      type: object
      required: [name, status, cpu, maxcpu, mem, maxmem, disk, maxdisk, uptime]
      properties:
        name: { type: string }
        status: { type: string, description: online of offline }
        cpu: { type: number, format: double, description: Bezetting van 0 tot 1 }
        maxcpu: { type: number, format: double }
        mem: { type: integer, format: int64 }
        maxmem: { type: integer, format: int64 }
        disk: { type: integer, format: int64 }
        maxdisk: { type: integer, format: int64 }
        uptime: { type: integer, format: int64 }
    GuestType:
      type: string
      enum: [qemu, lxc]
    ProxmoxGuest:
      type: object
      required: [vmid, type, name, host, status, template, cpu, maxcpu, mem, maxmem, disk, maxdisk, uptime, tags, lock, node_id, node_hostname,
        sandbox]
      properties:
        vmid: { type: integer }
        type: { $ref: "#/components/schemas/GuestType" }
        name: { type: string }
        host: { type: string, description: De Proxmox-host waar de VM nu staat }
        status: { type: string, description: "running, stopped of paused" }
        template: { type: boolean }
        cpu: { type: number, format: double }
        maxcpu: { type: number, format: double }
        mem: { type: integer, format: int64 }
        maxmem: { type: integer, format: int64 }
        disk: { type: integer, format: int64 }
        maxdisk: { type: integer, format: int64 }
        uptime: { type: integer, format: int64 }
        tags: { type: array, items: { type: string } }
        lock: { type: string, description: "Lopende bewerking in Proxmox, zoals migrate of backup" }
        node_id: { type: string, format: uuid, nullable: true, description: De gekoppelde node in ClusterForge }
        node_hostname: { type: string, nullable: true }
        sandbox:
          type: boolean
          description: Een tijdelijke sandbox van een back-upcontrole; daarop kan geen VM-actie
    ProxmoxStorage:
      type: object
      required: [name, host, shared, type, content, disk, maxdisk, status]
      properties:
        name: { type: string }
        host: { type: string }
        shared: { type: boolean }
        type: { type: string }
        content: { type: string }
        disk: { type: integer, format: int64 }
        maxdisk: { type: integer, format: int64 }
        status: { type: string, description: "available, of iets anders als Proxmox de storage niet bereikt" }
    ProxmoxSnapshot:
      type: object
      required: [name, description, parent, time, vmstate]
      properties:
        name: { type: string }
        description: { type: string }
        parent: { type: string }
        time: { type: string, format: date-time, nullable: true }
        vmstate: { type: boolean }
    ProxmoxLink:
      type: object
      required: [connection_id, vmid]
      properties:
        connection_id: { type: string, format: uuid }
        vmid: { type: integer }
    NodeProxmox:
      type: object
      required: [connection_id, connection_name, vmid, found, type, host, name, status, uptime]
      properties:
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        vmid: { type: integer }
        found: { type: boolean, description: false als de VM niet in de laatste sync zat }
        type: { type: string }
        host: { type: string }
        name: { type: string }
        status: { type: string }
        uptime: { type: integer, format: int64 }
    VmAction:
      type: string
      enum: [start, stop, shutdown, reboot, snapshot, migrate]
    VmActionInput:
      type: object
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/VmAction" }
        snapshot_name: { type: string, description: Leeg geeft cf-<datum>-<tijd> }
        description: { type: string }
        vmstate: { type: boolean, description: Ook het geheugen in de snapshot (alleen VM's die draaien) }
        target: { type: string, description: Doelhost bij migreren }
    NodeAction:
      type: string
      enum: [refresh_facts, reboot, shutdown, maintenance, activate]
      description: activate beëindigt het onderhoud
    NodeActionInput:
      type: object
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/NodeAction" }
        reason: { type: string, description: Komt in de activiteitenlog en in het systeemlog van de node }
        drain: { type: boolean, description: Bij herstarten of afsluiten eerst de VIP's weghalen (standaard ja) }
        force: { type: boolean, description: Doorgaan ook als geen andere node een VIP kan overnemen }
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    AgentUpgradeOverview:
      type: object
      required: [version, protocol, archs, auto, prod_auto, prod_halted, halted_by, prod_queue, off_cluster_ids, agents, running]
      properties:
        version: { type: string, description: De versie van de agent die deze server aanbiedt }
        protocol: { type: integer }
        archs: { type: array, items: { type: string }, description: "Architecturen waarvoor de server een agent heeft" }
        auto: { type: boolean, description: Agents vanzelf bijwerken staat aan }
        prod_auto: { type: boolean, description: Ook agents op prod vanzelf bijwerken, één prodcluster tegelijk }
        prod_halted: { type: boolean, description: Een update op prod mislukte; vanzelf bijwerken op prod staat stil }
        halted_by: { type: string, description: De node waar de update op prod mislukte }
        prod_queue:
          type: array
          description: Prodclusters van een klik "ook productie" die nog aan de beurt komen, in volgorde
          items:
            type: object
            required: [cluster_id, cluster_name, job_id]
            properties:
              cluster_id: { type: string, format: uuid }
              cluster_name: { type: string }
              job_id: { type: string, format: uuid, nullable: true }
        off_cluster_ids: { type: array, items: { type: string, format: uuid }, description: Clusters waar vanzelf bijwerken uitstaat }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentUpgradeAgent" } }
        running:
          type: array
          description: Taken agents.upgrade die wachten of lopen
          items:
            type: object
            required: [cluster_id, job_id]
            properties:
              cluster_id: { type: string, format: uuid, nullable: true }
              job_id: { type: string, format: uuid }
    AgentUpgradeAgent:
      type: object
      required: [node_id, hostname, cluster_id, cluster_name, cluster_slug, cluster_environment, version, protocol, arch, online, state, why, auto]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        cluster_slug: { type: string }
        cluster_environment: { type: string, description: "lab, test, prod, of leeg zonder cluster" }
        version: { type: string }
        protocol: { type: integer }
        arch: { type: string }
        online: { type: boolean }
        state:
          type: string
          enum: [current, outdated, failed, manual, newer, unknown]
          description: |
            current: dezelfde agent als die van de server. outdated: verouderd, werkt zichzelf bij. failed: de update werd
            op de node teruggezet. manual: verouderd en ouder dan protocol 23, met de hand bijwerken. newer: nieuwer dan de
            server. unknown: de server heeft geen agent voor deze node of de agent meldde zijn binary nog niet.
        why: { type: string }
        auto: { type: boolean, description: ClusterForge werkt deze agent vanzelf bij }
    UpdateOverview:
      type: object
      required: [nodes, run_protocol, smart_protocol]
      properties:
        run_protocol: { type: integer, description: Het agentprotocol vanaf waar updates kunnen }
        smart_protocol: { type: integer, description: Het agentprotocol vanaf waar de updates van fase 15 kunnen }
        nodes: { type: array, items: { $ref: "#/components/schemas/UpdateNode" } }
    UpdateNode:
      type: object
      required: [node_id, hostname, cluster_id, cluster_name, cluster_slug, cluster_environment, online, protocol, supported,
        upgrades_total, upgrades_security, packages, reboot_required, apt_updated_at, docker_version, compose_projects,
        has_database, vip_holder, facts_at, smart, docker_reports]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        cluster_slug: { type: string }
        cluster_environment: { type: string }
        online: { type: boolean }
        protocol: { type: integer }
        supported: { type: boolean }
        smart: { type: boolean, description: De agent kent de updates van fase 15 (protocol 29) }
        upgrades_total: { type: integer, nullable: true, description: Null als de agent het niet kon tellen }
        upgrades_security: { type: integer }
        packages: { type: array, items: { type: string } }
        reboot_required: { type: boolean }
        apt_updated_at: { type: string, format: date-time, nullable: true }
        docker_version: { type: string, description: Leeg zonder Docker }
        compose_projects:
          type: array
          items:
            type: object
            required: [name, status, config_files, working_dir, env_files, missing, services]
            properties:
              name: { type: string }
              status: { type: string }
              config_files: { type: array, items: { type: string } }
              working_dir: { type: string }
              env_files: { type: array, items: { type: string } }
              missing: { type: array, items: { type: string }, description: Compose-bestanden die niet meer bestaan }
              services:
                type: array
                items:
                  type: object
                  required: [service, container, image, state, health, restarts, mounts]
                  properties:
                    service: { type: string }
                    container: { type: string }
                    image: { type: string }
                    state: { type: string }
                    health: { type: string }
                    restarts: { type: integer }
                    mounts: { type: array, items: { type: string } }
        docker_reports:
          type: array
          description: Het rapport van de laatste Docker-update per project
          items: { $ref: "#/components/schemas/DockerReport" }
        has_database: { type: boolean, description: Het cluster heeft een database; die pakketten blijven staan }
        vip_holder: { type: boolean }
        facts_at: { type: string, format: date-time, nullable: true }
    UpdateInput:
      type: object
      properties:
        node_ids: { type: array, items: { type: string, format: uuid } }
        cluster_id: { type: string, format: uuid }
        apt:
          type: object
          properties:
            full: { type: boolean, description: full-upgrade in plaats van upgrade }
            autoremove: { type: boolean }
        docker:
          type: object
          properties:
            projects: { type: array, items: { type: string }, description: Leeg is elk Compose-project }
            prune: { type: boolean }
            always: { type: boolean, description: Ook zonder nieuw image down en up -d }
            health_seconds: { type: integer, description: Hoe lang de test mag duren; 0 is 120 s }
            rollback: { type: boolean, description: Bij een mislukte test de vorige versie terugzetten (standaard aan) }
            tags:
              type: array
              items:
                type: object
                required: [project, from, to]
                properties:
                  project: { type: string }
                  from: { type: string }
                  to: { type: string }
        reboot: { type: boolean, description: Herstarten als de node daar na de update om vraagt }
        failover: { type: boolean, description: De VIP-houder eerst failoveren naar een bijgewerkte node (standaard aan) }
        confirm: { type: string, description: De slug van het prodcluster, ter bevestiging }
    DockerReport:
      type: object
      required: [node_id, project, result, problem, created_at, job_id, conversation_id, services, logs, edited]
      properties:
        node_id: { type: string, format: uuid }
        project: { type: string }
        result: { type: string, enum: [up_to_date, updated, failed, rolled_back] }
        problem: { type: string }
        created_at: { type: string, format: date-time }
        job_id: { type: string, format: uuid, nullable: true }
        conversation_id: { type: string, format: uuid, nullable: true, description: Het gesprek met het voorstel voor een fix }
        logs: { type: string }
        edited: { type: array, items: { type: string } }
        services:
          type: array
          items:
            type: object
            required: [service, image, old_version, new_version, source, env_added, env_removed, state, health, changed]
            properties:
              service: { type: string }
              image: { type: string }
              changed: { type: boolean }
              old_version: { type: string }
              new_version: { type: string }
              source: { type: string }
              env_added: { type: array, items: { type: string } }
              env_removed: { type: array, items: { type: string } }
              state: { type: string }
              health: { type: string }
    UpdatePolicy:
      type: object
      required: [enabled, apt, apt_full, apt_autoremove, docker, docker_prune, reboot, window]
      properties:
        enabled: { type: boolean }
        apt: { type: boolean }
        apt_full: { type: boolean }
        apt_autoremove: { type: boolean }
        docker: { type: boolean }
        docker_prune: { type: boolean }
        reboot: { type: boolean }
        window: { type: string, description: Zoals "zo 03:00-05:00" of "dagelijks 02:00-04:00", in de tijdzone van de server }
    UpdatePolicyInput:
      allOf:
        - { $ref: "#/components/schemas/UpdatePolicy" }
        - type: object
          properties:
            confirm: { type: string, description: Bij prod "prod" of de slug van het cluster }
    ClusterUpdatePolicyInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [inherit, own, off] }
        policy: { $ref: "#/components/schemas/UpdatePolicy" }
        confirm: { type: string }
    UpdatePolicies:
      type: object
      required: [timezone, environments, clusters]
      properties:
        timezone: { type: string }
        environments:
          type: array
          items:
            type: object
            required: [environment, policy, updated_at, updated_by]
            properties:
              environment: { type: string }
              policy: { $ref: "#/components/schemas/UpdatePolicy" }
              updated_at: { type: string, format: date-time, nullable: true }
              updated_by: { type: string, nullable: true }
        clusters:
          type: array
          items:
            type: object
            required: [cluster_id, name, slug, environment, mode, own, effective, next_start, last_run_at, last_job_id, last_note]
            properties:
              cluster_id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              environment: { type: string }
              mode: { type: string, enum: [inherit, own, off] }
              own: { allOf: [{ $ref: "#/components/schemas/UpdatePolicy" }], nullable: true }
              effective: { $ref: "#/components/schemas/UpdatePolicy" }
              next_start: { type: string, format: date-time, nullable: true }
              last_run_at: { type: string, format: date-time, nullable: true }
              last_job_id: { type: string, format: uuid, nullable: true }
              last_note: { type: string }
    ComposeRef:
      type: object
      required: [node_id, project]
      properties:
        node_id: { type: string, format: uuid }
        project: { type: string }
    ComposeFiles:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            required: [path, content, sha256, env, secrets]
            properties:
              path: { type: string }
              content: { type: string }
              sha256: { type: string }
              env: { type: boolean }
              secrets: { type: integer, description: Aantal plaatshouders «geheim-N» }
    ComposeWriteInput:
      type: object
      required: [node_id, project, path, content, old_sha256]
      properties:
        node_id: { type: string, format: uuid }
        project: { type: string }
        path: { type: string }
        content: { type: string }
        old_sha256: { type: string }
        health_seconds: { type: integer }
        confirm: { type: string }
    Command:
      type: object
      required: [id, name, description, run_as, timeout_seconds, revision, updated_at, updated_by, last_run]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        run_as: { type: string }
        timeout_seconds: { type: integer }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, nullable: true }
        last_run: { allOf: [{ $ref: "#/components/schemas/Job" }], nullable: true }
    CommandDetail:
      allOf:
        - { $ref: "#/components/schemas/Command" }
        - type: object
          required: [script, revisions, runs]
          properties:
            script: { type: string }
            revisions:
              type: array
              items:
                type: object
                required: [revision, script, sha256, created_at, created_by]
                properties:
                  revision: { type: integer }
                  script: { type: string }
                  sha256: { type: string }
                  created_at: { type: string, format: date-time }
                  created_by: { type: string, nullable: true }
            runs: { type: array, items: { $ref: "#/components/schemas/Job" } }
    CommandInput:
      type: object
      required: [name, script]
      properties:
        name: { type: string }
        description: { type: string }
        script: { type: string }
        run_as: { type: string, description: Leeg is root }
        timeout_seconds: { type: integer, description: Nul is 30 minuten }
    CommandRunInput:
      type: object
      properties:
        node_ids: { type: array, items: { type: string, format: uuid } }
        cluster_id: { type: string, format: uuid }
        continue_on_error: { type: boolean, description: Ook op de volgende nodes draaien als het op een node mislukt }
        confirm: { type: string, description: De slug van het prodcluster, ter bevestiging }
    AgentUpgradeInput:
      type: object
      properties:
        node_ids: { type: array, items: { type: string, format: uuid } }
        cluster_id: { type: string, format: uuid }
        all: { type: boolean }
        include_prod: { type: boolean, description: "Met all: ook de agents op prod, één prodcluster na het andere" }
        totp_code: { type: string, description: "Wordt genegeerd: agents op prod bijwerken vraagt geen code meer" }
        confirm: { type: string, description: "Wordt genegeerd: agents op prod bijwerken vraagt geen bevestiging meer" }
    AgentEndpointsOverview:
      type: object
      required: [server_url, server_source, nats_url, nats_source, server_setting, nats_setting, server_default, nats_default, protocol, agents, running]
      properties:
        server_url: { type: string, description: Het adres in het installcommando; leeg is het adres van de webinterface }
        server_source: { type: string, enum: [setting, advertise, request] }
        nats_url: { type: string }
        nats_source: { type: string, enum: [setting, advertise, request] }
        server_setting: { type: string }
        nats_setting: { type: string }
        server_default: { type: string, description: Het adres zonder instelling (uit CF_NATS_ADVERTISE); leeg als er geen is }
        nats_default: { type: string }
        protocol: { type: integer, description: Het agentprotocol vanaf waar agents zich laten omzetten }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentEndpointAgent" } }
        running:
          type: array
          items:
            type: object
            required: [cluster_id, job_id]
            properties:
              cluster_id: { type: string, format: uuid, nullable: true }
              job_id: { type: string, format: uuid }
    AgentEndpointAgent:
      type: object
      required: [node_id, hostname, cluster_id, cluster_name, cluster_slug, cluster_environment, protocol, server_url, nats_url, online, state, why]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        cluster_slug: { type: string }
        cluster_environment: { type: string }
        protocol: { type: integer }
        server_url: { type: string }
        nats_url: { type: string }
        online: { type: boolean }
        state:
          type: string
          enum: [current, differs, failed, manual, unknown]
          description: |
            current: wijst naar het adres voor agents. differs: wijst naar een ander adres. failed: de vorige omzetting
            werd op de node teruggezet. manual: ouder dan protocol 47, eerst bijwerken. unknown: meldde zijn adressen nog niet.
        why: { type: string }
    AgentUpgradeStarted:
      type: object
      required: [jobs, skipped, queued_prod]
      properties:
        jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
        skipped: { type: array, items: { type: string } }
        queued_prod: { type: array, items: { type: string }, description: "Prodclusters in de rij, één voor één" }
    Job:
      type: object
      required: [id, kind, title, status, error, cluster_id, node_id, proxmox_id, requested_by, attempts, cancel_requested, retryable, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        retryable: { type: boolean, description: De taak is mislukt en kan opnieuw vanaf de mislukte stap }
        kind: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        error: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        proxmox_id: { type: string, format: uuid, nullable: true }
        requested_by: { type: string, nullable: true, description: Gebruikersnaam van wie de taak vroeg }
        attempts: { type: integer }
        cancel_requested: { type: boolean }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    JobDetail:
      allOf:
        - { $ref: "#/components/schemas/Job" }
        - type: object
          required: [steps]
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/JobStep" } }
    JobStep:
      type: object
      required: [seq, name, status, started_at, finished_at, log, error]
      properties:
        seq: { type: integer }
        name: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        log: { type: array, items: { type: string } }
        error: { type: string }
    TemplateParamType:
      type: string
      enum: [string, int, bool, ipv4, cidr, size, secret]
    TemplateParam:
      type: object
      required: [name, type, label, help, optional, immutable, default, min, max, choices]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/TemplateParamType" }
        label: { type: string }
        help: { type: string }
        optional: { type: boolean, description: Mag leeg blijven; een secret wordt dan gegenereerd }
        immutable: { type: boolean, description: Ligt vast na de uitrol }
        default: { type: string, nullable: true }
        min: { type: string, nullable: true }
        max: { type: string, nullable: true }
        choices:
          type: array
          items: { type: integer }
          description: De toegestane waarden van een int; leeg is alles tussen min en max
    TemplateRole:
      type: object
      required: [name, count, count_param]
      properties:
        name: { type: string }
        count: { type: integer, nullable: true, description: "Vast aantal nodes, of null als een parameter het bepaalt" }
        count_param: { type: string, nullable: true, description: De parameter met het aantal nodes }
    ServiceKind:
      type: string
      description: De soort van een dienst; een vaste lijst in internal/deps
      enum: [web, lb, vip, database, cache, queue, storage, dns, cron, container, app, external, other]
    ServiceSource:
      type: string
      enum: [template, manual, discovered]
    ServiceState:
      type: string
      enum: [confirmed, suggested, ignored]
    ServiceStatus:
      type: string
      description: De eigen status uit de heartbeats; unknown zonder unit, zonder instanties of extern
      enum: [unknown, healthy, degraded, down]
    ServiceImpact:
      type: string
      description: Wat een afhankelijkheid doet; none zonder uitval
      enum: [none, degraded, down]
    DependencyStrength:
      type: string
      enum: [hard, soft]
    DepGroup:
      type: object
      required: [id, kind, name, cluster_id, node_id, environment, status, status_reason, impact, impacted_by, suggestions]
      properties:
        id: { type: string, description: "cluster:<id>, node:<id> of external" }
        kind: { type: string, enum: [cluster, node, external] }
        name: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        status: { $ref: "#/components/schemas/Status" }
        status_reason: { type: string }
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        impacted_by: { type: array, items: { type: string }, description: De groepen waar doorgegeven uitval vandaan komt }
        suggestions: { type: integer, description: Voorgestelde diensten in deze groep }
    DepInstance:
      type: object
      required: [node_id, hostname, state, running]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        state: { type: string, description: ActiveState van de unit; leeg zonder verse heartbeat }
        running: { type: boolean }
    DepService:
      type: object
      required: [id, group_id, cluster_id, node_id, name, kind, unit, port, address, description, source, state, status,
        status_reason, impact, impact_reason, impact_path, cause_id, instances, last_seen_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        unit: { type: string }
        port: { type: integer, nullable: true }
        address: { type: string }
        description: { type: string }
        source: { $ref: "#/components/schemas/ServiceSource" }
        state: { $ref: "#/components/schemas/ServiceState" }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        status_reason: { type: string }
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        impact_reason: { type: string, description: "Zoals: mariadb in db-prod is down, via php8.2-fpm" }
        impact_path: { type: array, items: { type: string }, description: Van de oorzaak naar deze dienst }
        cause_id: { type: string, format: uuid, nullable: true }
        instances: { type: array, items: { $ref: "#/components/schemas/DepInstance" } }
        last_seen_at: { type: string, format: date-time, nullable: true, description: Wanneer de resolver de unit het laatst zag }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DepEdge:
      type: object
      required: [id, from, to, strength, source, state, note, affected, count, observed]
      properties:
        id: { type: string, description: "Het id van de afhankelijkheid; bij level=cluster <van>|<naar>" }
        from: { type: string, description: De afnemer (dienst-id, of groep-id bij level=cluster) }
        to: { type: string, description: De leverancier }
        strength: { $ref: "#/components/schemas/DependencyStrength" }
        source: { $ref: "#/components/schemas/ServiceSource" }
        state: { $ref: "#/components/schemas/ServiceState" }
        note: { type: string }
        affected: { type: boolean, description: Uitval bereikte de afnemer langs deze pijl }
        count: { type: integer, description: Hoeveel pijlen samengevoegd zijn; 1 per dienst }
        observed:
          description: Met include_connections wat de agents de afgelopen 24 uur zagen; null zonder, of als ze niets zagen
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DepObserved" }]
    DepObserved:
      type: object
      required: [count, first_seen, last_seen, text, lines]
      properties:
        count: { type: integer, format: int64, description: "Hoe vaak een agent de verbindingen zag in de afgelopen 24 uur: hij kijkt elke minuut" }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        text: { type: string, description: "Het bewijs in woorden, zoals 'php8.2-fpm op web-01 → mariadb in db-prod: 1.240 verbindingen gezien naar 10.0.30.100:3306 in de afgelopen 24 uur'" }
        lines: { type: array, items: { $ref: "#/components/schemas/DepObservedLine" }, description: "Per unit, node en adres; hoogstens 10" }
    DepObservedLine:
      type: object
      required: [node_id, hostname, unit, addr, port, count, last_seen]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        unit: { type: string }
        addr: { type: string }
        port: { type: integer }
        count: { type: integer, format: int64 }
        last_seen: { type: string, format: date-time }
    NodeConnections:
      type: object
      required: [supported, out, in]
      properties:
        supported: { type: boolean, description: De agent meldt verbindingen (protocol 5 of nieuwer) }
        out: { type: array, items: { $ref: "#/components/schemas/NodeConnOut" } }
        in: { type: array, items: { $ref: "#/components/schemas/NodeConnIn" } }
    NodeConnOut:
      type: object
      required: [unit, addr, port, count, first_seen, last_seen, dest, dest_label, from_service_id, service_id, node_id, cluster_id, dependency_id, dependency_state]
      properties:
        unit: { type: string, description: Leeg als de agent de unit niet zag }
        addr: { type: string }
        port: { type: integer }
        count: { type: integer, format: int64, description: Hoe vaak gezien in de afgelopen 24 uur }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        dest:
          type: string
          enum: [service, node, vip, clusterforge, unknown]
          description: "Een dienst; een node of VIP zonder dienst op die poort; ClusterForge zelf; of een onbekend adres"
        dest_label: { type: string, description: "Zoals 'mariadb in db-prod', 'web-02' of 'VIP van db-prod'" }
        from_service_id: { type: string, format: uuid, nullable: true, description: De dienst die de verbinding maakte }
        service_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        cluster_id: { type: string, format: uuid, nullable: true }
        dependency_id: { type: string, format: uuid, nullable: true, description: "De pijl tussen de twee diensten, als die er is" }
        dependency_state: { nullable: true, allOf: [{ $ref: "#/components/schemas/ServiceState" }] }
    NodeConnIn:
      type: object
      required: [unit, port, peer_node_id, peer_hostname, count, first_seen, last_seen]
      properties:
        unit: { type: string }
        port: { type: integer }
        peer_node_id: { type: string, format: uuid, nullable: true, description: De afzender als het een node is; null voor alle andere adressen samen }
        peer_hostname: { type: string }
        count: { type: integer, format: int64 }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
    DependencyGraph:
      type: object
      required: [level, groups, services, edges, suggestions, suggested_dependencies]
      properties:
        level: { type: string, enum: [service, cluster] }
        groups: { type: array, items: { $ref: "#/components/schemas/DepGroup" } }
        services: { type: array, items: { $ref: "#/components/schemas/DepService" } }
        edges: { type: array, items: { $ref: "#/components/schemas/DepEdge" } }
        suggestions: { type: integer, description: Voorgestelde diensten binnen het filter }
        suggested_dependencies: { type: integer, description: Voorgestelde afhankelijkheden binnen het filter }
    ServiceInput:
      type: object
      required: [name, kind]
      properties:
        cluster_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid, description: Een losse node zonder cluster }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        unit: { type: string }
        port: { type: integer }
        address: { type: string, description: Alleen extern, met port }
        description: { type: string }
    ServicePatch:
      type: object
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        unit: { type: string }
        port: { type: integer, nullable: true }
        address: { type: string }
        description: { type: string }
        state: { $ref: "#/components/schemas/ServiceState" }
    DependencyInput:
      type: object
      required: [from_service_id, to_service_id]
      properties:
        from_service_id: { type: string, format: uuid, description: De afnemer }
        to_service_id: { type: string, format: uuid, description: De leverancier }
        strength: { $ref: "#/components/schemas/DependencyStrength" }
        note: { type: string }
    DependencyPatch:
      type: object
      properties:
        strength: { $ref: "#/components/schemas/DependencyStrength" }
        note: { type: string }
        state: { $ref: "#/components/schemas/ServiceState" }
    ImpactItem:
      type: object
      required: [service_id, name, kind, group_id, group_name, environment, impact, direct, reason, path, dependency_id, source]
      properties:
        service_id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        group_id: { type: string }
        group_name: { type: string }
        environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        direct: { type: boolean, description: Geraakt door de storing zelf, niet langs een pijl }
        reason: { type: string, description: "Zoals: hangt hard af van mariadb in db-prod · handmatig" }
        path: { type: array, items: { type: string }, description: Van de oorzaak naar deze dienst }
        dependency_id: { type: string, format: uuid, nullable: true, description: De laatste pijl van het pad }
        source:
          nullable: true
          description: De bron van die pijl
          allOf: [{ $ref: "#/components/schemas/ServiceSource" }]
    ImpactGroup:
      type: object
      required: [group_id, name, environment, impact, count]
      properties:
        group_id: { type: string }
        name: { type: string }
        environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        count: { type: integer }
    Impact:
      type: object
      required: [target, items, groups]
      properties:
        target:
          type: object
          required: [kind, id, name]
          properties:
            kind: { type: string, enum: [service, cluster, node] }
            id: { type: string, format: uuid }
            name: { type: string, description: "Zoals: mariadb in db-prod" }
        items: { type: array, items: { $ref: "#/components/schemas/ImpactItem" } }
        groups: { type: array, items: { $ref: "#/components/schemas/ImpactGroup" }, description: Per groep de ergste impact, prod bovenaan }
    Template:
      type: object
      required: [name, version, title, description, cluster_type, params, roles, services, database]
      properties:
        name: { type: string }
        version: { type: string }
        title: { type: string }
        description: { type: string }
        cluster_type: { $ref: "#/components/schemas/ClusterType" }
        params: { type: array, items: { $ref: "#/components/schemas/TemplateParam" } }
        roles: { type: array, items: { $ref: "#/components/schemas/TemplateRole" } }
        services: { type: array, items: { $ref: "#/components/schemas/TemplateService" }, description: De diensten die een uitrol in de afhankelijkheidsgraaf zet }
        database: { allOf: [{ $ref: "#/components/schemas/TemplateDatabase" }], nullable: true, description: "De database die een uitrol altijd krijgt; null voor een template zonder" }
    TemplateDatabase:
      type: object
      description: Zoals Database erbij, maar altijd en alleen op de nodes van role
      required: [engine, role]
      properties:
        engine: { type: string }
        role: { type: string }
    TemplateService:
      type: object
      required: [name, kind, unit, port, port_param, depends_on]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        unit: { type: string, nullable: true, description: De systemd-unit zonder .service }
        port: { type: integer, nullable: true, description: Vaste hoofdpoort }
        port_param: { type: string, nullable: true, description: De parameter met de hoofdpoort, als die niet vastligt }
        depends_on: { type: array, items: { type: string }, description: Diensten uit dezelfde template waarvan deze afhangt }
    DeployCluster:
      type: object
      required: [name, slug, environment]
      properties:
        name: { type: string }
        slug: { type: string, description: "Ook het begin van de hostnames: <slug>-01, <slug>-02" }
        environment: { $ref: "#/components/schemas/Environment" }
        description: { type: string }
    DeployTarget:
      type: object
      required: [proxmox_id, network]
      properties:
        proxmox_id: { type: string, format: uuid }
        image_vmid: { type: integer, description: De VM-template (golden image) of CT-template om uit te klonen; niet bij create ct }
        create:
          type: string
          enum: [ct]
          description: >-
            ct - nieuwe CT's die de agent op de Proxmox-host maakt (fase 17), met cf-agent erin; image_vmid valt dan weg.
        ostemplate: { type: string, description: "Containertemplate bij create ct, zoals local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst; leeg is de nieuwste debian-13-standard" }
        template_storage: { type: string, description: Storage voor de containertemplate als de host hem downloadt; standaard local }
        privileged: { type: boolean, description: Bevoegde CT's in plaats van onbevoegde }
        storage: { type: string, description: Storage voor de schijven; leeg is die van de template }
        bridge: { type: string, description: Standaard vmbr0 }
        vlan: { type: integer, nullable: true }
        network: { type: string, enum: [dhcp, static] }
        first_ip: { type: string, description: "Adres van de eerste node met prefix, zoals 10.0.20.11/24; de volgende nodes krijgen de adressen erna" }
        gateway: { type: string }
        dns: { type: array, items: { type: string } }
        ssh_keys: { type: string, description: "Publieke SSH-sleutels, één per regel" }
        placement:
          type: array
          items: { $ref: "#/components/schemas/DeployPlacement" }
          description: >-
            Per node de Proxmox-host en de storage. Een node zonder keuze, of met een lege host of storage, krijgt die van
            ClusterForge: storage zoals het veld storage (of de template), hosts gespreid over de online hosts.
    DeployPlacement:
      type: object
      required: [role, index]
      properties:
        role: { type: string }
        index: { type: integer, description: "Volgnummer binnen de rol, vanaf 1" }
        host: { type: string, description: Proxmox-host; leeg kiest ClusterForge }
        storage: { type: string, description: Storage voor de schijf; leeg is de standaard }
        vmid: { type: integer, description: Nummer van de nieuwe VM of CT; leeg kiest ClusterForge }
        address: { type: string, description: Vast IPv4-adres zonder prefix; leeg is het volgende vrije na first_ip }
        cpu: { type: integer, description: vCPU's; leeg volgt de template }
        memory_mib: { type: integer, description: Geheugen in MB; leeg volgt de template }
        disk_gib: { type: integer, description: Schijf in GB; leeg volgt de template }
    DeployInput:
      type: object
      required: [template, cluster, params]
      properties:
        template: { type: string }
        cluster: { $ref: "#/components/schemas/DeployCluster" }
        params:
          type: object
          additionalProperties: true
          description: Waarden voor de parameters van de template
        target: { $ref: "#/components/schemas/DeployTarget" }
        server_url: { type: string, description: Het adres waarmee de nieuwe nodes ClusterForge bereiken; niet bij existing_nodes }
        existing_nodes:
          type: array
          items: { $ref: "#/components/schemas/DeployExistingNode" }
          description: >-
            Bestaande nodes (zoals CT's met een agent) per rol, in plaats van nieuwe VM's. Ze zitten nog in geen cluster;
            target en server_url vallen dan weg. Per rol precies zoveel als de template vraagt.
        database: { $ref: "#/components/schemas/DeployDatabase" }
    DeployExistingNode:
      type: object
      required: [node_id, role]
      properties:
        node_id: { type: string, format: uuid }
        role: { type: string }
        database: { $ref: "#/components/schemas/DeployDatabase" }
    DeployDatabase:
      type: object
      description: |
        Database erbij: als de uitrol lukt, zet ClusterForge deze database op alle nodes van het nieuwe cluster, zoals
        'Database toevoegen', om er een app naartoe te verhuizen. Houdt het plan haar tegen, dan staat de reden in het
        logboek (cluster.database_not_added).
      required: [engine]
      properties:
        engine: { type: string, description: "mariadb; postgresql komt later" }
    DeployPlanNode:
      type: object
      required: [hostname, role, index, address, host, storage, host_chosen, storage_chosen, cpu, memory_mib, disk_gib, vmid, vmid_chosen]
      properties:
        hostname: { type: string }
        role: { type: string }
        index: { type: integer, description: "Volgnummer binnen de rol, vanaf 1; leeg (0) bij bestaande nodes" }
        address: { type: string, description: "Adres met prefix, zoals 10.0.20.11/24; leeg bij DHCP" }
        host: { type: string, description: De Proxmox-host voor de VM }
        storage: { type: string, description: "De storage voor de schijf; leeg bij bestaande nodes" }
        host_chosen: { type: boolean, description: De host is gekozen in placement in plaats van door ClusterForge }
        storage_chosen: { type: boolean }
        cpu: { type: integer }
        memory_mib: { type: integer }
        disk_gib: { type: integer }
        vmid: { type: integer, description: "Nummer van de nieuwe VM of CT; 0 als Proxmox het bij het maken kiest" }
        vmid_chosen: { type: boolean }
    DeployPlan:
      type: object
      required: [nodes, vip, vrid]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/DeployPlanNode" } }
        vip: { type: string, description: Leeg als de template geen VIP heeft }
        vrid: { type: integer, nullable: true }
    DeployResult:
      type: object
      required: [job, cluster_id]
      properties:
        job: { $ref: "#/components/schemas/Job" }
        cluster_id: { type: string, format: uuid }
    GitCommit:
      type: object
      required: [sha, message, author, date, verified, url]
      properties:
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        verified: { type: boolean, description: Of GitHub de handtekening van de commit geldig vindt }
        url: { type: string, description: De commit op de website }
    GitRepo:
      type: object
      required: [id, api_url, repository, branch, path, server_url, web_url, head, last_sync_at, last_error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        api_url: { type: string }
        repository: { type: string, description: "eigenaar/naam" }
        branch: { type: string }
        path: { type: string, description: De map met een map per cluster }
        server_url:
          type: string
          description: Het adres waarmee nieuwe nodes uit Git ClusterForge bereiken; leeg als het nog niet ingevuld is
        web_url: { type: string, description: De repository op de website }
        head:
          description: De laatste commit die de server zag
          allOf: [{ $ref: "#/components/schemas/GitCommit" }]
          nullable: true
        last_sync_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: Waarom de laatste synchronisatie mislukte; leeg als ze lukte }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GitRepoStatus:
      type: object
      required: [enabled, repo, interval_seconds, pending_changes]
      properties:
        enabled: { type: boolean, description: Zonder CF_MASTER_KEY staat GitOps uit }
        repo:
          allOf: [{ $ref: "#/components/schemas/GitRepo" }]
          nullable: true
        interval_seconds: { type: integer, description: Tijd tussen twee keer lezen }
        pending_changes: { type: integer, description: Wijzigingen die wachten op goedkeuring }
    GitRepoInput:
      type: object
      required: [repository]
      properties:
        api_url: { type: string, description: "Standaard https://api.github.com" }
        repository: { type: string, description: "eigenaar/naam, of de link naar de repository" }
        branch: { type: string, description: Standaard main }
        path: { type: string, description: Standaard clusters }
        token: { type: string, format: password, description: "Fine-grained token met alleen Contents: read; leeg laat het opgeslagen token staan" }
        server_url:
          type: string
          description: "Het adres waarmee nieuwe nodes ClusterForge bereiken, zoals https://clusterforge.lan; nodig voor omhoog schalen en nieuwe clusters"
    GitProbe:
      type: object
      required: [head, files]
      properties:
        head: { $ref: "#/components/schemas/GitCommit" }
        files: { type: array, items: { type: string }, description: De gevonden clusterbestanden }
    GitFieldError:
      type: object
      required: [field, line, message]
      properties:
        field: { type: string, description: "Zoals params.vip of cluster.name" }
        line: { type: integer, description: De regel in het bestand; 0 als die niet bekend is }
        message: { type: string }
    GitFileState:
      type: string
      description: |
        in_sync: gelijk aan het cluster; pending: een wijziging wacht; applying:
        een goedgekeurde wijziging wordt toegepast; not_applied: gelijk aan de
        spec, maar die staat niet op alle nodes; rejected: deze inhoud is
        afgewezen; invalid: fouten; new: een nieuw cluster; unlinked: het
        cluster bestaat maar is niet gekoppeld; missing: het bestand van een
        gekoppeld cluster ontbreekt
      enum: [in_sync, pending, applying, not_applied, rejected, invalid, new, unlinked, missing]
    GitFile:
      type: object
      required: [path, slug, state, cluster_id, cluster_name, errors, change_id, commit, secret, url]
      properties:
        path: { type: string }
        slug: { type: string }
        state: { $ref: "#/components/schemas/GitFileState" }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        errors: { type: array, items: { $ref: "#/components/schemas/GitFieldError" } }
        change_id: { type: string, format: uuid, nullable: true, description: "De wachtende, afgewezen, lopende of mislukte wijziging" }
        commit: { type: string, description: De commit waarin de server deze inhoud voor het eerst zag }
        secret: { type: boolean, description: Er stond een geheim in; de inhoud wordt niet bewaard }
        url: { type: string, description: Het bestand op de website }
    GitChangeStatus:
      type: string
      enum: [pending, applying, applied, failed, rejected, superseded]
    GitChange:
      type: object
      required: [id, cluster_id, cluster_name, cluster_environment, slug, path, kind, status, commit, base_revision, revision, summary, job_id, decided_by, decided_at, reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string, description: De naam nu, of die uit het bestand bij een nieuw cluster }
        cluster_environment: { $ref: "#/components/schemas/Environment" }
        slug: { type: string }
        path: { type: string }
        kind: { type: string, enum: [create, update] }
        status: { $ref: "#/components/schemas/GitChangeStatus" }
        commit: { $ref: "#/components/schemas/GitCommit" }
        base_revision: { type: integer }
        revision: { type: integer, nullable: true, description: De spec-revisie die de goedkeuring maakte }
        summary: { type: string, description: "Zoals: node_count van 2 naar 3; keepalived.conf op 2 nodes, 1 nieuwe node" }
        job_id: { type: string, format: uuid, nullable: true }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        reason: { type: string, description: "De reden van afwijzen of vervallen, of de fout van de taak" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GitChangeDetail:
      allOf:
        - $ref: "#/components/schemas/GitChange"
        - type: object
          required: [plan, local, file_url, needs_confirmation, full_apply, blocked, blocked_code]
          properties:
            needs_confirmation: { type: boolean, description: "Het cluster is of wordt prod: goedkeuren vraagt de slug" }
            full_apply:
              type: boolean
              description: Een eerdere revisie is niet op alle nodes toegepast, dus goedkeuren past alle stappen opnieuw toe
            blocked: { type: string, description: "Waarom goedkeuren nu niet kan; leeg als het kan" }
            blocked_code:
              type: string
              description: "no_server_url: het adres van ClusterForge ontbreekt bij de koppeling; dhcp_growth: omhoog schalen met DHCP; leeg als goedkeuren kan"
            plan: { $ref: "#/components/schemas/GitPlan" }
            local:
              type: array
              items: { type: string }
              description: Uit de laatste driftcontrole, wat op de nodes al afwijkt en overschreven wordt
            file_url: { type: string }
    GitApproveInput:
      type: object
      properties:
        confirm: { type: string, description: Op prod de slug van het cluster }
    GitRejectInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    GitReapplyInput:
      type: object
      properties:
        confirm: { type: string, description: Op prod de slug van het cluster }
        server_url:
          type: string
          description: Het adres van ClusterForge voor nodes die nog moeten aanmelden; leeg neemt dat van de koppeling met Git
    GitDecision:
      type: object
      required: [change, job]
      properties:
        change: { $ref: "#/components/schemas/GitChange" }
        job:
          allOf: [{ $ref: "#/components/schemas/Job" }]
          nullable: true
          description: null als er op geen node iets verandert
    GitFieldChange:
      type: object
      required: [field, label, from, to]
      properties:
        field: { type: string }
        label: { type: string }
        from: { type: string }
        to: { type: string }
    GitPlanNewNode:
      type: object
      required: [hostname, role, address, prefix, host, vm]
      properties:
        hostname: { type: string }
        role: { type: string }
        address: { type: string }
        prefix: { type: integer }
        host: { type: string }
        vm:
          type: object
          required: [cpu, memory_mib, disk_gib]
          properties:
            cpu: { type: integer }
            memory_mib: { type: integer }
            disk_gib: { type: integer }
    GitStepChange:
      type: object
      required: [step, ids, title, change, summary]
      properties:
        step: { type: string, description: "Zoals file:/var/www/html/index.html" }
        ids: { type: array, items: { type: string } }
        title: { type: string }
        change: { type: string, enum: [added, changed, removed] }
        summary: { type: string }
        diff: { type: string, description: "Unified diff; geheimen staan er als [geheim] in" }
    GitPlanNode:
      type: object
      required: [node_id, hostname, new, vips, steps]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        role: { type: string, description: De rol uit de template, zoals server of worker }
        new: { type: boolean }
        vips: { type: array, items: { type: string }, description: De VIP's die deze node nu heeft }
        steps: { type: array, items: { $ref: "#/components/schemas/GitStepChange" } }
    GitPlan:
      type: object
      required: [kind, summary, base_revision, template, metadata, params, new_nodes, nodes, unchanged, warnings, no_steps]
      properties:
        kind: { type: string, enum: [create, update] }
        summary: { type: string }
        base_revision: { type: integer }
        template:
          type: object
          required: [name, from, to]
          properties:
            name: { type: string }
            from: { type: string, description: Leeg bij een nieuw cluster }
            to: { type: string }
        metadata: { type: array, items: { $ref: "#/components/schemas/GitFieldChange" } }
        params: { type: array, items: { $ref: "#/components/schemas/GitFieldChange" } }
        new_nodes: { type: array, items: { $ref: "#/components/schemas/GitPlanNewNode" } }
        nodes:
          type: array
          description: |
            In de volgorde van toepassen; de bestaande nodes met de VIP-eigenaar als laatste, daarna de nieuwe. Bij
            Kubernetes gaan de servers voor de workers.
          items: { $ref: "#/components/schemas/GitPlanNode" }
        unchanged: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        no_steps: { type: boolean, description: Geen gerenderde stap verandert }
        vip: { type: string }
        vrid: { type: integer }
        proxmox: { type: string }
    SpecEditParam:
      type: object
      required: [param, value, locked]
      properties:
        param: { $ref: "#/components/schemas/TemplateParam" }
        value: { nullable: true, description: "De waarde nu; null bij een geheim of een lege optionele waarde" }
        locked: { type: string, description: "Waarom de parameter niet te wijzigen is; leeg als het kan" }
    SpecEditForm:
      type: object
      required: [template, version, versions, params, blocked]
      properties:
        template: { type: string }
        version: { type: string }
        versions: { type: array, items: { type: string }, description: De versies van de template in deze server }
        params: { type: array, items: { $ref: "#/components/schemas/SpecEditParam" } }
        blocked: { type: string, description: "Waarom de spec hier niet te wijzigen is, zoals bij een cluster dat Git volgt; leeg als het kan" }
    SpecEditInput:
      type: object
      required: [params]
      properties:
        version: { type: string, description: De templateversie; leeg houdt de huidige }
        params:
          type: object
          additionalProperties: true
          description: De parameters die veranderen; de andere houden hun waarde
    SpecEditPlan:
      type: object
      required: [plan, hash, needs_confirmation, full_apply, blocked, blocked_code]
      properties:
        plan: { $ref: "#/components/schemas/GitPlan" }
        hash: { type: string, description: Toepassen vraagt hem terug; zo gebeurt wat je zag }
        needs_confirmation: { type: boolean, description: "Het cluster is prod: toepassen vraagt de slug" }
        full_apply: { type: boolean, description: Een eerdere revisie is niet op alle nodes toegepast, dus de taak past alle stappen opnieuw toe }
        blocked: { type: string, description: "Waarom toepassen nu niet kan; leeg als het kan" }
        blocked_code:
          type: string
          description: "render_failed, membership of dhcp_growth; leeg als toepassen kan"
    SpecApplyInput:
      allOf:
        - $ref: "#/components/schemas/SpecEditInput"
        - type: object
          required: [hash]
          properties:
            hash: { type: string, description: De hash van het plan dat je bekeek }
            server_url: { type: string, description: "Het adres van ClusterForge waar nieuwe nodes zich aanmelden; nodig als er nodes bijkomen" }
            confirm: { type: string, description: Op prod de slug van het cluster }
    SpecApplied:
      type: object
      required: [revision, job]
      properties:
        revision: { type: integer }
        job:
          allOf: [{ $ref: "#/components/schemas/Job" }]
          nullable: true
          description: null als er op geen node iets verandert
    ZabbixAgentSettings:
      type: object
      required: [auto_apply, auto_prod, server, server_active, version, host_metadata, api_url, host_group, templates,
        docker_template, proxy, token_set, available, updated_at]
      properties:
        auto_apply: { type: boolean, description: Elke node met een agent krijgt vanzelf zabbix-agent2 }
        auto_prod: { type: boolean, description: Ook nodes van prod-clusters }
        server: { type: string, description: "Server= in zabbix_agent2.conf" }
        server_active: { type: string, description: "ServerActive= in zabbix_agent2.conf" }
        version: { type: string, description: Versie van de Zabbix-repository, zoals 8.0 }
        host_metadata: { type: string }
        api_url: { type: string, description: Adres van api_jsonrpc.php }
        host_group: { type: string, description: Groep voor hosts die ClusterForge aanmaakt }
        templates: { type: array, items: { type: string } }
        docker_template: { type: string, description: Extra template voor nodes met Docker }
        proxy: { type: string, description: Proxy voor nieuwe hosts; leeg is de server }
        token_set: { type: boolean }
        available: { type: boolean, description: De server heeft een masterkey om sleutels te bewaren }
        updated_at: { type: string, format: date-time }
    ZabbixAgentSettingsInput:
      type: object
      required: [auto_apply, auto_prod, server, server_active, version, host_metadata, api_url, host_group, templates,
        docker_template, proxy]
      properties:
        auto_apply: { type: boolean }
        auto_prod: { type: boolean }
        server: { type: string }
        server_active: { type: string }
        version: { type: string }
        host_metadata: { type: string }
        api_url: { type: string }
        host_group: { type: string }
        templates: { type: array, items: { type: string } }
        docker_template: { type: string }
        proxy: { type: string }
        token: { type: string, description: Weglaten laat het token staan; leeg haalt het weg }
    ZabbixAgentNode:
      type: object
      required: [node_id, hostname, ip, cluster_id, cluster_name, cluster_environment, online, supported, docker,
        agent_service, enabled, managed, psk_identity, psk_created_at, applied_at, apply_job_id, apply_running,
        apply_error, apply_failed_at, zabbix_host_id, pending]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        ip: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        cluster_environment: { type: string }
        online: { type: boolean }
        supported: { type: boolean }
        docker: { type: boolean }
        agent_service: { type: string, description: Stand van zabbix-agent2 uit de heartbeat; leeg als hij er niet is }
        enabled: { type: boolean }
        managed: { type: boolean }
        psk_identity: { type: string }
        psk_created_at: { type: string, format: date-time, nullable: true }
        applied_at: { type: string, format: date-time, nullable: true }
        apply_job_id: { type: string, format: uuid, nullable: true }
        apply_running: { type: boolean }
        apply_error: { type: string }
        apply_failed_at: { type: string, format: date-time, nullable: true }
        zabbix_host_id: { type: string }
        pending: { type: boolean }
    ZabbixAgentsOverview:
      type: object
      required: [settings, nodes]
      properties:
        settings: { $ref: "#/components/schemas/ZabbixAgentSettings" }
        nodes: { type: array, items: { $ref: "#/components/schemas/ZabbixAgentNode" } }
    ZabbixAgentTestResult:
      type: object
      required: [ok, version, message]
      properties:
        ok: { type: boolean }
        version: { type: string }
        message: { type: string }
    ZabbixAgentNodesInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [manage, unmanage, apply, rotate] }
        node_ids: { type: array, items: { type: string, format: uuid } }
        all: { type: boolean, description: Alle nodes die nog niet toegepast zijn (apply) of alle nodes }
    ZabbixAgentNodesResult:
      type: object
      required: [jobs, skipped]
      properties:
        jobs: { type: array, items: { type: string, format: uuid } }
        skipped: { type: array, items: { type: string } }
    ZabbixLatestItem:
      type: object
      required: [itemid, name, key, numeric, units, last_value, prev_value, last_clock, component, error, hostid, host_name]
      properties:
        itemid: { type: string }
        name: { type: string }
        key: { type: string }
        numeric: { type: boolean }
        units: { type: string }
        last_value: { type: string }
        prev_value: { type: string }
        last_clock: { type: string, format: date-time, nullable: true }
        component: { type: string }
        error: { type: string }
        hostid: { type: string }
        host_name: { type: string }
    ZabbixBoardItem:
      type: object
      required: [itemid, label]
      properties:
        itemid: { type: string }
        label: { type: string, description: Eigen naam in de legende; leeg is de naam uit Zabbix }
    ZabbixPanel:
      type: object
      required: [id, type, title, w, h, items, range, warn, crit, max, min_severity, hostid, text]
      properties:
        id: { type: string, description: Leeg bij een nieuw paneel; de server geeft er een }
        type: { type: string, description: "Een van: graph, stat, gauge, problems, text" }
        title: { type: string }
        w: { type: integer, description: Breedte in kolommen, 1-4 }
        h: { type: integer, description: Hoogte, 1-3 }
        items: { type: array, items: { $ref: "#/components/schemas/ZabbixBoardItem" }, description: "graph: 1-6; stat en gauge: 1" }
        range: { type: string, description: "graph: 1h, 6h, 24h, 7d of 30d" }
        warn: { type: number, nullable: true, description: "stat en gauge: vanaf hier oranje" }
        crit: { type: number, nullable: true, description: "stat en gauge: vanaf hier rood" }
        max: { type: number, nullable: true, description: "gauge: de volle meter (leeg: 100)" }
        min_severity: { type: integer, description: "problems: vanaf deze ernst (0-5)" }
        hostid: { type: string, description: "problems: alleen deze host; leeg is alle" }
        text: { type: string, description: "text: de tekst" }
    ZabbixDashboardInput:
      type: object
      required: [name, description, refresh, panels]
      properties:
        name: { type: string }
        description: { type: string }
        refresh: { type: integer, description: "Verversen in seconden: 0, 30, 60, 300 of 900" }
        panels: { type: array, items: { $ref: "#/components/schemas/ZabbixPanel" } }
    ZabbixDashboard:
      type: object
      required: [id, name, description, refresh, panels, created_at, updated_at, updated_by]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        refresh: { type: integer }
        panels: { type: array, items: { $ref: "#/components/schemas/ZabbixPanel" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, nullable: true }
    ZabbixItem:
      type: object
      required: [itemid, name, key, numeric, units, last_value, prev_value, last_clock, component, error]
      properties:
        itemid: { type: string }
        name: { type: string }
        key: { type: string }
        numeric: { type: boolean, description: Getallen (float of unsigned); alleen daarvan is er een grafiek }
        units: { type: string }
        last_value: { type: string }
        prev_value: { type: string }
        last_clock: { type: string, format: date-time, nullable: true }
        component: { type: string, description: De tag component; leeg zonder }
        error: { type: string, description: Niet ondersteund en waarom; leeg als het item werkt }
    ZabbixHostItems:
      type: object
