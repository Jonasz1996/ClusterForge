        id:
          type: string
          description: e en een event-id, c en een journaal-id, of m voor een afwijking in de metrics
        ts: { type: string, format: date-time }
        from:
          type: string
          format: date-time
          description: Het begin van het venster waarin het waarschijnlijk gebeurde
