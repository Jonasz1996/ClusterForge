    post:
      operationId: explainKubeObject
      summary: Laat de assistent uitleggen wat er met een object is, zoals waarom een pod niet start; het antwoord stroomt als server-sent events
      description: |
        Voor wie de assistent mag gebruiken. De assistent leest het object met zijn events, en bij een pod de logs van nu en
        van voor de laatste herstart, en zegt wat er mis is met het bewijs erbij. Alles alleen lezend en zonder de waarden
        van Secrets; wachtwoorden en tokens in logs en YAML zijn vervangen door [geheim]. De uitleg komt in een nieuw
        gesprek; het laatste event, done, noemt het (conversation_id).
