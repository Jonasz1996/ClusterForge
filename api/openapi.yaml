        node: { type: string, description: Proxmox-host waarop de test draait }
        archive: { type: string, description: Volume van de back-up }
        type: { type: string, enum: [qemu, lxc] }
        storage: { type: string, description: Storage voor de schijven van de test }
    SecurityObject:
      type: object
      description: Een object van de beveiligingsmodule (fase 27); de velden staan in web/src/lib/security.ts en internal/security.
      additionalProperties: true
    SecurityRefreshInput:
      type: object
      properties:
        feeds: { type: boolean, description: Feeds opnieuw ophalen }
        nodes: { type: boolean, description: Pakketlijsten opnieuw ophalen }
        node_id: { type: string, format: uuid, description: Alleen deze node (met nodes) }
    SecurityAcceptInput:
      type: object
      required: [note]
      properties:
        note: { type: string, maxLength: 500 }
        days: { type: integer, minimum: 1, maximum: 365, description: Na zoveel dagen weer open; leeg is voor altijd }
    SecurityScopeInput:
      type: object
      required: [name, cidrs]
      properties:
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        cidrs: { type: array, items: { type: string } }
        exclude: { type: array, items: { type: string } }
        public_confirm: { type: string }
        public_note: { type: string, maxLength: 300 }
    SecurityScanInput:
      type: object
      required: [name, scope_id, profile, schedule]
