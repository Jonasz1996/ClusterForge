      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: drainKubeNode
      summary: Een node leegmaken, zoals kubectl drain (admin); wordt een taak
      description: |
        Met preview=true komt alleen het plan terug: welke pods uitgezet worden, welke blijven en welke het tegenhouden.
        Houden pods het tegen, dan antwoordt de server 409 met code needs_force; met force=true gaan ze toch weg.
        Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubeDrainInput" }
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeDrainPlan" }
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
