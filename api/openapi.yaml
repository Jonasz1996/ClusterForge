  /agents/claim:
    post:
      operationId: claimAgent
      summary: Een agent in een CT uit een CT-template meldt zich aan zonder token (zonder sessie)
      description: |
        Alleen tijdens een uitrol: die zette voor de node met deze hostname
        een token klaar met het adres van de CT. De aanvraag moet van dat
        adres komen. 404 no_claim betekent dat er (nog) niets klaarstaat;
