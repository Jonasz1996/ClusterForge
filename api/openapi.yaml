        source: { type: string, enum: [log, agent, server, proxmox, clusterforge, metrics, kube] }
        kind: { type: string }
        action: { type: string }
        summary: { type: string }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster: { type: string }
        subject: { type: string }
        job_id: { type: string, format: uuid, nullable: true }
        job: { type: string }
        link: { type: string }
        detail:
          type: object
          additionalProperties: { type: string }
    Timeline:
      type: object
      required: [entries, has_more]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        has_more:
          type: boolean
          description: Er waren meer regels; de oudste ontbreken
    IncidentMoment:
      type: object
      required: [entry_id, ts, from, to, summary, why]
