openapi: 3.0.3
info:
  title: ClusterForge API
  version: 0.1.0
  description: |
    REST-API van clusterforge-server. Dit bestand is de bron van waarheid:
    de Go-servertypes (internal/httpapi/gen) en de TypeScript-client
    (web/src/lib/api/schema.ts) worden eruit gegenereerd met `make generate`.

    Authenticatie gebeurt met een sessiecookie (`cf_session`). Elke request
    die iets wijzigt, behalve login, stuurt de CSRF-token uit `/auth/me` of
    de login-respons mee in de header `X-CSRF-Token`.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Gezondheid van de server en de database
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database niet bereikbaar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/login:
    post:
      operationId: login
      summary: Inloggen met wachtwoord en, indien ingesteld, TOTP-code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Ingelogd; de sessiecookie staat in Set-Cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      summary: Uitloggen
      responses:
        "204": { description: Uitgelogd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      operationId: getMe
      summary: De ingelogde gebruiker en de CSRF-token van de sessie
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      operationId: changePassword
      summary: Wachtwoord wijzigen; andere sessies worden beëindigd
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Gewijzigd }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/totp/setup:
    post:
      operationId: beginTotpSetup
      summary: Nieuw TOTP-geheim aanmaken (nog niet actief)
      responses:
        "200":
          description: Geheim en otpauth-URL voor de authenticator-app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/totp/enable:
    post:
      operationId: enableTotp
      summary: TOTP activeren met een code uit de authenticator-app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeRequest" }
      responses:
        "204": { description: Geactiveerd }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/totp/disable:
    post:
      operationId: disableTotp
      summary: TOTP uitzetten met wachtwoord en een geldige code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisableRequest" }
      responses:
        "204": { description: Uitgezet }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /events:
    get:
      operationId: listEvents
      summary: Recente events, nieuwste eerst, zonder zinnen (alleen admin; het logboek staat onder /audit)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /audit:
    get:
      operationId: listAudit
      summary: Het logboek, nieuwste eerst, met een zin per regel (alleen admin)
      description: |
        Filters zijn optioneel en worden gecombineerd. Paginering gaat met
        `before`: geef het `next_before` van de vorige pagina mee.
      parameters:
        - $ref: "#/components/parameters/AuditBefore"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditUser"
        - $ref: "#/components/parameters/AuditActorType"
        - $ref: "#/components/parameters/AuditCluster"
        - $ref: "#/components/parameters/AuditNode"
        - $ref: "#/components/parameters/AuditJob"
        - $ref: "#/components/parameters/AuditCategory"
        - $ref: "#/components/parameters/AuditQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /audit/info:
    get:
      operationId: getAuditInfo
      summary: Soorten, gebruikers en verwijderde onderwerpen voor de filters van het logboek (alleen admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /audit/export:
    get:
      operationId: exportAudit
      summary: Het logboek als NDJSON, met dezelfde filters (alleen admin)
      description: |
        Eén AuditEntry per regel, nieuwste eerst, hoogstens 100.000 regels.
        Elke export komt zelf in het logboek als audit.exported.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditUser"
        - $ref: "#/components/parameters/AuditActorType"
        - $ref: "#/components/parameters/AuditCluster"
        - $ref: "#/components/parameters/AuditNode"
        - $ref: "#/components/parameters/AuditJob"
        - $ref: "#/components/parameters/AuditCategory"
        - $ref: "#/components/parameters/AuditQuery"
      responses:
        "200":
          description: Bijlage met NDJSON
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /users:
    get:
      operationId: listUsers
      summary: Actieve gebruikers, voor bijvoorbeeld de keuze van owners
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserRef" }
        "401": { $ref: "#/components/responses/Error" }
  /clusters:
    get:
      operationId: listClusters
      summary: Alle clusters met aantallen nodes en VIP's
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ClusterListItem" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCluster
      summary: Cluster aanmaken (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCluster
      summary: Cluster met nodes, VIP's en owners
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCluster
      summary: Cluster wijzigen (admin); alleen meegestuurde velden veranderen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterPatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCluster
      summary: Cluster verwijderen (admin); nodes blijven bestaan zonder cluster, VIP's verdwijnen
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/vips:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createVip
      summary: VIP toevoegen aan een cluster (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VipInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vip" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /vips/{vipId}:
    parameters:
      - { name: vipId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateVip
      summary: VIP wijzigen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VipPatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vip" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVip
      summary: VIP verwijderen (admin)
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes:
    get:
      operationId: listNodes
      summary: Alle nodes, met hun cluster
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createNode
      summary: Node aanmaken (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNode
      summary: Eén node
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateNode
      summary: Node wijzigen (admin); cluster_id null haalt de node uit zijn cluster
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodePatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteNode
      summary: Node verwijderen (admin)
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/facts:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNodeFacts
      summary: Facts en laatste heartbeat van de agent op deze node
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeRuntime" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/connections:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNodeConnections
      summary: De TCP-verbindingen die de agent de afgelopen 24 uur zag (admin)
      description: |
        Uitgaand per unit, adres en poort, met waar het heen gaat. Inkomend per
        eigen poort; de afzender staat er alleen bij als het een node is, alle
        andere adressen zijn samengeteld.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeConnections" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/actions:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: nodeAction
      summary: Een node herstarten, afsluiten, in of uit onderhoud zetten of zijn facts verzamelen (admin); wordt een taak
      description: |
        Bij onderhoud, herstarten en afsluiten zet de agent eerst keepalived uit zodat de VIP's naar een andere node gaan.
        Een node van een Kubernetes-cluster wordt eerst leeggemaakt: cordon en zijn pods uitzetten. Na een herstart of na het
        onderhoud krijgt hij weer pods zodra hij Ready is.
        Een node met een database van ClusterForge: is hij de primary van Patroni, dan schakelt ClusterForge eerst over naar de
        synchrone replica; na een herstart of na het onderhoud wacht de taak tot de node weer meedoet in de database.
        Kan geen andere node een VIP overnemen, of zou de database stoppen of haar meerderheid verliezen, dan antwoordt de server
        409 met code needs_force; met force=true gaat het toch door.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeActionInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/metrics:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: range, in: query, schema: { $ref: "#/components/schemas/MetricsRange" } }
      - $ref: "#/components/parameters/MetricsFrom"
      - $ref: "#/components/parameters/MetricsTo"
    get:
      operationId: getNodeMetrics
      summary: Grafieken van één node uit VictoriaMetrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/changes:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/ChangesFrom"
      - $ref: "#/components/parameters/ChangesTo"
      - $ref: "#/components/parameters/ChangesKind"
      - $ref: "#/components/parameters/ChangesLimit"
    get:
      operationId: listNodeChanges
      summary: Het wijzigingsjournaal van een node, nieuwste eerst
      description: |
        Wat er op de node veranderde, uit de agent, de server, Proxmox en
        ClusterForge zelf. Een viewer ziet bij een SSH-login geen IP-adres.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeChanges" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/changes:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/ChangesFrom"
      - $ref: "#/components/parameters/ChangesTo"
      - $ref: "#/components/parameters/ChangesKind"
      - $ref: "#/components/parameters/ChangesLimit"
    get:
      operationId: listClusterChanges
      summary: Het wijzigingsjournaal van alle nodes van een cluster, nieuwste eerst
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeChanges" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/timeline:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/TimelineFrom"
      - $ref: "#/components/parameters/TimelineTo"
      - $ref: "#/components/parameters/TimelineClass"
      - $ref: "#/components/parameters/TimelineLimit"
    get:
      operationId: getNodeTimeline
      summary: De tijdlijn van een node, oudste eerst
      description: |
        Het logboek en het journaal samen: wat er op de node en met zijn
        cluster gebeurde. Nooit iets uit de beveiliging; een viewer ziet bij
        een SSH-login geen IP-adres.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/timeline:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/TimelineFrom"
      - $ref: "#/components/parameters/TimelineTo"
      - $ref: "#/components/parameters/TimelineClass"
      - $ref: "#/components/parameters/TimelineLimit"
    get:
      operationId: getClusterTimeline
      summary: De tijdlijn van een cluster en zijn nodes, oudste eerst
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/metrics:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: range, in: query, schema: { $ref: "#/components/schemas/MetricsRange" } }
      - $ref: "#/components/parameters/MetricsFrom"
      - $ref: "#/components/parameters/MetricsTo"
    get:
      operationId: getClusterMetrics
      summary: Grafieken van een cluster, met een lijn per node
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /stream:
    get:
      operationId: stream
      summary: Live wijzigingen als Server-Sent Events
      description: |
        Een event `change` per nieuw event in de eventlog, met als data een
        JSON-object met alleen het id. Wat er veranderde, staat in het logboek.
        De stream sluit na enkele minuten; de browser verbindt dan opnieuw.
      responses:
        "200":
          description: Stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /info:
    get:
      operationId: getInfo
      summary: Instellingen van de server die de webinterface nodig heeft
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /enrollment-tokens:
    get:
      operationId: listEnrollmentTokens
      summary: Bruikbare enrollmenttokens (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EnrollmentToken" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createEnrollmentToken
      summary: Enrollmenttoken aanmaken (admin); het token zelf staat alleen in dit antwoord
      requestBody:
        required: true
