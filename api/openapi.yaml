        reason: { type: string }
        since: { type: string, format: date-time }
        until:
          type: string
          format: date-time
          nullable: true
          description: Wanneer het weer goed was; null zolang het nog misgaat
        present:
          type: boolean
          description: Of het onderwerp nog bestaat
    Incident:
      type: object
      required: [id, number, title, severity, status, started_at, detected_at, resolved_at, caused_by_test, test_run_id, note, updated_at, subjects, cause]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        severity: { type: string, enum: [low, high, critical] }
        status: { type: string, enum: [open, resolved] }
        started_at: { type: string, format: date-time }
        detected_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        caused_by_test:
          type: boolean
          description: Tijdens een failovertest van ClusterForge in hetzelfde cluster
        test_run_id: { type: string, format: uuid, nullable: true }
        note: { type: string }
        updated_at: { type: string, format: date-time }
        subjects:
          type: array
          items: { $ref: "#/components/schemas/IncidentSubject" }
        cause:
          allOf: [{ $ref: "#/components/schemas/IncidentTopCause" }]
          nullable: true
          description: De eerste oorzaak uit de analyse, als die waarschijnlijk of mogelijk is
    IncidentTopCause:
      type: object
      required: [summary, level]
      properties:
        summary: { type: string }
        level: { type: string, enum: [likely, possible] }
    IncidentList:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        has_more: { type: boolean }
    IncidentDetail:
      type: object
      required: [incident, history, history_more, analysis, timeline, timeline_more]
      properties:
        incident: { $ref: "#/components/schemas/Incident" }
        analysis:
          allOf: [{ $ref: "#/components/schemas/IncidentAnalysis" }]
          nullable: true
          description: Null zolang de analyse nog niet gerekend is
        timeline:
          type: array
          description: |
            Het logboek, het journaal en de afwijkingen in de metrics over wat
            geraakt was en wat eromheen ligt, van twee uur voor het eerste
            symptoom tot het einde, oudste eerst
          items: { $ref: "#/components/schemas/TimelineEntry" }
        timeline_more:
          type: boolean
          description: Er waren meer regels; de oudste ontbreken
        history:
          type: array
          description: Statusovergangen, incidenten en tests over wat geraakt was, oudste eerst
          items: { $ref: "#/components/schemas/AuditEntry" }
        history_more:
          type: boolean
          description: Er waren meer regels dan getoond
    TimelineEntry:
      type: object
      required: [id, ts, from, to, delay, class, source, kind, action, summary, node_id, hostname, cluster_id, cluster, subject, job_id, job, link, detail]
      properties:
        id:
          type: string
          description: e en een event-id, c en een journaal-id, of m voor een afwijking in de metrics
        ts: { type: string, format: date-time }
        from:
          type: string
          format: date-time
          description: Het begin van het venster waarin het waarschijnlijk gebeurde
        to: { type: string, format: date-time }
        delay:
          type: string
          description: Waarom het venster er is, zoals 'een node gaat pas na 90 s zonder heartbeat op down'
        class: { type: string, enum: [change, symptom, info] }
        source: { type: string, enum: [log, agent, server, proxmox, clusterforge, metrics] }
        kind: { type: string }
        action: { type: string }
        summary: { type: string }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster: { type: string }
        subject: { type: string }
        job_id: { type: string, format: uuid, nullable: true }
        job: { type: string }
        link: { type: string }
        detail:
          type: object
          additionalProperties: { type: string }
    Timeline:
      type: object
      required: [entries, has_more]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        has_more:
          type: boolean
          description: Er waren meer regels; de oudste ontbreken
    IncidentMoment:
      type: object
      required: [entry_id, ts, from, to, summary, why]
