          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxPatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProxmox
      summary: Proxmox-koppeling verwijderen (admin); nodes blijven bestaan zonder koppeling
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/sync:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncProxmox
      summary: Nu synchroniseren en de back-ups opnieuw lezen in plaats van op de volgende ronde te wachten (admin)
      responses:
        "200":
          description: Gesynchroniseerd; last_error zegt of het lukte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConnection" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/resources:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProxmoxResources
      summary: Hosts, VM's, containers en storage uit de laatste sync
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxResources" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/vms/{vmid}/actions:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: vmid, in: path, required: true, schema: { type: integer } }
    post:
      operationId: vmAction
      summary: Een VM of container starten, stoppen, snapshotten of migreren (admin); wordt een taak
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VmActionInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/vms/{vmid}/snapshots:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: vmid, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listVmSnapshots
      summary: Snapshots van een VM of container, rechtstreeks uit Proxmox
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProxmoxSnapshot" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /backups:
    get:
      operationId: getBackups
      summary: Back-upstand van elke bewaakte VM, per koppeling de dekking, en per cluster de slechtste stand
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupOverview" }
        "401": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/backups:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNodeBackups
      summary: Back-upstand en alle back-ups van de VM van een node
      responses:
        "200":
          description: OK; item is null als de node niet aan een VM gekoppeld is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeBackups" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/backups/verify:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: verifyNodeBackup
      summary: Back-up controleren in een sandbox (admin)
      description: >-
        Zet de nieuwste back-up van de VM van de node terug als tijdelijke VM
        in pool cf-sandbox, met elke netwerkkaart op link_down, start hem,
        controleert hem via de guest agent en verwijdert hem altijd weer. Met
        volid een andere back-up van dezelfde VM. 409 met code busy als er al
        een failovertest of back-upcontrole loopt, of conflict als de node
        geen VM heeft, het een container is of er geen back-up is.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupVerifyInput" }
      responses:
        "202":
          description: In de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /backup-sandboxes/{sandboxId}/cleanup:
    parameters:
      - { name: sandboxId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cleanupBackupSandbox
      summary: Een sandbox nu opruimen (admin)
      description: >-
        Verwijdert de sandbox langs dezelfde bewaakte weg als de opruimer,
        bijvoorbeeld na destroy_failed. Wacht tot Proxmox klaar is. 409 als de
        controle nog loopt, Proxmox de VM vergrendeld heeft of de sandbox al
        opgeruimd is.
      responses:
        "200":
          description: Opgeruimd, of de VM bestond niet (meer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClusterDrift
      summary: Drift van een cluster per node, met waarmee vergeleken wordt
      description: >-
        source is null voor een cluster zonder gewenste staat. Viewers mogen
        dit zien: er staan geen geheimen, inhoud of hashes in.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift/check:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkClusterDrift
      summary: Alle actieve nodes nu controleren (admin)
      description: >-
        Synchroon en zonder bevestiging na 30 seconden; elke node heeft 20
        seconden. Een controle verandert niets op de nodes.
      responses:
        "200":
          description: De drift na de controle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift/baseline:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: captureBaseline
      summary: Baseline vastleggen voor een cluster zonder template (admin)
      description: >-
        Bekijkt de gekozen nodes met state.inspect en legt vast wat er nu
        staat, als nieuwe spec-revisie. Nodes die al een baseline hebben en
        niet gekozen zijn, houden de hunne. Met preview alleen tonen, zonder
        op te slaan. Van een bestand komen alleen grootte, rechten, eigenaar
        en een HMAC van de inhoud in de baseline; het antwoord bevat geen
        hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaselineInput" }
      responses:
        "200":
          description: Wat vastgelegd is, of bij preview zou worden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaselineResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift/remediate:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: remediateClusterDrift
      summary: Gekozen afwijkingen herstellen met cluster.apply (admin)
      description: >-
        Alleen voor een cluster uit een template met een kloppend
        lidmaatschap. Per node de gekozen stappen met de vingerafdrukken
        die getoond werden; is er intussen iets veranderd, dan is het 409
        drift_changed. Met preview alleen het plan, in de volgorde van de
        taak met de VIP-eigenaar als laatste. Op prod moet confirm gelijk
        zijn aan de slug (anders 409 needs_confirmation) en moet de
        gebruiker tweestapsverificatie aan hebben (anders 403
        totp_required).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemediationInput" }
      responses:
        "200":
          description: Het plan, bij preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationResult" }
        "202":
          description: De taak staat in de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift/ignores:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDriftIgnores
      summary: Negeerregels van een cluster, ook de verlopen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftIgnoreList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDriftIgnore
      summary: Een stap negeren op één node of het hele cluster (admin)
      description: >-
        key is een stap zoals file:/etc/nginx/nginx.conf of service:nginx,
        een voorvoegsel dat op * eindigt, of * alleen (alleen met een
        einddatum). De regel geldt meteen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriftIgnoreInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftIgnore" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /drift-ignores/{ignoreId}:
    parameters:
      - { name: ignoreId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteDriftIgnore
      summary: Een negeerregel opheffen (admin)
      responses:
        "204": { description: Opgeheven }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/failover-tests:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFailoverTests
      summary: Failovertests van een cluster met hun laatste run
      description: >-
        Met wat het formulier nodig heeft (welke scenario's nu kunnen en
        waarom niet, de VIP's met hun standaardprobe) en de runs die niet
        volledig hersteld zijn, voor de rode balk.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailoverTestList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createFailoverTest
      summary: Nieuwe failovertest (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FailoverTestInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailoverTest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /failover-tests/{testId}:
    parameters:
      - { name: testId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFailoverTest
      summary: Eén failovertest
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailoverTest" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateFailoverTest
      summary: Een failovertest wijzigen (admin); oude runs houden hun definitie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FailoverTestInput" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailoverTest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFailoverTest
      summary: Een failovertest verwijderen (admin); de runs blijven als geschiedenis
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /failover-tests/{testId}/runs:
    parameters:
      - { name: testId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFailoverTestRuns
      summary: De runs van één test, nieuwste eerst
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRunList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: startFailoverTest
      summary: Nu testen (admin)
      description: >-
        Doet de voorcontrole synchroon en zet de run en de taak in één
        transactie in de wachtrij, door het clusterslot en het testslot. Op
        prod alleen met tweestapsverificatie (anders 403 totp_required) en
        de slug van het cluster als confirm (anders 409 needs_confirmation).
        409 precheck_failed met de controles, of busy als er al een test of
        een taak in het cluster loopt.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FailoverStartInput" }
      responses:
        "202":
          description: In de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /test-runs:
    get:
      operationId: listTestRuns
      summary: Runs van failovertests en back-upcontroles, nieuwste eerst
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [failover.test, backup.verify] } }
        - { name: cluster_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: node_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: result, in: query, required: false, schema: { $ref: "#/components/schemas/TestRunResult" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRunList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /test-runs/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTestRun
      summary: Het rapport van één run
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /test-runs/{runId}/restore:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreTestRun
      summary: Opnieuw herstellen (admin)
      description: >-
        Voor een failoverrun met restored false: een taak door het
        clusterslot die de dienst start en de terugkeer controleert.
      responses:
        "202":
          description: In de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/drift:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNodeDrift
      summary: Drift van één node
      responses:
        "200":
          description: OK; nodes heeft hoogstens deze ene node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/drift/check:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkNodeDrift
      summary: Eén node nu controleren (admin)
      responses:
        "200":
          description: De drift na de controle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/spec-revisions:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSpecRevisions
      summary: De gewenste staat van een cluster uit een template, met elke revisie en wat ze veranderde
      description: >-
        Zonder template (een cluster dat met de hand is aangemaakt) is template
        null en zijn er geen revisies. notes zegt wat er niet klopt: een
        templateversie die niet in deze server zit, nodes die niet bij de spec
        passen, of een node die niet te renderen is.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecHistory" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/backup-policy:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBackupPolicy
      summary: Back-upbeleid van een cluster, of de standaard als het er nog geen heeft
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupPolicy" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateBackupPolicy
      summary: Back-upbeleid van een cluster wijzigen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupPolicyInput" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/backup-watch:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setBackupWatch
      summary: De lijst "ook bewaken" van een koppeling vervangen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupWatchInput" }
      responses:
        "200":
          description: Vervangen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs:
    get:
      operationId: listJobs
      summary: Recente taken, nieuwste eerst
      parameters:
        - { name: node_id, in: query, schema: { type: string, format: uuid } }
        - { name: cluster_id, in: query, schema: { type: string, format: uuid } }
        - { name: proxmox_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getJob
      summary: Eén taak met zijn stappen en uitvoer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/cancel:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelJob
      summary: Taak annuleren (admin); een lopende Proxmox-taak wordt gestopt
      responses:
        "202":
          description: Geannuleerd of annuleren gevraagd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/retry:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryJob
      summary: Een mislukte uitrol opnieuw proberen vanaf de mislukte stap (admin)
      responses:
        "202":
          description: Weer in de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /templates:
    get:
      operationId: listTemplates
      summary: De clustertemplates in deze server
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Error" }
  /deployments:
    post:
      operationId: deployCluster
      summary: Een nieuw cluster uitrollen uit een template (admin)
      description: |
        Maakt het cluster met zijn nodes (lifecycle provisioning) en start de
        uitrol als taak: VM's klonen in Proxmox, agents aanmelden, de stappen
        uitvoeren en controleren. Een validatiefout noemt het veld in field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployInput" }
      responses:
        "202":
          description: Uitrol gestart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /deployments/plan:
    post:
      operationId: planDeployment
      summary: Controleren wat een uitrol zou maken (admin)
      description: |
        Doet dezelfde controles als een uitrol en geeft de nodes die er zouden
        komen, met hun adres en Proxmox-host, zonder iets te maken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /dependency-graph:
    get:
      operationId: getDependencyGraph
      summary: De afhankelijkheidsgraaf in één aanroep
      description: |
        Groepen (clusters, losse nodes en Extern), diensten met hun eigen
        status, de doorgegeven uitval en hun instanties, en de pijlen. De
        status wordt over de hele graaf uitgerekend, ook met een filter. Met
        level=cluster komen er geen diensten en zijn de pijlen tussen groepen
        samengevoegd.
      parameters:
        - { name: cluster_id, in: query, required: false, description: Dat cluster plus zijn directe buren, schema: { type: string, format: uuid } }
        - { name: environment, in: query, required: false, description: De clusters van die omgeving plus hun directe buren, schema: { $ref: "#/components/schemas/Environment" } }
        - { name: include_suggested, in: query, required: false, description: Ook voorgestelde diensten, schema: { type: boolean } }
        - { name: include_ignored, in: query, required: false, description: Ook genegeerde diensten, om ze terug te zetten, schema: { type: boolean } }
        - { name: level, in: query, required: false, schema: { type: string, enum: [service, cluster] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyGraph" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /services:
    post:
      operationId: createService
      summary: Een dienst aanmaken in een cluster, op een losse node of extern (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepService" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /services/{serviceId}:
    parameters:
      - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateService
      summary: Een dienst wijzigen, of een voorstel bevestigen, negeren of terugzetten (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepService" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteService
      summary: Een dienst met zijn pijlen verwijderen (admin)
      description: Een dienst met een unit blijft als genegeerde rij staan, zodat hij niet opnieuw voorgesteld wordt.
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dependencies:
    post:
      operationId: createDependency
      summary: Vastleggen dat een dienst van een andere afhangt (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DependencyInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepEdge" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dependencies/{dependencyId}:
    parameters:
      - { name: dependencyId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateDependency
      summary: Sterkte of notitie van een afhankelijkheid wijzigen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DependencyPatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepEdge" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDependency
      summary: Een afhankelijkheid verwijderen (admin)
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /impact:
    get:
      operationId: getImpact
      summary: Wat raakt uitval van een dienst, cluster of node
      description: |
        Precies één van service_id, cluster_id en node_id. Alleen bekende
        afhankelijkheden; prod staat bovenaan. Bij een node telt een tweede
        gezonde instantie mee, net als de overname van het VIP.
      parameters:
        - { name: service_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: cluster_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: node_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Impact" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cf_session
  parameters:
    AuditBefore:
      name: before
      in: query
      description: Alleen regels met een kleiner id (de volgende pagina)
      schema: { type: integer, format: int64 }
    AuditFrom:
      name: from
      in: query
      description: Vanaf dit tijdstip
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      description: Tot (niet tot en met) dit tijdstip
      schema: { type: string, format: date-time }
    AuditUser:
      name: user
      in: query
      description: Wat deze gebruiker deed, wat namens hem gebeurde en wat over zijn account ging
      schema: { type: string, format: uuid }
    AuditActorType:
      name: actor_type
      in: query
      schema: { type: string, enum: [user, agent, system] }
    AuditCluster:
      name: cluster
      in: query
      description: Ook een verwijderd cluster
      schema: { type: string, format: uuid }
    AuditNode:
      name: node
      in: query
      description: Ook taken en agents van deze node
      schema: { type: string, format: uuid }
    AuditJob:
      name: job
      in: query
      schema: { type: string, format: uuid }
    AuditCategory:
      name: category
      in: query
      description: Een soort uit /audit/info
      schema: { type: string }
    AuditQuery:
      name: q
      in: query
      description: Zoekt in action, payload en de namen van gebruiker, cluster, node en taak
      schema: { type: string, maxLength: 200 }
  responses:
    Error:
      description: Fout
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stabiele foutcode, bijvoorbeeld invalid_credentials of totp_required
        message:
          type: string
        field:
          type: string
          description: Het veld met de fout, zoals params.vip, als de fout bij één veld hoort
        checks:
          type: array
          description: Bij precheck_failed de controles van de voorcontrole
          items: { $ref: "#/components/schemas/TestRunCheck" }
    Health:
      type: object
      required: [status, version, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        database: { type: string, enum: [ok, unreachable] }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        totp_code: { type: string, description: "Zescijferige code, alleen als TOTP aan staat" }
    Role:
      type: string
      enum: [admin, viewer]
    User:
      type: object
      required: [id, username, role, totp_enabled, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        totp_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    Me:
      type: object
      required: [user, csrf_token, session_expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        session_expires_at: { type: string, format: date-time }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12 }
    TotpSetup:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: { type: string }
        otpauth_url: { type: string }
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    TotpDisableRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string, format: password }
        code: { type: string }
    Event:
      type: object
      required: [id, ts, actor_type, actor_id, subject_type, subject_id, action, payload]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, agent, system] }
        actor_id: { type: string }
        subject_type: { type: string }
        subject_id: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        payload: { type: object, additionalProperties: true }
    BackupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    BackupFreshness:
      type: string
      enum: [ok, stale, missing, unknown]
      description: |
        ok: de nieuwste back-up is jonger dan de maximale leeftijd. stale: ze
        is ouder. missing: Proxmox heeft geen back-up. unknown: de back-ups
        van de koppeling zijn niet te lezen.
    BackupVolume:
      type: object
      required: [volid, storage, host, time, size, format, notes, protected, verify]
      properties:
        volid: { type: string }
        storage: { type: string }
        host:
          type: string
          description: De Proxmox-host waarlangs de back-up gelezen is
        time: { type: string, format: date-time }
        size: { type: integer, format: int64 }
        format: { type: string }
        notes: { type: string }
        protected: { type: boolean }
        verify:
          type: string
          description: Verificatie door Proxmox Backup Server; leeg als die er niet is
          enum: ["", ok, failed]
    BackupItem:
      type: object
      required: [connection_id, connection_name, vmid, name, label, guest_type, node, cluster, watched, freshness, reason, since, max_age_hours, latest, count,
        last_verification]
      properties:
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        vmid: { type: integer }
        name:
          type: string
          description: Naam van de VM in Proxmox; leeg als hij er niet meer is
        label:
          type: string
          description: Het label uit de lijst "ook bewaken"
        guest_type: { type: string }
        node:
          allOf: [{ $ref: "#/components/schemas/BackupRef" }]
          nullable: true
        cluster:
          allOf: [{ $ref: "#/components/schemas/BackupRef" }]
          nullable: true
        watched:
          type: boolean
          description: Bewaakt via de lijst "ook bewaken" in plaats van via een node
        freshness: { $ref: "#/components/schemas/BackupFreshness" }
        reason:
          type: string
          description: Waarom de stand niet ok is
        since:
          type: string
          format: date-time
          nullable: true
        max_age_hours: { type: integer }
        latest:
          allOf: [{ $ref: "#/components/schemas/BackupVolume" }]
          nullable: true
        count: { type: integer }
        last_verification:
          allOf: [{ $ref: "#/components/schemas/BackupVerification" }]
          nullable: true
          description: De laatste afgeronde back-upcontrole van de node
    BackupVerification:
      type: object
      required: [run_id, result, summary, finished_at, recovery_seconds]
      properties:
        run_id: { type: string, format: uuid }
        result: { $ref: "#/components/schemas/TestRunResult" }
        summary: { type: string }
        finished_at: { type: string, format: date-time, nullable: true }
        recovery_seconds:
          type: number
          format: double
          nullable: true
          description: Hersteltijd, terugzetten plus opstarten
    BackupSandbox:
      type: object
      required: [id, connection_id, connection_name, vmid, source_vmid, source, run_id, running, volid, state, host, storage, error,
        created_at, destroyed_at]
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        vmid: { type: integer, description: Het VMID van de sandbox }
        source_vmid: { type: integer, description: Het VMID van de VM waarvan de back-up is }
        source:
          allOf: [{ $ref: "#/components/schemas/BackupRef" }]
          nullable: true
          description: De node van de bron-VM
        run_id: { type: string, format: uuid, nullable: true }
        running: { type: boolean, description: De controle van deze sandbox loopt nog }
        volid: { type: string }
        state:
          type: string
          enum: [reserved, present, destroyed, destroy_failed, none]
          description: none als de VM er nooit kwam of niet (meer) in pool cf-sandbox zit
        host: { type: string }
        storage: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        destroyed_at: { type: string, format: date-time, nullable: true }
    BackupVerifyInput:
      type: object
      properties:
        volid: { type: string, description: Een andere back-up van dezelfde VM; leeg is de nieuwste }
    BackupVerifyDefinition:
      type: object
      required: [volid, backup_time, size, format, backup_storage, connection_id, connection_name, source_vmid, guest_name, chosen]
      properties:
        volid: { type: string }
        backup_time: { type: string, format: date-time }
        size: { type: integer, format: int64 }
        format: { type: string }
        backup_storage: { type: string }
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        source_vmid: { type: integer }
        guest_name: { type: string }
        chosen: { type: boolean, description: Iemand koos deze back-up; anders de nieuwste }
    BackupVerifyMeasurements:
      type: object
      required: [restore_seconds, boot_seconds, check_seconds, cleanup_seconds, total_seconds, host, storage, sandbox_vmid, hostname, os,
        filesystems, destroyed_at]
      properties:
        restore_seconds: { type: number, format: double, nullable: true }
        boot_seconds: { type: number, format: double, nullable: true, description: Van starten tot de guest agent antwoordt }
        check_seconds: { type: number, format: double, nullable: true }
        cleanup_seconds: { type: number, format: double, nullable: true }
        total_seconds: { type: number, format: double, nullable: true }
        host: { type: string }
        storage: { type: string, description: De sandbox-storage }
        sandbox_vmid: { type: integer }
        hostname: { type: string, description: Wat de guest agent als hostname gaf }
        os: { type: string }
        filesystems: { type: integer }
        destroyed_at: { type: string, format: date-time, nullable: true }
    BackupVerifyReport:
      type: object
      required: [definition, measurements, sandbox]
      properties:
        definition: { $ref: "#/components/schemas/BackupVerifyDefinition" }
        measurements: { $ref: "#/components/schemas/BackupVerifyMeasurements" }
        sandbox:
          allOf: [{ $ref: "#/components/schemas/BackupSandbox" }]
          nullable: true
    BackupUncovered:
      type: object
      required: [vmid, name, type, node]
      properties:
        vmid: { type: integer }
        name: { type: string }
        type: { type: string }
        node:
          allOf: [{ $ref: "#/components/schemas/BackupRef" }]
          nullable: true
    BackupConnection:
      type: object
      required: [id, name, checked_at, error, watch, not_backed_up, backup_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: Laatste poging om de back-ups te lezen
        error: { type: string }
        watch:
          type: array
          description: De lijst "ook bewaken"
          items: { $ref: "#/components/schemas/BackupWatchEntry" }
        not_backed_up:
          type: array
          nullable: true
          description: VM's die in geen back-upjob zitten; null als Proxmox dat niet liet lezen
          items: { $ref: "#/components/schemas/BackupUncovered" }
        backup_count: { type: integer }
    BackupClusterState:
      type: object
      required: [id, freshness]
      properties:
        id: { type: string, format: uuid }
        freshness: { $ref: "#/components/schemas/BackupFreshness" }
    BackupOverview:
      type: object
      required: [items, connections, clusters, sandboxes]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BackupItem" }
        connections:
          type: array
          items: { $ref: "#/components/schemas/BackupConnection" }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/BackupClusterState" }
        sandboxes:
          type: array
          description: Sandboxes die nog kunnen bestaan, ook na een mislukte verwijdering
          items: { $ref: "#/components/schemas/BackupSandbox" }
    NodeBackups:
      type: object
      required: [item, backups]
      properties:
        item:
          allOf: [{ $ref: "#/components/schemas/BackupItem" }]
          nullable: true
        backups:
          type: array
          items: { $ref: "#/components/schemas/BackupVolume" }
    DriftReport:
      type: object
      required: [source, notes, nodes]
      properties:
        source:
          allOf: [{ $ref: "#/components/schemas/DriftSource" }]
          nullable: true
        notes:
          type: array
          description: Wat de vergelijking beïnvloedt, zoals een nieuwere templateversie of een afwijkend lidmaatschap
          items: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/DriftNode" } }
    DriftSource:
      type: object
      required: [kind, template, template_version, spec_revision, baseline_at, items]
      properties:
        kind: { type: string, enum: [template, baseline] }
        template: { type: string, description: Leeg bij een baseline }
        template_version: { type: string }
        spec_revision: { type: integer }
        baseline_at: { type: string, format: date-time, nullable: true, description: Wanneer de baseline het laatst is vastgelegd }
        items:
          allOf: [{ $ref: "#/components/schemas/BaselineItems" }]
          nullable: true
          description: Wat de baseline vastlegt; null bij een template
    BaselineItems:
      type: object
      required: [packages, services, files]
      properties:
        packages: { type: array, items: { type: string } }
        services: { type: array, items: { type: string } }
        files: { type: array, items: { type: string } }
    BaselineInput:
      type: object
      required: [node_ids, packages, services, files]
      properties:
        node_ids: { type: array, items: { type: string, format: uuid } }
        packages: { type: array, items: { type: string } }
        services: { type: array, items: { type: string } }
        files: { type: array, items: { type: string }, description: Volledige paden van bestanden of mappen }
        preview: { type: boolean, description: Alleen tonen wat er vastgelegd zou worden }
    BaselineResult:
      type: object
      required: [revision, nodes]
      properties:
        revision: { type: integer, description: De nieuwe spec-revisie; 0 bij preview }
        nodes: { type: array, items: { $ref: "#/components/schemas/BaselineNode" } }
    BaselineNode:
      type: object
      required: [node_id, hostname, items, notes]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/BaselineItem" } }
        notes: { type: array, items: { type: string }, description: Wat niet vastgelegd werd en waarom }
    BaselineItem:
      type: object
      required: [kind, name, version, enabled, active, mode, owner, group, size, content]
      properties:
        kind: { type: string, enum: [package, service, file, directory] }
        name: { type: string }
        version: { type: string }
        enabled: { type: boolean, nullable: true }
        active: { type: boolean, nullable: true }
        mode: { type: string }
        owner: { type: string }
        group: { type: string }
        size: { type: integer, format: int64 }
        content: { type: boolean, description: Of de inhoud vergeleken wordt }
    DriftIgnoreInput:
      type: object
      required: [key, reason]
      properties:
        node_id: { type: string, format: uuid, nullable: true, description: Leeg voor het hele cluster }
        key: { type: string }
        reason: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
    DriftIgnore:
      type: object
      required: [id, node_id, hostname, key, reason, expires_at, expired, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string, nullable: true }
        key: { type: string }
        reason: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }
        created_by:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        created_at: { type: string, format: date-time }
    DriftIgnoreList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DriftIgnore" } }
    FailoverScenario:
      type: string
      enum: [keepalived_stop, service_stop, vm_hard_stop]
    FailoverProbeHTTP:
      type: object
      required: [path, expect]
      properties:
        path: { type: string, description: "Begint met /, zoals /health" }
        expect: { type: integer, description: De verwachte HTTP-status }
    FailoverProbeTCP:
      type: object
      required: [port]
      properties:
        port: { type: integer }
    FailoverProbe:
      type: object
      description: Een HTTP-pad met de verwachte status, of een TCP-poort. De host is altijd het VIP.
      properties:
        http: { $ref: "#/components/schemas/FailoverProbeHTTP" }
        tcp: { $ref: "#/components/schemas/FailoverProbeTCP" }
    FailoverTestInput:
      type: object
      required: [name, vip_id, scenario, max_takeover_seconds, expect_failback, probe]
      properties:
        name: { type: string }
        vip_id: { type: string, format: uuid }
        scenario: { $ref: "#/components/schemas/FailoverScenario" }
        service: { type: string, description: nginx of haproxy bij service_stop }
        max_takeover_seconds: { type: integer, description: 1 tot 120 }
        expect_failback: { type: boolean, description: Het VIP moet daarna terug naar de oorspronkelijke node }
        probe: { $ref: "#/components/schemas/FailoverProbe" }
        scheduled: { type: boolean, description: "Gepland in het testvenster; niet op prod. Standaard uit" }
    FailoverStartInput:
      type: object
      properties:
        confirm: { type: string, description: Op prod de slug van het cluster }
    FailoverTest:
      type: object
      required: [id, cluster_id, vip_id, vip_address, vip_owner, vip_owner_id, name, scenario, service, description, max_takeover_seconds,
        expect_failback, probe, scheduled, next_run_at, last_run, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        vip_id: { type: string, format: uuid }
        vip_address: { type: string }
        vip_owner: { type: string, nullable: true, description: De node die het VIP nu heeft }
        vip_owner_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        scenario: { $ref: "#/components/schemas/FailoverScenario" }
        service: { type: string }
        description: { type: string, description: "Het scenario in gewone taal, zoals keepalived stoppen op de eigenaar" }
        max_takeover_seconds: { type: integer }
        expect_failback: { type: boolean }
        probe: { $ref: "#/components/schemas/FailoverProbe" }
        scheduled: { type: boolean, description: Gepland in het testvenster }
        next_run_at: { type: string, format: date-time, nullable: true, description: De volgende geplande run }
        last_run:
          allOf: [{ $ref: "#/components/schemas/TestRun" }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FailoverScenarioOption:
      type: object
      required: [key, label, available, reason, default_seconds, units]
      properties:
        key: { $ref: "#/components/schemas/FailoverScenario" }
        label: { type: string }
        available: { type: boolean }
        reason: { type: string, description: Waarom het scenario hier nu niet kan }
        default_seconds: { type: integer }
        units: { type: array, items: { type: string }, description: De diensten die service_stop hier kan stoppen }
    FailoverVIPOption:
      type: object
      required: [id, address, owner_hostname, probe]
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        owner_hostname: { type: string, nullable: true }
        probe: { $ref: "#/components/schemas/FailoverProbe" }
    FailoverOptions:
      type: object
      required: [scenarios, vips, default_failback, prod, slug, window, next_window, last_tested_at]
      properties:
        scenarios: { type: array, items: { $ref: "#/components/schemas/FailoverScenarioOption" } }
        vips: { type: array, items: { $ref: "#/components/schemas/FailoverVIPOption" } }
        default_failback: { type: boolean, description: "Aan voor clusters uit een template met failback (keepalived met preempt), zoals keepalived-nginx" }
        prod:
          type: boolean
          description: >-
            Prodcluster: een test start alleen met de hand, met de slug als
            bevestiging en tweestapsverificatie, en is niet te plannen
        slug: { type: string }
        window: { type: string, description: "Het testvenster in gewone taal, zoals zondag van 03:00 tot 05:00" }
        next_window: { type: string, format: date-time, description: Het begin van het volgende testvenster }
        last_tested_at: { type: string, format: date-time, nullable: true, description: "De laatste test met PASS, WARNING of FAIL" }
    FailoverTestList:
      type: object
      required: [items, options, unrestored]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FailoverTest" } }
        options: { $ref: "#/components/schemas/FailoverOptions" }
        unrestored:
          type: array
          description: Runs waarvan het herstel niet lukte
          items: { $ref: "#/components/schemas/TestRun" }
    TestRunResult:
      type: string
      enum: [pass, warning, fail, error, skipped, canceled]
    TestRunCheck:
      type: object
      required: [name, ok, detail, warning]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }
        warning: { type: boolean, description: "Niet in orde, maar geen reden om af te keuren" }
    TestRunEvent:
      type: object
      required: [t_ms, kind, text]
      properties:
        t_ms: { type: integer, format: int64, description: "Milliseconden na de storing, of bij een back-upcontrole na de start" }
        kind: { type: string, enum: [fault, down, up, takeover, clear, ready, return, step] }
        text: { type: string }
    TestRunSegment:
      type: object
      required: [from_ms, to_ms, ok]
      properties:
        from_ms: { type: integer, format: int64 }
        to_ms: { type: integer, format: int64 }
        ok: { type: boolean }
    FailoverMeasurements:
      type: object
      required: [downtime_ms, expect_ms, window_ms, takeover_node, takeover_node_id, takeover_ms, failback_ms, returned_to, end_ms, probe]
      properties:
        downtime_ms: { type: integer, format: int64, nullable: true, description: Van de eerste mislukte probe tot de eerste van drie goede op rij }
        expect_ms: { type: integer, format: int64 }
        window_ms: { type: integer, format: int64 }
        takeover_node: { type: string }
        takeover_node_id: { type: string, format: uuid, nullable: true }
        takeover_ms: { type: integer, format: int64, nullable: true, description: Wanneer een verse heartbeat de overname bevestigde }
        failback_ms: { type: integer, format: int64, nullable: true, description: De onderbreking bij de terugkeer }
        returned_to: { type: string }
        end_ms: { type: integer, format: int64 }
        probe: { type: array, items: { $ref: "#/components/schemas/TestRunSegment" } }
    FailoverDefinition:
      type: object
      required: [test_id, name, scenario, service, unit, vip, max_takeover_seconds, expect_failback, probe, description]
      properties:
        test_id: { type: string, format: uuid }
        name: { type: string }
        scenario: { $ref: "#/components/schemas/FailoverScenario" }
        service: { type: string }
        unit: { type: string }
        vip: { type: string }
        max_takeover_seconds: { type: integer }
        expect_failback: { type: boolean }
        probe: { $ref: "#/components/schemas/FailoverProbe" }
        description: { type: string }
    TestRun:
      type: object
      required: [id, kind, trigger, cluster_id, cluster_name, test_id, node_id, hostname, job_id, job_status, result, restored,
        summary, checks, timeline, measurements, definition, backup, requested_by, created_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [failover.test, backup.verify] }
        trigger: { type: string, enum: [manual, schedule] }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        test_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string, description: "De node die de storing kreeg, of waarvan de back-up gecontroleerd werd" }
        job_id: { type: string, format: uuid, nullable: true }
        job_status:
          allOf: [{ $ref: "#/components/schemas/JobStatus" }]
          nullable: true
        result:
          allOf: [{ $ref: "#/components/schemas/TestRunResult" }]
          nullable: true
          description: Leeg zolang de taak wacht of loopt
        restored: { type: boolean, nullable: true, description: false als het herstel niet lukte; leeg als er niets te herstellen was }
        summary: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/TestRunCheck" } }
        timeline: { type: array, items: { $ref: "#/components/schemas/TestRunEvent" } }
        measurements:
          allOf: [{ $ref: "#/components/schemas/FailoverMeasurements" }]
          nullable: true
          description: Alleen bij failover.test
        definition:
          allOf: [{ $ref: "#/components/schemas/FailoverDefinition" }]
          nullable: true
          description: Alleen bij failover.test
        backup:
          allOf: [{ $ref: "#/components/schemas/BackupVerifyReport" }]
          nullable: true
          description: Alleen bij backup.verify
        requested_by: { type: string, nullable: true, description: Gebruikersnaam van wie de run vroeg }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    TestRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TestRun" } }
    DriftNode:
      type: object
      required: [node_id, hostname, status, checked_at, drift_since, spec_revision, findings, unchecked, error, skipped, agent_too_old]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        status:
          type: string
          description: unknown als de node nog nooit gecontroleerd is; none als hij niet in de gewenste staat staat
          enum: [in_sync, drift, error, none, unknown]
        checked_at: { type: string, format: date-time, nullable: true }
        drift_since: { type: string, format: date-time, nullable: true }
        spec_revision: { type: integer, description: De revisie van de laatste controle }
        findings:
          type: array
          description: Bij status error de afwijkingen van de laatste geslaagde controle
          items: { $ref: "#/components/schemas/DriftFinding" }
        unchecked: { type: array, items: { $ref: "#/components/schemas/DriftUnchecked" } }
        error: { type: string }
        skipped:
          type: string
          description: Waarom de node nu niet gecontroleerd wordt, zoals "agent te oud voor driftcontrole"; leeg als hij wel gecontroleerd wordt
        agent_too_old: { type: boolean }
    DriftFinding:
      type: object
      required: [key, step, kind, title, aspect, expected, actual, detail, mtime, since, fingerprint, ignored, ignore_id]
      properties:
        key: { type: string, description: "Stap en aspect, zoals file:/etc/keepalived/keepalived.conf:content" }
        step: { type: string, description: "De stap, zoals file:/etc/keepalived/keepalived.conf" }
        kind: { type: string, enum: [package, file, directory, service, user, command] }
        title: { type: string }
        aspect: { type: string, enum: [exists, type, content, mode, owner, group, installed, loaded, enabled, active, creates] }
        expected: { type: string }
        actual: { type: string }
        detail: { type: string }
        mtime: { type: string, format: date-time, nullable: true, description: Wanneer het bestand op de node veranderde }
        since: { type: string, format: date-time }
        fingerprint: { type: string, description: HMAC van de waargenomen waarde; verandert als er op de node opnieuw iets wijzigt }
        ignored: { type: boolean, description: Een negeerregel dekt deze stap; telt niet voor de status }
        ignore_id: { type: string, format: uuid, nullable: true }
    RemediationInput:
      type: object
      required: [nodes]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/RemediationChoice" } }
        confirm: { type: string, description: Op prod de slug van het cluster }
        preview: { type: boolean, description: "Alleen het plan tonen, zonder iets te starten" }
    RemediationChoice:
      type: object
      required: [node_id, steps]
      properties:
        node_id: { type: string, format: uuid }
        steps: { type: array, items: { $ref: "#/components/schemas/RemediationStepChoice" } }
    RemediationStepChoice:
      type: object
      required: [step, fingerprints]
      properties:
        step: { type: string, description: "De stap, zoals file:/etc/keepalived/keepalived.conf" }
        fingerprints: { type: array, items: { type: string }, description: De vingerafdrukken van de afwijkingen van die stap die getoond werden }
    RemediationResult:
      type: object
      required: [plan, job]
      properties:
        plan: { $ref: "#/components/schemas/RemediationPlan" }
        job:
          allOf: [{ $ref: "#/components/schemas/Job" }]
          nullable: true
          description: null bij preview
    RemediationPlan:
      type: object
      required: [cluster_id, cluster, slug, environment, template, version, revision, needs_confirmation, nodes, notes]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster: { type: string }
        slug: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
        template: { type: string }
        version: { type: string }
        revision: { type: integer }
        needs_confirmation: { type: boolean, description: Op prod moet de slug ingetikt worden }
        nodes: { type: array, items: { $ref: "#/components/schemas/RemediationPlanNode" }, description: In de volgorde van de taak }
        notes: { type: array, items: { type: string }, description: "Wat er hoogstens kan gebeuren, in gewone zinnen" }
    RemediationPlanNode:
      type: object
      required: [node_id, hostname, vips, steps, ignored]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        vips: { type: array, items: { type: string }, description: De VIP's die de node nu heeft; zo'n node komt als laatste }
        steps: { type: array, items: { $ref: "#/components/schemas/RemediationPlanStep" } }
        ignored: { type: array, items: { type: string }, description: Genegeerde stappen die blijven zoals ze zijn }
    RemediationPlanStep:
      type: object
      required: [step, title, action]
      properties:
        step: { type: string }
        title: { type: string }
        action: { type: string, description: "Wat er gebeurt, zoals: bestand /etc/keepalived/keepalived.conf overschrijven, daarna keepalived herladen" }
    DriftUnchecked:
      type: object
      required: [step, title, reason]
      properties:
        step: { type: string }
        title: { type: string }
        reason: { type: string }
    ClusterDriftSummary:
      type: object
      required: [status, nodes_with_drift, checked_at]
      properties:
        status:
          type: string
          description: none zonder gewenste staat; unknown als niet elke actieve node het laatste uur gecontroleerd is
          enum: [in_sync, drift, unknown, none]
        nodes_with_drift: { type: integer }
        checked_at: { type: string, format: date-time, nullable: true, description: De oudste laatste controle van de actieve nodes }
    SpecHistory:
      type: object
      required: [template, revision, params, notes, items]
      properties:
        template:
          allOf: [{ $ref: "#/components/schemas/SpecTemplate" }]
          nullable: true
        revision: { type: integer, description: Huidige revisie; 0 zonder spec }
        params:
          type: array
          description: De parameters van de huidige revisie; van een geheim alleen dat het opgeslagen is
          items: { $ref: "#/components/schemas/SpecParam" }
        notes:
          type: array
          items: { type: string }
        items:
          type: array
          description: Nieuwste eerst
          items: { $ref: "#/components/schemas/SpecRevision" }
    SpecTemplate:
      type: object
      required: [name, version, available, latest]
      properties:
        name: { type: string }
        version: { type: string }
        available:
          type: boolean
          description: Deze versie zit in de server
        latest:
          type: string
          nullable: true
          description: De nieuwste versie in de server
    SpecParam:
      type: object
      required: [name, label, value, secret]
      properties:
        name: { type: string }
        label: { type: string }
        value: { type: string, nullable: true }
        secret: { type: boolean }
    SpecRevision:
      type: object
      required: [revision, source, created_at, created_by, template, template_version, nodes, changes]
      properties:
        revision: { type: integer }
        source: { type: string, enum: [ui, api, git] }
        created_at: { type: string, format: date-time }
        created_by:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        template: { type: string }
        template_version: { type: string }
        nodes:
          type: array
          items: { type: string }
        changes:
          type: array
          description: Wat er veranderde tegenover de vorige revisie; leeg bij de eerste
          items: { $ref: "#/components/schemas/SpecChange" }
    SpecChange:
      type: object
      required: [label, from, to]
      properties:
        label: { type: string }
        from: { type: string }
        to: { type: string }
    BackupPolicy:
      type: object
      required: [max_age_hours, default, verify_enabled, next_run_at, last_verified_at, window]
      properties:
        max_age_hours: { type: integer }
        default:
          type: boolean
          description: Het cluster heeft nog geen eigen beleid
        verify_enabled:
          type: boolean
          description: >-
            De back-upcontrole draait gepland in het testvenster, telkens voor
            de node die het langst niet gecontroleerd werd
        next_run_at: { type: string, format: date-time, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true, description: De laatste controle van een node van dit cluster }
        window: { type: string, description: Het testvenster in gewone taal }
    BackupPolicyInput:
      type: object
      description: Alleen de velden die meegegeven zijn, veranderen
      properties:
        max_age_hours: { type: integer, minimum: 1, maximum: 720 }
        verify_enabled: { type: boolean }
    BackupWatchEntry:
      type: object
      required: [vmid, label]
      properties:
        vmid: { type: integer }
        label: { type: string, maxLength: 100 }
    BackupWatchInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/BackupWatchEntry" }
    AuditRef:
      type: object
      required: [id, name, deleted]
      properties:
        id: { type: string }
        name: { type: string }
        deleted: { type: boolean }
    AuditChange:
      type: object
      required: [field, label, from, to]
      description: Eén gewijzigd veld; een lege waarde betekent geen waarde.
      properties:
        field: { type: string }
        label: { type: string }
        from: { type: string }
        to: { type: string }
    AuditEntry:
      type: object
      required: [id, ts, action, category, summary, actor, on_behalf_of, subject, cluster, node, job, ip, session, changes, payload]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        action: { type: string }
        category: { type: string }
        summary:
          type: string
          description: Wat er gebeurde, als Nederlandse zin
        actor:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [user, agent, system] }
            id: { type: string }
            name: { type: string }
        on_behalf_of:
          description: De gebruiker die de taak aanvroeg, als het systeem dit namens hem deed
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        subject:
          type: object
          required: [type, id, name, deleted]
          properties:
            type: { type: string }
            id: { type: string }
            name: { type: string }
            deleted: { type: boolean }
        cluster:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        node:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        job:
          allOf: [{ $ref: "#/components/schemas/AuditRef" }]
          nullable: true
        ip: { type: string, nullable: true }
        session:
          type: string
          nullable: true
          description: Het begin van de sessiehash; regels met dezelfde waarde komen uit dezelfde login
        changes:
          type: array
          items: { $ref: "#/components/schemas/AuditChange" }
        payload: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_before:
          type: integer
          format: int64
          nullable: true
          description: Geef dit mee als before voor de volgende pagina; null op de laatste
    AuditInfo:
      type: object
      required: [categories, users, deleted_clusters, deleted_nodes, total, oldest]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        users:
          type: array
          items:
            type: object
            required: [id, username, disabled]
            properties:
              id: { type: string, format: uuid }
              username: { type: string }
              disabled: { type: boolean }
        deleted_clusters:
          type: array
          items: { $ref: "#/components/schemas/AuditRef" }
        deleted_nodes:
          type: array
          items: { $ref: "#/components/schemas/AuditRef" }
        total: { type: integer, format: int64 }
        oldest: { type: string, format: date-time, nullable: true }
    UserRef:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
    ClusterType:
      type: string
      enum: [keepalived, nginx, docker, cron, postgresql_ha, mariadb_ha, generic]
    Environment:
      type: string
      enum: [lab, test, prod]
    NodeLifecycle:
      type: string
      enum: [provisioning, active, maintenance, draining, decommissioned]
    Status:
      type: string
      description: |
        Berekend uit heartbeats, metrics en VIP's (zie internal/status).
        unknown betekent: geen agent of nog geen gegevens.
      enum: [unknown, healthy, degraded, down, split_brain]
    Cluster:
      type: object
      required: [id, slug, name, description, type, environment, status, status_reason, status_since, tags, git_repo_url, template_name, template_version, spec_revision, created_at, updated_at]
      properties:
        template_name: { type: string, nullable: true, description: De template waaruit het cluster is uitgerold }
        template_version: { type: string, nullable: true }
        spec_revision: { type: integer, description: Revisie van de gewenste staat; 0 zonder spec }
        id: { type: string, format: uuid }
        slug: { type: string, description: "Korte unieke naam, bijvoorbeeld webcluster-prod" }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/ClusterType" }
        environment: { $ref: "#/components/schemas/Environment" }
        status: { $ref: "#/components/schemas/Status" }
        status_reason: { type: string, description: Waarom de status niet healthy is }
        status_since: { type: string, format: date-time, nullable: true }
        tags: { type: array, items: { type: string } }
        git_repo_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClusterListItem:
      allOf:
        - $ref: "#/components/schemas/Cluster"
        - type: object
          required: [node_count, vip_count, vips, drift, impact, impacted_by]
          properties:
            node_count: { type: integer }
            vip_count: { type: integer }
            drift: { $ref: "#/components/schemas/ClusterDriftSummary" }
            impact:
              description: >-
                De ergste doorgegeven uitval op de bevestigde diensten van dit
                cluster, langs bekende afhankelijkheden van buiten; uitval
                binnen het cluster zegt de status al
              allOf: [{ $ref: "#/components/schemas/ServiceImpact" }]
            impacted_by: { type: array, items: { type: string }, description: "De clusters, nodes of extern waar die uitval begint, zoals db-prod" }
            vips:
              type: array
              description: De VIP's met hun huidige eigenaar
              items: { $ref: "#/components/schemas/VipOwner" }
    ClusterDetail:
      allOf:
        - $ref: "#/components/schemas/Cluster"
        - type: object
          required: [owners, nodes, vips]
          properties:
            owners: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
            nodes: { type: array, items: { $ref: "#/components/schemas/Node" } }
            vips: { type: array, items: { $ref: "#/components/schemas/Vip" } }
    ClusterInput:
      type: object
      required: [slug, name, type, environment]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/ClusterType" }
        environment: { $ref: "#/components/schemas/Environment" }
        git_repo_url: { type: string }
        tags: { type: array, items: { type: string } }
        owner_ids: { type: array, items: { type: string, format: uuid } }
    ClusterPatch:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/ClusterType" }
        environment: { $ref: "#/components/schemas/Environment" }
        git_repo_url: { type: string }
        tags: { type: array, items: { type: string } }
        owner_ids: { type: array, items: { type: string, format: uuid } }
    Node:
      type: object
      required: [id, cluster_id, cluster_slug, cluster_name, hostname, role, description, lifecycle, primary_ip, tags, created_at, updated_at, agent, status, status_reason, status_since, proxmox, drift_status]
      properties:
        id: { type: string, format: uuid }
        drift_status:
          type: string
          nullable: true
          description: De laatste driftcontrole, of null als de node nooit gecontroleerd is
          enum: [in_sync, drift, error, none]
        proxmox:
          description: De gekoppelde VM of container in Proxmox, of null
          nullable: true
          allOf: [{ $ref: "#/components/schemas/NodeProxmox" }]
        status: { $ref: "#/components/schemas/Status" }
        status_reason: { type: string, description: Waarom de status niet healthy is }
        status_since: { type: string, format: date-time, nullable: true }
        agent:
          description: De actieve agent, of null als er (nog) geen agent is
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AgentSummary" }]
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_slug: { type: string, nullable: true }
        cluster_name: { type: string, nullable: true }
        hostname: { type: string }
        role: { type: string }
        description: { type: string }
        lifecycle: { $ref: "#/components/schemas/NodeLifecycle" }
        primary_ip: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NodeInput:
      type: object
      required: [hostname]
      properties:
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        role: { type: string }
        description: { type: string }
        lifecycle: { $ref: "#/components/schemas/NodeLifecycle" }
        primary_ip: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        proxmox:
          description: Koppeling met een VM of container in Proxmox; null koppelt los
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ProxmoxLink" }]
    NodePatch:
      type: object
      properties:
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        role: { type: string }
        description: { type: string }
        lifecycle: { $ref: "#/components/schemas/NodeLifecycle" }
        primary_ip: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        proxmox:
          description: Koppeling met een VM of container in Proxmox; null koppelt los
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ProxmoxLink" }]
    Vip:
      type: object
      required: [id, cluster_id, address, interface, vrid, description, owner_node_id, owner_hostname, owner_since]
      properties:
        id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
        address: { type: string }
        interface: { type: string }
        vrid: { type: integer, nullable: true }
        description: { type: string }
        owner_node_id: { type: string, format: uuid, nullable: true }
        owner_hostname: { type: string, nullable: true }
        owner_since: { type: string, format: date-time, nullable: true }
    VipOwner:
      type: object
      required: [address, owner_hostname]
      properties:
        address: { type: string }
        owner_hostname: { type: string, nullable: true }
    VipInput:
      type: object
      required: [address]
      properties:
        address: { type: string }
        interface: { type: string }
        vrid: { type: integer, nullable: true }
        description: { type: string }
    VipPatch:
      type: object
      properties:
        address: { type: string }
        interface: { type: string }
        vrid: { type: integer, nullable: true }
        description: { type: string }
    AgentConnection:
      type: string
      description: online bij een heartbeat in de laatste 30 s, late tot 90 s, daarna offline
      enum: [online, late, offline]
    AgentSummary:
      type: object
      required: [id, version, enrolled_at, last_seen_at, connection, commands]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        commands: { type: boolean, description: "De agent kan commando's uitvoeren (herstarten, onderhoud); oudere agents niet" }
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
        connection: { $ref: "#/components/schemas/AgentConnection" }
    NodeRuntime:
      type: object
      required: [facts, collected_at, changed_at, heartbeat]
      properties:
        facts:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Facts" }]
        collected_at: { type: string, format: date-time, nullable: true }
        changed_at: { type: string, format: date-time, nullable: true }
        heartbeat:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/HeartbeatStatus" }]
    HeartbeatStatus:
      type: object
      required: [received_at, uptime_seconds, load, addresses, services]
      properties:
        received_at: { type: string, format: date-time }
        uptime_seconds: { type: integer, format: int64 }
        load: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        addresses: { type: array, items: { type: string } }
        services: { type: object, additionalProperties: { type: string } }
    Facts:
      type: object
      description: Zoals de agent ze verzamelt; zie pkg/protocol
      required: [hostname, machine_id, os, kernel, arch, virtualization, cpus, memory_bytes, swap_bytes, boot_time, primary_address, interfaces, filesystems, services, docker, keepalived, upgrades]
      properties:
        hostname: { type: string }
        machine_id: { type: string }
        os:
          type: object
          required: [id, version_id, codename, pretty_name]
          properties:
            id: { type: string }
            version_id: { type: string }
            codename: { type: string }
            pretty_name: { type: string }
        kernel: { type: string }
        arch: { type: string }
        virtualization: { type: string }
        cpus: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        swap_bytes: { type: integer, format: int64 }
        boot_time: { type: string, format: date-time }
        primary_address: { type: string }
        interfaces:
          type: array
          nullable: true
          items:
            type: object
            required: [name, mac, up, addresses]
            properties:
              name: { type: string }
              mac: { type: string }
              up: { type: boolean }
              addresses: { type: array, nullable: true, items: { type: string } }
        filesystems:
          type: array
          nullable: true
          items:
            type: object
            required: [mount, device, type, size_bytes, used_bytes]
            properties:
              mount: { type: string }
              device: { type: string }
              type: { type: string }
              size_bytes: { type: integer, format: int64 }
              used_bytes: { type: integer, format: int64 }
        services:
          type: array
          nullable: true
          items:
            type: object
            required: [name, active, enabled]
            properties:
              name: { type: string }
              active: { type: string }
              enabled: { type: string }
        docker:
          type: object
          nullable: true
          required: [version, containers]
          properties:
            version: { type: string }
            containers: { type: integer }
        keepalived:
          type: object
          nullable: true
          required: [active, vips]
          properties:
            active: { type: string }
            vips: { type: array, nullable: true, items: { type: string } }
        upgrades:
          type: object
          nullable: true
          required: [total, security, packages]
          properties:
            total: { type: integer }
            security: { type: integer }
            packages: { type: array, nullable: true, items: { type: string } }
    EnrollmentToken:
      type: object
      required: [id, description, node_id, node_hostname, cluster_id, cluster_name, max_uses, uses, expires_at, created_at, created_by]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        node_id: { type: string, format: uuid, nullable: true }
        node_hostname: { type: string, nullable: true }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string, nullable: true }
        max_uses: { type: integer }
        uses: { type: integer }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { type: string, nullable: true, description: Gebruikersnaam }
    EnrollmentTokenInput:
      type: object
      properties:
        description: { type: string }
        node_id: { type: string, format: uuid, nullable: true, description: Alleen deze bestaande node mag zich ermee aanmelden }
        cluster_id: { type: string, format: uuid, nullable: true, description: Nieuwe nodes komen in dit cluster }
        max_uses: { type: integer, minimum: 1, maximum: 100, description: Standaard 1 }
        ttl_hours: { type: integer, minimum: 1, maximum: 720, description: Standaard 24 }
    NewEnrollmentToken:
      allOf:
        - { $ref: "#/components/schemas/EnrollmentToken" }
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Alleen nu zichtbaar }
    EnrollRequest:
      type: object
      required: [token, nkey_public, hostname, machine_id, agent_version, protocol_version]
      properties:
        token: { type: string }
        nkey_public: { type: string }
        hostname: { type: string }
        machine_id: { type: string }
        agent_version: { type: string }
        protocol_version: { type: integer }
    EnrollResponse:
      type: object
      required: [agent_id, node_id, nats_url, nats_cert_sha256]
      properties:
        agent_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        nats_url: { type: string, description: Bijvoorbeeld tls://clusterforge.lan:4222 }
        nats_cert_sha256: { type: string, description: Hex-sha256 van het NATS-certificaat; de agent pint het }
    MetricsRange:
      type: string
      enum: ["1h", "6h", "24h", "7d"]
      default: "1h"
    Metrics:
      type: object
      required: [range, start, end, step_seconds, timestamps, panels]
      properties:
        range: { $ref: "#/components/schemas/MetricsRange" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        step_seconds: { type: integer }
        timestamps:
          type: array
          description: Unix-tijden in seconden; de waarden van elke lijn horen hierbij
          items: { type: integer, format: int64 }
        panels:
          type: array
          items: { $ref: "#/components/schemas/MetricPanel" }
    MetricPanel:
      type: object
      required: [id, title, unit, series]
      properties:
        id: { type: string }
        title: { type: string }
        unit: { type: string, enum: [percent, load, bytes_per_second, celsius] }
        series:
          type: array
          items: { $ref: "#/components/schemas/MetricSeries" }
    MetricSeries:
      type: object
      required: [label, values]
      properties:
        label: { type: string }
        values:
          type: array
          description: Eén waarde per tijdstip in timestamps; null als er geen meting is
          items: { type: number, format: double, nullable: true }
    ServerInfo:
      type: object
      required: [version, metrics_enabled, grafana_node_url, grafana_cluster_url]
      properties:
        version: { type: string }
        metrics_enabled: { type: boolean, description: Of er een VictoriaMetrics is ingesteld }
        grafana_node_url:
          type: string
          description: Link naar Grafana voor een node, met {hostname}, {node_id}, {cluster}, {cluster_id} en {env}; leeg als niet ingesteld
        grafana_cluster_url:
          type: string
          description: Link naar Grafana voor een cluster, met {cluster}, {cluster_id} en {env}; leeg als niet ingesteld
    ProxmoxConnection:
      type: object
      required: [id, name, api_url, token_id, tls_fingerprint, pve_version, last_sync_at, last_error, counts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        api_url: { type: string, description: "Bijvoorbeeld https://pve1.lan:8006" }
        token_id: { type: string, description: "Bijvoorbeeld clusterforge@pve!cf" }
        tls_fingerprint: { type: string, description: SHA-256 van het certificaat zoals Proxmox hem toont; leeg betekent gewone CA-controle }
        pve_version: { type: string }
        last_sync_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: Fout van de laatste sync; leeg als die lukte }
        counts: { $ref: "#/components/schemas/ProxmoxCounts" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProxmoxCounts:
      type: object
      required: [hosts, vms, containers]
      properties:
        hosts: { type: integer }
        vms: { type: integer }
        containers: { type: integer }
    ProxmoxInput:
      type: object
      required: [name, api_url, token_id, token_secret]
      properties:
        name: { type: string }
        api_url: { type: string }
        token_id: { type: string }
        token_secret: { type: string, writeOnly: true }
        tls_fingerprint: { type: string }
    ProxmoxPatch:
      type: object
      properties:
        name: { type: string }
        api_url: { type: string }
        token_id: { type: string }
        token_secret: { type: string, writeOnly: true }
        tls_fingerprint: { type: string }
    ProxmoxProbe:
      type: object
      required: [api_url, fingerprint, subject, issuer, not_after, trusted]
      properties:
        api_url: { type: string, description: Het adres zoals de server het gebruikt }
        fingerprint: { type: string }
        subject: { type: string }
        issuer: { type: string }
        not_after: { type: string, format: date-time }
        trusted: { type: boolean, description: Of het certificaat ook zonder vingerafdruk geldig is }
    ProxmoxResources:
      type: object
      required: [hosts, guests, storages]
      properties:
        hosts: { type: array, items: { $ref: "#/components/schemas/ProxmoxHost" } }
        guests: { type: array, items: { $ref: "#/components/schemas/ProxmoxGuest" } }
        storages: { type: array, items: { $ref: "#/components/schemas/ProxmoxStorage" } }
    ProxmoxHost:
      type: object
      required: [name, status, cpu, maxcpu, mem, maxmem, disk, maxdisk, uptime]
      properties:
        name: { type: string }
        status: { type: string, description: online of offline }
        cpu: { type: number, format: double, description: Bezetting van 0 tot 1 }
        maxcpu: { type: number, format: double }
        mem: { type: integer, format: int64 }
        maxmem: { type: integer, format: int64 }
        disk: { type: integer, format: int64 }
        maxdisk: { type: integer, format: int64 }
        uptime: { type: integer, format: int64 }
    GuestType:
      type: string
      enum: [qemu, lxc]
    ProxmoxGuest:
      type: object
      required: [vmid, type, name, host, status, template, cpu, maxcpu, mem, maxmem, disk, maxdisk, uptime, tags, lock, node_id, node_hostname,
        sandbox]
      properties:
        vmid: { type: integer }
        type: { $ref: "#/components/schemas/GuestType" }
        name: { type: string }
        host: { type: string, description: De Proxmox-host waar de VM nu staat }
        status: { type: string, description: "running, stopped of paused" }
        template: { type: boolean }
        cpu: { type: number, format: double }
        maxcpu: { type: number, format: double }
        mem: { type: integer, format: int64 }
        maxmem: { type: integer, format: int64 }
        disk: { type: integer, format: int64 }
        maxdisk: { type: integer, format: int64 }
        uptime: { type: integer, format: int64 }
        tags: { type: array, items: { type: string } }
        lock: { type: string, description: "Lopende bewerking in Proxmox, zoals migrate of backup" }
        node_id: { type: string, format: uuid, nullable: true, description: De gekoppelde node in ClusterForge }
        node_hostname: { type: string, nullable: true }
        sandbox:
          type: boolean
          description: Een tijdelijke sandbox van een back-upcontrole; daarop kan geen VM-actie
    ProxmoxStorage:
      type: object
      required: [name, host, shared, type, content, disk, maxdisk]
      properties:
        name: { type: string }
        host: { type: string }
        shared: { type: boolean }
        type: { type: string }
        content: { type: string }
        disk: { type: integer, format: int64 }
        maxdisk: { type: integer, format: int64 }
    ProxmoxSnapshot:
      type: object
      required: [name, description, parent, time, vmstate]
      properties:
        name: { type: string }
        description: { type: string }
        parent: { type: string }
        time: { type: string, format: date-time, nullable: true }
        vmstate: { type: boolean }
    ProxmoxLink:
      type: object
      required: [connection_id, vmid]
      properties:
        connection_id: { type: string, format: uuid }
        vmid: { type: integer }
    NodeProxmox:
      type: object
      required: [connection_id, connection_name, vmid, found, type, host, name, status, uptime]
      properties:
        connection_id: { type: string, format: uuid }
        connection_name: { type: string }
        vmid: { type: integer }
        found: { type: boolean, description: false als de VM niet in de laatste sync zat }
        type: { type: string }
        host: { type: string }
        name: { type: string }
        status: { type: string }
        uptime: { type: integer, format: int64 }
    VmAction:
      type: string
      enum: [start, stop, shutdown, reboot, snapshot, migrate]
    VmActionInput:
      type: object
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/VmAction" }
        snapshot_name: { type: string, description: Leeg geeft cf-<datum>-<tijd> }
        description: { type: string }
        vmstate: { type: boolean, description: Ook het geheugen in de snapshot (alleen VM's die draaien) }
        target: { type: string, description: Doelhost bij migreren }
    NodeAction:
      type: string
      enum: [refresh_facts, reboot, shutdown, maintenance, activate]
      description: activate beëindigt het onderhoud
    NodeActionInput:
      type: object
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/NodeAction" }
        reason: { type: string, description: Komt in de activiteitenlog en in het systeemlog van de node }
        drain: { type: boolean, description: Bij herstarten of afsluiten eerst de VIP's weghalen (standaard ja) }
        force: { type: boolean, description: Doorgaan ook als geen andere node een VIP kan overnemen }
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    Job:
      type: object
      required: [id, kind, title, status, error, cluster_id, node_id, proxmox_id, requested_by, attempts, cancel_requested, retryable, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        retryable: { type: boolean, description: De taak is mislukt en kan opnieuw vanaf de mislukte stap }
        kind: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        error: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        proxmox_id: { type: string, format: uuid, nullable: true }
        requested_by: { type: string, nullable: true, description: Gebruikersnaam van wie de taak vroeg }
        attempts: { type: integer }
        cancel_requested: { type: boolean }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    JobDetail:
      allOf:
        - { $ref: "#/components/schemas/Job" }
        - type: object
          required: [steps]
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/JobStep" } }
    JobStep:
      type: object
      required: [seq, name, status, started_at, finished_at, log, error]
      properties:
        seq: { type: integer }
        name: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        log: { type: array, items: { type: string } }
        error: { type: string }
    TemplateParamType:
      type: string
      enum: [string, int, bool, ipv4, cidr, size, secret]
    TemplateParam:
      type: object
      required: [name, type, label, help, optional, default, min, max]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/TemplateParamType" }
        label: { type: string }
        help: { type: string }
        optional: { type: boolean, description: Mag leeg blijven; een secret wordt dan gegenereerd }
        default: { type: string, nullable: true }
        min: { type: string, nullable: true }
        max: { type: string, nullable: true }
    TemplateRole:
      type: object
      required: [name, count, count_param]
      properties:
        name: { type: string }
        count: { type: integer, nullable: true, description: "Vast aantal nodes, of null als een parameter het bepaalt" }
        count_param: { type: string, nullable: true, description: De parameter met het aantal nodes }
    ServiceKind:
      type: string
      description: De soort van een dienst; een vaste lijst in internal/deps
      enum: [web, lb, vip, database, cache, queue, storage, dns, cron, container, app, external, other]
    ServiceSource:
      type: string
      enum: [template, manual, discovered]
    ServiceState:
      type: string
      enum: [confirmed, suggested, ignored]
    ServiceStatus:
      type: string
      description: De eigen status uit de heartbeats; unknown zonder unit, zonder instanties of extern
      enum: [unknown, healthy, degraded, down]
    ServiceImpact:
      type: string
      description: Wat een afhankelijkheid doet; none zonder uitval
      enum: [none, degraded, down]
    DependencyStrength:
      type: string
      enum: [hard, soft]
    DepGroup:
      type: object
      required: [id, kind, name, cluster_id, node_id, environment, status, status_reason, impact, impacted_by, suggestions]
      properties:
        id: { type: string, description: "cluster:<id>, node:<id> of external" }
        kind: { type: string, enum: [cluster, node, external] }
        name: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        status: { $ref: "#/components/schemas/Status" }
        status_reason: { type: string }
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        impacted_by: { type: array, items: { type: string }, description: De groepen waar doorgegeven uitval vandaan komt }
        suggestions: { type: integer, description: Voorgestelde diensten in deze groep }
    DepInstance:
      type: object
      required: [node_id, hostname, state, running]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        state: { type: string, description: ActiveState van de unit; leeg zonder verse heartbeat }
        running: { type: boolean }
    DepService:
      type: object
      required: [id, group_id, cluster_id, node_id, name, kind, unit, port, address, description, source, state, status,
        status_reason, impact, impact_reason, impact_path, cause_id, instances, last_seen_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        unit: { type: string }
        port: { type: integer, nullable: true }
        address: { type: string }
        description: { type: string }
        source: { $ref: "#/components/schemas/ServiceSource" }
        state: { $ref: "#/components/schemas/ServiceState" }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        status_reason: { type: string }
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        impact_reason: { type: string, description: "Zoals: mariadb in db-prod is down, via php8.2-fpm" }
        impact_path: { type: array, items: { type: string }, description: Van de oorzaak naar deze dienst }
        cause_id: { type: string, format: uuid, nullable: true }
        instances: { type: array, items: { $ref: "#/components/schemas/DepInstance" } }
        last_seen_at: { type: string, format: date-time, nullable: true, description: Wanneer de resolver de unit het laatst zag }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DepEdge:
      type: object
      required: [id, from, to, strength, source, state, note, affected, count]
      properties:
        id: { type: string, description: "Het id van de afhankelijkheid; bij level=cluster <van>|<naar>" }
        from: { type: string, description: De afnemer (dienst-id, of groep-id bij level=cluster) }
        to: { type: string, description: De leverancier }
        strength: { $ref: "#/components/schemas/DependencyStrength" }
        source: { $ref: "#/components/schemas/ServiceSource" }
        state: { $ref: "#/components/schemas/ServiceState" }
        note: { type: string }
        affected: { type: boolean, description: Uitval bereikte de afnemer langs deze pijl }
        count: { type: integer, description: Hoeveel pijlen samengevoegd zijn; 1 per dienst }
    DependencyGraph:
      type: object
      required: [level, groups, services, edges, suggestions]
      properties:
        level: { type: string, enum: [service, cluster] }
        groups: { type: array, items: { $ref: "#/components/schemas/DepGroup" } }
        services: { type: array, items: { $ref: "#/components/schemas/DepService" } }
        edges: { type: array, items: { $ref: "#/components/schemas/DepEdge" } }
        suggestions: { type: integer, description: Voorgestelde diensten binnen het filter }
    ServiceInput:
      type: object
      required: [name, kind]
      properties:
        cluster_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid, description: Een losse node zonder cluster }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        unit: { type: string }
        port: { type: integer }
        address: { type: string, description: Alleen extern, met port }
        description: { type: string }
    ServicePatch:
      type: object
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        unit: { type: string }
        port: { type: integer, nullable: true }
        address: { type: string }
        description: { type: string }
        state: { $ref: "#/components/schemas/ServiceState" }
    DependencyInput:
      type: object
      required: [from_service_id, to_service_id]
      properties:
        from_service_id: { type: string, format: uuid, description: De afnemer }
        to_service_id: { type: string, format: uuid, description: De leverancier }
        strength: { $ref: "#/components/schemas/DependencyStrength" }
        note: { type: string }
    DependencyPatch:
      type: object
      properties:
        strength: { $ref: "#/components/schemas/DependencyStrength" }
        note: { type: string }
    ImpactItem:
      type: object
      required: [service_id, name, kind, group_id, group_name, environment, impact, direct, reason, path, dependency_id, source]
      properties:
        service_id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        group_id: { type: string }
        group_name: { type: string }
        environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        direct: { type: boolean, description: Geraakt door de storing zelf, niet langs een pijl }
        reason: { type: string, description: "Zoals: hangt hard af van mariadb in db-prod · handmatig" }
        path: { type: array, items: { type: string }, description: Van de oorzaak naar deze dienst }
        dependency_id: { type: string, format: uuid, nullable: true, description: De laatste pijl van het pad }
        source:
          nullable: true
          description: De bron van die pijl
          allOf: [{ $ref: "#/components/schemas/ServiceSource" }]
    ImpactGroup:
      type: object
      required: [group_id, name, environment, impact, count]
      properties:
        group_id: { type: string }
        name: { type: string }
        environment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Environment" }]
        impact: { $ref: "#/components/schemas/ServiceImpact" }
        count: { type: integer }
    Impact:
      type: object
      required: [target, items, groups]
      properties:
        target:
          type: object
          required: [kind, id, name]
          properties:
            kind: { type: string, enum: [service, cluster, node] }
            id: { type: string, format: uuid }
            name: { type: string, description: "Zoals: mariadb in db-prod" }
        items: { type: array, items: { $ref: "#/components/schemas/ImpactItem" } }
        groups: { type: array, items: { $ref: "#/components/schemas/ImpactGroup" }, description: Per groep de ergste impact, prod bovenaan }
    Template:
      type: object
      required: [name, version, title, description, cluster_type, params, roles, services]
      properties:
        name: { type: string }
        version: { type: string }
        title: { type: string }
        description: { type: string }
        cluster_type: { $ref: "#/components/schemas/ClusterType" }
        params: { type: array, items: { $ref: "#/components/schemas/TemplateParam" } }
        roles: { type: array, items: { $ref: "#/components/schemas/TemplateRole" } }
        services: { type: array, items: { $ref: "#/components/schemas/TemplateService" }, description: De diensten die een uitrol in de afhankelijkheidsgraaf zet }
    TemplateService:
      type: object
      required: [name, kind, unit, port, port_param, depends_on]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        unit: { type: string, nullable: true, description: De systemd-unit zonder .service }
        port: { type: integer, nullable: true, description: Vaste hoofdpoort }
        port_param: { type: string, nullable: true, description: De parameter met de hoofdpoort, als die niet vastligt }
        depends_on: { type: array, items: { type: string }, description: Diensten uit dezelfde template waarvan deze afhangt }
    DeployCluster:
      type: object
      required: [name, slug, environment]
      properties:
        name: { type: string }
        slug: { type: string, description: "Ook het begin van de hostnames: <slug>-01, <slug>-02" }
        environment: { $ref: "#/components/schemas/Environment" }
        description: { type: string }
    DeployTarget:
      type: object
      required: [proxmox_id, image_vmid, network]
      properties:
        proxmox_id: { type: string, format: uuid }
        image_vmid: { type: integer, description: De VM-template (golden image) om uit te klonen }
        storage: { type: string, description: Storage voor de schijven; leeg is die van de template }
        bridge: { type: string, description: Standaard vmbr0 }
        vlan: { type: integer, nullable: true }
        network: { type: string, enum: [dhcp, static] }
        first_ip: { type: string, description: "Adres van de eerste node met prefix, zoals 10.0.20.11/24; de volgende nodes krijgen de adressen erna" }
        gateway: { type: string }
        dns: { type: array, items: { type: string } }
        ssh_keys: { type: string, description: "Publieke SSH-sleutels, één per regel" }
    DeployInput:
      type: object
      required: [template, cluster, params, target, server_url]
      properties:
        template: { type: string }
        cluster: { $ref: "#/components/schemas/DeployCluster" }
        params:
          type: object
          additionalProperties: true
          description: Waarden voor de parameters van de template
        target: { $ref: "#/components/schemas/DeployTarget" }
        server_url: { type: string, description: Het adres waarmee de nieuwe nodes ClusterForge bereiken }
    DeployPlanNode:
      type: object
      required: [hostname, role, address, host, cpu, memory_mib, disk_gib]
      properties:
        hostname: { type: string }
        role: { type: string }
        address: { type: string, description: "Adres met prefix, zoals 10.0.20.11/24; leeg bij DHCP" }
        host: { type: string, description: De Proxmox-host voor de VM }
        cpu: { type: integer }
        memory_mib: { type: integer }
        disk_gib: { type: integer }
    DeployPlan:
      type: object
      required: [nodes, vip, vrid]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/DeployPlanNode" } }
        vip: { type: string, description: Leeg als de template geen VIP heeft }
        vrid: { type: integer, nullable: true }
    DeployResult:
      type: object
      required: [job, cluster_id]
      properties:
        job: { $ref: "#/components/schemas/Job" }
        cluster_id: { type: string, format: uuid }
