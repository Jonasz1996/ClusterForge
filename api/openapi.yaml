    post:
      operationId: callPveApi
      summary: Iets veranderen via de Proxmox-API, als taak pvehost.action (admin)
      description: |
        Alleen de aanroepen in internal/pvehost/policy.go. Gevaarlijke aanroepen (terugzetten over een gast, een host
        herstarten, storage of een back-up verwijderen, netwerk toepassen) vragen confirm. Wachtwoorden en sleutels gaan
        versleuteld in de taak.
      requestBody:
