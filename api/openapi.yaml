        before: { type: string, description: De status bij de start }
        predicted: { $ref: "#/components/schemas/DisasterPrediction" }
        vips: { type: array, items: { $ref: "#/components/schemas/DisasterVIP" } }
    DisasterPreview:
      type: object
      required: [ok, checks, description, targets, steps, clusters, skipped, notes, confirm, rehearsal]
