        cluster_name: { type: string }
        environment: { type: string }
        bridge: { type: string }
        connection: { type: string }
        host: { type: string, description: De Proxmox-host waarop alle sandboxes komen; leeg als er geen past }
        storage: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/DRPlanNode" } }
        vips: { type: array, items: { $ref: "#/components/schemas/DisasterVIP" } }
        rto_target_minutes: { type: integer, description: 0 is geen doel }
        rpo_target_hours: { type: integer, description: 0 is geen doel }
        rpo_seconds: { type: number, format: double, description: De leeftijd van de oudste back-up nu }
        spread_seconds: { type: number, format: double, description: Hoe ver de back-ups van de nodes uit elkaar liggen }
        fix: { type: array, items: { type: string }, description: De commando's die de bridge op de host afsluiten, als die niet klopt }
    DRReportNode:
      type: object
      required: [node_id, hostname, source_vmid, sandbox_vmid, volid, backup_time, restore_seconds, boot_seconds, addresses, agent_version, destroyed]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        source_vmid: { type: integer }
        sandbox_vmid: { type: integer, nullable: true }
        volid: { type: string }
        backup_time: { type: string, format: date-time }
        restore_seconds: { type: number, format: double, nullable: true }
        boot_seconds: { type: number, format: double, nullable: true }
        addresses: { type: array, items: { type: string }, description: De adressen die cf-agent in de sandbox meldde }
        agent_version: { type: string }
        destroyed: { type: boolean }
    DRReportVIP:
