        score: { type: integer, nullable: true }
        grade: { type: string }
        computed_at: { type: string, format: date-time, nullable: true }
        platform:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RiskCard" }]
        clusters:
          type: array
          items: { $ref: "#/components/schemas/RiskClusterScore" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/RiskPlacedFinding" }
    RiskPoint:
      type: object
