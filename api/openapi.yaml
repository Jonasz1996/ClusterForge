    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: lesson, in: path, required: true, schema: { type: string } }
    post:
      operationId: hintKubeLesson
      summary: Ik zit vast, een hint van de assistent bij de opdracht die aan de beurt is; het antwoord stroomt als server-sent events
      description: |
        Voor wie de assistent mag gebruiken. ClusterForge controleert de les eerst, zoals checkKubeLesson. De assistent
        kijkt wat er op het cluster staat en geeft een hint die verder helpt zonder het antwoord voor te zeggen; het goede
        antwoord op een vraag krijgt hij niet. Is er geen opdracht aan de beurt, dan 409.
      responses:
        "200":
          description: De stroom van het antwoord, met dezelfde events als askAssistant
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
