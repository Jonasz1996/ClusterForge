    post:
      operationId: createPveToken
      summary: Een API-token van Proxmox maken (admin)
      description: |
        Proxmox toont de waarde van een nieuw token maar één keer. ClusterForge geeft hem in dit antwoord terug en
        bewaart hem nergens (geen taak, geen logboek). Vraagt een agent met protocol 36 op een host.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PveTokenInput" }
      responses:
        "201":
          description: Het token, met zijn waarde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PveTokenCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
