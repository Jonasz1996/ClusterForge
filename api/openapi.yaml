        gateway: { type: string }
        dns: { type: array, items: { type: string } }
        ssh_keys: { type: string, description: "Publieke SSH-sleutels, één per regel" }
    DeployInput:
      type: object
      required: [template, cluster, params, target, server_url]
      properties:
        template: { type: string }
        cluster: { $ref: "#/components/schemas/DeployCluster" }
        params:
          type: object
          additionalProperties: true
          description: Waarden voor de parameters van de template
        target: { $ref: "#/components/schemas/DeployTarget" }
        server_url: { type: string, description: Het adres waarmee de nieuwe nodes ClusterForge bereiken }
    DeployPlanNode:
      type: object
      required: [hostname, role, address, host, cpu, memory_mib, disk_gib]
      properties:
        hostname: { type: string }
        role: { type: string }
        address: { type: string, description: "Adres met prefix, zoals 10.0.20.11/24; leeg bij DHCP" }
        host: { type: string, description: De Proxmox-host voor de VM }
        cpu: { type: integer }
        memory_mib: { type: integer }
        disk_gib: { type: integer }
    DeployPlan:
      type: object
      required: [nodes, vip, vrid]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/DeployPlanNode" } }
