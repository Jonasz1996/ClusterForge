        probe: { type: string }
        probe_ok: { type: boolean, nullable: true }
    DRReport:
      type: object
      required: [scenario_id, name, cluster_name, environment, bridge, connection, host, storage, fix, rto_target_minutes, rpo_target_hours,
        rto_seconds, rpo_seconds, rto_met, rpo_met, restore_seconds, boot_seconds, check_seconds, cleanup_seconds, total_seconds, nodes,
        vips, destroyed_at, aborted]
      properties:
        scenario_id: { type: string, format: uuid }
        name: { type: string }
        cluster_name: { type: string }
        environment: { type: string }
        bridge: { type: string }
        connection: { type: string }
        host: { type: string }
        storage: { type: string }
        fix: { type: array, items: { type: string }, description: De commando's die de bridge afsluiten, als de voorcontrole daarop faalde }
