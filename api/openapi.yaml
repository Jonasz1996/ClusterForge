        ok: { type: boolean, description: Of de voorcontrole slaagt }
        checks: { type: array, items: { $ref: "#/components/schemas/TestRunCheck" } }
        description: { type: string }
        targets: { type: array, items: { $ref: "#/components/schemas/DisasterTarget" } }
        steps: { type: array, items: { $ref: "#/components/schemas/DisasterPlannedStep" }, description: Bij sequence }
        clusters: { type: array, items: { $ref: "#/components/schemas/DisasterClusterPlan" } }
        skipped: { type: array, items: { type: string }, description: Draaiende VM's op de host die niet in ClusterForge staan en aan blijven }
        notes: { type: array, items: { type: string }, description: Wat de voorspelling onzeker maakt }
        confirm: { type: array, items: { type: string }, description: De slugs om in te tikken }
        rehearsal:
          allOf: [{ $ref: "#/components/schemas/DRPlan" }]
          nullable: true
          description: Bij dr_rehearsal wat er teruggaat en waar
    DisasterTargetResult:
      type: object
      required: [node_id, hostname, error]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        error: { type: string }
    DisasterClusterResult:
      type: object
      required: [id, name, slug, environment, role, before, predicted, measured, longest_ms, recovered_ms, match, slow]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        environment: { type: string }
        role: { type: string, enum: [target, dependent] }
        before: { type: string }
        predicted: { $ref: "#/components/schemas/DisasterPrediction" }
        measured: { $ref: "#/components/schemas/DisasterPrediction" }
        longest_ms: { type: integer, format: int64, description: De langste onderbreking op een VIP tijdens de storing }
        recovered_ms: { type: integer, format: int64, nullable: true, description: Hoe lang na het terugzetten het cluster weer gezond was }
        match: { type: string, enum: [as_predicted, unexpected, milder, stayed_healthy, not_recovered, unknown] }
        slow: { type: boolean, description: Het herstel duurde langer dan verwacht }
    DisasterVIPResult:
      type: object
      required: [cluster_id, address, probe, segments]
      properties:
        cluster_id: { type: string, format: uuid }
        address: { type: string }
        probe: { $ref: "#/components/schemas/FailoverProbe" }
        segments: { type: array, items: { $ref: "#/components/schemas/TestRunSegment" } }
    DisasterReport:
      type: object
      required: [scenario_id, name, kind, description, unit, fault_ms, expect_recovery_ms, short_outage_ms, clear_ms, recovery_ms,
        total_ms, end_ms, targets, target_results, steps, clusters, vips, skipped, notes]
      properties:
        scenario_id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/DisasterKind" }
        description: { type: string }
        unit: { type: string }
        fault_ms: { type: integer, format: int64 }
        expect_recovery_ms: { type: integer, format: int64 }
        short_outage_ms: { type: integer, format: int64, description: Een kortere onderbreking telt als overname, niet als uitval }
        clear_ms: { type: integer, format: int64, nullable: true, description: Wanneer alles weer gestart was, na de storing }
        recovery_ms: { type: integer, format: int64, nullable: true, description: Van het terugzetten tot elk cluster weer gezond was }
        total_ms: { type: integer, format: int64, nullable: true, description: Van de storing tot elk cluster weer gezond was }
        end_ms: { type: integer, format: int64 }
        targets: { type: array, items: { $ref: "#/components/schemas/DisasterTarget" } }
        target_results: { type: array, items: { $ref: "#/components/schemas/DisasterTargetResult" } }
        steps: { type: array, items: { $ref: "#/components/schemas/DisasterPlannedStep" }, description: Bij sequence, met wat elke stap deed }
        clusters:
          type: array
          description: Voorspeld tegen gemeten; tijdens de run de voorspelling met measured leeg
          items: { $ref: "#/components/schemas/DisasterClusterResult" }
        vips: { type: array, items: { $ref: "#/components/schemas/DisasterVIPResult" } }
        skipped: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
    TestRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TestRun" } }
    DriftNode:
      type: object
      required: [node_id, hostname, status, checked_at, drift_since, spec_revision, findings, unchecked, error, skipped, agent_too_old]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        status:
          type: string
          description: unknown als de node nog nooit gecontroleerd is; none als hij niet in de gewenste staat staat
          enum: [in_sync, drift, error, none, unknown]
        checked_at: { type: string, format: date-time, nullable: true }
        drift_since: { type: string, format: date-time, nullable: true }
        spec_revision: { type: integer, description: De revisie van de laatste controle }
        findings:
          type: array
          description: Bij status error de afwijkingen van de laatste geslaagde controle
          items: { $ref: "#/components/schemas/DriftFinding" }
        unchecked: { type: array, items: { $ref: "#/components/schemas/DriftUnchecked" } }
        error: { type: string }
        skipped:
          type: string
          description: Waarom de node nu niet gecontroleerd wordt, zoals "agent te oud voor driftcontrole"; leeg als hij wel gecontroleerd wordt
        agent_too_old: { type: boolean }
    DriftFinding:
      type: object
      required: [key, step, kind, title, aspect, expected, actual, detail, mtime, since, fingerprint, ignored, ignore_id]
      properties:
        key: { type: string, description: "Stap en aspect, zoals file:/etc/keepalived/keepalived.conf:content" }
        step: { type: string, description: "De stap, zoals file:/etc/keepalived/keepalived.conf" }
        kind: { type: string, enum: [package, file, directory, service, user, command] }
        title: { type: string }
        aspect: { type: string, enum: [exists, type, content, mode, owner, group, installed, loaded, enabled, active, creates] }
        expected: { type: string }
        actual: { type: string }
        detail: { type: string }
        mtime: { type: string, format: date-time, nullable: true, description: Wanneer het bestand op de node veranderde }
        since: { type: string, format: date-time }
        fingerprint: { type: string, description: HMAC van de waargenomen waarde; verandert als er op de node opnieuw iets wijzigt }
        ignored: { type: boolean, description: Een negeerregel dekt deze stap; telt niet voor de status }
        ignore_id: { type: string, format: uuid, nullable: true }
    RemediationInput:
      type: object
      required: [nodes]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/RemediationChoice" } }
        confirm: { type: string, description: Op prod de slug van het cluster }
        preview: { type: boolean, description: "Alleen het plan tonen, zonder iets te starten" }
    RemediationChoice:
      type: object
      required: [node_id, steps]
      properties:
        node_id: { type: string, format: uuid }
        steps: { type: array, items: { $ref: "#/components/schemas/RemediationStepChoice" } }
    RemediationStepChoice:
      type: object
      required: [step, fingerprints]
      properties:
        step: { type: string, description: "De stap, zoals file:/etc/keepalived/keepalived.conf" }
        fingerprints: { type: array, items: { type: string }, description: De vingerafdrukken van de afwijkingen van die stap die getoond werden }
    RemediationResult:
      type: object
      required: [plan, job]
      properties:
        plan: { $ref: "#/components/schemas/RemediationPlan" }
        job:
          allOf: [{ $ref: "#/components/schemas/Job" }]
          nullable: true
          description: null bij preview
    RemediationPlan:
      type: object
      required: [cluster_id, cluster, slug, environment, template, version, revision, needs_confirmation, nodes, notes]
      properties:
        cluster_id: { type: string, format: uuid }
        cluster: { type: string }
        slug: { type: string }
        environment: { $ref: "#/components/schemas/Environment" }
        template: { type: string }
        version: { type: string }
        revision: { type: integer }
        needs_confirmation: { type: boolean, description: Op prod moet de slug ingetikt worden }
        nodes: { type: array, items: { $ref: "#/components/schemas/RemediationPlanNode" }, description: In de volgorde van de taak }
        notes: { type: array, items: { type: string }, description: "Wat er hoogstens kan gebeuren, in gewone zinnen" }
    RemediationPlanNode:
      type: object
      required: [node_id, hostname, vips, steps, ignored]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        vips: { type: array, items: { type: string }, description: De VIP's die de node nu heeft; zo'n node komt als laatste }
        steps: { type: array, items: { $ref: "#/components/schemas/RemediationPlanStep" } }
        ignored: { type: array, items: { type: string }, description: Genegeerde stappen die blijven zoals ze zijn }
    RemediationPlanStep:
      type: object
      required: [step, title, action]
      properties:
        step: { type: string }
        title: { type: string }
        action: { type: string, description: "Wat er gebeurt, zoals: bestand /etc/keepalived/keepalived.conf overschrijven, daarna keepalived herladen" }
    DriftUnchecked:
      type: object
