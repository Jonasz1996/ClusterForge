        step: { type: string }
        title: { type: string }
        reason: { type: string }
    ClusterDriftSummary:
      type: object
      required: [status, nodes_with_drift, checked_at]
      properties:
        status:
          type: string
          description: none zonder gewenste staat; unknown als niet elke actieve node het laatste uur gecontroleerd is
          enum: [in_sync, drift, unknown, none]
        nodes_with_drift: { type: integer }
        checked_at: { type: string, format: date-time, nullable: true, description: De oudste laatste controle van de actieve nodes }
    SpecHistory:
      type: object
      required: [template, revision, params, notes, items]
      properties:
        template:
          allOf: [{ $ref: "#/components/schemas/SpecTemplate" }]
          nullable: true
        revision: { type: integer, description: Huidige revisie; 0 zonder spec }
        params:
          type: array
          description: De parameters van de huidige revisie; van een geheim alleen dat het opgeslagen is
          items: { $ref: "#/components/schemas/SpecParam" }
        notes:
          type: array
          items: { type: string }
        items:
          type: array
          description: Nieuwste eerst
          items: { $ref: "#/components/schemas/SpecRevision" }
    SpecTemplate:
      type: object
      required: [name, version, available, latest]
      properties:
        name: { type: string }
        version: { type: string }
        available:
          type: boolean
          description: Deze versie zit in de server
        latest:
          type: string
          nullable: true
          description: De nieuwste versie in de server
    SpecParam:
      type: object
