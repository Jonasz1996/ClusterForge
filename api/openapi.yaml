          allOf: [{ $ref: "#/components/schemas/IncidentAnalysis" }]
          nullable: true
          description: Null zolang de analyse nog niet gerekend is
        timeline:
          type: array
          description: |
            Het logboek, het journaal en de afwijkingen in de metrics over wat
