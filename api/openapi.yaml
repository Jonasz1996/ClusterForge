        vmid: { type: integer }
        label: { type: string, maxLength: 100 }
    BackupWatchInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/BackupWatchEntry" }
    AuditRef:
      type: object
