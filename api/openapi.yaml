        protocol, supported, enabled, managed, bouncer, extra_profiles, disabled_profiles, status, status_at, plan,
        plan_hash, applied_hash, applied_at, apply_job_id, apply_running, apply_error, apply_failed_at, blocklist, poll_at,
        poll_error, console_enrolled, console_enrolled_at, console_error, console_failed_at]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        cluster_slug: { type: string }
        cluster_environment: { type: string }
        cluster_template: { type: string }
        online: { type: boolean }
        protocol: { type: integer }
        supported: { type: boolean, description: De agent kent CrowdSec (protocol 28) }
        enabled: { type: boolean, description: CrowdSec staat aan in ClusterForge }
        managed: { type: boolean }
        bouncer: { type: boolean }
        extra_profiles: { type: array, items: { type: string } }
        disabled_profiles: { type: array, items: { type: string } }
        status:
          allOf: [{ $ref: "#/components/schemas/CrowdSecStatus" }]
          nullable: true
        status_at: { type: string, format: date-time, nullable: true }
        plan:
          allOf: [{ $ref: "#/components/schemas/CrowdSecPlan" }]
          nullable: true
        plan_hash: { type: string }
        applied_hash: { type: string }
        applied_at: { type: string, format: date-time, nullable: true }
        apply_job_id: { type: string, format: uuid, nullable: true }
        apply_running: { type: boolean }
        apply_error: { type: string }
        apply_failed_at: { type: string, format: date-time, nullable: true }
        blocklist: { type: integer, description: Bans van de community-blocklist, -1 als onbekend }
        poll_at: { type: string, format: date-time, nullable: true }
        poll_error: { type: string }
        console_enrolled: { type: boolean, description: Aangemeld bij de CrowdSec Console met de huidige sleutel }
        console_enrolled_at: { type: string, format: date-time, nullable: true }
        console_error: { type: string }
        console_failed_at: { type: string, format: date-time, nullable: true }
    CrowdSecAlert:
      type: object
