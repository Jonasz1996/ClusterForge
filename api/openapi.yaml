        key: { type: string, description: "Herkent het onderdeel, zoals host:<koppeling>:pve1" }
        kind: { $ref: "#/components/schemas/RiskComponentKind" }
        name: { type: string, description: "Zoals pve1, local-lvm op pve1 of ceph (gedeeld)" }
        group: { type: string, description: De Proxmox-koppeling, het cluster van een node, de groep van een dienst of de omgeving van een cluster }
    RiskComponentList:
      type: object
      required: [components]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/RiskComponent" }
    RiskWhatIfInput:
      type: object
      required: [components]
      properties:
        components:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }
    RiskGuestOutcome:
      type: object
