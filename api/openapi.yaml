          nullable: true
          description: Alleen bij host_down
        unit: { type: string, description: Bij service_down de dienst }
        steps: { type: array, items: { $ref: "#/components/schemas/DisasterStep" }, description: Bij sequence de stappen }
        fault_seconds: { type: integer, description: Hoe lang de storing duurt }
        recovery_seconds: { type: integer, description: Hoe snel na het terugzetten alles weer gezond moet zijn }
        bridge: { type: string, description: Bij dr_rehearsal de afgesloten bridge }
        schedule: { $ref: "#/components/schemas/DRSchedule" }
        schedule_label: { type: string }
        next_run_at: { type: string, format: date-time, nullable: true, description: De volgende geplande DR-repetitie }
        last_run:
          allOf: [{ $ref: "#/components/schemas/TestRun" }]
