      summary: Een back-up op proef terugzetten, starten en weer opruimen (admin)
      description: |
        Zet de back-up terug als nieuwe gast met een vrij ID, met de netwerkkaarten los en zonder doorgegeven
        hardware, start hem, wacht tot hij draait (VM met guest agent: tot die antwoordt) en verwijdert hem daarna.
      requestBody:
