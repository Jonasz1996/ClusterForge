          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentTokenInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewEnrollmentToken" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /enrollment-tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteEnrollmentToken
      summary: Enrollmenttoken intrekken (admin)
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /agents/enroll:
    post:
      operationId: enrollAgent
      summary: Een agent meldt zich aan met een enrollmenttoken (zonder sessie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "200":
          description: Aangemeld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /agents/{agentId}/revoke:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeAgent
      summary: Agent intrekken (admin); de verbinding wordt meteen verbroken
      responses:
        "204": { description: Ingetrokken }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox:
    get:
      operationId: listProxmox
      summary: Gekoppelde Proxmox-omgevingen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, enabled]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProxmoxConnection" }
                  enabled:
                    type: boolean
                    description: false als de server geen masterkey heeft; dan kun je geen Proxmox koppelen
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProxmox
      summary: Proxmox koppelen (admin); de server test de verbinding eerst
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxInput" }
      responses:
        "201":
          description: Gekoppeld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /proxmox/probe:
    post:
      operationId: probeProxmox
      summary: Certificaat van een Proxmox-adres ophalen om de vingerafdruk te controleren (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_url]
              properties:
                api_url: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxProbe" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProxmox
      summary: Eén Proxmox-omgeving
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConnection" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProxmox
      summary: Proxmox-koppeling wijzigen (admin); zonder token_secret blijft het oude
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxPatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProxmox
      summary: Proxmox-koppeling verwijderen (admin); nodes blijven bestaan zonder koppeling
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/sync:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncProxmox
      summary: Nu synchroniseren en de back-ups opnieuw lezen in plaats van op de volgende ronde te wachten (admin)
      responses:
        "200":
          description: Gesynchroniseerd; last_error zegt of het lukte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConnection" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/resources:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProxmoxResources
      summary: Hosts, VM's, containers en storage uit de laatste sync
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxResources" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/network:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProxmoxNetwork
      summary: Het netwerk van elke host, elke 10 minuten gelezen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostNetworkList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/vms/{vmid}/actions:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: vmid, in: path, required: true, schema: { type: integer } }
    post:
      operationId: vmAction
      summary: Een VM of container starten, stoppen, snapshotten of migreren (admin); wordt een taak
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VmActionInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/vms/{vmid}/snapshots:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: vmid, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listVmSnapshots
      summary: Snapshots van een VM of container, rechtstreeks uit Proxmox
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProxmoxSnapshot" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /backups:
    get:
      operationId: getBackups
      summary: Back-upstand van elke bewaakte VM, per koppeling de dekking, en per cluster de slechtste stand
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupOverview" }
        "401": { $ref: "#/components/responses/Error" }
  /backups/databases:
    get:
      operationId: listDatabaseBackups
      summary: Per database van een cluster de nieuwste dump en hoe vers die is
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseBackups" }
        "401": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/backups:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNodeBackups
      summary: Back-upstand en alle back-ups van de VM van een node
      responses:
        "200":
          description: OK; item is null als de node niet aan een VM gekoppeld is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeBackups" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/backups/verify:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: verifyNodeBackup
      summary: Back-up controleren in een sandbox (admin)
      description: >-
        Zet de nieuwste back-up van de VM van de node terug als tijdelijke VM
        in pool cf-sandbox, met elke netwerkkaart op link_down, start hem,
        controleert hem via de guest agent en verwijdert hem altijd weer. Met
        volid een andere back-up van dezelfde VM. 409 met code busy als er al
        een failovertest of back-upcontrole loopt, of conflict als de node
        geen VM heeft, het een container is of er geen back-up is.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupVerifyInput" }
      responses:
        "202":
          description: In de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /backup-sandboxes/{sandboxId}/cleanup:
    parameters:
      - { name: sandboxId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cleanupBackupSandbox
      summary: Een sandbox nu opruimen (admin)
      description: >-
        Verwijdert de sandbox langs dezelfde bewaakte weg als de opruimer,
        bijvoorbeeld na destroy_failed. Wacht tot Proxmox klaar is. 409 als de
        controle nog loopt, Proxmox de VM vergrendeld heeft of de sandbox al
        opgeruimd is.
      responses:
        "200":
          description: Opgeruimd, of de VM bestond niet (meer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClusterDrift
      summary: Drift van een cluster per node, met waarmee vergeleken wordt
      description: >-
        source is null voor een cluster zonder gewenste staat. Viewers mogen
        dit zien: er staan geen geheimen, inhoud of hashes in.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift/check:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkClusterDrift
      summary: Alle actieve nodes nu controleren (admin)
      description: >-
        Synchroon en zonder bevestiging na 30 seconden; elke node heeft 20
        seconden. Een controle verandert niets op de nodes.
      responses:
        "200":
          description: De drift na de controle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift/baseline:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: captureBaseline
      summary: Baseline vastleggen voor een cluster zonder template (admin)
      description: >-
        Bekijkt de gekozen nodes met state.inspect en legt vast wat er nu
        staat, als nieuwe spec-revisie. Nodes die al een baseline hebben en
        niet gekozen zijn, houden de hunne. Met preview alleen tonen, zonder
        op te slaan. Van een bestand komen alleen grootte, rechten, eigenaar
        en een HMAC van de inhoud in de baseline; het antwoord bevat geen
        hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaselineInput" }
      responses:
        "200":
          description: Wat vastgelegd is, of bij preview zou worden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaselineResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift/remediate:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: remediateClusterDrift
      summary: Gekozen afwijkingen herstellen met cluster.apply (admin)
      description: >-
        Alleen voor een cluster uit een template met een kloppend
        lidmaatschap. Per node de gekozen stappen met de vingerafdrukken
        die getoond werden; is er intussen iets veranderd, dan is het 409
        drift_changed. Met preview alleen het plan, in de volgorde van de
        taak met de VIP-eigenaar als laatste. Op prod moet confirm gelijk
        zijn aan de slug (anders 409 needs_confirmation) en moet de
        gebruiker tweestapsverificatie aan hebben (anders 403
        totp_required).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemediationInput" }
      responses:
        "200":
          description: Het plan, bij preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationResult" }
        "202":
          description: De taak staat in de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/drift/ignores:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDriftIgnores
      summary: Negeerregels van een cluster, ook de verlopen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftIgnoreList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDriftIgnore
      summary: Een stap negeren op één node of het hele cluster (admin)
      description: >-
        key is een stap zoals file:/etc/nginx/nginx.conf of service:nginx,
        een voorvoegsel dat op * eindigt, of * alleen (alleen met een
        einddatum). De regel geldt meteen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriftIgnoreInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftIgnore" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /drift-ignores/{ignoreId}:
    parameters:
      - { name: ignoreId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteDriftIgnore
      summary: Een negeerregel opheffen (admin)
      responses:
        "204": { description: Opgeheven }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/failover-tests:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFailoverTests
      summary: Failovertests van een cluster met hun laatste run
      description: >-
        Met wat het formulier nodig heeft (welke scenario's nu kunnen en
        waarom niet, de VIP's met hun standaardprobe) en de runs die niet
        volledig hersteld zijn, voor de rode balk.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailoverTestList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createFailoverTest
      summary: Nieuwe failovertest (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FailoverTestInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailoverTest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /failover-tests/{testId}:
    parameters:
      - { name: testId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFailoverTest
      summary: Eén failovertest
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailoverTest" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateFailoverTest
      summary: Een failovertest wijzigen (admin); oude runs houden hun definitie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FailoverTestInput" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailoverTest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFailoverTest
      summary: Een failovertest verwijderen (admin); de runs blijven als geschiedenis
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /failover-tests/{testId}/runs:
    parameters:
      - { name: testId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFailoverTestRuns
      summary: De runs van één test, nieuwste eerst
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRunList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: startFailoverTest
      summary: Nu testen (admin)
      description: >-
        Doet de voorcontrole synchroon en zet de run en de taak in één
        transactie in de wachtrij, door het clusterslot en het testslot. Op
        prod alleen met tweestapsverificatie (anders 403 totp_required) en
        de slug van het cluster als confirm (anders 409 needs_confirmation).
        409 precheck_failed met de controles, of busy als er al een test of
        een taak in het cluster loopt.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FailoverStartInput" }
      responses:
        "202":
          description: In de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/disaster-scenarios:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDisasterScenarios
      summary: Rampoefeningen van een cluster met hun laatste run
      description: >-
        Met wat het formulier nodig heeft: welke soorten hier kunnen en
        waarom niet, de Proxmox-hosts met een node van dit cluster en de
        diensten die kunnen wegvallen.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisasterScenarioList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDisasterScenario
      summary: Nieuwe rampoefening (admin), alleen in lab en test
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisasterScenarioInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisasterScenario" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /disaster-scenarios/{scenarioId}:
    parameters:
      - { name: scenarioId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateDisasterScenario
      summary: Een rampoefening wijzigen (admin); oude runs houden hun definitie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisasterScenarioInput" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisasterScenario" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDisasterScenario
      summary: Een rampoefening verwijderen (admin); de runs blijven als geschiedenis
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /disaster-scenarios/{scenarioId}/preview:
    parameters:
      - { name: scenarioId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: previewDisasterScenario
      summary: Voorcontrole en voorspelling, zonder iets te doen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisasterPreview" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /disaster-scenarios/{scenarioId}/run:
    parameters:
      - { name: scenarioId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: runDisasterScenario
      summary: Rampoefening starten (admin)
      description: >-
        Doet de voorcontrole synchroon en zet de run en de taak in één
        transactie in de wachtrij, door het clusterslot van elk geraakt
        cluster en het testslot. confirm bevat de slug van elk cluster met
        een node die de storing krijgt (anders 409 needs_confirmation). 409
        precheck_failed met de controles, of busy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisasterRunInput" }
      responses:
        "202":
          description: In de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /test-runs:
    get:
      operationId: listTestRuns
      summary: Runs van failovertests, back-upcontroles en rampoefeningen, nieuwste eerst
      description: Met cluster_id ook de rampoefeningen die dat cluster maten.
      parameters:
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/TestRunKind" } }
        - { name: cluster_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: node_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: result, in: query, required: false, schema: { $ref: "#/components/schemas/TestRunResult" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRunList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /test-runs/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTestRun
      summary: Het rapport van één run
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /test-runs/{runId}/restore:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreTestRun
      summary: Opnieuw herstellen (admin)
      description: >-
        Voor een failoverrun of rampoefening met restored false: een taak
        door het clusterslot die alles start en de terugkeer controleert.
      responses:
        "202":
          description: In de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/drift:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNodeDrift
      summary: Drift van één node
      responses:
        "200":
          description: OK; nodes heeft hoogstens deze ene node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/drift/check:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkNodeDrift
      summary: Eén node nu controleren (admin)
      responses:
        "200":
          description: De drift na de controle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/spec-revisions:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSpecRevisions
      summary: De gewenste staat van een cluster uit een template, met elke revisie en wat ze veranderde
      description: >-
        Zonder template (een cluster dat met de hand is aangemaakt) is template
        null en zijn er geen revisies. notes zegt wat er niet klopt: een
        templateversie die niet in deze server zit, nodes die niet bij de spec
        passen, of een node die niet te renderen is.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecHistory" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/spec/edit:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClusterSpecEdit
      summary: De parameters van een cluster uit een template om te wijzigen
      description: |
        Met hun waarden van nu, voor de huidige templateversie of voor version. Een cluster dat Git volgt,
        geeft het formulier met blocked: daar is cluster.yaml de bron.
      parameters:
        - { name: version, in: query, schema: { type: string }, description: Een andere versie van de template }
      responses:
        "200":
          description: Het formulier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecEditForm" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/spec/plan:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planClusterSpec
      summary: Het plan van een wijziging van de spec (admin); er verandert niets
      description: |
        Hetzelfde plan als bij een wijziging uit Git: wat er per node verandert en welke nodes erbij komen.
        409 met git_managed als het cluster Git volgt, no_change als er niets verandert. Minder nodes kan niet:
        een worker van Kubernetes haal je weg met remove-node.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecEditInput" }
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecEditPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/spec:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: applyClusterSpec
      summary: Een wijziging van de spec toepassen (admin)
      description: |
        Alleen als het plan nog dezelfde hash heeft; anders 409 met plan_changed. Maakt een nieuwe revisie met bron ui
        en, als er op de nodes iets verandert, een taak cluster.apply. Op prod vraagt het tweestapsverificatie en de slug.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecApplyInput" }
      responses:
        "200":
          description: Toegepast; op geen node verandert iets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecApplied" }
        "202":
          description: De taak die de revisie toepast staat in de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecApplied" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/backup-policy:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBackupPolicy
      summary: Back-upbeleid van een cluster, of de standaard als het er nog geen heeft
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupPolicy" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateBackupPolicy
      summary: Back-upbeleid van een cluster wijzigen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupPolicyInput" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/recovery-targets:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setRecoveryTargets
      summary: De RTO- en RPO-doelen van een cluster zetten (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryTargetsInput" }
      responses:
        "200":
          description: Gezet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryTargets" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proxmox/{proxmoxId}/backup-watch:
    parameters:
      - { name: proxmoxId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setBackupWatch
      summary: De lijst "ook bewaken" van een koppeling vervangen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupWatchInput" }
      responses:
        "200":
          description: Vervangen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs:
    get:
      operationId: listJobs
      summary: Recente taken, nieuwste eerst
      parameters:
        - { name: node_id, in: query, schema: { type: string, format: uuid } }
        - { name: cluster_id, in: query, schema: { type: string, format: uuid } }
        - { name: proxmox_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getJob
      summary: Eén taak met zijn stappen en uitvoer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/cancel:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelJob
      summary: Taak annuleren (admin); een lopende Proxmox-taak wordt gestopt
      responses:
        "202":
          description: Geannuleerd of annuleren gevraagd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/retry:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryJob
      summary: Een mislukte uitrol opnieuw proberen vanaf de mislukte stap (admin)
      responses:
        "202":
          description: Weer in de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /templates:
    get:
      operationId: listTemplates
      summary: De clustertemplates in deze server
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Error" }
  /deployments:
    post:
      operationId: deployCluster
      summary: Een nieuw cluster uitrollen uit een template (admin)
      description: |
        Maakt het cluster met zijn nodes (lifecycle provisioning) en start de
        uitrol als taak: VM's klonen in Proxmox, agents aanmelden, de stappen
        uitvoeren en controleren. Een validatiefout noemt het veld in field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployInput" }
      responses:
        "202":
          description: Uitrol gestart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /deployments/plan:
    post:
      operationId: planDeployment
      summary: Controleren wat een uitrol zou maken (admin)
      description: |
        Doet dezelfde controles als een uitrol en geeft de nodes die er zouden
        komen, met hun adres en Proxmox-host, zonder iets te maken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /dependency-graph:
    get:
      operationId: getDependencyGraph
      summary: De afhankelijkheidsgraaf in één aanroep
      description: |
        Groepen (clusters, losse nodes en Extern), diensten met hun eigen
        status, de doorgegeven uitval en hun instanties, en de pijlen. De
        status wordt over de hele graaf uitgerekend, ook met een filter. Met
        level=cluster komen er geen diensten en zijn de pijlen tussen groepen
        samengevoegd.
      parameters:
        - { name: cluster_id, in: query, required: false, description: Dat cluster plus zijn directe buren, schema: { type: string, format: uuid } }
        - { name: environment, in: query, required: false, description: De clusters van die omgeving plus hun directe buren, schema: { $ref: "#/components/schemas/Environment" } }
        - { name: include_suggested, in: query, required: false, description: Ook voorgestelde diensten, schema: { type: boolean } }
        - { name: include_ignored, in: query, required: false, description: "Ook genegeerde diensten en pijlen, om ze terug te zetten", schema: { type: boolean } }
        - { name: include_connections, in: query, required: false, description: Per pijl wat de agents de afgelopen 24 uur zagen (observed), schema: { type: boolean } }
        - { name: level, in: query, required: false, schema: { type: string, enum: [service, cluster] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyGraph" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /services:
    post:
      operationId: createService
      summary: Een dienst aanmaken in een cluster, op een losse node of extern (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepService" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /services/{serviceId}:
    parameters:
      - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateService
      summary: Een dienst wijzigen, of een voorstel bevestigen, negeren of terugzetten (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepService" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteService
      summary: Een dienst met zijn pijlen verwijderen (admin)
      description: Een dienst met een unit blijft als genegeerde rij staan, zodat hij niet opnieuw voorgesteld wordt.
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dependencies:
    post:
      operationId: createDependency
      summary: Vastleggen dat een dienst van een andere afhangt (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DependencyInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepEdge" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dependencies/{dependencyId}:
    parameters:
      - { name: dependencyId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateDependency
      summary: Sterkte of notitie van een afhankelijkheid wijzigen, of een voorstel bevestigen, negeren of terugzetten (admin)
      description: Bevestigen bevestigt ook een voorgestelde dienst aan een van beide kanten. Is een van beide genegeerd, dan antwoordt de server 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DependencyPatch" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepEdge" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDependency
      summary: Een afhankelijkheid verwijderen (admin)
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /impact:
    get:
      operationId: getImpact
      summary: Wat raakt uitval van een dienst, cluster of node
      description: |
        Precies één van service_id, cluster_id en node_id. Alleen bekende
        afhankelijkheden; prod staat bovenaan. Bij een node telt een tweede
        gezonde instantie mee, net als de overname van het VIP.
      parameters:
        - { name: service_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: cluster_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: node_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Impact" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /gitops/repo:
    get:
      operationId: getGitRepo
      summary: De koppeling met Git en de stand van de laatste synchronisatie
      description: Ook voor viewers. Het token komt nooit terug.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepoStatus" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: saveGitRepo
      summary: De koppeling maken of wijzigen (admin)
      description: |
        Leest eerst de kop van de branch; lukt dat niet, dan wordt er niets
        opgeslagen. Een leeg token laat het opgeslagen token staan. Na het
        opslaan leest de server de repository meteen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitRepoInput" }
      responses:
        "200":
          description: Opgeslagen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepoStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteGitRepo
      summary: De koppeling verwijderen (admin); alle clusters worden ontkoppeld
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /gitops/repo/probe:
    post:
      operationId: probeGitRepo
      summary: Token, branch en map testen zonder op te slaan (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitRepoInput" }
      responses:
        "200":
          description: De kop van de branch en de clusterbestanden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitProbe" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /gitops/sync:
    post:
      operationId: syncGit
      summary: Nu synchroniseren (admin)
      description: Leest de repository opnieuw, ook als de kop niet veranderde, en controleert elk bestand opnieuw.
      responses:
        "202": { description: Aangestoten }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /gitops/files:
    get:
      operationId: listGitFiles
      summary: De clusterbestanden uit de laatste scan, met hun toestand en fouten
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GitFile" }
        "401": { $ref: "#/components/responses/Error" }
  /gitops/changes:
    get:
      operationId: listGitChanges
      summary: Wijzigingen uit Git, eerst wat wacht of loopt
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/GitChangeStatus" } }
        - { name: cluster_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GitChange" }
        "401": { $ref: "#/components/responses/Error" }
  /gitops/changes/{changeId}:
    parameters:
      - { name: changeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGitChange
      summary: Eén wijziging met commit, plan, diffs en lokale afwijkingen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitChangeDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /gitops/changes/{changeId}/approve:
    parameters:
      - { name: changeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveGitChange
      summary: Een wachtende wijziging goedkeuren en toepassen (admin)
      description: |
        Schrijft in één transactie een spec-revisie met bron git en de commit,
        werkt naam, beschrijving, omgeving en tags bij en zet cluster.apply in
        de wachtrij. Verandert er op geen node een stap, dan is de wijziging
        meteen toegepast (200, zonder taak). Op prod vraagt het
        tweestapsverificatie en de slug. 409 bij een verouderd plan
        (plan_changed), een bezet clusterslot (busy) of een wijziging die in
        deze versie nog niet kan (not_supported).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitApproveInput" }
      responses:
        "200":
          description: Toegepast zonder taak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitDecision" }
        "202":
          description: Goedgekeurd; de taak past de wijziging toe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitDecision" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /gitops/changes/{changeId}/reject:
    parameters:
      - { name: changeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectGitChange
      summary: Een wachtende wijziging afwijzen met een reden (admin)
      description: Het bestand blijft afgewezen tot een nieuwe commit het wijzigt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitRejectInput" }
      responses:
        "200":
          description: Afgewezen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitChange" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/git/reapply:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reapplyClusterGit
      summary: De huidige revisie opnieuw toepassen (admin)
      description: |
        Alleen als applied_revision achterloopt, zoals na een mislukte
        toepassing: een nieuwe cluster.apply met alle stappen, behalve wat
        genegeerd wordt. Op prod vraagt het tweestapsverificatie en de slug.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitReapplyInput" }
      responses:
        "202":
          description: In de wachtrij
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/git/export:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportClusterGit
      summary: Het cluster als cluster.yaml, zonder geheimen
      description: Alleen voor een cluster uit een ingebouwde template. Ook voor viewers.
      responses:
        "200":
          description: Het bestand
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/git/link:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: linkClusterGit
      summary: Het cluster aan zijn bestand in Git koppelen (admin)
      description: |
        Lukt alleen als het bestand in de repository gelijk is aan de export;
        anders 409 met code git_mismatch en de diff. Daarna is Git de bron
        van waarheid en geven wijzigingen aan wat uit Git komt 409.
      responses:
        "200":
          description: Gekoppeld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/git/unlink:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: unlinkClusterGit
      summary: Het cluster van Git ontkoppelen (admin); een wachtende wijziging vervalt
      responses:
        "200":
          description: Ontkoppeld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /incidents:
    get:
      operationId: listIncidents
      summary: Incidenten, open eerst, daarna de afgesloten die in de periode begonnen
      description: |
        Incidenten door een failovertest van ClusterForge zijn standaard
        verborgen; `include_tests` toont ze.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved] } }
        - { name: cluster, in: query, description: Alleen incidenten die dit cluster raakten, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: Begonnen vanaf; standaard 30 dagen geleden, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Begonnen voor; standaard nu, schema: { type: string, format: date-time } }
        - { name: include_tests, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /incidents/{incidentId}:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getIncident
      summary: Eén incident, met wat er geraakt was en de statusovergangen in die periode
      description: |
        De geschiedenis komt uit het logboek, maar alleen statusovergangen,
        incidenten en tests over de geraakte clusters, nodes en diensten.
        Een viewer ziet ze zonder IP-adres en sessie.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /incidents/{incidentId}/analyze:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: analyzeIncident
      summary: Het incident laten analyseren door de assistent; het resultaat stroomt als server-sent events
      description: |
        Voor wie de assistent mag gebruiken. Het model krijgt het incident,
        de analyse van What Broke, de tijdlijn en de geschiedenis, en kijkt
        met de tools verder. Het resultaat heeft vier kopjes (In het kort,
        Waarschijnlijke oorzaak, Nog te controleren, Wat je kunt doen) en
        komt bij het incident, met model en datum. Het telt mee voor het
        budget. Het laatste event, done, noemt het gesprek
        (conversation_id) waarin je verder kunt vragen.
      responses:
        "200":
          description: De stroom van het antwoord, met dezelfde events als askAssistant
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /incidents/{incidentId}/note:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setIncidentNote
      summary: De notitie bij een incident (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentNote" }
      responses:
        "200":
          description: Opgeslagen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /assistant/settings:
    get:
      operationId: getAssistantSettings
      summary: De instellingen van de assistent en of jij hem kunt gebruiken
      description: Voor iedereen. De API-sleutel komt nooit terug.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantSettings" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: saveAssistantSettings
      summary: De instellingen opslaan (admin)
      description: |
        Vraagt opnieuw bevestiging: met tweestapsverificatie de code, anders
        het wachtwoord. Een lege sleutel laat de opgeslagen sleutel staan.
        Zonder CF_MASTER_KEY kan de assistent niet aan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantSettingsInput" }
      responses:
        "200":
          description: Opgeslagen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assistant/settings/test:
    post:
      operationId: testAssistantKey
      summary: Eén kleine vraag met de sleutel en het model, zonder iets op te slaan (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantKeyTest" }
      responses:
        "200":
          description: De uitkomst; ook een fout van de Anthropic API staat hierin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantKeyTestResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assistant/usage:
    get:
      operationId: getAssistantUsage
      summary: Het verbruik van deze maand; per gebruiker alleen voor admins
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantUsage" }
        "401": { $ref: "#/components/responses/Error" }
  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      summary: Je gesprekken, nieuwste eerst
      parameters:
        - name: all
          in: query
          description: Ook die van anderen (admin)
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantConversationList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAssistantConversation
      summary: Een nieuw gesprek, eventueel over een cluster, node of incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantConversationInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantConversation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assistant/conversations/{conversationId}:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAssistantConversation
      summary: Een gesprek met zijn vragen en antwoorden (de vrager of een admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantConversationDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAssistantConversation
      summary: Een gesprek wissen (de vrager of een admin)
      responses:
        "204": { description: Gewist }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /assistant/conversations/{conversationId}/messages:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: askAssistant
      summary: Een vraag stellen; het antwoord stroomt als server-sent events
      description: |
        Alleen in je eigen gesprek. De events zijn text (een stuk van het
        antwoord, {"text"}), tool (een tool die loopt, {"name", "label"}),
        error ({"message"}) en als laatste done (tokens, kosten en model).
        Fouten voor het antwoord begint, zoals een leeg budget, komen als
        gewone JSON-fout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantQuestion" }
      responses:
        "200":
          description: De stroom van het antwoord
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /assistant/explain:
    post:
      operationId: explainRisk
      summary: Een bevinding van de health score of een SPOF laten uitleggen; het antwoord stroomt als server-sent events
      description: |
        Voor wie de assistent mag gebruiken. De uitleg komt in een nieuw
        gesprek, zodat je erop kunt doorvragen; het laatste event, done,
        noemt het (conversation_id). Een bevinding of SPOF die er niet
        (meer) is, geeft 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantExplainInput" }
      responses:
        "200":
          description: De stroom van het antwoord, met dezelfde events als askAssistant
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /risk:
    get:
      operationId: getRisk
      summary: De health score van het geheel, de kaart Platform en alle bevindingen
      description: |
        De bevindingen staan gesorteerd op wat het oplossen oplevert voor de
        score van het geheel; geaccepteerde bevindingen achteraan. Voor een
        viewer staat bij een beheerder zonder tweestapsverificatie geen naam.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskOverview" }
        "401": { $ref: "#/components/responses/Error" }
  /risk/history:
    get:
      operationId: getRiskHistory
      summary: De trend van de score, één punt per dag en vandaag de huidige
      parameters:
        - name: cluster
          in: query
          description: Een cluster; zonder is het het geheel
          schema: { type: string, format: uuid }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskHistory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /risk/acceptances:
    post:
      operationId: acceptRiskFinding
      summary: Een bevinding accepteren met een reden en eventueel een einddatum (admin)
      description: Een geaccepteerde bevinding kost geen punten maar blijft zichtbaar. De score rekent meteen opnieuw.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskAcceptanceInput" }
      responses:
        "204": { description: Geaccepteerd }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /risk/acceptances/{acceptanceId}:
    parameters:
      - { name: acceptanceId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteRiskAcceptance
      summary: Een acceptatie intrekken (admin)
      responses:
        "204": { description: Ingetrokken }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /risk/components:
    get:
      operationId: listRiskComponents
      summary: De onderdelen die in de wat-als kunnen uitvallen
      description: Proxmox-hosts, storage, bridges, clusters, nodes en bevestigde diensten.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskComponentList" }
        "401": { $ref: "#/components/responses/Error" }
  /risk/what-if:
    post:
      operationId: riskWhatIf
      summary: Rekenen wat er gebeurt als onderdelen tegelijk uitvallen
      description: |
        Rekent alleen en raakt niets aan; daarom mogen ook viewers het. Per
        cluster de voorspelde status met de echte statusregels, eerst en na de
        herstart door Proxmox HA, de VM's die uitvallen of herstarten, de
        diensten die geraakt worden, en of ClusterForge zelf uitvalt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskWhatIfInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskWhatIf" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /risk/spof:
    get:
      operationId: listRiskSPOFs
      summary: De single points of failure
      description: |
        De wat-als voor elke host, storage, bridge en node apart, alsof de rest
        gezond is. Een onderdeel staat erin als zijn uitval een prod-cluster of
        een bevestigde prod-dienst down maakt, ook nadat HA herstart wat het
        kan. De meeste uitval eerst.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskSPOFList" }
        "401": { $ref: "#/components/responses/Error" }
  /self-location:
    get:
      operationId: getSelfLocation
      summary: Op welke VM of container ClusterForge zelf draait
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfLocation" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: setSelfLocation
      summary: De VM van ClusterForge zelf invullen (admin)
      description: Een ingevulde VM wint van wat ClusterForge zelf vindt, tot je haar weghaalt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfLocationInput" }
      responses:
        "204": { description: Bewaard }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSelfLocation
      summary: De ingevulde VM weghalen, zodat ClusterForge zelf zoekt (admin)
      responses:
        "204": { description: Weggehaald }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /map:
    get:
      operationId: getMap
      summary: Een laag van de infrastructuurkaart
      description: |
        physical: per Proxmox-host de VM's, containers en storage, met een lijn
        van elke gast naar de storage van zijn schijven. network: de subnetten
        met hun nodes, de bridges van de hosts met hun VLAN's, de gateways, de
        VIP's met hun eigenaar en de VRRP-peers. Alleen lezen. De laag Diensten
        is de afhankelijkheidsgraaf (/dependency-graph).
      parameters:
        - { name: layer, in: query, required: true, schema: { type: string, enum: [physical, network] } }
        - { name: environment, in: query, schema: { $ref: "#/components/schemas/Environment" } }
        - { name: cluster_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapLayer" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /node-links:
    get:
      operationId: listNodeLinks
      summary: Voorstellen om een node aan een VM te koppelen
      description: |
        Een VM of container in Proxmox die geen node is, met hetzelfde
        MAC-adres als een interface van een node met een agent en zonder VM.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeLinkList" }
        "401": { $ref: "#/components/responses/Error" }
  /node-links/{linkId}/confirm:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmNodeLink
      summary: Een koppelvoorstel bevestigen; de node hangt dan aan de VM (admin)
      responses:
        "204": { description: Gekoppeld }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /node-links/{linkId}/ignore:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: ignoreNodeLink
      summary: Een koppelvoorstel negeren; het komt niet terug (admin)
      responses:
        "204": { description: Genegeerd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/risk:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClusterRisk
      summary: De zeven scorekaarten van een cluster met hun bevindingen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterRisk" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /docs:
    get:
      operationId: listDocs
      summary: Alle documenten van de documentatie met hun nieuwste versie
      description: Het overzicht en per cluster vijf hoofdstukken. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocIndex" }
        "401": { $ref: "#/components/responses/Error" }
  /docs/download:
    get:
      operationId: downloadDocs
      summary: Alle documenten als zip met Markdown
      description: |
        De nieuwste versie van elk document, met de mappen zoals ze in Git
        zouden staan: README.md en clusters/<slug>/<hoofdstuk>.md. Zonder
        geheimen. Ook voor viewers.
      responses:
        "200":
          description: De zip
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
  /docs/generate:
    post:
      operationId: generateDocs
      summary: De documentatie nu opnieuw schrijven (admin)
      description: Bewaart alleen documenten waarvan de inhoud veranderde.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocGenerateResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /docs/target:
    get:
      operationId: getDocsTarget
      summary: De GitHub-repository van de documentatie en de laatste publicatie
      description: Ook voor viewers. Het token komt nooit terug.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocsTargetStatus" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: saveDocsTarget
      summary: De koppeling maken of wijzigen (admin)
      description: |
        Leest eerst de branch en test met een losse blob of het token mag
        schrijven; lukt dat niet, dan wordt er niets opgeslagen. Een leeg
        token laat het opgeslagen token staan. De repository en branch van
        GitOps worden geweigerd. Na het opslaan publiceert de server meteen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocsTargetInput" }
      responses:
        "200":
          description: Opgeslagen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocsTargetStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDocsTarget
      summary: De koppeling verwijderen (admin); wat al in de repository staat, blijft daar
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /docs/target/test:
    post:
      operationId: testDocsTarget
      summary: Token, repository en branch testen zonder op te slaan (admin)
      description: Maakt een losse blob die bij geen enkele commit hoort; zo blijkt of het token mag schrijven.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocsTargetInput" }
      responses:
        "200":
          description: De branch en de documenten die er al staan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocsTargetProbe" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /docs/publish:
    post:
      operationId: publishDocs
      summary: De documentatie nu naar GitHub schrijven (admin)
      description: |
        Eén commit met alleen de bestanden die veranderden; zonder verschil
        geen commit. Werkt ook als automatisch publiceren uit staat.
      responses:
        "200":
          description: De commit, of geen als alles al gelijk was
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocsPublishResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /docs/summary:
    post:
      operationId: summarizeDocs
      summary: De samenvatting 'In het kort' van een cluster laten schrijven (admin); het antwoord stroomt als server-sent events
      description: |
        De assistent leest de hoofdstukken van het cluster en schrijft een
        korte samenvatting. Die komt bovenaan het hoofdstuk Architectuur,
        met model en datum, en de documentatie wordt meteen opnieuw
        geschreven. Links, afbeeldingen en HTML gaan eruit, omdat de
        documentatie ook naar GitHub kan gaan.
      parameters:
        - { name: cluster, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: De stroom van het antwoord, met dezelfde events als askAssistant
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDocSummary
      summary: De samenvatting 'In het kort' van een cluster weghalen (admin)
      parameters:
        - { name: cluster, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Weggehaald }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /docs/{scope}/{kind}:
    parameters:
      - { $ref: "#/components/parameters/DocScopeParam" }
      - { $ref: "#/components/parameters/DocKindParam" }
    get:
      operationId: getDoc
      summary: Eén document als Markdown, de nieuwste versie of een oudere
      description: |
        Is er nog geen versie bewaard, dan schrijft de server het document
        zonder het te bewaren; version is dan leeg. Ook voor viewers.
      parameters:
        - { $ref: "#/components/parameters/DocClusterParam" }
        - name: version
          in: query
          description: Een bewaarde versie uit de geschiedenis
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doc" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /docs/{scope}/{kind}/history:
    parameters:
      - { $ref: "#/components/parameters/DocScopeParam" }
      - { $ref: "#/components/parameters/DocKindParam" }
    get:
      operationId: getDocHistory
      summary: De bewaarde versies van een document, nieuwste eerst
      parameters:
        - { $ref: "#/components/parameters/DocClusterParam" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocHistory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /docs/{scope}/{kind}/diff:
    parameters:
      - { $ref: "#/components/parameters/DocScopeParam" }
      - { $ref: "#/components/parameters/DocKindParam" }
    get:
      operationId: getDocDiff
      summary: Wat er tussen twee versies van een document veranderde, als unified diff
      parameters:
        - { $ref: "#/components/parameters/DocClusterParam" }
        - { name: from, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: to, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocDiff" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /reports/recovery:
    get:
      operationId: getRecoveryReport
      summary: Het rapport Herstelbaarheid van een maand
      description: |
        Per cluster de nieuwste back-ups, de controles, failovertests,
        rampoefeningen en DR-repetities van de maand, RTO en RPO tegen de
        doelen en de open risico's op de kaarten Back-ups, Herstelbaarheid
        en Redundantie. Een maand met een bewaard rapport geeft dat rapport;
        anders rekent ClusterForge het nu, met de back-ups, doelen en
        risico's van nu. Ook voor viewers.
      parameters:
        - name: month
          in: query
          description: JJJJ-MM; zonder is het deze maand
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/preferences:
    put:
      operationId: setPreferences
      summary: Voorkeuren van de ingelogde gebruiker, zoals de leermodus van Kubernetes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Bewaard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /component-templates:
    get:
      operationId: listComponentTemplates
      summary: De databases die ClusterForge op de nodes van een cluster kan zetten, met hun instellingen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ComponentTemplate" } }
        "401": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listClusterComponents
      summary: De onderdelen van een cluster, zoals zijn database
      description: |
        Een onderdeel is een gewenste staat op de nodes van een cluster dat er al is, naast een template of baseline. In
        fase 5 is dat de database: MariaDB Galera. Ook voor viewers; geheimen staan er niet in.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ClusterComponent" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addClusterComponent
      summary: Een database toevoegen (admin); wordt een taak
      description: |
        Rolt het plan uit dat POST .../components/plan gaf, als de hash nog klopt en niets het tegenhoudt: de nodes een voor
        een, met na elke node wachten tot hij Synced is. Een ander plan geeft 409 met code plan_stale. Op prod vraagt het
        tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentApplyInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/plan:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planClusterComponent
      summary: Bekijken wat een database toevoegen zou doen (admin)
      description: |
        Per node het geheugen, de schijf, de Proxmox-host, wat er al draait en de stappen, met de bevindingen die het
        tegenhouden of waarvoor gewaarschuwd wordt. Er verandert niets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentInput" }
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateClusterComponent
      summary: Vanzelf opnieuw starten aan- of uitzetten (admin)
      description: |
        Met auto_recover begint ClusterForge een Galera-cluster na een volledige uitval vanzelf opnieuw, zodra alle datanodes
        antwoorden en MariaDB nergens meer draait of start, op de node met de nieuwste data. Ook een node die niet startte
        terwijl het cluster draait, start het dan opnieuw. Standaard aan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentUpdateInput" }
      responses:
        "200":
          description: Het onderdeel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterComponent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeClusterComponent
      summary: Een database die nooit gelukt is uit ClusterForge halen (admin)
      description: |
        Alleen zolang de database nog nooit helemaal uitgerold is, zodat een nieuwe poging met andere nodes kan. Op de nodes
        verandert niets. Een draaiende database geeft 409.
      responses:
        "204": { description: Weggehaald }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/apply:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reapplyClusterComponent
      summary: Een database opnieuw toepassen (admin); wordt een taak
      description: |
        Past de huidige revisie opnieuw toe, bijvoorbeeld na een mislukte uitrol of als de driftcontrole een gewijzigd
        bestand ziet. Een node die al meedoet, sluit niet opnieuw aan; is zijn configuratie veranderd, dan herstart MariaDB
        daar, node voor node. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentReapplyInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/manage:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClusterComponentManage
      summary: Beheer van een database per node (admin)
      description: |
        Per datanode hoe het met de database staat en wat Beheer er kan: bij Galera opnieuw synchroniseren, bij PostgreSQL
        met Patroni een replica de primary maken of opnieuw opbouwen. Bij elke actie staat waarom ze niet kan, of wat er
        gebeurt. Er verandert niets.
      responses:
        "200":
          description: Beheer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentManage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      operationId: manageClusterComponent
      summary: Een actie uit Beheer uitvoeren (admin); wordt een taak
      description: |
        Voert de actie op de node uit als Beheer nog is wat je zag (de hash) en de actie kan. Een ander overzicht geeft 409
        met code plan_stale. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentManageInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/settings/plan:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planClusterComponentSettings
      summary: Bekijken wat nieuwe instellingen van een database doen (admin)
      description: |
        De instellingen die na de uitrol nog kunnen veranderen, met hun waarde nu, en wat de nieuwe waarden in settings
        doen: wat verandert, de volgorde van de nodes (de schrijver als laatste), het geheugen per node en wat er gebeurt.
        Zonder settings is het alleen het overzicht. Er verandert niets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentSettingsPlanInput" }
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentSettingsPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/settings:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: changeClusterComponentSettings
      summary: De instellingen van een database wijzigen (admin); wordt een taak
      description: |
        Maakt een nieuwe revisie met de nieuwe instellingen en past ze node voor node toe, met de schrijver als laatste: bij
        Galera herstart MariaDB op elke node en wacht ClusterForge tot hij weer Synced is; bij PostgreSQL komt
        max_connections in etcd en herstart PostgreSQL node voor node, de primary als laatste. Een ander plan geeft 409 met
        code plan_stale. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentSettingsInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/upgrade:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getClusterComponentUpgrade
      summary: Bekijken wat bijwerken van een database doet (admin)
      description: |
        Per node de versie die nu draait en de pakketten van de database met een nieuwere versie volgens de laatste apt
        update, de volgorde (de schrijver als laatste) en wat er gebeurt. Er verandert niets.
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentUpgradePlan" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      operationId: upgradeClusterComponent
      summary: Een database bijwerken naar een kleinere versie (admin); wordt een taak
      description: |
        Node voor node, de schrijver als laatste: apt-get update, alleen de pakketten van de database bijwerken binnen de
        versie van Debian, en als er iets veranderde de database daar herstarten en wachten tot de node weer meedoet. Bij
        PostgreSQL schakelt ClusterForge eerst over als de node de primary is. Een ander plan geeft 409 met code
        plan_stale. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentUpgradeInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/join/plan:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planClusterComponentJoin
      summary: Bekijken wat het toevoegen van een node aan een database doet (admin)
      description: |
        De nodes van het cluster die nog niet bij de database horen, en voor de gekozen node wat er gebeurt: de controles
        op de nieuwe node (agent, Debian, poorten, geheugen, schijf), wat er op de andere nodes verandert (geen ervan
        herstart de database), het VIP en het aantal stemmen daarna. Zonder node_id zijn het alleen de kandidaten. Er
        verandert niets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentJoinPlanInput" }
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentJoinPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/join:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: joinClusterComponent
      summary: Een node toevoegen aan een database (admin); wordt een taak
      description: |
        Maakt een nieuwe revisie met de node erbij en past die toe. Bij Galera haalt de nieuwe node alle data bij een node
        die meedoet; bij PostgreSQL wordt hij eerst lid van etcd en dan een replica. De andere nodes herstarten niet. Een
        ander plan geeft 409 met code plan_stale. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentJoinInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/recover/plan:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planRecoverClusterComponent
      summary: Bekijken wat opnieuw starten zou doen (admin)
      description: |
        Per datanode hoe het met MariaDB staat en tot welke transactie hij de data heeft (seqno), en welke node het cluster
        begint: die met de nieuwste data. Na een crash staat de positie alleen in InnoDB; de taak leest haar dan eerst. Er
        verandert niets.
      responses:
        "200":
          description: Het plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentRecoverPlan" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/heal-auto:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setHealAuto
      summary: Zelfherstel vanzelf aan- of uitzetten op een cluster (admin)
      description: |
        Aan voert ClusterForge elk plan van Zelfherstel dat vanzelf mag zelf uit, met een rem: het probleem bestaat minstens
        twee minuten, hoogstens drie pogingen per uur, na een mislukte poging een kwartier wachten, het Galera-cluster opnieuw
        beginnen hoogstens eens per uur, en na drie mislukte pogingen op rij pauze. Aanzetten heft een pauze op. Op prod kan
        het niet aan (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealAutoSetting" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/recover:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recoverClusterComponent
      summary: De database opnieuw starten (admin); wordt een taak
      description: |
        Doet wat het plan met deze hash zei: draait het cluster nog op een node, dan sluiten de andere daar aan; anders
        begint de node met de nieuwste data het cluster en sluiten de andere een voor een aan. Een node die niet antwoordde,
        doet niet mee. Een ander plan geeft 409 met code plan_stale. Op prod vraagt het tweestapsverificatie en de slug in
        confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentRecoverInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/metrics:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: range, in: query, schema: { $ref: "#/components/schemas/MetricsRange" } }
      - $ref: "#/components/parameters/MetricsFrom"
      - $ref: "#/components/parameters/MetricsTo"
    get:
      operationId: getComponentMetrics
      summary: Grafieken van de database van een cluster, met een lijn per node
      description: |
        Bij MariaDB verbindingen, query's per seconde, de buffer pool, de wachtrij en flow control van Galera, en de grootte per
        database; bij PostgreSQL verbindingen, transacties per seconde, cache-hits, de achterstand van de replica's en de grootte
        per database. De agent meet ze vanaf protocol 13. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/databases:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listComponentDatabases
      summary: De databases en gebruikers in de database van een cluster
      description: |
        ClusterForge leest ze bij MariaDB op de datanode met het VIP, of anders de eerste die Synced is, en bij PostgreSQL op
        de primary van Patroni: de databases met grootte, tabellen en verbindingen op die node, en de gebruikers met hun hosts
        en rechten, zonder wachtwoord of hash. Bij PostgreSQL heeft een gebruiker geen hosts; pg_hba laat de nodes en het VIP
        binnen. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentDatabases" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      operationId: createComponentDatabase
      summary: Een database met een eigen gebruiker aanmaken (admin)
      description: |
        De gebruiker krijgt alle rechten op de database en mag inloggen vanaf elke node en elk VIP van het cluster; bij
        PostgreSQL wordt hij de eigenaar van de database. Het wachtwoord staat één keer in het antwoord; ClusterForge bewaart
        het niet. Bestaat de database of de gebruiker al, dan 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentDatabaseInput" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentDatabaseCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/databases/{name}/drop:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      operationId: dropComponentDatabase
      summary: Een database weghalen (admin)
      description: |
        Alleen met de naam van de database in name. Op prod vraagt het tweestapsverificatie en de slug in confirm. De
        gebruikers houden hun rechten op die naam; haal ze apart weg.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentDropInput" }
      responses:
        "204": { description: Weggehaald }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/users/{user}/password:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: user, in: path, required: true, schema: { type: string } }
    post:
      operationId: setComponentUserPassword
      summary: Een gebruiker een nieuw wachtwoord geven (admin)
      description: |
        Op al zijn hosts. Het wachtwoord staat één keer in het antwoord; de app kan pas weer inloggen als het daar staat. Op
        prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentConfirmInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentUserPassword" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/users/{user}/drop:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: user, in: path, required: true, schema: { type: string } }
    post:
      operationId: dropComponentUser
      summary: Een gebruiker op al zijn hosts weghalen (admin)
      description: Alleen met de naam van de gebruiker in name. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentDropInput" }
      responses:
        "204": { description: Weggehaald }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/dumps:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listComponentDumps
      summary: De dumps van de databases van een cluster, met de instellingen van de nachtelijke dump
      description: |
        Per database de nieuwste goede dump en hoe vers die is, en alle dumps die ClusterForge kent, de nieuwste eerst. De
        dumps staan op de nodes in /var/backups/clusterforge-db; ClusterForge vraagt de agents hier niets. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentDumps" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createComponentDump
      summary: Meteen een dump van een database maken (admin); wordt een taak
      description: |
        Bij MariaDB komt de dump op een datanode zonder het VIP die Synced is, bij PostgreSQL op de primary. Loopt er al een
        dump of terugzetten van deze database, dan 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentDumpInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/dumps/{dumpId}/restore:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: dumpId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreComponentDump
      summary: Een dump terugzetten in een nieuwe database naast de bestaande (admin); wordt een taak
      description: |
        Standaard heet de nieuwe database <database>_herstel_<datum van de dump>. De bestaande database blijft zoals ze is.
        Mislukt het, dan haalt de agent de nieuwe database weer weg. Bij PostgreSQL zet de agent met de dump hem over het
        netwerk terug op de primary, met een tijdelijke beheerder die ClusterForge daar maakt en daarna weghaalt.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentRestoreInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentRestoreStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /clusters/{clusterId}/components/{componentId}/backup:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setComponentBackup
      summary: De nachtelijke dump van de databases van een cluster instellen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentBackupSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentBackupSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /databases:
    get:
      operationId: listDatabases
      summary: De MariaDB- en PostgreSQL-servers die de agents melden
      description: |
        ClusterForge vraagt elke minuut elke node met een databaseserver naar
        zijn status, via agentprotocol 9. De servers staan gegroepeerd per
        cluster en engine, zoals een Galera-cluster of een primary met zijn
        replica's. Alleen catalogus- en statusgegevens, nooit een rij uit een
        tabel. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DatabaseGroup" } }
        "401": { $ref: "#/components/responses/Error" }
  /heal:
    get:
      operationId: listHeal
      summary: Zelfherstel per database
      description: |
        Wat er mis is met elke MariaDB-, MySQL- en PostgreSQL-database op de nodes, ook als ClusterForge haar niet toepaste,
        met het herstelplan en of dat vanzelf mag. Elke minuut vraagt ClusterForge elke node met een databaseserver
        heal inspect (agentprotocol 22): units, processen, vrije ruimte en de Galera-config. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/HealReport" } }
        "401": { $ref: "#/components/responses/Error" }
  /heal/run:
    post:
      operationId: runHeal
      summary: Het herstelplan van een database uitvoeren (admin); wordt een taak heal.run
      description: |
        Doet wat het plan met deze hash zei: Galera-adressen bijwerken, een hangend proces stoppen, de server starten, of
        bij Galera zonder Primary component het cluster beginnen op de node met de nieuwste data en de andere laten
        aansluiten. Een ander plan geeft 409 met code plan_stale; een plan dat nu niet kan, of een database die een onderdeel
        van ClusterForge is, geeft 409. Op prod vraagt het tweestapsverificatie en de slug in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealRunInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /cronjobs:
    get:
      operationId: listCronjobs
      summary: De cronjobs en systemd-timers die de agents melden
      description: |
        ClusterForge vraagt elke vijf minuten elke node naar zijn cronjobs en timers, via agentprotocol 16: /etc/crontab,
        /etc/cron.d, de crontabs van gebruikers, de periodieke mappen en de systemd-timers, met de laatste run uit de journal.
        Per cluster dezelfde job op meer nodes samen. Wachtwoorden in commando's zijn op de node al gemaskeerd. Ook voor
        viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CronGroup" } }
        "401": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/cron-logging:
    post:
      operationId: setCronLogging
      summary: cron op een node het einde en de exitcode van elke job laten loggen (admin)
      description: |
        Schrijft een drop-in voor cron.service die cron met -L 15 start, en herstart cron; lopende jobs draaien door.
        Met enabled=false gaat de drop-in weg. Vraagt agentprotocol 17.
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Gedaan
          content:
            application/json:
              schema:
                type: object
                required: [output]
                properties:
                  output: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /nodes/{nodeId}/crons/{key}/toggle:
    post:
      operationId: toggleNodeCron
      summary: Een gevonden cronregel op een node uit- of weer aanzetten (admin)
      description: |
        Zet de regel in commentaar, met "# uitgezet door ClusterForge: " ervoor, of haalt dat weer weg. Alleen voor een regel
        in /etc/crontab, /etc/cron.d of de crontab van een gebruiker; de rest van het bestand blijft zoals het is. Daarna leest
        ClusterForge de node opnieuw. Vraagt agentprotocol 20, en op prod de slug en TOTP.
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                confirm: { type: string, description: De slug van het cluster, op prod }
      responses:
        "200":
          description: Gedaan
          content:
            application/json:
              schema:
                type: object
                required: [output]
                properties:
                  output: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /cron-jobs:
    get:
      operationId: listCronJobs
      summary: De beheerde cronjobs, met de laatste run per node
      description: Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ManagedCronJob" } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCronJob
      summary: Een beheerde cronjob maken (admin)
      description: |
        De job komt meteen op de nodes als systemd-timer (agentprotocol 18). Op prod vraagt het tweestapsverificatie en de
        slug in confirm. 400 met field bij een fout in het formulier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedCronJobCreate" }
      responses:
        "201":
          description: Gemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedCronJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /cron-jobs/schedule:
    get:
      operationId: checkCronSchedule
      summary: Een schema in gewone taal, met de volgende vijf runs
      parameters:
        - { name: schedule, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronScheduleInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /cron-jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCronJob
      summary: Eén beheerde cronjob met zijn runs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedCronJobDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCronJob
      summary: Een beheerde cronjob wijzigen of aan- en uitzetten (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedCronJobInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedCronJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCronJob
      summary: Een beheerde cronjob weghalen, ook van de nodes (admin)
      parameters:
        - { name: confirm, in: query, required: false, schema: { type: string } }
      responses:
        "204": { description: Weg }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /cron-jobs/{jobId}/run:
    post:
      operationId: runCronJob
      summary: Een beheerde cronjob nu uitvoeren (admin)
      description: Op de node met het VIP, op zijn node of op alle nodes. Op prod met tweestapsverificatie en de slug in confirm.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: string }
      responses:
        "202":
          description: Gestart
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /cron-jobs/{jobId}/plan:
    get:
      operationId: getCronSyncPlan
      summary: Wat een bestandssync nodig heeft, per node gecontroleerd (admin)
      description: |
        Vraagt elke bron en elk doel naar rsync, ssh, sshd, PermitRootLogin, de hostsleutels en de vrije ruimte in de doelmap.
        Vraagt agentprotocol 21.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronSyncPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /cron-jobs/{jobId}/dry-run:
    post:
      operationId: dryRunCronSync
      summary: Een bestandssync als proef draaien naar één doel (admin)
      description: |
        rsync --dry-run --itemize-changes vanaf de bron die de sync nu zou draaien; er verandert niets. Elke regel is een bestand
        dat zou veranderen, zoals ">f+++++++++ map/bestand" (nieuw) of "*deleting oud" (weg, alleen met verwijderen aan).
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, format: uuid, description: De node-id van het doel }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [source, lines]
                properties:
                  source: { type: string, description: De bron die de proef draaide }
                  lines: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /cron-runs/{runId}:
    get:
      operationId: getCronRun
      summary: Eén run met zijn uitvoer
      description: Een viewer ziet de uitvoer niet van een job die als root draait.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronRun" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /cron-runs/{runId}/stop:
    post:
      operationId: stopCronRun
      summary: Een lopende run stoppen (admin)
      description: cf-agent stopt het commando met zijn hele procesgroep; de run krijgt de uitkomst stopped. Vraagt agentprotocol 19.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: string }
      responses:
        "202": { description: Gestopt }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /cronjobs/refresh:
    post:
      operationId: refreshCronjobs
      summary: De cronjobs van alle nodes meteen opnieuw lezen
      responses:
        "202": { description: Gestart }
        "401": { $ref: "#/components/responses/Error" }
  /databases/migration:
    get:
      operationId: getDatabaseMigration
      summary: Het plan om een database naar de database van een cluster te verhuizen
      description: |
        Bekijkt de database op de oude server (alleen de catalogus: grootte, tabellen met engine en primaire sleutel, views,
        routines, triggers en events) en laat de importerende node van het nieuwe cluster de begroeting van de oude MariaDB
        lezen, zonder in te loggen. Zonder component kiest het plan het cluster waarvan de app de database nu al gebruikt, als
        dat er één is. Met de bevindingen en de vorige proeven. Er verandert niets. Ook voor viewers.
      parameters:
        - { name: source, in: query, required: true, schema: { type: string }, description: "De sleutel van de server onder Databases, zoals mariadb/<cluster>" }
        - { name: database, in: query, required: true, schema: { type: string } }
        - { name: component, in: query, required: false, schema: { type: string, format: uuid }, description: De database van het nieuwe cluster }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseMigrationPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /databases/migration/trial:
    post:
      operationId: startDatabaseMigrationTrial
      summary: Een proefverhuizing beginnen (admin); wordt een taak
      description: |
        Maakt op de oude server een tijdelijke gebruiker die alleen deze database mag lezen, laat de nieuwe node de dump
        ophalen en importeren in <database>_proef terwijl de app doorwerkt, telt de rijen aan beide kanten, haalt de kopie en
        de gebruiker weer weg en bewaart hoe lang het duurde. Het wachtwoord van de tijdelijke gebruiker bewaart ClusterForge
        nergens. 409 als het plan iets tegenhoudt of er al een proef van deze database loopt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabaseMigrationInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migration/move:
    post:
      operationId: startDatabaseMove
      summary: Een database echt verhuizen (admin); wordt een taak
      description: |
        Zet de app eerst in onderhoud. De taak kijkt of er nog iemand met de oude database verbonden is (zonder force wacht ze
        even en stopt ze dan), maakt de gebruikers van de app op het nieuwe cluster met dezelfde hash van hun wachtwoord, laat
        de nieuwe node de dump ophalen en importeren in dezelfde naam, en telt de rijen aan beide kanten. Alles moet gelijk
        zijn; anders gaan de nieuwe database en de nieuwe gebruikers weer weg en blijft de app op de oude. Gelukt, dan wacht de
        verhuizing op overschakelen. De hash bewaart ClusterForge nergens. 409 als het plan iets tegenhoudt, als er zonder force
        nog verbindingen zijn, of als er al een proef of verhuizing van deze database loopt. Raakt de verhuizing een
        prodcluster, dan met de slug (die van het nieuwe cluster, anders die van het oude) en tweestapsverificatie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabaseMoveInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migrations/{id}/switch:
    post:
      operationId: switchDatabaseMove
      summary: De app draait op de nieuwe database (admin)
      description: |
        Voor een verhuizing die gekopieerd is. Zonder force mag niemand meer met de oude database verbonden zijn en moet
        iemand met de nieuwe verbonden zijn; anders 409 met wie. Daarna mogen de gebruikers van de app de oude database alleen
        nog lezen (SELECT en SHOW VIEW).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, description: "Toch overschakelen, ook met verbindingen naar de oude database" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseMigrationRun" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migrations/{id}/cancel:
    post:
      operationId: cancelDatabaseMove
      summary: Een gekopieerde verhuizing annuleren (admin)
      description: |
        Haalt de nieuwe database en de gebruikers die ClusterForge maakte weg van het nieuwe cluster; de app blijft op de oude
        database. Confirm is de naam van de database. 409 als iemand de nieuwe database al gebruikt: schakel dan over.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseMigrationRun" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migrations/{id}/lock:
    post:
      operationId: lockDatabaseMove
      summary: De oude database van een verhuisde app op slot zetten of het slot eraf halen (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked]
              properties:
                locked: { type: boolean, description: "true: alleen nog lezen; false: de rechten van voor de verhuizing terug" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseMigrationRun" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/migrations/{id}/retire:
    post:
      operationId: retireDatabaseMove
      summary: De oude database van een verhuisde app afbouwen (admin); wordt een taak
      description: |
        Kan als er zeven dagen niemand van buiten de databasenode met de oude database verbonden was, en nu niemand
        verbonden is (ook niet op de databasenode zelf). Een laatste dump op een node van de oude server, die blijft staan;
        is hij niet compleet, dan stopt het. Daarna gaan de database en de gebruikers van de app weg. Een gebruiker die ook
        rechten op een andere database heeft of er de laatste 30 dagen een andere gebruikte, blijft. Name is de naam van de
        database; raakt het een prodcluster (dat van de app, anders het oude), dan ook de slug en tweestapsverificatie. 409
        als het nog niet kan, met tot wanneer en waarom.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentDropInput" }
      responses:
        "202":
          description: Taak aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /databases/retire:
    get:
      operationId: listDatabaseRetire
      summary: De oude databaseservers waarvan een database verhuisd is
      description: |
        Per oude server (alle databaseservers op dezelfde nodes, zoals MariaDB en PostgreSQL op db1 tot db3): de verhuisde
        databases met wanneer afbouwen kan, wat er nog van een app op staat, en per app of zijn firewallregel naar de oude
        server nog gebruikt wordt, uit de verbindingen die ClusterForge elke minuut leest. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DatabaseRetireSource" } }
        "401": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters:
    get:
      operationId: listKubeClusters
      summary: De Kubernetes-clusters met hun laatste samenvatting
      description: |
        ClusterForge vat elk cluster van type kubernetes elke 30 seconden
        samen via de kube-brug van een agent. Ook voor viewers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KubeClusterSummary" } }
        "401": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters/{clusterId}:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getKubeOverview
      summary: Overzicht van een Kubernetes-cluster, live via de kube-brug
      description: |
        Versie, nodes, pods per status, apps, CPU en geheugen, de laatste
        waarschuwingen en de pods die aandacht vragen. 503 met code
        agent_too_old als de agents op de servers te oud zijn voor de
        kube-brug, kube_unavailable als geen agent de API bereikt, en 502
        met code kube_api bij een fout van Kubernetes zelf.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters/{clusterId}/nodes:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listKubeNodes
      summary: De Kubernetes-nodes, met de ClusterForge-node en VM erbij
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KubeNode" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /kubernetes/clusters/{clusterId}/workloads:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/KubeNamespace"
