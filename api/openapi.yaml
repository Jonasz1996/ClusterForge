      - { name: dcId, in: path, required: true, schema: { type: string } }
    post:
      operationId: openPveConsole
      summary: Een console openen op een gast of host (admin)
      description: |
        Opent via de agent op de Proxmox-host een scherm (vnc, noVNC) of terminal (serial, ct, host; xterm). Daarna
        opent de browser binnen 30 seconden de websocket GET /api/v1/pve/console/{session}. Het verkeer komt in geen
        taak of logboek. Vraagt de agent met protocol 37 op die host.
      requestBody:
        required: true
