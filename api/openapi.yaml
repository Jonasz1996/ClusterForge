  /kubernetes/clusters/{clusterId}/lessons/{lesson}/check:
    parameters:
      - { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: lesson, in: path, required: true, schema: { type: string } }
    post:
      operationId: checkKubeLesson
      summary: Een les bekijken en de opdracht die aan de beurt is controleren op het cluster
      description: |
        De opdrachten zijn op volgorde. ClusterForge controleert de eerste die niet af is, alleen lezend; lukt die, dan
        is de volgende meteen aan de beurt. answers zijn antwoorden op vragen en de bevestiging van een leesopdracht,
        per opdracht. Kan het cluster niet gelezen worden, dan staat dat in problem en blijft de opdracht aan de beurt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KubeLessonCheckInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubeLesson" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
