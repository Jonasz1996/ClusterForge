        cluster_name: { type: string }
        test_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string, description: "De node die de storing kreeg, of waarvan de back-up gecontroleerd werd" }
        job_id: { type: string, format: uuid, nullable: true }
        job_status:
          allOf: [{ $ref: "#/components/schemas/JobStatus" }]
          nullable: true
        result:
          allOf: [{ $ref: "#/components/schemas/TestRunResult" }]
          nullable: true
          description: Leeg zolang de taak wacht of loopt
        restored: { type: boolean, nullable: true, description: false als het herstel niet lukte; leeg als er niets te herstellen was }
        summary: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/TestRunCheck" } }
        timeline: { type: array, items: { $ref: "#/components/schemas/TestRunEvent" } }
        measurements:
          allOf: [{ $ref: "#/components/schemas/FailoverMeasurements" }]
          nullable: true
          description: Alleen bij failover.test
        definition:
          allOf: [{ $ref: "#/components/schemas/FailoverDefinition" }]
          nullable: true
          description: Alleen bij failover.test
        backup:
          allOf: [{ $ref: "#/components/schemas/BackupVerifyReport" }]
          nullable: true
          description: Alleen bij backup.verify
        disaster:
          allOf: [{ $ref: "#/components/schemas/DisasterReport" }]
          nullable: true
          description: Alleen bij disaster.run
        rehearsal:
          allOf: [{ $ref: "#/components/schemas/DRReport" }]
          nullable: true
          description: Alleen bij dr.rehearsal
        requested_by: { type: string, nullable: true, description: Gebruikersnaam van wie de run vroeg }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    DisasterKind: { type: string, enum: [host_down, service_down, vip_loss, sequence, dr_rehearsal] }
    DRSchedule:
      type: string
      enum: ["", weekly, monthly]
      description: "Leeg: alleen met de hand; weekly: elke week in het testvenster; monthly: in het eerste testvenster van de maand"
    RecoveryTargets:
      type: object
      required: [rto_minutes, rpo_hours, default_rto_minutes, default_rpo_hours, custom]
      properties:
        rto_minutes: { type: integer, description: "Hoe lang herstel uit de back-ups mag duren; 0 is geen doel" }
        rpo_hours: { type: integer, description: "Hoe oud de gegevens na herstel mogen zijn; 0 is geen doel" }
        default_rto_minutes: { type: integer, description: "De standaard van de omgeving: prod 60, lab en test 0" }
        default_rpo_hours: { type: integer, description: "De standaard van de omgeving: prod 26, lab en test 0" }
        custom: { type: boolean, description: Het cluster heeft eigen doelen }
    RecoveryTargetsInput:
      type: object
      required: [rto_minutes, rpo_hours]
      properties:
        rto_minutes: { type: integer, nullable: true, minimum: 0, maximum: 10080, description: "Leeg: de standaard van de omgeving; 0: geen doel" }
        rpo_hours: { type: integer, nullable: true, minimum: 0, maximum: 8760, description: "Leeg: de standaard van de omgeving; 0: geen doel" }
    DRPlanNode:
      type: object
      required: [node_id, hostname, source_vmid, volid, backup_time, backup_storage, size_bytes, memory_bytes, disk_bytes, address]
