            symptoom tot het einde, oudste eerst
          items: { $ref: "#/components/schemas/TimelineEntry" }
        timeline_more:
          type: boolean
          description: Er waren meer regels; de oudste ontbreken
        history:
          type: array
          description: Statusovergangen, incidenten, tests en herstelacties van Zelfherstel over wat geraakt was, oudste eerst
          items: { $ref: "#/components/schemas/AuditEntry" }
        history_more:
          type: boolean
          description: Er waren meer regels dan getoond
        ai:
          allOf: [{ $ref: "#/components/schemas/IncidentAI" }]
          nullable: true
          description: De analyse van de assistent; null zolang er geen is
    IncidentAI:
      type: object
      required: [text, hidden, model, at, by, automatic, cost_usd, conversation_id]
      properties:
        text: { type: string, nullable: true, description: "Markdown met vier kopjes; null als hidden" }
        hidden:
          type: boolean
          description: De analyse las met de rechten van een beheerder; een viewer ziet de tekst niet
        model: { type: string, description: "Het model dat antwoordde; met een fallback meer, gescheiden door een komma" }
        at: { type: string, format: date-time }
        by: { type: string, nullable: true, description: Wie haar vroeg; null als ze automatisch was }
        automatic: { type: boolean }
        cost_usd: { type: number }
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: Het gesprek met de tools; alleen voor wie het mag openen
    TimelineEntry:
      type: object
      required: [id, ts, from, to, delay, class, source, kind, action, summary, node_id, hostname, cluster_id, cluster, subject, job_id, job, link, detail]
