        name: { type: string, maxLength: 60 }
        scope_id: { type: string, format: uuid }
        scanner_id: { type: string, format: uuid, nullable: true }
        profile: { type: string, enum: [snel, standaard, volledig] }
        max_rate: { type: integer, minimum: 10, maximum: 5000 }
        default_passwords: { type: boolean, description: "Per dienst één aanmeldpoging met het standaardwachtwoord (opt-in)." }
        schedule: { type: string, enum: [uit, dagelijks, wekelijks] }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        hour: { type: integer, minimum: 0, maximum: 23 }
    SecurityFixInput:
      type: object
      required: [node_id, rules]
      properties:
        node_id: { type: string, format: uuid }
        rules: { type: array, items: { type: string }, minItems: 1 }
        rollback_minutes: { type: integer, minimum: 2, maximum: 60, description: "SSH: na zoveel minuten terugdraaien tenzij bevestigd (standaard 10)." }
    SecurityToolSchedule:
      type: object
      required: [schedule]
      properties:
        schedule: { type: string, enum: [uit, dagelijks, wekelijks] }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        hour: { type: integer, minimum: 0, maximum: 23 }
    FirewallObject:
      type: object
      description: Een object van de firewall (fase 16); de velden staan in web/src/lib/firewall.ts en internal/firewall.
      additionalProperties: true
    FirewallOverview:
      type: object
      required: [protocol, settings, stats, hourly, clusters, warnings, nodes, rules, catalog, classes]
      properties:
        protocol: { type: integer }
        settings: { $ref: "#/components/schemas/FirewallObject" }
        stats: { $ref: "#/components/schemas/FirewallObject" }
        hourly: { type: array, items: { $ref: "#/components/schemas/FirewallObject" } }
        clusters: { type: array, items: { $ref: "#/components/schemas/FirewallObject" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/FirewallObject" } }
        nodes: { type: array, items: { $ref: "#/components/schemas/FirewallObject" } }
        rules: { type: array, items: { $ref: "#/components/schemas/FirewallObject" } }
        catalog: { type: array, items: { $ref: "#/components/schemas/FirewallObject" } }
        classes: { type: array, items: { type: string } }
    FirewallSettingsInput:
      type: object
      required: [auto_apply, lan, admin, ssh_from, unknown_ports, strict, confirm_seconds, grace_hours, monitor]
      properties:
        auto_apply: { type: boolean }
        lan: { type: array, items: { type: string } }
        admin: { type: array, items: { type: string } }
        ssh_from: { type: string, enum: [lan, admin, any] }
        unknown_ports: { type: string, enum: [lan, closed] }
        strict: { type: boolean }
        confirm_seconds: { type: integer, minimum: 30, maximum: 900 }
        grace_hours: { type: integer, minimum: 0, maximum: 720 }
        monitor: { type: boolean }
    FirewallNodesInput:
      type: object
      required: [mode]
      properties:
        node_ids: { type: array, items: { type: string, format: uuid } }
        cluster_id: { type: string, format: uuid }
        all: { type: boolean }
        mode: { type: string, enum: ["off", preview, managed] }
    FirewallRuleInput:
      type: object
      required: [action, proto, port]
      properties:
        action: { type: string, enum: [open, close] }
        proto: { type: string, enum: [tcp, udp] }
        port: { type: string, description: "Poort of reeks, zoals 8443 of 2379:2380" }
        source: { type: string, description: "any, lan, cluster, admin, containers of een adres/netwerk (bij open)" }
        comment: { type: string, maxLength: 60 }
        node_id: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }
    CrowdSecTopEntry:
      type: object
      required: [key, country, as, count]
      properties:
        key: { type: string }
        country: { type: string }
        as: { type: string }
        count: { type: integer }
    SocOverview:
      type: object
      required: [generated_at, window, level, score, stats, now, activity, attackers, targets, coverage]
      properties:
        generated_at: { type: string, format: date-time }
        window: { type: string, enum: ["24h", "7d"], x-enum-varnames: [SocWindow24h, SocWindow7d] }
        level:
          type: object
          required: [level, reasons]
          properties:
            level: { type: string, enum: [normaal, waakzaam, verhoogd, kritiek], x-enum-varnames: [SocLevelNormaal, SocLevelWaakzaam, SocLevelVerhoogd, SocLevelKritiek] }
            reasons: { type: array, items: { type: string } }
        score:
          type: object
          required: [score, parts, previous, trend]
          properties:
            score: { type: integer }
            previous: { type: integer, nullable: true }
            parts:
              type: array
              items:
                type: object
                required: [key, label, max, points, deductions]
                properties:
                  key: { type: string }
                  label: { type: string }
                  max: { type: integer }
                  points: { type: number }
                  deductions:
                    type: array
                    items:
                      type: object
                      required: [text, points, href]
                      properties:
                        text: { type: string }
                        points: { type: number }
                        href: { type: string }
            trend:
              type: array
              items:
                type: object
                required: [at, score]
                properties:
                  at: { type: string, format: date-time }
                  score: { type: integer }
        stats:
          type: object
          required: [attacks, attacks_prev, active_bans, blocked, blocked_prev, login_failures, login_failures_prev, security_updates, security_nodes, nodes, protected]
          properties:
            attacks: { type: integer }
            attacks_prev: { type: integer }
            active_bans: { type: integer }
            blocked: { type: integer, format: int64 }
            blocked_prev: { type: integer, format: int64 }
            login_failures: { type: integer }
            login_failures_prev: { type: integer }
            security_updates: { type: integer }
            security_nodes: { type: integer }
            nodes: { type: integer }
            protected: { type: integer }
        now:
          type: array
          items: { $ref: "#/components/schemas/SocItem" }
        activity:
          type: array
          items:
            type: object
            required: [at, crowdsec, firewall, logins]
            properties:
              at: { type: string, format: date-time }
              crowdsec: { type: integer }
              firewall: { type: integer, format: int64 }
              logins: { type: integer }
        attackers:
          type: array
          items: { $ref: "#/components/schemas/SocAttacker" }
        targets:
          type: object
          required: [nodes, ports, scenarios]
          properties:
            nodes: { type: array, items: { $ref: "#/components/schemas/SocCount" } }
            ports: { type: array, items: { $ref: "#/components/schemas/SocCount" } }
            scenarios: { type: array, items: { $ref: "#/components/schemas/SocCount" } }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/SocCoverage" }
    SocItem:
      type: object
      required: [key, tone, prio, title, detail, href, action]
      properties:
        key: { type: string }
        tone: { type: string, enum: [red, amber, info], x-enum-varnames: [SocToneRed, SocToneAmber, SocToneInfo] }
        prio: { type: number }
        title: { type: string }
        detail: { type: string }
        href: { type: string }
        action: { type: string }
    SocAttacker:
      type: object
      required: [ip, kind, node, country, as, sources, alerts, blocked, logins, nodes, scenarios, ports, first_seen, last_seen, banned, ban_until]
      properties:
        ip: { type: string }
        kind: { type: string, enum: [extern, intern, node] }
        node: { type: string, description: "Hostnaam (of 'VIP cluster') als het adres van een eigen node is." }
        country: { type: string }
        as: { type: string }
        sources: { type: array, items: { type: string, enum: [crowdsec, firewall, login], x-enum-varnames: [SocSourceCrowdsec, SocSourceFirewall, SocSourceLogin] } }
        alerts: { type: integer }
        blocked: { type: integer, format: int64 }
        logins: { type: integer }
        nodes: { type: array, items: { type: string } }
        scenarios: { type: array, items: { type: string } }
        ports: { type: array, items: { type: string } }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        banned: { type: boolean }
        ban_until: { type: string, format: date-time, nullable: true }
    SocCount:
      type: object
      required: [key, label, count, detail]
      properties:
        key: { type: string }
        label: { type: string }
        count: { type: integer, format: int64 }
        detail: { type: string }
    SocCoverage:
      type: object
      required: [node_id, hostname, cluster_id, cluster_name, online, firewall, crowdsec, bouncer, security_updates, zabbix, gaps]
      properties:
        node_id: { type: string, format: uuid }
        hostname: { type: string }
        cluster_id: { type: string, format: uuid, nullable: true }
        cluster_name: { type: string }
        online: { type: boolean }
        firewall: { $ref: "#/components/schemas/SocState" }
        crowdsec: { $ref: "#/components/schemas/SocState" }
        bouncer:
          type: string
          description: Leeg als CrowdSec er niet (beheerd) staat; anders een SocState.
        security_updates: { type: integer }
        zabbix:
          type: string
          description: "Fase 33: on (bewaakt en bereikbaar), down (Zabbix ziet de node niet), missing (geen Zabbix-host); leeg zonder Zabbix. Telt niet mee in de score."
        gaps: { type: array, items: { type: string } }
    SocState:
      type: string
      enum: ["on", preview, "off", missing, down, error, unsupported, unknown, unmanaged]
    CrowdSecOverview:
      type: object
      required: [protocol, settings, stats, hourly, top_scenarios, top_ips, warnings, nodes, catalog]
      properties:
        protocol: { type: integer }
        settings: { $ref: "#/components/schemas/CrowdSecSettings" }
        stats:
          type: object
          required: [managed, running, alerts_24h, active_bans, blocklist, bouncers, bouncers_down]
          properties:
            managed: { type: integer }
            running: { type: integer }
            alerts_24h: { type: integer }
            active_bans: { type: integer }
            blocklist: { type: integer }
            bouncers: { type: integer }
            bouncers_down: { type: integer }
        hourly:
          type: array
          items:
            type: object
            required: [hour, count]
            properties:
              hour: { type: string, format: date-time }
              count: { type: integer }
        top_scenarios: { type: array, items: { $ref: "#/components/schemas/CrowdSecTopEntry" } }
        top_ips: { type: array, items: { $ref: "#/components/schemas/CrowdSecTopEntry" } }
        warnings:
          type: array
          items:
            type: object
            required: [node_id, hostname, text]
            properties:
              node_id: { type: string, format: uuid }
              hostname: { type: string }
              text: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/CrowdSecNode" } }
        catalog:
          type: array
          items:
            type: object
            required: [key, name, description, collections, community, nodes]
            properties:
              key: { type: string }
              name: { type: string }
              description: { type: string }
              collections: { type: array, items: { type: string } }
              community: { type: boolean }
              nodes: { type: array, items: { type: string } }
    CrowdSecNodeDetail:
      type: object
      required: [node, alerts]
      properties:
        node: { $ref: "#/components/schemas/CrowdSecNode" }
        alerts: { type: array, items: { $ref: "#/components/schemas/CrowdSecAlert" } }
