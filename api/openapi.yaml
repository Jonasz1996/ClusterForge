        cols: { type: integer }
        rows: { type: integer }
        password: { type: string, description: "Op prod, als je geen tweestapsverificatie hebt" }
        totp_code: { type: string, maxLength: 10, description: "Op prod: je code van tweestapsverificatie" }
    PveConsoleOpened:
      type: object
      required: [session, kind, title]
      properties:
        session: { type: string }
        kind: { type: string }
        title: { type: string }
        password: { type: string, description: "Eenmalig VNC-wachtwoord (alleen vnc), vervalt na 30 seconden" }
    PveRestoreTestInput:
      type: object
      required: [node, archive, type, storage]
