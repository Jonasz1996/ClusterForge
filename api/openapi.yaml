        allowed: { type: boolean, description: "false op prod: dan kan alleen de DR-repetitie" }
        reason: { type: string }
        slug: { type: string }
        kinds: { type: array, items: { $ref: "#/components/schemas/DisasterKindOption" } }
        hosts: { type: array, items: { $ref: "#/components/schemas/DisasterHostOption" } }
        units: { type: array, items: { type: string } }
        vips: { type: array, items: { type: string } }
        nodes: { type: array, items: { $ref: "#/components/schemas/DisasterNodeOption" }, description: Voor de stappen van een reeks }
        actions: { type: array, items: { $ref: "#/components/schemas/DisasterActionOption" } }
        targets: { $ref: "#/components/schemas/RecoveryTargets" }
        window: { type: string, description: "Het testvenster, zoals zondag van 03:00 tot 05:00" }
    DisasterScenarioList:
      type: object
      required: [items, options]
