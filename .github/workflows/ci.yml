name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clusterforge
          POSTGRES_PASSWORD: clusterforge
          POSTGRES_DB: clusterforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clusterforge"
          --health-interval 5s
          --health-retries 10
      # Voor de databasecommando's van de agent; de tests praten met de
      # mariadb in de container via docker exec.
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-retries 20
      # De oude server bij een verhuizing: MariaDB 10.11 zoals in Debian 12,
      # naar de 11.8 hierboven zoals in Debian 13.
      mariadb10:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Gegenereerde code is actueel
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0 generate
          go generate ./...
          git diff --exit-code -- internal/
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Tests
        env:
          CF_TEST_DATABASE_URL: postgres://clusterforge:clusterforge@localhost:5432/clusterforge_test?sslmode=disable
          CF_TEST_MARIADB: ${{ job.services.mariadb.id }}
          CF_TEST_MARIADB_SOURCE: ${{ job.services.mariadb10.id }}
        run: go test -p 1 -race -timeout 20m ./...

  galera:
    name: Echte Galera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Drie MariaDB-containers in een Galera-cluster: welke node na een
      # uitval de nieuwste data heeft, dat er niets verloren gaat, en dat
      # een vierde node aansluit terwijl er geschreven wordt.
      - name: Opnieuw beginnen na een uitval en een node toevoegen
        env:
          CF_TEST_GALERA_DOCKER: "1"
        run: go test -count=1 -timeout 20m -v -run TestRealGalera ./internal/galera/

  patroni:
    name: Echte Patroni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # PostgreSQL staat meestal al op de runner. Patroni komt uit PyPI, en
      # etcd met hetzelfde script als op de nodes, dus met de vaste SHA-256.
      - name: PostgreSQL, Patroni en etcd
        run: |
          ls /usr/lib/postgresql/*/bin/postgres || (sudo apt-get update -q && sudo apt-get install -y -q postgresql)
          python3 -m venv "$RUNNER_TEMP/patroni"
          "$RUNNER_TEMP/patroni/bin/pip" install -q "patroni[etcd3]==4.1.5" "psycopg2-binary==2.9.13"
          sudo mkdir -p /usr/local/lib/clusterforge
          sudo sh internal/components/builtin/postgresql-patroni/1.0.0/files/install-etcd.sh.tmpl
      # Drie nodes op loopback met de configuratie van het onderdeel: failover
      # zonder verlies, de oude primary terug als replica, en opkomen na een
      # uitval van alle nodes.
      - name: Failover, opkomen na een uitval en een node toevoegen
        env:
          CF_TEST_PATRONI: ${{ runner.temp }}/patroni/bin/patroni
          CF_TEST_ETCD: /usr/local/bin/etcd
        run: go test -count=1 -timeout 20m -v -run TestRealPatroni ./internal/components/

  web:
    name: Webinterface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API-types zijn actueel
        run: pnpm generate:api && git diff --exit-code -- src/lib/api/schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: Container-image
    runs-on: ubuntu-latest
    # Een image per commit, zodat een kleine LXC kan bijwerken zonder zelf te
    # bouwen. Alleen voor branches in deze repo: een fork krijgt geen schrijfrechten.
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Bij een PR is github.sha de merge-commit; het image hoort bij de kop
      # van de branch, zoals `git describe --tags --always` op de LXC hem noemt.
      - id: tags
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref_name }}
        run: |
          short=${SHA:0:7}
          image=ghcr.io/jonasz1996/clusterforge-server
          echo "version=$short" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            echo "$image:$short"
            if [ -n "$PR" ]; then echo "$image:pr-$PR"; else echo "$image:$REF"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # De server biedt de agent voor amd64 en arm64 aan; die moeten in elk image zitten.
      - name: Agents in het image
        env:
          IMAGE: ghcr.io/jonasz1996/clusterforge-server:${{ steps.tags.outputs.version }}
        run: |
          id=$(docker create "$IMAGE")
          docker cp "$id:/usr/share/clusterforge/agents" agents
          docker rm "$id"
          ls -l agents
          for arch in amd64 arm64; do
            test -s agents/cf-agent-linux-$arch
            (cd agents && sha256sum -c cf-agent-linux-$arch.sha256)
          done
