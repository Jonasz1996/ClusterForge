name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clusterforge
          POSTGRES_PASSWORD: clusterforge
          POSTGRES_DB: clusterforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clusterforge"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Gegenereerde code is actueel
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0 generate
          go generate ./...
          git diff --exit-code -- internal/
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Tests
        env:
          CF_TEST_DATABASE_URL: postgres://clusterforge:clusterforge@localhost:5432/clusterforge_test?sslmode=disable
        run: go test -p 1 -race ./...

  web:
    name: Webinterface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API-types zijn actueel
        run: pnpm generate:api && git diff --exit-code -- src/lib/api/schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: Container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
