name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest alleen voor een gewone versie, niet voor v1.0.0-rc1 en dergelijke.
      - id: tags
        env:
          REF: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/jonasz1996/clusterforge-server:$REF"
            case "$REF" in *-*) ;; *) echo "ghcr.io/jonasz1996/clusterforge-server:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.list }}
