name: homepage
version: 1.0.0
title: Homepage (HA)
description: >-
  De eigen homepage (github.com/Jonasz1996/homepage: dashboard, monitoring,
  syslog) op drie of vijf nodes met één gedeelde PostgreSQL met TimescaleDB
  (Patroni, met een eigen VIP op de primary) en een VIP van keepalived. De
  api en de syslog-ontvanger draaien op elke node; de checks (de worker)
  draaien op precies één node: die met het VIP en het slot in de database.
  Een bestaande homepage neem je over met homepage-ctl.sh overnemen op die
  node zelf, met een gecontroleerde back-up vooraf, een telling en
  controlesom per tabel en terugdraaien bij een fout. De bestaande node is
  node 1; zijn PostgreSQL blijft ernaast staan als terugweg.
cluster_type: generic

# De checks volgen het VIP. Terugspringen zou ze zonder reden laten
# verhuizen; het VIP blijft dus waar het is zolang die node gezond is.
failback: false

# PostgreSQL (Patroni) op alle nodes, met een eigen VIP op de primary en
# TimescaleDB (de homepage bewaart er checks, metingen en logs in).
# ClusterForge maakt daarna de gebruiker en de database homepage (eigenaar).
database:
  engine: postgresql
  role: node
  vip: "{{ .params.db_vip }}"
  host: "{{ .params.db_vip }}"
  settings:
    shared_buffers: 256M
    max_connections: 200
    shared_preload_libraries: timescaledb
  steps:
    - { kind: db_user, user: homepage, password: "{{ .params.db_password }}", grant_on: homepage }

params:
  - name: vip
    type: ipv4
    label: VIP
    immutable: true
    help: Het adres van de homepage (http://VIP). Zet daarna de host in Nginx Proxy Manager naar dit adres, poort 80, en je syslog naar dit adres. Niet .1 tot .3 van het VLAN (gateways).
  - name: db_vip
    type: ipv4
    label: VIP van de database
    immutable: true
    help: Een tweede vrij adres; het staat altijd op de primary van PostgreSQL.
  - name: nodes
    type: int
    label: Aantal nodes
    help: Patroni wil een meerderheid; met drie mag er één uitvallen.
    default: 3
    choices: [3, 5]
  - name: version
    type: string
    label: Versie van de homepage
    help: Een commit, tag of branch van github.com/Jonasz1996/homepage. Neem je een bestaande homepage over, geef dan haar commit (regel commit= in /etc/homepage/versie op de oude node; homepage-ctl.sh status toont hem). Een andere waarde bouwt de homepage op elke node opnieuw en herstart ze.
    default: main
    pattern: '[A-Za-z0-9][A-Za-z0-9._/-]{0,99}'
  - name: db_password
    type: secret
    label: Wachtwoord van de databasegebruiker homepage
    help: Leeg laten maakt er een; je ziet het bij Verbinding.
    length: 32
  - name: vrid
    type: int
    label: VRRP-id
    immutable: true
    help: Uniek per keepalived-groep in hetzelfde netwerk. Leeg laten kiest een vrij nummer.
    optional: true
    min: 1
    max: 255
  - name: auth_pass
    type: secret
    label: VRRP-wachtwoord
    help: Leeg laten maakt er een. Keepalived gebruikt hoogstens 8 tekens.
    length: 8
  - name: cpu
    type: int
    label: vCPU per node
    default: 2
    min: 1
    max: 16
  - name: memory
    type: size
    label: Geheugen per node
    help: Voor de homepage, PostgreSQL met TimescaleDB en het bouwen van de frontend.
    default: 2G
    min: 2G
    max: 64G
  - name: disk
    type: size
    label: Schijf per node
    help: Checks, metingen en logs staan in PostgreSQL, op elke node een kopie.
    default: 32G
    min: 16G
    max: 1T

roles:
  - name: node
    count: "{{ .params.nodes }}"
    vm:
      cpu: "{{ .params.cpu }}"
      memory: "{{ .params.memory }}"
      disk: "{{ .params.disk }}"
    steps:
      # Geen leeg cluster main als TimescaleDB PostgreSQL meebrengt: Patroni
      # maakt straks zijn eigen (zelfde bestand als de database van
      # ClusterForge).
      - directory: { path: /etc/postgresql-common/createcluster.d, mode: "0755" }
      - file:
          path: /etc/postgresql-common/createcluster.d/clusterforge.conf
          content: "# Beheerd door ClusterForge: Patroni maakt het cluster, niet het pakket.\ncreate_main_cluster = false\n"
          mode: "0644"
      # Wat install.sh van de homepage installeert (zonder PostgreSQL-server:
      # die komt van Patroni), plus psql/pg_dump/pg_restore voor de
      # overname en rsync en sshd voor de sync.
      - package: { names: [keepalived, nginx, git, curl, gnupg, ca-certificates, openssl, python3, python3-venv, python3-dev, build-essential, nodejs, npm, iputils-ping, postgresql-client, rsync, openssh-server, openssh-client] }
      - command:
          title: gebruiker homepage
          run: useradd --system --home-dir /opt/homepage --shell /usr/sbin/nologin homepage
          unless: id homepage
      - directory: { path: /usr/local/lib/clusterforge, mode: "0755" }
      # files: wat de sync homepage-instellingen naar de andere nodes brengt
      # (na een overname de instellingen en de sleutel van de oude node in
      # .cf, 0600).
      - directory: { path: /opt/cf-homepage, mode: "0755" }
      - directory: { path: /opt/cf-homepage/files, mode: "0755" }
      - directory: { path: /var/lib/cf-homepage, mode: "0700" }
      # Groep homepage zet homepage-ctl.sh (rechten) na de installatie:
      # de groep bestaat hier nog niet. De api en de worker lezen er
      # secret.key (2.9); apply laat de groep ongemoeid.
      - directory: { path: /etc/cf-homepage, mode: "0750" }
      - file:
          path: /etc/cf-homepage/base.env
          template: base.env.tmpl
          mode: "0600"
      - file:
          path: /usr/local/lib/clusterforge/homepage-ctl.sh
          template: homepage-ctl.sh.tmpl
          mode: "0755"
      - command:
          title: ufw-regels voor het cluster
          run: /usr/local/lib/clusterforge/homepage-ctl.sh firewall
          unless: /usr/local/lib/clusterforge/homepage-ctl.sh firewall-ok
      # Een oude homepage op deze node (de bestaande node, node 1): haar
      # PostgreSQL verhuist van cluster main op 5432 naar homepageoud op
      # 5433, met een back-up vooraf, zodat Patroni 5432 krijgt. De homepage
      # blijft draaien en bedient het VIP tot de overname.
      - command:
          title: oude homepage klaarzetten
          run: /usr/local/lib/clusterforge/homepage-ctl.sh voorbereiden
          unless: /usr/local/lib/clusterforge/homepage-ctl.sh voorbereid
      # TimescaleDB voor de PostgreSQL van Patroni (pakketbron van
      # Timescale, zoals install.sh). Op de node met de oude homepage staat
      # het al en verandert er niets.
      - command:
          title: TimescaleDB
          run: /usr/local/lib/clusterforge/homepage-ctl.sh timescaledb
          unless: /usr/local/lib/clusterforge/homepage-ctl.sh timescaledb-ok
      - command:
          title: mappen voor de homepage
          run: /usr/local/lib/clusterforge/homepage-ctl.sh mappen
          unless: /usr/local/lib/clusterforge/homepage-ctl.sh mappen-ok
      # Code ophalen en bouwen, in dezelfde mappen als install.sh. Een
      # andere versie bouwt opnieuw; de vorige build blijft tot de nieuwe lukt.
      - command:
          title: homepage ophalen en bouwen (enkele minuten)
          run: /usr/local/lib/clusterforge/homepage-ctl.sh bouwen
          unless: /usr/local/lib/clusterforge/homepage-ctl.sh gebouwd
      - command:
          title: nginx voor de homepage
          run: /usr/local/lib/clusterforge/homepage-ctl.sh nginx
          unless: /usr/local/lib/clusterforge/homepage-ctl.sh nginx-ok
      # De api en de syslog-ontvanger zijn enabled op elke node. Zolang de
      # database er niet is of de installatie nog niet is overgenomen,
      # wachten ze. De worker (de checks) start keepalived op de VIP-node.
      - file:
          path: /etc/systemd/system/cf-homepage-api.service
          template: cf-homepage-api.service.tmpl
      - file:
          path: /etc/systemd/system/cf-homepage-worker.service
          template: cf-homepage-worker.service.tmpl
      - file:
          path: /etc/systemd/system/cf-homepage-syslog.service
          template: cf-homepage-syslog.service.tmpl
      - file:
          path: /etc/systemd/system/cf-homepage-backup.service
          template: cf-homepage-backup.service.tmpl
      - file:
          path: /etc/systemd/system/cf-homepage-backup.timer
          template: cf-homepage-backup.timer.tmpl
      - file:
          path: /etc/systemd/system/cf-homepage-volg.service
          template: cf-homepage-volg.service.tmpl
      - file:
          path: /etc/systemd/system/cf-homepage-volg.timer
          template: cf-homepage-volg.timer.tmpl
      - command:
          title: cf-homepage inschakelen
          run: systemctl daemon-reload && systemctl enable cf-homepage-api cf-homepage-syslog cf-homepage-backup.timer cf-homepage-volg.timer && systemctl start --no-block cf-homepage-api cf-homepage-backup.timer cf-homepage-volg.timer
          unless: systemctl is-enabled --quiet cf-homepage-api && systemctl is-enabled --quiet cf-homepage-syslog && systemctl is-enabled --quiet cf-homepage-backup.timer && systemctl is-enabled --quiet cf-homepage-volg.timer
      - command:
          title: homepage herstarten na een wijziging
          run: /usr/local/lib/clusterforge/homepage-ctl.sh restart-if-changed
          unless: /usr/local/lib/clusterforge/homepage-ctl.sh unchanged
      - directory: { path: /etc/keepalived/conf.d, mode: "0755" }
      - file:
          path: /etc/keepalived/keepalived.conf
          template: keepalived.conf.tmpl
          mode: "0640"
          notify: [service:keepalived:reload]
      - service: { name: keepalived, enabled: true, state: started }

# Van de VIP-node naar de andere nodes, zonder --delete: de overgenomen
# instellingen en sleutel, en de dagelijkse dumps (de worker kijkt ze na op
# de node waar hij draait).
syncs:
  - name: homepage-instellingen
    schedule: "* * * * *"
    source: /opt/cf-homepage/files/
    target: /opt/cf-homepage/files/
    delete: false
    alert: true
    timeout_seconds: 300
  - name: homepage-backups
    schedule: "20 4 * * *"
    source: /var/backups/homepage/
    target: /var/backups/homepage/
    delete: false
    exclude: [/homepage_backuptest*, "*.tmp"]
    alert: true
    timeout_seconds: 1800

# De homepage start pas na de overname; daarom controleert de uitrol alleen het VIP.
checks:
  - vip_owned: { vip: "{{ .params.vip }}", within: 120s }

services:
  - { name: homepage, kind: app, unit: cf-homepage-api, port: 80 }
  - { name: keepalived, kind: vip, unit: keepalived }
