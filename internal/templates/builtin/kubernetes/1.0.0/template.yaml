name: kubernetes
version: 1.0.0
title: Kubernetes (k3s)
description: >-
  Een Kubernetes-cluster met k3s 1.35 op Debian-VM's. Servers draaien de API
  en de clusterdatabase etcd, workers draaien je apps. Netwerk, DNS, de
  ingress Traefik, een load balancer, opslag op de nodes en metrics zitten
  erin. Eén VIP is het vaste adres voor kubectl (poort 6443) en voor je apps
  (poort 80 en 443). Begin met één server om te leren; drie servers
  overleven het uitvallen van één.
cluster_type: kubernetes
# De k3s die deze versie installeert; bijwerken is overstappen naar een
# nieuwere templateversie.
kubernetes:
  version: v1.35.9+k3s1
# Keepalived met preempt: het VIP keert terug naar server-01 zodra die weer
# gezond is.
failback: true

params:
  - name: vip
    type: ipv4
    label: VIP
    immutable: true
    help: Het vaste adres van het cluster, voor kubectl en je apps. Het moet vrij zijn en in hetzelfde netwerk liggen als de nodes.
  - name: servers
    type: int
    label: Aantal servers
    help: Eén server is genoeg om te leren. Drie overleven het uitvallen van één; etcd heeft altijd een meerderheid nodig, dus een even aantal kan niet.
    default: 1
    choices: [1, 3, 5]
  - name: workers
    type: int
    label: Aantal workers
    help: Workers draaien alleen apps. Zonder workers draaien de apps op de servers.
    default: 2
    min: 0
    max: 10
  - name: vrid
    type: int
    label: VRRP-id
    immutable: true
    help: Uniek per keepalived-groep in hetzelfde netwerk. Leeg laten kiest een vrij nummer.
    optional: true
    min: 1
    max: 255
  - name: server_cpu
    type: int
    label: vCPU per server
    default: 2
    min: 2
    max: 32
  - name: server_memory
    type: size
    label: Geheugen per server
    default: 4G
    min: 2G
    max: 128G
  - name: server_disk
    type: size
    label: Schijf per server
    default: 30G
    min: 20G
    max: 1T
  - name: worker_cpu
    type: int
    label: vCPU per worker
    default: 2
    min: 1
    max: 64
  - name: worker_memory
    type: size
    label: Geheugen per worker
    default: 4G
    min: 1G
    max: 256G
  - name: worker_disk
    type: size
    label: Schijf per worker
    default: 40G
    min: 20G
    max: 2T
  - name: token
    type: secret
    label: Jointoken
    help: Leeg laten maakt er een. Met dit token melden nieuwe nodes zich aan bij het cluster.
    length: 48
  - name: auth_pass
    type: secret
    label: VRRP-wachtwoord
    help: Leeg laten maakt er een. Keepalived gebruikt hoogstens 8 tekens.
    length: 8

roles:
  # De servers komen eerst: server-01 begint het cluster en krijgt het VIP,
  # de andere servers en de workers melden zich daarna aan via het VIP.
  - name: server
    count: "{{ .params.servers }}"
    vm:
      cpu: "{{ .params.server_cpu }}"
      memory: "{{ .params.server_memory }}"
      disk: "{{ .params.server_disk }}"
    steps:
      - package: { names: [curl, ca-certificates] }
      - directory: { path: /usr/local/lib/clusterforge, mode: "0755" }
      - file:
          path: /usr/local/lib/clusterforge/install-k3s.sh
          template: install-k3s.sh.tmpl
          mode: "0755"
      # Het script zet na een gelukte installatie een merkteken met de
      # versie; zo ziet ook de driftcontrole of de juiste k3s er staat.
      - command:
          run: /usr/local/lib/clusterforge/install-k3s.sh
          creates: /usr/local/lib/clusterforge/k3s-v1.35.9+k3s1
      - directory: { path: /etc/rancher/k3s, mode: "0755" }
      - file:
          path: /etc/rancher/k3s/config.yaml
          template: server.yaml.tmpl
          mode: "0600"
          notify: [service:k3s:restart]
      - file:
          path: /etc/systemd/system/k3s.service
          template: k3s.service.tmpl
          notify: [service:k3s:restart]
      - service: { name: k3s, enabled: true, state: started }
      - command:
          run: ln -s /usr/local/bin/k3s /usr/local/bin/kubectl
          creates: /usr/local/bin/kubectl
      - package: { names: [keepalived] }
      - file:
          path: /etc/keepalived/check-k3s.sh
          template: check-k3s.sh.tmpl
          mode: "0755"
      - file:
          path: /etc/keepalived/keepalived.conf
          template: keepalived.conf.tmpl
          mode: "0640"
          notify: [service:keepalived:reload]
      - service: { name: keepalived, enabled: true, state: started }
  - name: worker
    count: "{{ .params.workers }}"
    min: 0
    vm:
      cpu: "{{ .params.worker_cpu }}"
      memory: "{{ .params.worker_memory }}"
      disk: "{{ .params.worker_disk }}"
    steps:
      - package: { names: [curl, ca-certificates] }
      - directory: { path: /usr/local/lib/clusterforge, mode: "0755" }
      - file:
          path: /usr/local/lib/clusterforge/install-k3s.sh
          template: install-k3s.sh.tmpl
          mode: "0755"
      # Het script zet na een gelukte installatie een merkteken met de
      # versie; zo ziet ook de driftcontrole of de juiste k3s er staat.
      - command:
          run: /usr/local/lib/clusterforge/install-k3s.sh
          creates: /usr/local/lib/clusterforge/k3s-v1.35.9+k3s1
      - directory: { path: /etc/rancher/k3s, mode: "0755" }
      - file:
          path: /etc/rancher/k3s/config.yaml
          template: worker.yaml.tmpl
          mode: "0600"
          notify: [service:k3s-agent:restart]
      - file:
          path: /etc/systemd/system/k3s-agent.service
          template: k3s-agent.service.tmpl
          notify: [service:k3s-agent:restart]
      - service: { name: k3s-agent, enabled: true, state: started }

# Traefik antwoordt 404 op een adres zonder app. Dat antwoord op het VIP
# betekent dat de API, de scheduler, het netwerk, de load balancer en de
# ingress werken.
checks:
  - vip_owned: { vip: "{{ .params.vip }}", within: 120s }
  - kube_ready: { within: 300s }
  - http: { url: "http://{{ .params.vip }}/", expect: 404, within: 300s }

services:
  - { name: k3s, kind: container, unit: k3s }
  - { name: k3s-agent, kind: container, unit: k3s-agent, depends_on: [k3s, keepalived], strength: soft }
  - { name: keepalived, kind: vip, unit: keepalived }
